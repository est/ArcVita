    - {name: "启", reign: "约前2029-约前1981", place: "阳翟(今河南禹州)", note: "家天下始"}
    - {name: "太康", reign: "约前1981-约前1950", place: "斟鄩(今河南偃师)", note: "失国于后羿"}
    - {name: "少康", reign: "约前1900", place: "阳翟(今河南禹州)", note: "中兴夏室"}
    - {name: "桀", reign: "约前1600", place: "斟鄩(今河南偃师)", note: "暴君，亡于商汤"}

- dynasty: "商"
