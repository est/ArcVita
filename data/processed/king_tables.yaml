    - {name: "周桓王", reign: "前720-前697", place: "洛邑(今河南洛阳)", note: "繻葛之战败于郑庄王"}
    - {name: "周襄王", reign: "前652-前619", place: "洛邑(今河南洛阳)", note: "王子带之乱，齐桓公勤王"}

- dynasty: "春秋五霸"
  period: "前685-前476"
  place: ""
  kings:
    - {name: "齐桓公", reign: "前685-前643", place: "临淄(今山东淄博)", note: "尊王攘夷，九合诸侯，与管仲共治。葵丘会盟(前651)"}
    - {name: "管仲", reign: "前685-前643(辅政)", place: "临淄(今山东淄博)", note: "辅佐齐桓公称霸，相地而衰征"}
    - {name: "宋襄公", reign: "前650-前637", place: "商丘(今河南商丘)", note: "泓水之战，仁义之师。盂地会盟被楚囚"}
    - {name: "晋文公", reign: "前636-前628", place: "绛(今山西翼城)", note: "城濮之战退避三舍，践土会盟称霸。与秦穆公联盟后反目"}
    - {name: "秦穆公", reign: "前659-前621", place: "雍(今陕西凤翔)", note: "称霸西戎，崤之战败于晋。与晋文公联盟又反目"}
    - {name: "楚庄王", reign: "前613-前591", place: "郢(今湖北荆州)", note: "一鸣惊人，问鼎中原。邲之战(前597)大败晋国"}
    - {name: "吴王阖闾", reign: "前514-前496", place: "姑苏(今江苏苏州)", note: "用孙武/伍子胥，柏举之战破楚郢都"}
    - {name: "吴王夫差", reign: "前496-前473", place: "姑苏(今江苏苏州)", note: "败越后骄傲，被勾践灭国"}
    - {name: "越王勾践", reign: "前496-前465", place: "会稽(今浙江绍兴)", note: "卧薪尝胆灭吴，范蠡辞去，文种被杀"}

- dynasty: "战国七雄"
  period: "前475-前221"
  place: ""
  kings:
    - {name: "魏文侯", reign: "前445-前396", place: "安邑(今山西夏县)", note: "李悝变法，战国首霸。与秦战于河西"}
    - {name: "秦孝公", reign: "前361-前338", place: "咸阳(今陕西咸阳)", note: "用商鞅变法。与魏战于河西，收复失地"}
    - {name: "商鞅", reign: "前356-前338(变法)", place: "咸阳(今陕西咸阳)", note: "两次变法强秦，最终车裂。与公子虔冲突"}
    - {name: "齐威王", reign: "前356-前320", place: "临淄(今山东淄博)", note: "邹忌讽齐王纳谏。马陵之战(前341)与魏决战"}
    - {name: "魏惠王", reign: "前369-前319", place: "大梁(今河南开封)", note: "桂陵之战(前354)马陵之战(前341)两败于齐。庞涓vs孙膑"}
    - {name: "赵武灵王", reign: "前325-前299", place: "邯郸(今河北邯郸)", note: "胡服骑射，灭中山。沙丘之变被饿死"}
    - {name: "秦惠文王", reign: "前337-前311", place: "咸阳(今陕西咸阳)", note: "车裂商鞅但用其法。张仪连横破纵。与蜀交战"}
    - {name: "秦昭襄王", reign: "前306-前251", place: "咸阳(今陕西咸阳)", note: "长平之战(前260)坑赵卒40万，白起为将。与赵/楚/齐连年交战"}
    - {name: "赵惠文王", reign: "前298-前266", place: "邯郸(今河北邯郸)", note: "廉颇蔺相如将相和。长平之战用赵括替换廉颇"}
    - {name: "燕昭王", reign: "前311-前279", place: "蓟(今北京)", note: "黄金台招贤，乐毅伐齐连下70城"}
    - {name: "齐湣王", reign: "前301-前284", place: "临淄(今山东淄博)", note: "五国伐齐，乐毅破齐70城"}
    - {name: "楚顷襄王", reign: "前298-前263", place: "郢(今湖北荆州)", note: "白起破郢(前278)，楚国东迁"}
    - {name: "秦始皇", reign: "前246-前221(即位前)", place: "咸阳(今陕西咸阳)", note: "13岁即位，嫪毐之乱，逐吕不韦。统一六国"}

- dynasty: "秦朝"
  period: "前221-前207"
  place: "咸阳(今陕西咸阳)"
  kings:
    - {name: "秦始皇", reign: "前221-前210", place: "咸阳(今陕西咸阳)", note: "始皇帝，统一度量衡文字，修长城。与李斯/蒙恬共治"}
    - {name: "李斯", reign: "前221-前208(丞相)", place: "咸阳(今陕西咸阳)", note: "书同文，焚书坑儒。与赵高斗争失败被腰斩"}
    - {name: "赵高", reign: "前210-前207(权臣)", place: "咸阳(今陕西咸阳)", note: "指鹿为马，杀李斯，逼秦二世自杀"}
    - {name: "秦二世", reign: "前210-前207", place: "咸阳(今陕西咸阳)", note: "胡亥，赵高指鹿为马，被逼自杀"}

- dynasty: "秦末/楚汉"
  period: "前209-前202"
  place: ""
  kings:
    - {name: "陈胜", reign: "前209", place: "大泽乡(今安徽宿州)", note: "大泽乡起义，王侯将相宁有种乎。与吴广共举义"}
    - {name: "吴广", reign: "前209", place: "大泽乡(今安徽宿州)", note: "与陈胜共举义，被部下所杀"}
    - {name: "项梁", reign: "前209-前208", place: "吴(今江苏苏州)", note: "项羽叔父，定陶之战阵亡"}
    - {name: "项羽", reign: "前206-前202", place: "彭城(今江苏徐州)", note: "巨鹿之战破秦军，鸿门宴放刘邦，垓下之围自刎。与刘邦楚汉争霸"}
    - {name: "刘邦", reign: "前206-前202", place: "汉中(今陕西汉中)", note: "约法三章得民心，明修栈道暗度陈仓。与项羽争霸，最终垓下围杀"}
    - {name: "韩信", reign: "前206-前196(为将)", place: "汉中→齐→楚", note: "明修栈道暗度陈仓，背水一战，垓下围杀项羽。被吕后所杀"}
    - {name: "张良", reign: "前206-前189(谋臣)", place: "下邳(今江苏邳州)", note: "圯上受书，鸿门宴救刘邦，运筹帷幄决胜千里"}
    - {name: "萧何", reign: "前206-前193(丞相)", place: "咸阳→长安", note: "月下追韩信，萧规曹随。汉初三杰之一"}
    - {name: "范增", reign: "前206-前204(项羽谋士)", place: "彭城(今江苏徐州)", note: "鸿门宴劝杀刘邦未果，被离间出走"}
    - {name: "英布", reign: "前206-前196(为将)", place: "九江(今安徽六安)", note: "九江王，后归汉。淮南王之乱被杀"}
    - {name: "彭越", reign: "前206-前196(为将)", place: "梁(今河南商丘)", note: "游击战专家，后被刘邦所杀"}
    - {name: "田横", reign: "前209-前202", place: "齐(今山东)", note: "田氏齐王后裔，五百壮士殉义"}

- dynasty: "西汉"
  period: "前202-8"
  place: "长安(今陕西西安)"
  kings:
    - {name: "汉高祖", reign: "前202-前195", place: "长安(今陕西西安)", note: "刘邦，布衣天子。杀韩信/彭越/英布"}
    - {name: "吕后", reign: "前195-前180", place: "长安(今陕西西安)", note: "临朝称制，杀韩信，毒杀赵王如意"}
    - {name: "周勃", reign: "前180(平诸吕)", place: "长安(今陕西西安)", note: "北军左袒，诛诸吕迎文帝"}
    - {name: "陈平", reign: "前180-前178(丞相)", place: "长安(今陕西西安)", note: "反间计去范增，白登解围。平诸吕功臣"}
    - {name: "汉文帝", reign: "前180-前157", place: "长安(今陕西西安)", note: "文景之治，轻徭薄赋。与贾谊/晁错共治"}
    - {name: "汉景帝", reign: "前157-前141", place: "长安(今陕西西安)", note: "七国之乱平定，削藩加强中央"}
    - {name: "周亚夫", reign: "前154(平七国之乱)", place: "长安(今陕西西安)", note: "周勃之子，平七国之乱。后饿死狱中"}
    - {name: "汉武帝", reign: "前141-前87", place: "长安(今陕西西安)", note: "罢黜百家，张骞通西域，卫青霍去病击匈奴。李广难封"}
    - {name: "卫青", reign: "前129-前106(为将)", place: "长安→漠北", note: "龙城首捷，七击匈奴，娶平阳公主"}
    - {name: "霍去病", reign: "前121-前117(为将)", place: "长安→漠北", note: "封狼居胥，匈奴失河西之歌。24岁早逝"}
    - {name: "李广", reign: "前166-前119(为将)", place: "边塞→漠北", note: "飞将军，一生70余战未封侯，漠北之战迷路自刎"}
    - {name: "张骞", reign: "前138-前114(出使)", place: "长安→大宛→大月氏", note: "凿空西域，丝绸之路开拓者。两次出使13年"}
    - {name: "司马迁", reign: "前108-前91(太史令)", place: "长安", note: "受李陵之祸受宫刑，忍辱著《史记》"}
    - {name: "董仲舒", reign: "前140(对策)", place: "长安", note: "天人三策，罢黜百家独尊儒术"}
    - {name: "苏武", reign: "前100-前81(出使)", place: "匈奴→北海(今贝加尔湖)", note: "牧羊19年不降，持节不屈"}
    - {name: "张汤", reign: "前130-前115(酷吏)", place: "长安", note: "酷吏代表，办淮南王案"}
    - {name: "主父偃", reign: "前127(推恩令)", place: "长安", note: "推恩令削弱诸侯，后被汉武帝诛杀"}
    - {name: "霍光", reign: "前87-前68(辅政)", place: "长安", note: "汉武帝托孤重臣，废昌邑王立宣帝"}
    - {name: "汉宣帝", reign: "前74-前49", place: "长安(今陕西西安)", note: "昭宣中兴，匈奴归降。与霍光共治"}
    - {name: "王莽", reign: "前1-8(篡汉)", place: "长安(今陕西西安)", note: "篡汉建新，改革失败导致绿林赤眉起义"}

- dynasty: "东汉"
  period: "25-220"
  place: "洛阳(今河南洛阳)"
  kings:
    - {name: "光武帝", reign: "25-57", place: "洛阳(今河南洛阳)", note: "光武中兴，昆阳之战以少胜多。柔道治天下"}
    - {name: "汉明帝", reign: "57-75", place: "洛阳(今河南洛阳)", note: "白马驮经，佛教东传。班超通西域"}
    - {name: "班超", reign: "73-95(出使)", place: "洛阳→西域", note: "投笔从戎，经营西域30年，36人定50国"}
    - {name: "窦宪", reign: "89-92(北征)", place: "洛阳→燕然山", note: "燕然勒石，大破北匈奴"}
    - {name: "蔡伦", reign: "105(改良造纸)", place: "洛阳(今河南洛阳)", note: "改进造纸术，推动知识传播"}
    - {name: "张衡", reign: "78-139", place: "南阳→洛阳", note: "浑天仪地动仪，《二京赋》"}
    - {name: "班固", reign: "32-92", place: "洛阳(今河南洛阳)", note: "著《汉书》，断代史开创者"}
    - {name: "汉桓帝", reign: "146-168", place: "洛阳(今河南洛阳)", note: "党锢之祸，宦官专权"}
    - {name: "汉灵帝", reign: "168-189", place: "洛阳(今河南洛阳)", note: "黄巾起义爆发"}
    - {name: "汉献帝", reign: "189-220", place: "洛阳→许昌", note: "董卓之乱，曹操挟天子以令诸侯，汉室倾覆"}
    - {name: "袁绍", reign: "190-202", place: "邺(今河北临漳)", note: "四世三公，官渡之战败于曹操"}
    - {name: "曹操", reign: "196-220", place: "许昌(今河南许昌)", note: "挟天子以令诸侯，统一北方。赤壁之战败于孙刘联军"}
    - {name: "孙策", reign: "194-200", place: "建业(今江苏南京)", note: "小霸王，奠定东吴基业，被刺身亡"}
    - {name: "孙权", reign: "200-229", place: "建业(今江苏南京)", note: "赤壁之战联刘抗曹，建立吴国"}
    - {name: "刘备", reign: "208-222", place: "成都(今四川成都)", note: "三顾茅庐得诸葛亮，建立蜀汉"}
    - {name: "诸葛亮", reign: "221-234", place: "成都→五丈原", note: "六出祁山北伐，五丈原病逝"}
    - {name: "关羽", reign: "200-220", place: "荆州(今湖北荆州)", note: "败走麦城被杀"}
    - {name: "张飞", reign: "201-221", place: "阆中(今四川阆中)", note: "被部下所杀"}
    - {name: "司马懿", reign: "231-251(魏权臣)", place: "洛阳(今河南洛阳)", note: "抵御诸葛亮，高平陵政变夺权"}
    - {name: "司马昭", reign: "263-265(魏权臣)", place: "洛阳(今河南洛阳)", note: "灭蜀汉，司马昭之心路人皆知"}
    - {name: "司马炎", reign: "265-290(晋武帝)", place: "洛阳(今河南洛阳)", note: "篡魏建晋，统一三国。八王之乱埋祸根"}

