    - {name: "周公旦", reign: "约前1043-约前1036(摄政)", place: "洛邑(今河南洛阳)", note: "制礼作乐，摄政七年，平三监之乱"}
    - {name: "成王", reign: "约前1043-约前1021", place: "镐京(今陕西西安)", note: "周公辅政，成康之治"}
    - {name: "康王", reign: "约前1021-约前996", place: "镐京(今陕西西安)", note: "成康之治，天下安宁"}
    - {name: "昭王", reign: "约前996-约前977", place: "镐京(今陕西西安)", note: "南征楚国，溺死汉水"}
    - {name: "穆王", reign: "约前977-约前922", place: "镐京(今陕西西安)", note: "西征犬戎，会西王母"}
    - {name: "厉王", reign: "约前878-前842", place: "镐京(今陕西西安)", note: "暴虐被逐，国人暴动"}
    - {name: "宣王", reign: "前827-前782", place: "镐京(今陕西西安)", note: "宣王中兴"}
    - {name: "幽王", reign: "前781-前771", place: "镐京(今陕西西安)", note: "烽火戏诸侯，西周亡"}

- dynasty: "东周(春秋)"
