    - {name: "武丁", reign: "约前1250-约前1192", place: "殷(今河南安阳)", note: "武丁中兴，傅说为相"}
    - {name: "纣", reign: "约前1075-约前1046", place: "朝歌(今河南淇县)", note: "暴君，与妲己，亡于周武王"}

- dynasty: "西周"
