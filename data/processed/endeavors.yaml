  description_zh: 天下既定，高祖论功行赏。群臣争曰：'吾等身被坚执锐，攻城略地，萧何未尝有汗马之劳，徒以文墨议论居臣等之上，何也？'高祖曰：'夫猎，追杀兽兔者狗也，而发踪指示者人也。诸公猎狗之功，萧何人之功也。'遂定萧何为首功，封酂侯，赐剑履上殿、入朝不趋。
