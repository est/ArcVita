  description_zh: 吕后时，陈平以中郎将事孝惠帝，后为左丞相。吕后崩，陈平与周勃合谋诛灭诸吕，迎立文帝。文帝以陈平为右丞相，位极人臣。陈平为相不治事，曰：'宰相者，上佐天子理阴阳，顺四时，下育万物之宜，外镇抚四夷诸侯，内亲附百姓，使卿大夫各得任其职焉。'在位一年余而薨。
