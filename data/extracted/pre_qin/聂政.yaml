person:
  name_zh: "聂政"
  name_en: "Nie Zheng"
  birth_date: "约-410"
  death_date: "-397"
  birth_place: "韩国轵深井里"
  era: "战国初期"
  archetype: "以身报恩的死士"
  dilemmas: ["母在不许身的孝义", "严仲子知遇之恩", "刺韩相后的自毁容貌"]
  summary_zh: "韩国勇士，因母在不许身。母死后，受严仲子知遇之恩，独身仗剑入韩刺杀相侠累。事成后自毁面目，以免连累家人。韩人悬赏购其尸，其姊聂荣前往认尸。"
  summary_first_person: "严仲子不远千里结交于吾，吾母在堂未敢以身相许。母既终，吾遂许之。一人仗剑入韩，上阶刺杀侠累，左右大乱。吾恐连累家人，自毁面目，剖腹而死。吾姊来认吾尸，使吾之名不至湮灭。"
  lesson: "刺客的义不仅在杀，更在自我毁灭以护亲人。"

