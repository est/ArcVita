person:
  name_zh: "孙武"
  name_en: "Sun Wu"
  birth_date: "约-545"
  death_date: "约-470"
  birth_place: "齐国乐安"
  era: "春秋末期"
  archetype: "以道驭术的兵家宗师"
  dilemmas: ["齐国内乱中的抉择", "吴国庙堂的信任困境", "功成身退与壮志未酬"]
  summary_zh: "齐人奔吴，以十三篇兵法惊动吴王，西破强楚、北威齐晋，终以功成身退隐于山林，被后世尊为兵圣。"
  summary_first_person: "吾本齐国之后，见齐政日乱，携一卷兵书南奔吴国。阖闾用吾之策，五战五胜，直入郢都。然吴宫之后，世间再无孙武用兵之迹，唯余十三篇兵法，任后人评说。"
  lesson: "最高的兵法是不战而屈人之兵，最大的智慧是功成身退。"

endeavors:
  - title_zh: "以兵法见吴王，奠定吴国霸业"
    domain: "军事"
    start_date: "-512"
    end_date: "-506"
    places: ["吴国姑苏", "楚国郢都"]
    phases:
      - name: "以兵法见用"
        start_date: "-512"
        end_date: "-512"
        place: "姑苏吴宫"
        highlight: "吴宫教战斩二姬"
      - name: "经略伐楚"
        start_date: "-512"
        end_date: "-506"
        place: "吴楚边境"
        highlight: "柏举之战五战入郢"
      - name: "北威诸侯"
        start_date: "-506"
        end_date: "-504"
        place: "中原"
        highlight: "吴国霸业鼎盛"
    description_zh: "吾以兵法十三篇谒见吴王阖闾，王令教宫中美女以试吾。吾三令五申而妇人笑不止，遂斩王之二姬以立军令。自此吴王知吾能用兵，拜为将军。与伍子胥共谋伐楚，自淮汭而进，五战五胜，长驱入郢。楚昭王出奔，吴师大振。"
    outcome: "吴国西破强楚，北威齐晋，成就春秋末期霸业"
    lesson: "令之以文，齐之以武，是谓必取"
  - title_zh: "著《孙子兵法》十三篇"
    domain: "军事理论"
    start_date: "约-515"
    end_date: "约-510"
    places: ["吴国"]
    phases:
      - name: "成书"
        start_date: "约-515"
        end_date: "约-510"
        place: "吴国"
        highlight: "十三篇传世"
    description_zh: "吾总结数十年用兵心得与历史战例，著成十三篇兵法，论战略、战术、地形、用间，字字珠玑。此书传至后世，被尊为兵学圣典。"
    outcome: "十三篇兵法传世，被后世尊为百世谈兵之祖"
    lesson: "兵者，国之大事，死生之地，存亡之道，不可不察也"

events:
  - date: "-512"
    place_name: "姑苏吴宫"
    event_type: "军事任用"
    title_zh: "吴宫教战斩二姬"
    description_zh: "吴王阖闾出宫中美女百八十人交孙武操练。孙武三令五申后，妇人仍笑不止。孙武曰'约束不明，申令不熟，将之罪也；既已约束而不用命，吏士之罪也'，遂斩队长二人。自此军令如山，无人敢犯。"
    is_highlight: true
    highlight_type: "成语"
    highlight_note: "三令五申之典由此而来，奠定了孙武治军严明的形象"
  - date: "-506"
    place_name: "楚国柏举"
    event_type: "战役"
    title_zh: "柏举之战五战入郢"
    description_zh: "孙武与伍子胥率吴军三万，自淮汭千里奔袭楚国。在柏举大破楚军二十万，五战五胜，一路追击至郢都。楚昭王仓皇出奔，吴军入郢，这是春秋时期以少胜多的经典战例。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "春秋时期规模最大的远征战，三万破二十万"
  - date: "-506"
    place_name: "楚国郢都"
    event_type: "军事行动"
    title_zh: "入郢鞭尸"
    description_zh: "吴军攻入郢都后，伍子胥掘楚平王之墓鞭尸三百以报父仇。孙武虽参与伐楚之谋，但对伍子胥的复仇之举持保留态度，体现了兵家与复仇者的不同格局。"
    is_highlight: false
    highlight_type: "决策"
    highlight_note: ""
  - date: "-504"
    place_name: "中原"
    event_type: "霸业巅峰"
    title_zh: "吴国北威齐晋"
    description_zh: "破楚之后，吴国声威大振，北面威慑齐晋两大国。吴王夫差继位后，吴国霸业达到顶峰。然孙武此后渐隐于史册，功成身退。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "功成身退——孙武最深的智慧"
