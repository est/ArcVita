person:
  name_zh: "孙膑"
  name_en: "Sun Bin"
  birth_date: "约-380"
  death_date: "约-316"
  birth_place: "齐国阿、鄄之间"
  era: "战国中期"
  archetype: "以弱胜强的军师智者"
  dilemmas: ["师出同门的兄弟阋墙", "膑刑之辱与复仇之志", "功高震主的生存之道"]
  summary_zh: "孙武后裔，与庞涓同学兵法于鬼谷子。庞涓妒其才而膑之，孙膑忍辱奔齐，以围魏救赵、减灶诱敌之计大破魏军，名震天下。"
  summary_first_person: "吾与庞涓同师鬼谷子，本以为手足之情可期终身。不料其嫉吾之才，诱我至魏而施以膑刑。吾装疯避祸，终得归齐。马陵道上万弩齐发之时，庞涓方知'孙膑在此'四字的分量。"
  lesson: "真正的强者不是没有至暗时刻，而是能在至暗时刻中找到翻盘之路。"

endeavors:
  - title_zh: "围魏救赵，桂陵之战"
    domain: "军事"
    start_date: "-354"
    end_date: "-353"
    places: ["魏国大梁", "齐国"]
    phases:
      - name: "谋划"
        start_date: "-354"
        end_date: "-354"
        place: "齐国临淄"
        highlight: "田忌赛马献计"
      - name: "实施"
        start_date: "-353"
        end_date: "-353"
        place: "魏国桂陵"
        highlight: "桂陵伏击大破魏军"
    description_zh: "魏国庞涓率大军围赵都邯郸，赵求救于齐。孙膑献策田忌，不救赵而直趋魏都大梁。庞涓回师途中，在桂陵遭齐军伏击，大败被擒。此即'围魏救赵'之典。"
    outcome: "大败魏军，解赵国之围"
    lesson: "攻其必救，避实击虚"
  - title_zh: "马陵之战，计杀庞涓"
    domain: "军事"
    start_date: "-342"
    end_date: "-341"
    places: ["魏国", "齐国", "马陵道"]
    phases:
      - name: "减灶诱敌"
        start_date: "-342"
        end_date: "-341"
        place: "齐魏边境"
        highlight: "增兵减灶之计"
      - name: "马陵伏击"
        start_date: "-341"
        end_date: "-341"
        place: "马陵道"
        highlight: "万弩齐发，庞涓自刎"
    description_zh: "魏攻韩，韩求救于齐。孙膑再用此计，以减灶诱庞涓轻骑追击。魏军至马陵道，万弩齐发，庞涓自知中计，叹曰'遂成竖子之名'，自刎而死。"
    outcome: "魏军覆灭，庞涓身死，齐国称霸"
    lesson: "知彼知己，百战不殆"
  - title_zh: "桂陵之战后著《孙膑兵法》"
    domain: "军事理论"
    start_date: "约-340"
    end_date: "约-330"
    places: ["齐国"]
    phases:
      - name: "著书立说"
        start_date: "约-340"
        end_date: "约-330"
        place: "齐国"
        highlight: "《孙膑兵法》传世"
    description_zh: "孙膑在军事实践之余，著有《孙膑兵法》八十九篇，发展了孙武的军事思想。此书久佚，1972年在银雀山汉墓中重新出土。"
    outcome: "兵法传世，补全了先秦兵学谱系"
    lesson: "实战出真知，理论源于实践"

events:
  - date: "-354"
    place_name: "魏国桂陵"
    event_type: "战役"
    title_zh: "桂陵之战——围魏救赵"
    description_zh: "魏将庞涓围赵，孙膑不救赵而直攻魏都大梁，迫使庞涓回师。齐军在桂陵设伏，大破疲惫之师。此战开创了'围魏救赵'的经典战术。"
    is_highlight: true
    highlight_type: "成语"
    highlight_note: "围魏救赵成为后世兵法经典战术代名词"
  - date: "-341"
    place_name: "马陵道"
    event_type: "战役"
    title_zh: "马陵之战——减灶诱敌"
    description_zh: "孙膑以逐日减少军灶数量制造齐军溃逃假象，诱庞涓轻骑追击。庞涓果然中计，率轻兵急追至马陵道。道路狭窄，两旁万弩齐发，魏军大溃。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "减灶之计——兵者诡道的极致演绎"
  - date: "-353"
    place_name: "齐国临淄"
    event_type: "谋略"
    title_zh: "田忌赛马"
    description_zh: "齐国赛马，田忌屡败于齐威王。孙膑献策：以己之下驷对王之上驷，以上驷对中驷，以中驷对下驷，三局两胜。田忌用此策果然赢了齐威王。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "以劣胜优的经典博弈思维"
  - date: "-355"
    place_name: "魏国"
    event_type: "至暗时刻"
    title_zh: "庞涓膑刑"
    description_zh: "庞涓嫉妒孙膑才华，将其骗至魏国，诬以罪名施以膑刑（挖去膝盖骨）和黥刑（脸上刺字）。孙膑装疯卖傻才免于一死，后在齐国使者帮助下逃回齐国。"
    is_highlight: true
    highlight_type: "至暗时刻"
    highlight_note: "膑刑——孙膑之名由此而来，从至暗到巅峰"
