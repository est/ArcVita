person:
  name_zh: "句践"
  name_en: "Goujian"
  birth_date: "约-520"
  death_date: "-465"
  birth_place: "越国会稽"
  era: "春秋末期"
  archetype: "卧薪尝胆的复仇之王"
  dilemmas: ["会稽之耻的屈辱求生", "忠臣可用不可亲的帝王心术", "灭吴之后鸟尽弓藏"]
  summary_zh: "越王句践兵败会稽，卧薪尝胆二十年，终灭强吴，成为春秋最后一位霸主。然其为人'可与共患难，不可与共安乐'，功臣范蠡去之，文种诛之。"
  summary_first_person: "吾会稽兵败，为吴王夫差驾车三年，尝粪问疾始得归越。卧薪尝胆二十年，十年生聚十年教训，终灭吴国。吾能忍天下人所不能忍，故能成天下人所不能成。然范蠡知吾，文种不知，终成悲剧。"
  lesson: "能忍辱者方能负重，但能共患难者未必能共安乐。"

