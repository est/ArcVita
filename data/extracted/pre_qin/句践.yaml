      - name: "灭吴称霸"
        start_date: "-482"
        end_date: "-473"
        place: "吴国姑苏"
        highlight: "夫差自刎，越灭吴"
    description_zh: "越王句践不听范蠡劝谏兴兵伐吴，大败于夫椒，困于会稽山。以厚币贿赂吴太宰伯嚭，始得赦归。入吴为奴三年，亲为夫差驾车、尝粪问疾。归越后卧薪尝胆，任用范蠡、文种，十年生聚、十年教训。趁夫差北上争霸之际两度伐吴，终灭之。"
    outcome: "灭吴称霸，成为春秋最后一位霸主"
    lesson: "能忍天下所不能忍，方能成天下所不能成"
  - title_zh: "卧薪尝胆，十年生聚十年教训"
    domain: "治国"
    start_date: "-491"
    end_date: "-482"
    places: ["越国会稽"]
    phases:
      - name: "卧薪尝胆"
        start_date: "-491"
        end_date: "-491"
        place: "越国"
        highlight: "悬胆于户，日尝苦味"
      - name: "十年生聚"
        start_date: "-491"
        end_date: "-481"
        place: "越国"
        highlight: "奖励生育，充实人口"
      - name: "十年教训"
        start_date: "-482"
        end_date: "-473"
        place: "越国"
        highlight: "练兵备战"
    description_zh: "句践自会稽归来后，置胆于坐卧之处，饮食必先尝苦胆以自警。推行休养生息政策：奖励生育，壮者不娶老妇、老者不娶壮妻；十年不收税以富国；暗中训练甲兵。文种献灭吴九术，一一实施。"
    outcome: "越国国力大增，从三千残兵恢复到甲兵五万"
    lesson: "耻辱可以是最大的动力，前提是你记得它"
  - title_zh: "鸟尽弓藏，逼走范蠡、诛杀文种"
    domain: "政治"
    start_date: "-473"
    end_date: "-471"
    places: ["越国"]
    phases:
      - name: "范蠡辞去"
        start_date: "-473"
        end_date: "-473"
        place: "越国"
        highlight: "范蠡浮海出齐，书遗文种"
      - name: "文种被诛"
        start_date: "约-471"
        end_date: "约-471"
        place: "越国"
        highlight: "文种赐剑自刎"
    description_zh: "灭吴之后，范蠡功成身退，浮海至齐。遗书文种曰'飞鸟尽，良弓藏；狡兔死，走狗烹。越王为人长颈鸟喙，可与共患难，不可与共乐。子何不去？'文种不听，称病不朝。有人诬其谋反，句践赐剑令其自刎。"
    outcome: "范蠡得善终，文种被赐死"
    lesson: "知人者智，自知者明——范蠡知句践，文种不知"

events:
  - date: "-494"
    place_name: "越国会稽"
    event_type: "至暗时刻"
    title_zh: "会稽之耻"
    description_zh: "越王句践不听范蠡劝阻，贸然伐吴，大败于夫椒。三千残兵被困会稽山。句践以大夫种之计，卑辞厚礼求和，亲入吴国为奴三年。此为句践一生最大的耻辱，也是其复仇之路的起点。"
    is_highlight: true
    highlight_type: "至暗时刻"
    highlight_note: "会稽之耻——卧薪尝胆的起点"
  - date: "-493"
    place_name: "吴国姑苏"
    event_type: "决策"
    title_zh: "尝粪问疾"
    description_zh: "夫差生病，句践亲尝其粪便以诊断病情，贺曰'大王之疾将愈'。夫差大为感动，以为句践已彻底臣服，遂赦其归越。此为句践隐忍到极致的名场面。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "忍辱的极限——帝王尊严的彻底碾碎"
  - date: "-482"
    place_name: "吴国姑苏"
    event_type: "战役"
    title_zh: "姑苏之袭——趁虚灭吴"
    description_zh: "夫差率精锐北上与晋国争霸于黄池，句践趁吴国空虚，率军偷袭姑苏。俘获吴太子友，焚姑苏台。夫差急回，求和。此为句践隐忍多年后第一次出手。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "十年磨一剑的第一次亮剑"
  - date: "-473"
    place_name: "吴国姑苏"
    event_type: "战役"
    title_zh: "越灭吴——夫差自刎"
    description_zh: "越国再次伐吴，围姑苏三年。吴军崩溃，夫差求和不得。夫差叹曰'吾无面目见子胥于地下'，以巾蒙面自刎。越国灭吴，句践终于报了会稽之仇。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "二十年卧薪尝胆的终极兑现"
  - date: "约-473"
    place_name: "越国"
    event_type: "决策"
    title_zh: "赐文种死"
    description_zh: "灭吴功臣文种被赐剑自刎。范蠡早有预见：'飞鸟尽，良弓藏；狡兔死，走狗烹。'句践长颈鸟喙之相，果应验了'可共患难不可共安乐'的古训。"
    is_highlight: true
    highlight_type: "至暗时刻"
    highlight_note: "功臣的结局——帝王心术的冷酷注脚"
