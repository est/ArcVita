      - name: "准备刺杀"
        start_date: "-228"
        end_date: "-227"
        place: "燕国"
        highlight: "樊於期献首级，徐夫人匕首淬毒"
      - name: "易水送别"
        start_date: "-227"
        end_date: "-227"
        place: "燕国易水"
        highlight: "风萧萧兮易水寒"
      - name: "图穷匕见"
        start_date: "-227"
        end_date: "-227"
        place: "秦国咸阳殿"
        highlight: "图穷匕见，功亏一篑"
    description_zh: "秦将王翦破赵，兵临燕境。太子丹恐惧，欲遣荆轲入秦刺秦王。荆轲携樊於期之首级与督亢地图，以献地为名入秦。秦王召见，荆轲展地图，图穷而匕首现。荆轲左手持秦王袖，右手持匕首刺之。秦王惊起，衣袖挣断。秦王绕柱而走，群臣惊愕。荆轲追秦王，秦王拔剑击断荆轲左腿。荆轲以匕首掷之，不中。荆轲倚柱而笑，箕踞以骂。左右上前杀之。"
    outcome: "刺秦失败，荆轲身死"
    lesson: "虽千万人吾往矣——明知必败仍义无反顾"

events:
  - date: "-227"
    place_name: "燕国易水"
    event_type: "决策"
    title_zh: "易水送别——风萧萧兮易水寒"
    description_zh: "荆轲西入强秦，太子丹及宾客送至易水之上。高渐离击筑，荆轲和而歌'风萧萧兮易水寒，壮士一去兮不复还'。歌声悲壮，士皆垂泪。复为慷慨羽声，士皆瞋目。荆轲登车而去，终已不顾。"
    is_highlight: true
    highlight_type: "名言"
    highlight_note: "千古第一送别——悲壮之极致"
  - date: "-227"
    place_name: "秦国咸阳殿"
    event_type: "刺杀"
    title_zh: "图穷匕见——刺秦失败"
    description_zh: "荆轲在秦王殿上展开督亢地图，至最后一段图穷匕首现。荆轲左手抓住秦王衣袖，右手持匕首刺向秦王。秦王惊起挣断衣袖，绕铜柱而走。荆轲追之不及，秦王拔剑击断荆轲左腿。荆轲以匕首投向秦王，不中，击于柱上。荆轲知事不成，倚柱而笑，箕踞以骂，终被左右所杀。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "图穷匕见——中国历史上最著名的一击"
  - date: "-228"
    place_name: "燕国"
    event_type: "决策"
    title_zh: "樊於期献首级"
    description_zh: "荆轲认为刺秦需要信物，提出以秦国叛将樊於期的首级和燕国督亢地图为见面礼。樊於期闻讯曰'此臣之日夜切齿腐心也'，自刎献首级。荆轲收其首级，以匣封之。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "两颗头颅的重量——刺秦计划的血腥筹码"
  - date: "-228"
    place_name: "燕国"
    event_type: "战役"
    title_zh: "高渐离击筑——知音绝唱"
    description_zh: "荆轲好读书击剑，与高渐离游于燕市。高渐离击筑，荆轲和而歌，相乐也。后荆轲刺秦失败，秦灭燕。高渐离以筑击秦始皇不中，被杀。知音之交终以生死相许。"
    is_highlight: false
    highlight_type: "名言"
    highlight_note: ""
