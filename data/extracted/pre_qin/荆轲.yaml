person:
  name_zh: "荆轲"
  name_en: "Jing Ke"
  birth_date: "约-424"  # 魏国卫国人
  death_date: "-227"
  birth_place: "卫国"
  era: "战国末期"
  archetype: "易水悲歌的千古刺客"
  dilemmas: ["太子丹之托与刺秦之艰", "图穷匕见的绝境", "壮士一去不复还的宿命"]
  summary_zh: "卫人荆轲，受燕太子丹之托入秦刺杀秦王政。以献督亢地图为名，图穷匕见，匕首中秦王之袖而未中其身。秦王绕柱而走，拔剑斩荆轲。荆轲倚柱而笑，箕踞以骂，身死而志不灭。"
  summary_first_person: "风萧萧兮易水寒，壮士一去兮不复还。吾知此去必死，然天下苦秦久矣。太子丹以国士待吾，吾当以国士报之。图穷匕见之际，吾距秦王不过数步，然天命不在吾。倚柱而笑，箕踞而骂，吾虽身死，刺秦之志千秋不灭。"
  lesson: "有些战斗注定失败，但失败本身便是不朽。"

endeavors:
