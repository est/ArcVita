person:
  name_zh: "专诸"
  name_en: "Zhuan Zhu"
  birth_date: "约-537"
  death_date: "-515"
  birth_place: "吴国堂邑"
  era: "春秋末期"
  archetype: "一击必杀的义士"
  dilemmas: ["受人之托的义气", "母亲在世不可轻死", "以命换命的终极一击"]
  summary_zh: "吴国勇士，受公子光（吴王阖闾）之托，在鱼肠剑中藏匕首，趁进鱼之机刺杀吴王僚。僚当场毙命，专诸亦被侍卫所杀。公子光遂立为吴王。"
  summary_first_person: "吾有老母在堂，未敢以身许人。母既终，吾乃无后顾之忧。公子光待吾以国士，吾当以国士报之。鱼藏剑中，一击而中王僚之心，吾虽死无憾。"
  lesson: "真正的义士不是不怕死，而是找到了值得赴死的理由。"

endeavors:
  - title_zh: "鱼藏剑刺杀吴王僚"
    domain: "刺杀"
    start_date: "-516"
    end_date: "-515"
    places: ["吴国"]
    phases:
      - name: "准备"
        start_date: "-516"
        end_date: "-515"
        place: "吴国"
        highlight: "铸鱼肠剑，藏匕首于鱼腹"
      - name: "刺杀"
        start_date: "-515"
        end_date: "-515"
        place: "吴国公子光府"
        highlight: "进鱼之际拔剑刺王僚"
    description_zh: "公子光欲夺吴王僚之位，伍子胥荐专诸。专诸以母老未许。母死后，专诸从公子光谋。公子光设宴请王僚，王僚戒备森严。专诸扮作厨人，将匕首藏于烤鱼腹中进献。近王之际，自鱼腹中抽出匕首刺入王僚胸口，王僚当场毙命。专诸亦被左右侍卫所杀。公子光趁乱夺位，是为吴王阖闾。"
    outcome: "吴王僚被刺，公子光即位为吴王"
    lesson: "士为知己者死——义的极致是生命本身"

events:
  - date: "-515"
    place_name: "吴国公子光府"
    event_type: "刺杀"
    title_zh: "鱼肠剑刺杀吴王僚"
    description_zh: "专诸以烤鱼为名，将匕首藏于鱼腹之中。趁进鱼之机，抽出匕首刺入吴王僚胸口。王僚当场毙命。专诸随即被侍卫所杀。公子光趁乱即位，是为吴王阖闾。此匕首后被称为'鱼肠剑'，列为天下名剑。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "鱼肠剑——四大刺客之一的成名一击"
  - date: "-515"
    place_name: "吴国"
    event_type: "至暗时刻"
    title_zh: "母终而后许身"
    description_zh: "公子光初求专诸刺杀王僚，专诸曰'母在堂，未敢以身许人'。待母去世后，专诸主动投奔公子光，曰'士为知己者死，吾母已终，吾无后顾之忧矣'。"
    is_highlight: true
    highlight_type: "名言"
    highlight_note: "母终许身——义士的柔软与刚烈"
