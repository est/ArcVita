person:
  name_zh: "曹沫"
  name_en: "Cao Mo"
  birth_date: "约-720"
  death_date: "不详"
  birth_place: "鲁国"
  era: "春秋初期"
  archetype: "以勇夺城的义士"
  dilemmas: ["败军之将的雪耻之志", "劫持盟主的生死豪赌"]
  summary_zh: "鲁国将军，三战三败于齐。齐鲁会盟之际，以匕首劫持齐桓公，逼其归还所侵鲁地。桓公虽怒但不能不从。曹沫用三败之耻换回了鲁国失地。"
  summary_first_person: "吾三战三败，失地千里，天下笑吾为败军之将。然吾知勇者不以一败而丧志。柯之盟上，吾以一匕首劫齐桓公于坛上，使归我汶阳之田。管仲纵有万般计谋，亦不敢赌桓公之命。"
  lesson: "有时候最简单的手段能解决最复杂的问题——一把匕首胜过百万兵。"

