person:
  name_zh: "商鞅"
  name_en: "Shang Yang"
  birth_date: "约-390"
  death_date: "-338"
  birth_place: "卫国"
  era: "战国中期"
  archetype: "以法治国的铁血改革者"
  dilemmas: ["客卿身份的信用困境", "太子犯法的法与情", "功高震主与自掘坟墓"]
  summary_zh: "卫人公孙鞅入秦，以变法强秦，废井田、开阡陌、设县制、重农战。二十年间使秦国脱胎换骨，终以车裂之刑死于自己制定的法网之下，却是'商君虽死，秦法未败'。"
  summary_first_person: "吾三说秦孝公，以帝道、王道、霸道试之，孝公终用霸道。吾废井田、开阡陌、立军功，使秦人勇于公战。然吾终死于自己所立之法——太子犯法，吾刑其师傅；孝公死后，太子即位，吾遂车裂而亡。法在而人亡，此吾之宿命也。"
  lesson: "改革者最大的悲剧不是失败，而是成功到足以让自己成为新秩序的牺牲品。"

endeavors:
  - title_zh: "三说秦孝公，确立变法路线"
    domain: "政治"
    start_date: "约-359"
    end_date: "-356"
    places: ["秦国咸阳"]
    phases:
      - name: "以帝道试探"
        start_date: "约-359"
        end_date: "约-359"
        place: "秦国"
        highlight: "孝公昏昏欲睡"
      - name: "以王道游说"
        start_date: "约-359"
        end_date: "约-359"
        place: "秦国"
        highlight: "孝公不悦"
      - name: "以霸道定策"
        start_date: "约-359"
        end_date: "-356"
        place: "秦国"
        highlight: "孝公与语三日不厌"
    description_zh: "公孙鞅入秦，经景监引见三次面见秦孝公。初说以帝道（尧舜之治），孝公昏昏欲睡；再说以王道（三代之治），孝公不悦；三说以霸道（春秋五霸之术），孝公大悦，与之语三日不厌，遂决意变法。"
    outcome: "秦孝公全力支持变法，拜商鞅为左庶长"
    lesson: "知音不在多，一主足矣"
  - title_zh: "两次变法，强秦之基"
    domain: "政治改革"
    start_date: "-356"
    end_date: "-338"
    places: ["秦国咸阳", "秦国各地"]
    phases:
      - name: "第一次变法"
        start_date: "-356"
        end_date: "-352"
        place: "秦国"
        highlight: "徙木立信"
      - name: "第二次变法"
        start_date: "-350"
        end_date: "-338"
        place: "秦国咸阳"
        highlight: "废井田开阡陌"
    description_zh: "第一次变法：令民为什伍，编户齐民；奖励军功，斩一首者爵一级；重农抑商，耕织多者免徭役。为取信于民，立三丈之木于南门，募民徙之北门予五十金。第二次变法：废井田开阡陌，允许土地买卖；推行县制；统一度量衡。"
    outcome: "秦国由弱变强，奠定了统一六国的根基"
    lesson: "变法之要在于取信于民，徙木立信是万法之基"
  - title_zh: "太子犯法，刑其师傅"
    domain: "司法"
    start_date: "-356"
    end_date: "-355"
    places: ["秦国"]
    phases:
      - name: "执法困境"
        start_date: "-356"
        end_date: "-356"
        place: "秦国"
        highlight: "太子犯法"
      - name: "刑及师傅"
        start_date: "-355"
        end_date: "-355"
        place: "秦国"
        highlight: "刑公子虔、黥公孙贾"
    description_zh: "变法初行，太子犯法。商鞅曰'法之不行，自上犯之'，然太子为嗣君不可刑，遂刑其师傅公子虔和公孙贾。公子虔后来又犯法，再被劓刑。此二人后来成为商鞅最深的仇敌。"
    outcome: "法度严明，但也树立了致命的敌人"
    lesson: "执法必严，但也要考虑执法的代价"
  - title_zh: "功高震主，车裂而亡"
    domain: "命运"
    start_date: "-338"
    end_date: "-338"
    places: ["秦国咸阳"]
    phases:
      - name: "孝公之死"
        start_date: "-338"
        end_date: "-338"
        place: "秦国"
        highlight: "秦孝公薨"
      - name: "五牛分尸"
        start_date: "-338"
        end_date: "-338"
        place: "秦国咸阳"
        highlight: "车裂而死"
    description_zh: "秦孝公薨，太子即位（秦惠文王）。公子虔等人诬告商鞅谋反，惠文王下令追捕。商鞅逃至函谷关，因自己制定的法律规定无凭证不得入住旅店而被拒。最终被擒，处以车裂之刑，灭族。"
    outcome: "商鞅身死族灭，但秦法未废"
    lesson: "法自作而自受——商鞅之死是最深刻的制度悖论"

events:
  - date: "-356"
    place_name: "秦国南门"
    event_type: "决策"
    title_zh: "徙木立信"
    description_zh: "商鞅变法之初，在国都南门立一根三丈长的木头，悬赏五十金令民移至北门。百姓疑之不敢动。有一人试之，商鞅立即兑现赏金。由此取信于民，新法得以推行。"
    is_highlight: true
    highlight_type: "成语"
    highlight_note: "徙木立信——变法从建立公信力开始"
  - date: "-356"
    place_name: "秦国"
    event_type: "司法"
    title_zh: "太子犯法，刑其师傅"
    description_zh: "太子驷犯法，商鞅以'法之不行，自上犯之'为由，刑其师傅公子虔（劓刑）、黥公孙贾。此举震动朝野，但也为商鞅埋下杀身之祸。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "执法的勇气与代价并存"
  - date: "-338"
    place_name: "秦国函谷关"
    event_type: "至暗时刻"
    title_zh: "作法自毙"
    description_zh: "商鞅逃亡至关下，想住旅店。店主依据商鞅所立之法——'舍人无验者坐之'——拒绝收留。商鞅叹曰'为法之弊，一至此哉'。最终被秦军擒获，车裂于咸阳。"
    is_highlight: true
    highlight_type: "成语"
    highlight_note: "作法自毙——最讽刺的历史因果"
  - date: "-340"
    place_name: "魏国"
    event_type: "军事"
    title_zh: "大破魏军，俘公子卬"
    description_zh: "商鞅率秦军伐魏，与魏将公子卬对阵。商鞅以旧交之名约公子卬会盟，趁机伏兵擒之。魏军失去主帅大败。魏惠王被迫割河西之地求和。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "以诈术取胜——功业与道德的永恒冲突"
  - date: "-350"
    place_name: "秦国咸阳"
    event_type: "变法"
    title_zh: "废井田开阡陌"
    description_zh: "第二次变法核心：废除井田制，开阡陌封疆，允许土地自由买卖。同时推行县制，全国设三十一县。统一度量衡。这些措施从根本上改变了秦国的经济基础和政治结构。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "中国历史上最深刻的土地制度改革之一"
