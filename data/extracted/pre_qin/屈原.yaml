person:
  name_zh: "屈原"
  name_en: "Qu Yuan"
  birth_date: "约-340"
  death_date: "-278"
  birth_place: "楚国秭归"
  era: "战国中后期"
  archetype: "以身殉道的诗人政客"
  dilemmas: ["忠而被谤的政治困境", "美政理想与楚国现实的冲突", "独清独醒与举世皆浊"]
  summary_zh: "楚国三闾大夫，忠而被谤，两次放逐。以《离骚》《天问》开创中国浪漫主义文学之先河。楚国郢都被秦所破后，投汨罗江而死，以身殉国。"
  summary_first_person: "吾以王族之血，怀美政之志，入则与王议国事，出则号令遇宾客。奈何上官大夫妒之，令尹子兰毁之，王终疏吾。吾行吟泽畔，颜色憔悴，渔父问曰'何故至于斯'，吾曰'举世皆浊我独清'。郢都既破，吾遂自沉汨罗。"
  lesson: "真正的忠诚不在于服从，而在于明知不可为而为之的坚守。"

endeavors:
  - title_zh: "任三闾大夫，推行美政"
    domain: "政治"
    start_date: "约-317"
    end_date: "-313"
    places: ["楚国郢都"]
    phases:
      - name: "受楚怀王信任"
        start_date: "约-317"
        end_date: "-313"
        place: "楚国郢都"
        highlight: "入则与王图议国事"
      - name: "初遭谗言"
        start_date: "-313"
        end_date: "-313"
        place: "楚国郢都"
        highlight: "上官大夫进谗"
    description_zh: "屈原博闻强志，明于治乱，娴于辞令。楚怀王甚任之，使之出使诸侯。上官大夫与之同列争宠，进谗言于怀王，谓屈原每出必扬己之功而蔑王令。怀王怒而疏屈原。"
    outcome: "从信任到疏远，美政理想破灭"
    lesson: "忠诚者的最大敌人不是外敌，而是身边的谗言"
  - title_zh: "两次流放，行吟泽畔"
    domain: "文学"
    start_date: "-313"
    end_date: "-278"
    places: ["楚国汉北", "楚国江南"]
    phases:
      - name: "第一次流放"
        start_date: "-313"
        end_date: "-299"
        place: "楚国汉北"
        highlight: "作《离骚》"
      - name: "短暂召回"
        start_date: "-299"
        end_date: "-296"
        place: "楚国郢都"
        highlight: "劝怀王勿赴武关之会"
      - name: "第二次流放"
        start_date: "-296"
        end_date: "-278"
        place: "楚国江南"
        highlight: "作《渔父》《天问》"
    description_zh: "屈原被流放汉北期间，忧愁幽思而作《离骚》。后楚怀王被秦昭王诱骗入武关扣留，屈原苦谏不听。顷襄王即位后，令尹子兰再进谗言，屈原被放逐至江南更偏远之地。流放期间行吟泽畔，创作大量不朽诗篇。"
    outcome: "政治上彻底失败，文学上开创千古"
    lesson: "苦难是最好的创作源泉，但代价太过沉重"
  - title_zh: "投汨罗江殉国"
    domain: "精神"
    start_date: "-278"
    end_date: "-278"
    places: "楚国汨罗江"
    phases:
      - name: "闻郢都陷落"
        start_date: "-278"
        end_date: "-278"
        place: "楚国江南"
        highlight: "闻秦将白起破郢都"
      - name: "自沉殉国"
        start_date: "-278"
        end_date: "-278"
        place: "汨罗江"
        highlight: "怀石自沉"
    description_zh: "秦将白起攻破楚国郢都，烧夷陵，楚顷襄王东迁于陈。屈原闻讯，悲痛欲绝，怀石自沉汨罗江。五月初五日也，楚人哀之，岁岁以舟楫投粽于江中以祭之。"
    outcome: "以身殉国，成为中国文化中忠义的最高象征"
    lesson: "当一个人的理想与国家的命运同时破碎，殉国便是最后的选择"

events:
  - date: "-313"
    place_name: "楚国郢都"
    event_type: "决策"
    title_zh: "上官大夫进谗，屈原见疏"
    description_zh: "上官大夫靳尚与屈原争宠，向楚怀王进谗言，称屈原每草拟法令后以功自居。怀王怒而疏屈原，屈原的政治生涯由此转入下坡。"
    is_highlight: true
    highlight_type: "至暗时刻"
    highlight_note: "忠而被谤——千古忠臣的共同命运"
  - date: "-313"
    place_name: "楚国汉北"
    event_type: "代表作"
    title_zh: "作《离骚》"
    description_zh: "屈原被流放汉北期间，以香草美人为象征，抒发对楚王的忠诚和对奸佞的愤恨，写成中国文学史上第一篇长篇抒情诗《离骚》。'路漫漫其修远兮，吾将上下而求索'成为千古名句。"
    is_highlight: true
    highlight_type: "代表作"
    highlight_note: "《离骚》——中国浪漫主义文学的源头"
  - date: "-299"
    place_name: "楚国郢都"
    event_type: "决策"
    title_zh: "苦谏怀王勿赴武关之会"
    description_zh: "秦昭王约楚怀王会于武关。屈原力谏曰'秦虎狼之国，不可信，不如毋行'。怀王不听，入武关后被秦扣押，三年后客死于秦。屈原的预言完全应验。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "先知者的悲哀——忠言永远逆耳"
  - date: "-278"
    place_name: "楚国汨罗江"
    event_type: "至暗时刻"
    title_zh: "闻郢都陷落，自沉汨罗"
    description_zh: "秦将白起攻破楚国都城郢都，烧毁先王陵墓夷陵。屈原在流放途中闻讯，万念俱灰，怀石投入汨罗江。五月初五日，楚人以舟楫投粽祭之，后世遂成端午节。"
    is_highlight: true
    highlight_type: "至暗时刻"
    highlight_note: "以身殉国——中国文人精神的最高坐标"
  - date: "-296"
    place_name: "楚国江南"
    event_type: "名言"
    title_zh: "渔父问答——举世皆浊我独清"
    description_zh: "屈原流放江南，形容枯槁。渔父见而问之，屈原曰：'举世皆浊我独清，众人皆醉我独醒。'渔父劝其随波逐流，屈原曰：'宁赴湘流，葬于江鱼之腹中，安能以皓皓之白而蒙世俗之温蠖乎？'"
    is_highlight: true
    highlight_type: "名言"
    highlight_note: "举世皆浊我独清——千古文人的精神宣言"
