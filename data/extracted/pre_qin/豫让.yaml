person:
  name_zh: "豫让"
  name_en: "Yu Rang"
  birth_date: "约-470"
  death_date: "-453"
  birth_place: "晋国"
  era: "战国初期"
  archetype: "士为知己者死的终极诠释"
  dilemmas: ["国士之遇与国仇家恨", "漆身吞炭的自残式复仇", "赵襄子义释与求死不得"]
  summary_zh: "晋国刺客，先后事范氏、中行氏，后投智伯。赵襄子联合韩魏灭智伯，豫让为报知遇之恩，漆身吞炭、伏桥行刺赵襄子，两次失败后请赵襄子衣而击之，遂伏剑自杀。"
  summary_first_person: "吾事范氏、中行氏，彼以众人遇吾，吾以众人报之。智伯以国士遇吾，吾以国士报之。智伯已死，吾漆身吞炭，虽肝脑涂地亦不悔。'士为知己者死，女为悦己者容'——此吾之志也。"
  lesson: "知遇之恩重于生死——豫让用生命定义了'士'的精神。"

endeavors:
  - title_zh: "漆身吞炭，三刺赵襄子"
    domain: "刺杀"
    start_date: "-453"
    end_date: "-453"
    places: ["晋国"]
    phases:
      - name: "毁容变声"
        start_date: "-453"
        end_date: "-453"
        place: "晋国"
        highlight: "漆身为厉，吞炭为哑"
      - name: "第一次行刺"
        start_date: "-453"
        end_date: "-453"
        place: "赵襄子宫中厕所"
        highlight: "伏于厕中被识破"
      - name: "第二次行刺"
        start_date: "-453"
        end_date: "-453"
        place: "襄子必经之桥"
        highlight: "击衣而死"
    description_zh: "智伯被赵襄子联合韩魏三家所灭，赵襄子漆智伯之头为饮器。豫让欲为智伯报仇，先漆身为厉（使皮肤溃烂如癞），吞炭为哑（使声音嘶哑），改变容貌声音以行刺。第一次伏于赵襄子宫中厕所，被赵襄子识破释之。第二次伏于襄子过桥之下马惊处，豫让击襄子之衣，襄子叹曰'义士也'，令其击衣如击人，豫让三跃击衣而后伏剑自尽。"
    outcome: "豫让完成心愿后自杀殉义"
    lesson: "国士之遇，国士报之——义的最高形态"

events:
  - date: "-453"
    place_name: "赵襄子宫中"
    event_type: "刺杀"
    title_zh: "伏厕行刺，赵襄子义释"
    description_zh: "豫让漆身吞炭后伏于赵襄子宫中厕所。赵襄子如厕时心动，令搜索刺客，遂执豫让。左右欲杀之，赵襄子曰'义士也，吾谨避之耳'，释放豫让。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "义士与义主——乱世中的双向成全"
  - date: "-453"
    place_name: "晋国桥上"
    event_type: "刺杀"
    title_zh: "击衣殉义"
    description_zh: "豫让伏于赵襄子必经之桥下，马惊。赵襄子识之，豫让求曰'愿请君之衣而击之，虽死不恨'。襄子义之，使使者持衣与豫让。豫让三跃击衣曰'吾可以下报智伯矣'，遂伏剑自尽。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "击衣三跃——刺客精神的最高境界"
  - date: "-453"
    place_name: "晋国"
    event_type: "至暗时刻"
    title_zh: "漆身吞炭"
    description_zh: "豫让为改变容貌行刺赵襄子，以漆涂身使皮肤溃烂如癞，吞炭使声音嘶哑变调。其友见而泣曰'以子之才，委质而臣事襄子，襄子必近幸子。近幸子，乃为所欲，顾不易邪？何乃残身苦形，欲以求报襄子，不亦难乎！'豫让答曰'既已委质臣事人而求杀之，是怀二心以事其君也'。"
    is_highlight: true
    highlight_type: "至暗时刻"
    highlight_note: "以自残之躯行义士之志——对'忠'的极端诠释"
