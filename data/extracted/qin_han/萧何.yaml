person:
  name_zh: "萧何"
  name_en: "Xiao He"
  birth_date: "约-257"
  death_date: "-193"
  birth_place: "沛丰邑(今江苏丰县)"
  era: "秦末汉初"
  archetype: "以文治定天下的汉家第一相"
  dilemmas: ["乱世中择主的审慎", "功高震主的生存智慧", "制度创设与皇权的微妙平衡"]
  summary_zh: "沛县刀笔吏出身，辅佐刘邦起兵，镇守关中输粮不绝，论功居首封酂侯，为汉家制律定策，是开国功臣中唯一善终且封爵最久者。"
  summary_first_person: "吾本沛县一吏，日日案牍劳形，人皆以为庸碌。然吾观天下大势，知秦必亡、民思乱久矣。刘季过沛，吾知其非常人，遂以身相许。入咸阳时，诸将争金帛，吾独取秦丞相府图籍文书，天下户口强弱尽在胸中。此后镇守关中，转漕关东，粮饷不绝于道，终助高祖定鼎天下。论功行赏，吾居第一，然吾深知，刀笔吏之功不在沙场，在于让天下有序。"
  lesson: "真正的功勋不在于驰骋沙场，而在于让秩序从废墟中重生。"

endeavors:
  - title_zh: "镇守关中，输粮不绝"
    domain: "行政后勤"
    start_date: "-206"
    end_date: "-202"
    places: ["关中栎阳(今陕西富平)", "咸阳(今陕西咸阳)"]
    phases:
      - name: "取图籍知天下"
        start_date: "-206"
        end_date: "-206"
        place: "咸阳(今陕西咸阳)"
        highlight: "独取秦丞相府图籍"
      - name: "镇守关中"
        start_date: "-206"
        end_date: "-202"
        place: "栎阳(今陕西富平)"
        highlight: "转漕关东粮饷不绝"
      - name: "抚循百姓"
        start_date: "-205"
        end_date: "-202"
        place: "关中"
        highlight: "约法收民心"
    description_zh: "刘邦入咸阳，诸将争趋金帛财物，萧何独入秦丞相府，收律令图籍藏之。自此汉王具知天下户口多少、强弱之处。楚汉相争之际，萧何镇守关中，立法度、设郡县、转漕关东，源源不绝输粮于前线。高祖数败于项羽，萧何辄发关中卒补其军，汉军得以不衰。"
    outcome: "关中成为刘邦争天下的坚实后方，汉军粮饷兵员始终充足"
    lesson: "治国如理家，根基在于户籍、制度与后勤"
  - title_zh: "论功居首，封酂侯"
    domain: "政治"
    start_date: "-202"
    end_date: "-202"
    places: ["长安(今陕西西安)"]
    phases:
      - name: "群臣争功"
        start_date: "-202"
        end_date: "-202"
        place: "长安(今陕西西安)"
        highlight: "高祖定萧何为首功"
    description_zh: "天下既定，高祖论功行赏。群臣争曰：'吾等身被坚执锐，攻城略地，萧何未尝有汗马之劳，徒以文墨议论居臣等之上，何也？'高祖曰：'夫猎，追杀兽兔者狗也，而发踪指示者人也。诸公猎狗之功，萧何人之功也。'遂定萧何为首功，封酂侯，赐剑履上殿、入朝不趋。"
    outcome: "萧何居功臣第一，封酂侯，位列功臣之首"
    lesson: "运筹帷幄胜于冲锋陷阵"
  - title_zh: "制律定策，立汉家制度"
    domain: "制度建设"
    start_date: "-201"
    end_date: "-193"
    places: ["长安(今陕西西安)"]
    phases:
      - name: "作律九章"
        start_date: "-201"
        end_date: "-193"
        place: "长安(今陕西西安)"
        highlight: "萧何律——汉家法度之基"
      - name: "举贤自代"
        start_date: "-196"
        end_date: "-193"
        place: "长安(今陕西西安)"
        highlight: "荐曹参继任丞相"
    description_zh: "萧何为相，制定律令，捃摭秦法，取其宜于时者，作律九章。又作《九章律》，定度量衡，立制度。晚年力荐曹参为相，参用黄老之术，萧规曹随，汉初天下得以休养生息。"
    outcome: "汉家法律制度由此奠基，萧规曹随成千古佳话"
    lesson: "制度的生命力在于传承，而非个人之功"

events:
  - date: "-206"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "关键抉择"
    title_zh: "独取图籍——乱世中的远见"
    description_zh: "沛公入咸阳，秦宫室帷帐狗马重宝妇女以千数，诸将皆争趋金帛财物之府分之。萧何独先入收秦丞相府律令图书藏之。沛公为汉王，以何为丞相。项王与诸侯屠烧咸阳而去。汉王具知天下厄塞，户口多少，强弱之处，民所疾苦者，以何得秦图书也。"
    is_highlight: true
    highlight_type: "成语典故"
    highlight_note: "萧何追韩信的前置——先取图籍的战略眼光，与诸将争金帛形成鲜明对比"
  - date: "-205"
    place_name: "关中"
    event_type: "后勤保障"
    title_zh: "转漕关中——汉军的生命线"
    description_zh: "楚汉相争，高祖数失军遁去，萧何常居关中，遣军补其非。关中事，计户口转漕给军，汉王数失军遁去，何常兴关中卒，辄补缺。"
    is_highlight: false
    highlight_type: "行政"
    highlight_note: ""
  - date: "-204"
    place_name: "关中"
    event_type: "人事决策"
    title_zh: "遣子昆弟佐军——以身家性命为质"
    description_zh: "汉王与项羽相距京索间，上数使使劳苦丞相。鲍生谓丞相曰：'王暴衣露盖，数使使劳苦君者，有疑君心也。为君计，莫若遣君子孙昆弟能胜兵者悉诣军所，上必益信君。'何从其计，汉王大说。"
    is_highlight: true
    highlight_type: "决策智慧"
    highlight_note: "以自损求自保——功臣消解君疑的经典范式"
  - date: "-202"
    place_name: "长安(今陕西西安)"
    event_type: "政治定论"
    title_zh: "功人与功狗——论功居首"
    description_zh: "高祖论功，群臣以萧何无战功争之。高祖以猎喻：'夫猎，追杀兽兔者狗也，而发踪指示者人也。今诸公徒能得走兽耳，功狗也。至如萧何，发踪指示，功人也。'遂以萧何为第一功。"
    is_highlight: true
    highlight_type: "名言典故"
    highlight_note: "功人功狗之论——中国史上对文臣武功最精妙的评价"
  - date: "-196"
    place_name: "长安(今陕西西安)"
    event_type: "政治危机"
    title_zh: "自污名节以释君疑"
    description_zh: "何有客说之曰：'君灭族不久矣。位相国，功第一，不可复加。然君初入关中，得百姓心，十余年矣。上数使使问君畏君者，恐君关中摇动。今君何不多买田地，贱贳贷以自污？上心乃安。'何从其计，上大说。"
    is_highlight: true
    highlight_type: "决策智慧"
    highlight_note: "自污求存——功臣在皇权下最卑微的生存术"
  - date: "-195"
    place_name: "长安(今陕西西安)"
    event_type: "政治博弈"
    title_zh: "为民请苑——险遭不测"
    description_zh: "何以长安地狭，上林中多空地，弃，愿令民得入田。上大怒曰：'相国多受贾人财物，乃为请吾苑！'下廷尉，械系之。数日，王卫尉前言：'苟便于民，丞相请之，陛下何疑也？'上乃赦出之。"
    is_highlight: true
    highlight_type: "君臣博弈"
    highlight_note: "为民请命反遭系——相国之尊在皇权面前的脆弱"
  - date: "-195"
    place_name: "长安(今陕西西安)"
    event_type: "临终遗言"
    title_zh: "萧何举曹参——萧规曹随"
    description_zh: "何病，上亲自临视。问曰：'君即百岁后，谁可代君？'对曰：'知臣莫如主。'上曰：'曹参何如？'何顿首曰：'帝得之矣！臣死不恨矣！'何置田宅必居穷处，为家不治垣屋。曰：'后世贤，师吾俭；不贤，毋为势家所夺。'"
    is_highlight: true
    highlight_type: "历史传承"
    highlight_note: "萧规曹随——汉初无为而治的制度传承"
