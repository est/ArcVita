person:
  name_zh: "韩信"
  name_en: "Han Xin"
  birth_date: "约-231"
  death_date: "-196"
  birth_place: "淮阴(今江苏淮安)"
  era: "秦末汉初"
  archetype: "以兵法定天下却不知自保的兵仙"
  dilemmas: ["胯下之辱的忍耐与尊严", "功高震主的权力困局", "自立为王与忠臣之心的挣扎"]
  summary_zh: "淮阴布衣，寄食于人，受胯下之辱。投刘邦后明修栈道暗度陈仓，背水一战灭赵，十面埋伏灭楚，天下无敌。然功高不善终，终为吕后所诛于长乐宫钟室，千古名将之悲。"
  summary_first_person: "吾少时贫，寄食于漂母，母亦不厌。南昌亭长之妻不为吾具食，吾从之食数十日。淮阴屠中少年辱吾，令吾出胯下，吾孰视之，俯出胯下。天下皆以为怯，独吾知忍。后投汉王，登坛拜将，定三秦、灭赵、降燕、下齐，垓下围项王，天下无敌。然吾终不能自保，长乐宫中钟室之死，不知吾所学兵法，何以不能救吾一命。"
  lesson: "兵法可以定天下，却不能定人心；善战者未必善终。"

