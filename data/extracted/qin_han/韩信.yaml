      - name: "登坛拜将"
        start_date: "-206"
        end_date: "-206"
        place: "汉中(今陕西汉中)"
        highlight: "汉王筑坛拜韩信为大将军"
    description_zh: "韩信少时贫不能自食，常从人寄食。淮阴屠中少年辱之曰：'若虽长大，好带刀剑，中情怯耳。'众辱之曰：'信能死，刺我；不能死，出我胯下。'于是信孰视之，俯出胯下，匍匐。一市人皆笑信以为怯。后萧何月下追韩信，刘邦筑坛拜信为大将军，一军皆惊。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "胯下之辱与登坛拜将——从市井无赖到天下兵仙，人生最大的反转"
