        highlight: "垓下战后即被夺兵权"
      - name: "贬为淮阴侯"
        start_date: "-201"
        end_date: "-201"
        place: "长安(今陕西西安)"
        highlight: "云梦之游被缚"
      - name: "钟室之死"
        start_date: "-196"
        end_date: "-196"
        place: "长乐宫钟室(今陕西西安)"
        highlight: "为吕后所诛——千古名将之悲"
    description_zh: "韩信破齐后请为假齐王，刘邦正被围荥阳，大怒欲攻之。张良、陈平蹑其足，附耳曰：'汉方不利，宁能禁信之王乎？不如因而立，善遇使自守。'乃遣张良往立韩信为齐王。天下既定，刘邦夺韩信兵权，徙为楚王。有人告反，以云梦之游缚韩信于陈，贬为淮阴侯。韩信怨望，羞与绛、灌等列。后与陈豨谋反事泄，吕后与萧何设计，诱韩信入长乐宫钟室斩之。"
    is_highlight: true
    highlight_type: "悲剧"
    highlight_note: "钟室之死——'狡兔死，走狗烹；飞鸟尽，良弓藏'——千古名将之最悲结局"

events:
  - date: "-220"
    place_name: "淮阴(今江苏淮安)"
    event_type: "人生经历"
    title_zh: "漂母饭信——一饭千金"
    description_zh: "韩信为布衣时，贫无行，不得推择为吏，又不能治生商贾，常从人寄食饮，人多厌之。信钓于城下，诸母漂。有一母见信饥，饭信，竟漂数十日。信喜，谓漂母曰：'吾必有以重报母。'母怒曰：'大丈夫不能自食，吾哀王孙而进食，岂望报乎！'后信为楚王，召所从食漂母，赐千金。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "一饭千金——知恩图报与落魄时的人情冷暖"
  - date: "-210"
    place_name: "淮阴(今江苏淮安)"
    event_type: "人生经历"
    title_zh: "胯下之辱——忍者无敌"
    description_zh: "淮阴屠中少年有侮信者，曰：'若虽长大，好带刀剑，中情怯耳。'众辱之曰：'信能死，刺我；不能死，出我胯下。'于是信孰视之，俯出胯下，匍匐。一市人皆笑信以为怯。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "胯下之辱——中国文化中隐忍负重的经典符号，后世以'忍胯下之辱'喻大丈夫能屈能伸"
  - date: "-206"
    place_name: "汉中(今陕西汉中)"
    event_type: "人生转折"
    title_zh: "萧何月下追韩信——登坛拜将"
    description_zh: "韩信数与萧何语，何奇之。至南郑，诸将亡者数十人。信度何等已数言上，上不我用，即亡去。何闻信亡，不及以闻，自追之。有人言之于上曰：'丞相何亡。'上大怒。一二日何来谒上，上骂曰：'若亡，何也？'何曰：'臣不敢亡也，臣追亡者耳。'上复骂曰：'诸将亡者以十数，公无所追，追信，诈也。'何曰：'至如信者，国士无双。王必欲长王汉中，无所事信；必欲争天下，非信无所与计事者。'于是王许之，斋戒设坛场，拜信为大将军，一军皆惊。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "萧何月下追韩信——千古伯乐之典，韩信人生的决定性转折"
  - date: "-204"
    place_name: "井陉口(今河北井陉)"
    event_type: "战役"
    title_zh: "背水一战——置之死地而后生"
    description_zh: "韩信与张耳以兵数万，欲东下井陉击赵。信使万人先行，出，背水陈。赵军望见而大笑。平旦，信建大将之旗鼓，鼓行出井陉口。赵开壁击之，大战良久。于是信、耳详弃鼓旗，走水上军。水上军开入之，复疾战。赵果空壁争汉鼓旗，逐韩信、张耳。韩信、张耳已入水上军，军皆殊死战，不可败。信所出奇兵二千骑驰入赵壁，皆拔赵旗，立汉赤帜二千。赵军已不胜，欲还归壁，壁皆汉赤帜，大惊，以为汉皆已得赵王将矣，遂乱，赵将虽斩之不能禁也。于是汉兵夹击，大破虏赵军。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "背水一战——'置之死地而后生'的军事经典，后人以'背水一战'喻决死一搏"
  - date: "-203"
    place_name: "潍水(今山东潍坊)"
    event_type: "战役"
    title_zh: "水淹龙且——半渡而击"
    description_zh: "韩信伐齐，楚使龙且将兵二十万救齐。或曰：'汉兵远斗穷战，其锋不可当。齐楚自居其地战，兵易败散。不如深壁，令齐王使其信臣招所亡城。'龙且曰：'吾平生知韩信为人，易与耳。'信乃夜令人为万余囊，盛沙，壅水上流。引军半渡击龙且，详不胜，还走。龙且果喜曰：'固知信怯也。'遂追信渡水。信使人决壅囊，水大至。龙且军大半不得渡，即急击杀龙且，楚军败走。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "潍水之战——以水为兵的经典战例，半渡而击之"
  - date: "-202"
    place_name: "垓下(今安徽灵璧)"
    event_type: "战役"
    title_zh: "垓下之围——四面楚歌灭项王"
    description_zh: "汉王引兵渡淮南，追项羽至阳夏南。韩信、彭越皆会。韩信将三十万自当之，孔将军居左，费将军居右，绛侯柴将军在汉王后。韩信与项羽战，不利。却。孔将军、费将军纵，楚兵不利。韩信复乘之，大败垓下。项羽夜闻四面皆楚歌，乃大惊曰：'汉皆已得楚乎？是何楚人之多也！'项王则夜起饮帐中，悲歌慷慨，自为诗曰：'力拔山兮气盖世，时不利兮骓不逝。骓不逝兮可奈何，虞兮虞兮奈若何！'歌数阕，美人和之。项王泣数行下，左右皆泣，莫能仰视。遂自刎而死。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "垓下之围与霸王别姬——英雄末路的千古悲歌"
  - date: "-196"
    place_name: "长乐宫钟室(今陕西西安)"
    event_type: "人生终章"
    title_zh: "钟室之死——飞鸟尽良弓藏"
    description_zh: "陈豨反，高祖自将往诛之。信欲从中起。舍人弟告信欲反，吕后与萧何谋，乃诈令人从上所来，言豨已得死，列侯群臣皆贺。相国绐信曰：'虽疾，强入贺。'信入，吕后使武士缚信，斩之长乐宫钟室。信方斩，曰：'悔不用蒯通之计，乃为儿女子所诈，岂非天哉！'遂夷信三族。"
    is_highlight: true
    highlight_type: "悲剧"
    highlight_note: "钟室之死——'狡兔死，走狗烹；飞鸟尽，良弓藏'，千古名将最悲结局"
