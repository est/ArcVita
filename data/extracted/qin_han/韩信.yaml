        highlight: "四面楚歌围灭项羽"
    description_zh: "韩信拜大将军后，明修栈道暗度陈仓，还定三秦。后率军北伐，以背水阵大破赵军二十万于井陉，斩成安君陈余。又以檄文降燕。后以半渡而击之计水淹楚将龙且二十万军。垓下之战，率三十万军围项羽，十面埋伏，四面楚歌，终灭项王。"
    outcome: "横扫天下，灭魏、代、赵、燕、齐，垓下灭楚，天下归汉"
    lesson: "善战者无赫赫之功，善用兵者如水之就势"
