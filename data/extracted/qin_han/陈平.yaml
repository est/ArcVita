person:
  name_zh: "陈平"
  name_en: "Chen Ping"
  birth_date: "约-257"
  death_date: "-178"
  birth_place: "阳武户牖(今河南兰考)"
  era: "秦末汉初"
  archetype: "以奇谋诡道纵横乱世的智囊"
  dilemmas: ["盗嫂受金的道德困境", "事主不终的忠诚考验", "天下与个人的功利权衡"]
  summary_zh: "阳武布衣，先投魏王咎不用，再投项羽不受重，终归刘邦成心腹谋士。以反间计离间范增、以云梦之游擒韩信、以白登之围解高祖于匈奴，六出奇计，位至丞相，善终于家。"
  summary_first_person: "吾少时贫，人皆笑之。乡里富人张负以女妻之，曰：'人固有好美如陈平而长贫贱者乎？'吾游学四方，事魏王咎不用，事项王又不见用。至汉，高祖用吾为护军中尉。吾一生所学，不在仁义，在于权变。离间项范、擒缚韩信、解围白登，六出奇计，世人或以诡道目之，然乱世之中，正道不能存身，唯奇谋可活万民。"
  lesson: "乱世无常法，通权达变方为大智。"

endeavors:
  - title_zh: "六出奇计定汉室"
    domain: "军事谋略"
    start_date: "-204"
    end_date: "-195"
    places: ["荥阳(今河南荥阳)", "云梦(今湖北孝感)", "平城(今山西大同)"]
    phases:
      - name: "反间计去范增"
        start_date: "-204"
        end_date: "-204"
        place: "荥阳(今河南荥阳)"
        highlight: "以离间计瓦解项羽与范增"
      - name: "擒韩信"
        start_date: "-196"
        end_date: "-196"
        place: "云梦(今湖北孝感)"
        highlight: "伪游云梦擒韩信"
      - name: "解白登之围"
        start_date: "-200"
        end_date: "-200"
        place: "平城(今山西大同)"
        highlight: "以阏氏之计解围"
    description_zh: "陈平归汉后，以六出奇计佐刘邦：一、反间计离间项王与范增；二、以金行间瓦解楚军；三、解荥阳之围；四、请封韩信以固其心；五、伪游云梦擒缚韩信；六、解白登之围。每计皆中要害，然秘不外传，世人莫知其详。"
    outcome: "六出奇计，每计皆成，奠定汉室基业"
    lesson: "用间之妙在于无形，谋深则事成"
  - title_zh: "两朝丞相，善终于家"
    domain: "政治"
    start_date: "-195"
    end_date: "-178"
    places: ["长安(今陕西西安)"]
    phases:
      - name: "诛诸吕"
        start_date: "-180"
        end_date: "-180"
        place: "长安(今陕西西安)"
        highlight: "与周勃合谋诛灭吕氏"
      - name: "拜右丞相"
        start_date: "-179"
        end_date: "-178"
        place: "长安(今陕西西安)"
        highlight: "位至丞相，善终于家"
    description_zh: "吕后时，陈平以中郎将事孝惠帝，后为左丞相。吕后崩，陈平与周勃合谋诛灭诸吕，迎立文帝。文帝以陈平为右丞相，位极人臣。陈平为相不治事，曰：'宰相者，上佐天子理阴阳，顺四时，下育万物之宜，外镇抚四夷诸侯，内亲附百姓，使卿大夫各得任其职焉。'在位一年余而薨。"
    outcome: "历经高祖、惠帝、吕后、文帝四朝，位至丞相，善终于家"
    lesson: "为政以不扰民为上，宰相之要在于识人用人"

events:
  - date: "-204"
    place_name: "荥阳(今河南荥阳)"
    event_type: "军事谋略"
    title_zh: "反间计去范增——瓦解项羽智囊"
    description_zh: "汉被围荥阳，楚围数重。陈平用金四万斤行反间于楚军，言范增与汉有私，欲灭项氏分地而王。项王果疑范增，增怒曰：'天下事大定矣，君王自为之！愿赐骸骨归。'归未至彭城，疽发背而死。项羽自此失一谋主。"
    is_highlight: true
    highlight_type: "谋略"
    highlight_note: "反间计——四万金瓦解项羽与范增的君臣信任，改变了楚汉格局"
  - date: "-200"
    place_name: "平城白登山(今山西大同)"
    event_type: "军事解围"
    title_zh: "白登之围——以美人计解围"
    description_zh: "高祖北征匈奴，被冒顿单于四十万骑围于白登山七日。陈平秘使厚遗阏氏，说曰：'汉有美女如此，今皇帝困急，欲献之单于。'阏氏恐夺其宠，乃谓冒顿曰：'两主不相困。今得汉地，单于亦非能居之。且汉主亦有神灵，单于察之。'冒顿遂解围一角，汉军得出。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "白登之围——以妇人之心解十万汉军之困，奇谋诡道的极致"
  - date: "-203"
    place_name: "荥阳(今河南荥阳)"
    event_type: "军事谋略"
    title_zh: "金行离间——以利诱瓦解楚臣"
    description_zh: "陈平为高祖画策，以四万斤黄金行反间于楚。平乃夜出美女二千人予项羽军中，楚将喧传。项羽见汉王美女，以为汉尽得楚地美女，军心动摇。"
    is_highlight: false
    highlight_type: "谋略"
    highlight_note: ""
  - date: "-196"
    place_name: "云梦泽(今湖北孝感)"
    event_type: "政治行动"
    title_zh: "伪游云梦擒韩信——借势擒虎"
    description_zh: "有人告韩信谋反，高祖欲击之。陈平曰：'陛下兵精孰与楚？将用兵孰与韩信？陛下举兵而攻之，是趣之战也。古者天子巡狩会见诸侯，南方有云梦，陛下出伪游云梦，会诸侯于陈，韩信必郊迎谒，陛下因禽之，此特一力士之事耳。'高祖从之，果擒韩信。"
    is_highlight: true
    highlight_type: "谋略"
    highlight_note: "伪游云梦——以最小成本擒获天下第一猛将，四两拨千斤"
  - date: "-205"
    place_name: "荥阳(今河南荥阳)"
    event_type: "人生转折"
    title_zh: "归汉——择明主而事"
    description_zh: "陈平先事魏王咎，不用。事项王，赐金二十斤，然项王刚愎自用。至汉，周勃、灌婴等谗之曰：'平居家时盗其嫂；事魏王不容，亡而归楚；归楚不中，又亡归汉。又受诸将金，金多者得善处，金少者得恶处。'高祖诘之，平对曰：'臣裸身来，不受金无以为资。大王所赐金不敢私，尽以飨士。'高祖乃厚赐之，拜为护军中尉。"
    is_highlight: true
    highlight_type: "人生转折"
    highlight_note: "盗嫂受金的辩白——小节有亏但大才无双，高祖的识人之明"
  - date: "-180"
    place_name: "长安(今陕西西安)"
    event_type: "政治行动"
    title_zh: "诛诸吕安刘——合谋平乱"
    description_zh: "吕后崩，诸吕欲为乱。陈平与周勃合谋，令郦寄说吕禄交北军兵权。周勃入北军，大呼'为刘氏者左袒'，军皆左袒。遂诛诸吕，迎立代王刘恒为文帝。陈平以功拜右丞相。"
    is_highlight: true
    highlight_type: "政治行动"
    highlight_note: "诛吕安刘——功臣集团联手终结外戚专权的关键时刻"
  - date: "-179"
    place_name: "长安(今陕西西安)"
    event_type: "政治理念"
    title_zh: "宰相之论——不治而治"
    description_zh: "文帝问陈平天下钱谷出入几何，平谢不知。曰：'陛下即问决狱，责廷尉；问钱谷，责治粟内史。宰相者，上佐天子理阴阳，顺四时，下育万物之宜，外镇抚四夷诸侯，内亲附百姓，使卿大夫各得任其职焉。'文帝善之。"
    is_highlight: true
    highlight_type: "政治理念"
    highlight_note: "宰相之论——权力的精髓不在于亲力亲为，而在于识人用人"
