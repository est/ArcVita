person:
  name_zh: "汉武帝"
  name_en: "Emperor Wu of Han"
  birth_date: "-156"
  death_date: "-87"
  birth_place: "长安(今陕西西安)"
  era: "西汉"
  archetype: "雄才大略的千古一帝"
  dilemmas: ["开疆拓土与国力消耗的矛盾", "求仙问道与帝王理性的撕裂", "独尊儒术与方士迷信的并存", "太子刘据巫蛊之祸的骨肉悲剧"]
  summary_zh: "景帝中子，十六岁即位。在位五十四年，罢黜百家独尊儒术，北击匈奴通西域，南灭南越东定朝鲜，建年号、行封禅、改历法。然穷兵黩武致海内虚耗，晚年下轮台罪己诏。求仙问道终生不悟，为方士所欺。"
  summary_first_person: "朕十六岁即位，承文景之富，外有匈奴之患。朕北逐匈奴通西域，南灭百越东定朝鲜，四海之内莫不臣服。然朕一生好神仙之事，遣方士入海求蓬莱，封泰山祭泰一，虽屡为方士所欺而终不悟。巫蛊之祸，太子自缢，朕之大憾也。晚年悔之，下轮台罪己诏，然天下虚耗已不可复矣。"
  lesson: "雄才大略者亦有大弊——穷兵黩武与求仙妄费为千古鉴戒。"

endavors:
  - title_zh: "北击匈奴开疆拓土"
    domain: "军事"
    start_date: "-129"
    end_date: "-89"
    places: ["长安(今陕西西安)", "河西走廊", "漠北(今蒙古)", "西域(今新疆及中亚)"]
    phases:
      - name: "酝酿"
        start_date: "-141"
        end_date: "-129"
        place: "长安(今陕西西安)"
        highlight: "即位初休养生息积蓄国力"
      - name: "破局"
        start_date: "-129"
        end_date: "-127"
        place: "河南地(今河套)"
        highlight: "卫青收河南地，设朔方郡"
      - name: "高潮"
        start_date: "-121"
        end_date: "-119"
        place: "漠北(今蒙古)"
        highlight: "霍去病封狼居胥，匈奴远遁漠北"
      - name: "收束"
        start_date: "-89"
        end_date: "-89"
        place: "长安(今陕西西安)"
        highlight: "轮台罪己诏，悔穷兵黩武"
    description_zh: "武帝以卫青霍去病为将，三次大规模北击匈奴。元朔二年卫青收河南地设朔方郡。元狩二年霍去病出陇西越焉支山，俘匈奴休屠王祭天金人。元狩四年卫青霍去病分兵漠北，去病封狼居胥山，匈奴远遁漠北。又遣张骞通西域，南灭南越，东定朝鲜，西南夷皆内属。然连年用兵致海内虚耗，晚年下轮台罪己诏。"
    outcome: "匈奴远遁，疆域空前辽阔，奠定汉帝国版图"
    lesson: "武功虽盛，穷兵黩武终致国力衰退"
  - title_zh: "罢黜百家独尊儒术"
    domain: "思想文化"
    start_date: "-134"
    end_date: "-134"
    places: ["长安(今陕西西安)"]
    phases:
      - name: "高潮"
        start_date: "-134"
        end_date: "-134"
        place: "长安(今陕西西安)"
        highlight: "董仲舒对策天人三策，武帝从之"
      - name: "收束"
        start_date: "-134"
        end_date: "-134"
        place: "长安(今陕西西安)"
        highlight: "设五经博士，立太学，儒学独尊"
    description_zh: "建元元年，武帝招贤良方正，董仲舒对策三篇，提出'罢黜百家独尊儒术'。武帝从之，设五经博士，立太学于长安。自此儒学成为中国两千年官方正统思想。赵绾王臧欲议古立明堂，以窦太后好黄老而废。窦太后崩后，儒术始大行。"
    outcome: "儒学独尊，奠定了中国两千年的思想文化格局"
    lesson: "思想统一是政治统一的基础"
  - title_zh: "封禅泰山与求仙问道"
    domain: "宗教祭祀"
    start_date: "-110"
    end_date: "-89"
    places: ["泰山(今山东泰安)", "甘泉(今陕西淳化)", "东海(今山东沿海)"]
    phases:
      - name: "酝酿"
        start_date: "-141"
        end_date: "-110"
        place: "长安(今陕西西安)"
        highlight: "李少君以祠灶却老方见上"
      - name: "高潮"
        start_date: "-110"
        end_date: "-110"
        place: "泰山(今山东泰安)"
        highlight: "登泰山封禅，如祭后土礼"
      - name: "收束"
        start_date: "-89"
        end_date: "-89"
        place: "长安(今陕西西安)"
        highlight: "方士言皆不验，天子益怠厌而终不悟"
    description_zh: "武帝尤敬鬼神之祀，终生求仙问道。李少君以祠灶致物却老方见上，言蓬莱仙人可见。齐人少翁以鬼神方拜文成将军，后以帛书饭牛事发被诛。栾大佩六印贵振天下，后亦被诛。公孙卿屡言见仙人迹，帝幸缑氏城视迹。元封元年封泰山禅梁父，然方士所言终无验。太史公曰'天子益怠厌方士怪迂语矣，然终羁縻弗绝冀遇其真'。"
    outcome: "封禅泰山成为帝王最高祭祀典礼，然求仙终无所得"
    lesson: "英明如武帝亦为迷信所惑——权力不能使人理性"
  - title_zh: "巫蛊之祸与太子之死"
    domain: "政治"
    start_date: "-91"
    end_date: "-91"
    places: ["长安(今陕西西安)", "湖县(今河南灵宝)"]
    phases:
      - name: "酝酿"
        start_date: "-92"
        end_date: "-91"
        place: "长安(今陕西西安)"
        highlight: "江充以巫蛊构陷太子"
      - name: "高潮"
        start_date: "-91"
        end_date: "-91"
        place: "长安(今陕西西安)"
        highlight: "太子起兵诛江充，与丞相军战于长安"
      - name: "收束"
        start_date: "-91"
        end_date: "-91"
        place: "湖县(今河南灵宝)"
        highlight: "太子兵败逃亡湖县自缢而死"
    description_zh: "征和二年，江充以巫蛊事构陷太子刘据。太子无以自明，起兵诛江充。丞相发兵与太子战于长安五日，死者数万人。太子兵败出亡，自缢于湖县。武帝事后知太子冤，然悔之晚矣。"
    is_highlight: true
    highlight_type: "悲剧"
    highlight_note: "骨肉相残——帝王家的至大悲剧"

events:
  - date: "-134"
    place_name: "长安(今陕西西安)"
    event_type: "思想"
    title_zh: "罢黜百家独尊儒术"
    description_zh: "武帝诏举贤良方正直言极谏之士，董仲舒对策三篇，提出'诸不在六艺之科孔子之术者皆绝其道勿使并进'。武帝从之，自此儒学独尊，设五经博士立太学，为中国两千年思想文化定下基调。"
    is_highlight: true
    highlight_type: "制度"
    highlight_note: "独尊儒术——中国思想史的分水岭"
  - date: "-119"
    place_name: "漠北(今蒙古)"
    event_type: "战役"
    title_zh: "漠北之战封狼居胥"
    description_zh: "元狩四年，武帝遣卫青霍去病各率五万骑分击漠北。卫青至漠北与匈奴单于接战，单于夜遁。霍去病深入漠北二千余里，封狼居胥山禅于姑衍，临瀚海而还。匈奴远遁漠北，漠南无王庭。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "封狼居胥——中国军事史上武功的最高象征"
  - date: "-110"
    place_name: "泰山(今山东泰安)"
    event_type: "祭祀"
    title_zh: "封禅泰山"
    description_zh: "元封元年，武帝东巡海上至泰山。令侍中儒者射牛行事，封泰山下东方。天子独与侍中奉车上泰山，亦有封其事皆禁。明日下阴道禅泰山下东北肃然山，如祭后土礼。天子皆亲拜见衣上黄而用乐。"
    is_highlight: true
    highlight_type: "仪式"
    highlight_note: "封禅——中国帝王最高祭祀典礼的巅峰"
  - date: "-104"
    place_name: "长安(今陕西西安)"
    event_type: "制度"
    title_zh: "太初改历"
    description_zh: "太初元年，武帝诏改历法，以正月为岁首，色上黄，官名更印章以五字。司马迁等造太初历，始以正月为岁首，沿用至今。又遣李广利西伐大宛，汉威远播西域。"
    is_highlight: true
    highlight_type: "制度"
    highlight_note: "太初历——中国历法史上的重大变革"
  - date: "-91"
    place_name: "长安(今陕西西安)"
    event_type: "政治悲剧"
    title_zh: "巫蛊之祸"
    description_zh: "江充与太子有隙，恐太子即位后不利，遂以巫蛊事构陷太子。武帝在甘泉宫，太子无以自明，矫制诛江充。丞相刘屈氂发兵与太子战于长安，五日死者数万人。太子兵败逃至湖县自缢。武帝事后族灭江充全家，作思子宫于太子所死之处。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "巫蛊之祸——父子相疑骨肉相残的人间惨剧"
  - date: "-89"
    place_name: "长安(今陕西西安)"
    event_type: "反省"
    title_zh: "轮台罪己诏"
    description_zh: "武帝晚年悔征伐之事，下诏曰'前有司奏欲益民赋三十助边用，是重困老弱孤独也。而今禽息兽散，是朕不明也'。又曰'当今务在禁苛暴止擅赋力本农修马复令以补缺毋乏武备而已'。自此不复出军。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "轮台罪己诏——千古一帝的最后反省"
  - date: "-87"
    place_name: "未央宫(今陕西西安)"
    event_type: "终局"
    title_zh: "驾崩与身后"
    description_zh: "武帝崩于未央宫，年七十。遗诏立少子弗陵为太子，霍光辅政。在位五十四年，开疆万里功业赫赫，然海内虚耗户口减半。太史公曰'余从巡祭天地诸神名山川而封禅焉'，亲见其事，退而论次以传后世。"
    is_highlight: true
    highlight_type: "结局"
    highlight_note: "功过参半——后世对其评价始终褒贬不一"
