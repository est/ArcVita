      - name: "思想定一尊"
        start_date: "-134"
        end_date: "-130"
        place: "长安(今陕西西安)"
        highlight: "儒学成为官方意识形态"
    description_zh: "建元元年，武帝诏举贤良方正直言极谏之士，董仲舒以天人三策对之。策中提出天人感应、三纲五常、大一统、独尊儒术等理论。武帝善之，遂令罢黜百家，表章六经，立五经博士，开太学。自此儒学成为中国两千年的官方正统思想。"
    outcome: "儒学成为官方意识形态，影响中国两千年"
    lesson: "思想统一可以凝聚人心，但也可能压制多元"
  - title_zh: "《春秋》决狱——以儒学改造法律"
    domain: "法律思想"
    start_date: "约-130"
    end_date: "约-110"
    places: ["长安(今陕西西安)", "江都(今江苏扬州)"]
    phases:
      - name: "著书立说"
        start_date: "约-130"
        end_date: "约-110"
        place: "长安(今陕西西安)"
        highlight: "著《春秋繁露》——儒学理论化"
      - name: "春秋决狱"
        start_date: "约-125"
        end_date: "约-110"
        place: "江都(今江苏扬州)"
        highlight: "以《春秋》经义断案"
    description_zh: "董仲舒著《春秋繁露》，系统阐述天人感应、阴阳五行、三纲五常等理论。又提倡'春秋决狱'，即以《春秋》经义作为审判案件的依据，强调'论心定罪'，开启了以儒学改造法律的先河。其学说杂糅儒、法、阴阳各家，建立了庞大而精密的思想体系。"
    outcome: "建立了儒学的完整理论体系，开创了经学传统"
    lesson: "思想的力量在于体系化，理论一旦成为信仰便不可撼动"
  - title_zh: "天人感应——以天制君的双刃剑"
    domain: "政治哲学"
    start_date: "-134"
    end_date: "约-104"
    places: ["长安(今陕西西安)"]
    phases:
      - name: "天人感应之论"
        start_date: "-134"
        end_date: "-134"
        place: "长安(今陕西西安)"
        highlight: "天人三策——以天制君"
      - name: "灾异之说获罪"
        start_date: "-120"
        end_date: "-120"
        place: "长安(今陕西西安)"
        highlight: "论辽东高庙灾得罪"
    description_zh: "董仲舒以天人感应之说限制君权，认为天灾是对君主失德的谴告。然辽东高庙及长陵高园殿灾，仲舒居家推说其意，主张诛杀臣下。事泄获罪，废为中大夫。后虽赦免，然不敢复言灾异。"
    is_highlight: true
    highlight_type: "思想双刃"
    highlight_note: "以天制君——儒学对皇权最大的约束努力，却也是最脆弱的约束"

events:
  - date: "约-150"
    place_name: "广川(今河北枣强)"
    event_type: "人生经历"
    title_zh: "三年不窥园——苦读成大儒"
    description_zh: "董仲舒治《春秋》，下帷讲诵，弟子传以久次相受业，或莫见其面，盖三年不窥园。其精如此。进退容止，非礼不行，学士皆师尊之。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "三年不窥园——中国文化中专心治学的经典符号"
  - date: "-134"
    place_name: "长安(今陕西西安)"
    event_type: "政治决策"
    title_zh: "天人三策——罢黜百家独尊儒术"
    description_zh: "武帝即位，诏举贤良文学之士前后百数。董仲舒对策曰：'《春秋》大一统者，天地之常经，古今之通谊也。今师异道，人异论，百家殊方，指意不同，是以上亡以持一统，法制数变，下不知所守。臣愚以为诸不在六艺之科孔子之术者，皆绝其道，勿使并进。'武帝善之。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "天人三策——改变了中国思想史走向的三篇对策，两千年的思想底色由此奠定"
  - date: "-134"
    place_name: "长安(今陕西西安)"
    event_type: "思想论述"
    title_zh: "天人感应——以天制君"
    description_zh: "董仲舒对策又曰：'臣闻天之所大奉使之王者，必有非人力所能致而自至者，此受命之符也。天下之人同心归之，若归父母，故天瑞应诚而至。'又曰：'国家将有失道之败，而天乃先出灾害以谴告之。'此即天人感应之说，以天灾谴告限制君权。"
    is_highlight: true
    highlight_type: "思想论述"
    highlight_note: "天人感应——用天的名义约束皇权，是中国政治哲学中最具创意也最脆弱的制衡"
  - date: "约-125"
    place_name: "江都(今江苏扬州)"
    event_type: "思想实践"
    title_zh: "春秋决狱——以经义断案"
    description_zh: "董仲舒为江都相时，以《春秋》经义决狱。其论罪惟求其心，所谓'原心定罪'。如甲无子，拾路旁弃儿乙养之。乙长有罪杀人，甲藏之。律曰：'杀人者死。'仲舒议曰：'甲无子，振活养乙，虽非所生，谁与易之？《春秋》之义，父为子隐，甲宜匿乙。'诏不当坐。"
    is_highlight: true
    highlight_type: "思想实践"
    highlight_note: "春秋决狱——以道德判断取代法律条文，开启了经学司法化的传统"
  - date: "-120"
    place_name: "长安(今陕西西安)"
    event_type: "人生危机"
    title_zh: "辽东高庙灾——以天制君反噬自身"
    description_zh: "辽东高庙及长陵高园殿灾，董仲舒居家推说其意。主父偃窃其书奏之。天子视诸儒生，仲舒弟子吕步舒不知其师书，以为大愚。于是下仲舒吏，当死，诏赦之。仲舒遂不敢复言灾异。"
    is_highlight: true
    highlight_type: "人生转折"
    highlight_note: "以天制君反获罪——思想家的理论与现实政治之间的致命鸿沟"
  - date: "约-110"
    place_name: "长安(今陕西西安)"
    event_type: "学术成就"
    title_zh: "《春秋繁露》——儒学体系化的巅峰"
    description_zh: "董仲舒著《春秋繁露》十七卷八十二篇，系统阐述天人感应、阴阳五行、三纲五常等理论。将儒学与阴阳家、法家、道家思想杂糅，建立了庞大精密的思想体系。此书成为汉代今文经学的代表作，奠定了儒学官方化的理论基础。"
    is_highlight: true
    highlight_type: "学术成就"
    highlight_note: "《春秋繁露》——儒学从百家之一变为官方意识形态的理论奠基"
