person:
  name_zh: "司马迁"
  name_en: "Sima Qian"
  birth_date: "约-145"
  death_date: "约-90"
  birth_place: "夏阳(今陕西韩城)"
  era: "西汉武帝时期"
  archetype: "以血泪铸史的史家之圣"
  dilemmas: ["受腐刑后的生死抉择", "天人之际与古今之变的学术追求", "秉笔直书与当朝权力的冲突"]
  summary_zh: "太史令司马谈之子，继父志修《史记》，以'究天人之际，通古今之变，成一家之言'为旨。因李陵之祸受腐刑，忍辱负重完成中国第一部纪传体通史。《史记》百三十篇五十二万余字，为后世二十四史之首，被鲁迅誉为'史家之绝唱，无韵之离骚'。"
  summary_first_person: "吾父太史公临终执吾手而泣曰：'余死，汝必为太史。为太史，无忘吾所欲论著矣。'吾泣而受命。后遭李陵之祸，受腐刑之辱，肠一日而九回。每念斯耻，汗未尝不发背沾衣。然吾思之：'人固有一死，或重于泰山，或轻于鸿毛。'遂隐忍苟活，卒述往事，成一家之言。百三十篇既成，藏之名山，传之其人。此书上起黄帝，下至太初，凡三千余年，天人之际，古今之变，皆在其中。吾之血泪，唯此书可证。"
  lesson: "人固有一死，或重于泰山，或轻于鸿毛——忍辱负重只为不朽之业。"

