        highlight: "发愤著书终成《史记》"
    description_zh: "司马迁二十壮游天下，南游江淮，北涉汶泗，过梁楚之地，广泛搜集史料。元封三年继父太史令之职，开始著述。天汉二年，李陵败降匈奴，司马迁为之辩护，触怒武帝，下狱受腐刑。受刑后，他选择了忍辱负重继续著书，以'究天人之际，通古今之变，成一家之言'为旨，前后历经十四年，终于完成《史记》百三十篇。"
    outcome: "《史记》百三十篇五十二万余字，成为二十四史之首"
    lesson: "著书立说可以超越个人荣辱，成就千古不朽"
