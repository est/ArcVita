        start_date: "约-126"
        end_date: "约-125"
        place: "江淮一带"
        highlight: "登会稽探禹穴"
      - name: "北涉汶泗"
        start_date: "约-125"
        end_date: "约-124"
        place: "齐鲁之地"
        highlight: "观孔子遗风"
      - name: "过梁楚归"
        start_date: "约-124"
        end_date: "约-123"
        place: "梁楚之地"
        highlight: "访彭城丰沛"
    description_zh: "司马迁二十而南游江淮，上会稽探禹穴，窥九疑浮于沅湘；北涉汶泗，讲业齐鲁之都，观孔子遗风；过梁楚以归。此行足迹遍天下，广泛搜集民间传说和历史遗闻，为日后著《史记》奠定了丰厚的史料基础。"
    outcome: "实地考察使《史记》充满鲜活的民间视角和历史细节"
    lesson: "读万卷书行万里路，方能写出有血有肉的历史"

events:
  - date: "约-126"
    place_name: "全国各地"
    event_type: "人生经历"
    title_zh: "二十壮游——以双脚丈量天下"
    description_zh: "迁生龙门，耕牧河山之阳。年十岁则诵古文。二十而南游江淮，上会稽，探禹穴，窥九疑，浮于沅湘；北涉汶泗，讲业齐鲁之都，观孔子之遗风，乡射邹峄；厄困鄱薛彭城，过梁楚以归。"
    is_highlight: true
    highlight_type: "人生转折"
    highlight_note: "壮游天下——从书斋到田野，为《史记》注入了鲜活的生命力"
  - date: "-110"
    place_name: "泰山(今山东泰安)"
    event_type: "人生转折"
    title_zh: "泰山受命——继父志修史"
    description_zh: "天子始封泰山，太史公留滞周南，不得从事，发愤且卒。而子迁适使反，见父于河洛之间。太史公执迁手而泣曰：'余先周室之太史也。自上世尝显功名于虞夏，典天官事。后世中衰，绝于予乎？汝复为太史，则续吾祖矣。'迁俯首流涕曰：'小子不敏，请悉论先人所次旧闻，弗敢阙。'"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "太史公受命——临终托付，史家血脉的传承，千古史学的起点"
  - date: "-99"
    place_name: "长安(今陕西西安)"
    event_type: "人生危机"
    title_zh: "李陵之祸——受腐刑忍辱著书"
    description_zh: "天汉二年，李陵将五千步卒深入匈奴，转斗千里，弹尽援绝而降。武帝召问，群臣皆言陵罪。太史公独曰：'陵事亲孝，与士信，常奋不顾身以赴国家之急。今举事一不幸，全躯保妻子之臣随而媒孽其短，诚可痛也。'武帝以为沮贰师将军，下狱受腐刑。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "李陵之祸——秉笔直书者的宿命，为一句公道话付出最惨烈的代价"
  - date: "约-99"
    place_name: "长安(今陕西西安)"
    event_type: "人生抉择"
    title_zh: "生死抉择——或重于泰山或轻于鸿毛"
    description_zh: "受腐刑后，司马迁肠一日而九回，居则忽忽若有所亡，出则不知所往。每念斯耻，汗未尝不发背沾衣。然而他选择了隐忍苟活，因为《史记》未成。他写道：'人固有一死，或重于泰山，或轻于鸿毛。所以隐忍苟活，幽于粪土之中而不辞者，恨私心有所不尽，鄙陋没世而文采不表于后世也。'"
    is_highlight: true
    highlight_type: "名言"
    highlight_note: "或重于泰山或轻于鸿毛——中国文化中对生命价值最深刻的追问"
  - date: "约-91"
    place_name: "长安(今陕西西安)"
    event_type: "成就"
    title_zh: "《史记》成书——史家之绝唱"
    description_zh: "《史记》百三十篇，五十二万六千五百字，上起黄帝，下至太初元年，凡三千余年。分为十二本纪、十表、八书、三十世家、七十列传。体大思精，文约而事丰，被鲁迅誉为'史家之绝唱，无韵之离骚'。"
    is_highlight: true
    highlight_type: "成就"
    highlight_note: "《史记》——中国纪传体史书之祖，二十四史之首，影响中国两千年"
  - date: "约-91"
    place_name: "长安(今陕西西安)"
    event_type: "人生终章"
    title_zh: "藏之名山传之其人——史家的最后嘱托"
    description_zh: "《史记》既成，迁报任安书曰：'仆诚以著此书，藏之名山，传之其人，通邑大都，则仆偿前辱之责，虽万被戮，岂有悔哉！然此可为智者道，难为俗人言也。'司马迁之卒年不可确考，约在武帝末年。"
    is_highlight: true
    highlight_type: "人生终章"
    highlight_note: "藏之名山传之其人——千古史家的最后寄望，最终实现了不朽"
