person:
  name_zh: "项羽"
  name_en: "Xiang Yu"
  birth_date: "-232"
  death_date: "-202"
  birth_place: "下相(今江苏宿迁)"
  era: "秦末楚汉"
  archetype: "力拔山兮的末路霸王"
  dilemmas: ["贵族血统与草莽天下的矛盾", "刚愎自用与唯才是举的撕裂", "天亡我非战之罪的自我欺骗"]
  summary_zh: "楚将项燕之孙，起于江东，三年灭秦，分封天下，号为霸王。然刚愎拒谏、背约失义，终困垓下，四面楚歌，乌江自刎，年仅三十一。"
  summary_first_person: "吾起兵时二十四，八千子弟渡江而西，所当者破，所击者服，未尝一败。钜鹿破釜沉舟，诸侯壁上而观；鸿门纵虎归山，至今悔之。天亡我也，非战之罪——吾至死不悟，亦至死不悔。力拔山兮气盖世，时不利兮骓不逝。虞兮虞兮柰若何！"
  lesson: "个人武勇终不敌制度之力，刚愎自用者必失天下人心。"

endavors:
  - title_zh: "会稽起兵，八千子弟渡江"
    domain: "军事"
    start_date: "-209"
    end_date: "-208"
    places: ["会稽郡(今江苏苏州)", "江东"]
    phases:
      - name: "酝酿"
        start_date: "-209"
        end_date: "-209"
        place: "会稽(今江苏苏州)"
        highlight: "彼可取而代也"
      - name: "破局"
        start_date: "-209"
        end_date: "-209"
        place: "会稽守府"
        highlight: "拔剑斩会稽守，击杀数十百人"
      - name: "高潮"
        start_date: "-208"
        end_date: "-208"
        place: "江东"
        highlight: "收精兵八千，渡江西进"
      - name: "收束"
        start_date: "-208"
        end_date: "-208"
        place: "薛城(今山东滕州)"
        highlight: "立楚怀王孙心，号武信君"
    description_zh: "秦二世元年，陈胜首难，项梁与项羽于会稽斩郡守起兵。项羽击杀数十百人，一府慴伏。遂收吴中子弟八千人渡江而西，一路吞并各路义军，至薛城立楚怀王，号令诸侯。"
    outcome: "八千子弟起家，奠定反秦主力地位"
    lesson: "英雄起于草莽，贵在果决敢为"

  - title_zh: "巨鹿破釜沉舟，一战定天下"
    domain: "军事"
    start_date: "-207"
    end_date: "-207"
    places: ["钜鹿(今河北平乡)", "漳水(今河北南部)"]
    phases:
      - name: "酝酿"
        start_date: "-207"
        end_date: "-207"
        place: "安阳(今山东曹县)"
        highlight: "怒斩卿子冠军宋义，夺军权"
      - name: "破局"
        start_date: "-207"
        end_date: "-207"
        place: "漳水(今河北南部)"
        highlight: "破釜沉舟，持三日粮渡河"
      - name: "高潮"
        start_date: "-207"
        end_date: "-207"
        place: "钜鹿(今河北平乡)"
        highlight: "九战九捷，大破秦军，虏王离"
      - name: "收束"
        start_date: "-207"
        end_date: "-207"
        place: "漳南(今河北南部)"
        highlight: "诸侯将入辕门，膝行莫敢仰视"
    description_zh: "宋义为上将军救赵，按兵不动四十六日。项羽怒而斩之，夺军权。悉引兵渡河，皆沈船破釜甑烧庐舍，示士卒必死。九战九胜，绝秦甬道，大破之。诸侯军壁上观战，见楚兵一以当十，呼声动天，皆惴恐。及秦破，诸侯入辕门，膝行而前，莫敢仰视。"
    outcome: "巨鹿大捷，秦军主力覆灭，项羽成为诸侯上将军"
    lesson: "置之死地而后生，绝境中方见英雄本色"

  - title_zh: "鸿门宴纵虎归山"
    domain: "政治"
    start_date: "-206"
    end_date: "-206"
    places: ["鸿门(今陕西临潼)", "霸上(今陕西西安东)"]
    phases:
      - name: "酝酿"
        start_date: "-206"
        end_date: "-206"
        place: "鸿门(今陕西临潼)"
        highlight: "范增力主击杀刘邦"
      - name: "破局"
        start_date: "-206"
        end_date: "-206"
        place: "鸿门帐中"
        highlight: "项庄舞剑意在沛公"
      - name: "高潮"
        start_date: "-206"
        end_date: "-206"
        place: "鸿门帐中"
        highlight: "樊哙闯帐怒斥项王"
      - name: "收束"
        start_date: "-206"
        end_date: "-206"
        place: "鸿门"
        highlight: "刘邦间行脱身，项羽受璧坐上"
    description_zh: "刘邦先入关中，项羽大怒欲击。项伯夜告张良，刘邦亲赴鸿门谢罪。范增数目项王举玦示意，项王默然不应。项庄舞剑，项伯翼蔽沛公。樊哙闯帐怒斥，项王未有以应。刘邦借如厕间行遁去。亚父拔剑撞破玉斗，叹竖子不足与谋。"
    outcome: "项羽失去铲除最大对手的最后机会"
    lesson: "妇人之仁、匹夫之勇，终为天下笑"

  - title_zh: "分封天下，自立西楚霸王"
    domain: "政治"
    start_date: "-206"
    end_date: "-206"
    places: ["彭城(今江苏徐州)", "咸阳(今陕西咸阳)"]
    phases:
      - name: "高潮"
        start_date: "-206"
        end_date: "-206"
        place: "彭城(今江苏徐州)"
        highlight: "自立西楚霸王，分封十八路诸侯"
      - name: "收束"
        start_date: "-206"
        end_date: "-206"
        place: "咸阳(今陕西咸阳)"
        highlight: "屠咸阳杀子婴，烧秦宫室火三月不灭"
    description_zh: "项羽灭秦后，尊怀王为义帝而架空之，自立为西楚霸王都彭城。分封天下十八王，将刘邦远封巴蜀。西入咸阳杀秦降王子婴，烧秦宫室火三月不灭，收货宝妇女而东。或说关中可都以霸，项羽曰'富贵不归故乡如衣绣夜行'，烹说者。"
    outcome: "建立西楚霸权，但分封不均埋下诸侯反叛祸根"
    lesson: "沐猴而冠，有霸业之才而无帝王之量"

events:
  - date: "-209"
    place_name: "会稽(今江苏苏州)"
    event_type: "起义"
    title_zh: "会稽斩守起兵"
    description_zh: "秦二世元年，项梁与项羽于会稽郡府起事。项羽拔剑斩会稽守头，击杀府中数十百人，一府慴伏莫敢起。遂举吴中兵，得精兵八千人，开始了灭秦大业。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "项羽年仅二十四，力能扛鼎，一剑定江东"
  - date: "-207"
    place_name: "钜鹿(今河北平乡)"
    event_type: "战役"
    title_zh: "破釜沉舟大破秦军"
    description_zh: "项羽杀宋义夺军权后，悉引兵渡河，皆沈船、破釜甑、烧庐舍，持三日粮以示必死。九战绝秦甬道，大破王离军。诸侯军从壁上观战，见楚兵呼声动天、一以当十，皆惴恐。秦破后诸侯入辕门膝行莫敢仰视，项羽由是始为诸侯上将军。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "以少胜多的经典战例，奠定霸王威名"
  - date: "-206"
    place_name: "鸿门(今陕西临潼)"
    event_type: "政治博弈"
    title_zh: "鸿门宴"
    description_zh: "项羽四十万大军驻新丰鸿门，刘邦十万军霸上。项伯夜告张良，刘邦赴鸿门谢罪。范增三次举玦示意杀刘，项王默然不应。项庄舞剑意在沛公，樊哙闯帐怒斥。项王赐酒赐彘肩而不能杀。刘邦借如厕遁走，范增拔剑撞碎玉斗叹曰'夺项王天下者必沛公'。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "中国历史上最著名的一场饭局，决定天下归属"
  - date: "-206"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "暴行"
    title_zh: "屠咸阳烧秦宫"
    description_zh: "项羽引兵入咸阳，杀秦降王子婴，烧秦宫室火三月不灭，收其货宝妇女而东。有人劝都关中以霸天下，项羽曰'富贵不归故乡如衣绣夜行'，烹说者。秦人大失望，遂失关中民心。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "一念之差失天下——衣锦还乡的虚荣毁掉霸王基业"
  - date: "-206"
    place_name: "新安(今河南新安)"
    event_type: "暴行"
    title_zh: "坑杀秦降卒二十万"
    description_zh: "章邯率秦军二十万降楚，至新安。诸侯吏卒此前在秦中受秦吏凌辱，今乘胜奴役秦降卒。秦卒多怨言，诸将告项羽。项羽恐至关中不听，遂夜击坑杀秦卒二十余万人新安城南。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "残忍暴行失尽关中民心，反为刘邦铺路"
  - date: "-204"
    place_name: "彭城(今江苏徐州)"
    event_type: "战役"
    title_zh: "彭城之战大破汉军"
    description_zh: "刘邦趁项羽北击齐之际，以五十六万大军攻占彭城。项羽闻讯，自以精兵三万从鲁出胡陵，晨击汉军。日中大破之，汉军走穀泗水死者十余万人。追至灵壁睢水，汉卒十余万人皆入睢水，睢水为之不流。围刘邦三匝，大风起，刘邦乃得遁去。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "三万破五十六万——楚汉战争中最戏剧性的逆转"
  - date: "-203"
    place_name: "广武(今河南荥阳北)"
    event_type: "对峙"
    title_zh: "广武对峙与分羹之问"
    description_zh: "楚汉相持于广武，项羽将刘邦之父太公置于高俎上，告汉王曰'今不急下吾烹太公'。刘邦笑曰'吾与项羽约为兄弟，吾翁即若翁，必欲烹而翁幸分我一杯羹'。项羽怒欲杀之，项伯劝止。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "笑分一杯羹——刘邦的无赖与项羽的无奈"
  - date: "-203"
    place_name: "鸿沟(今河南荥阳一带)"
    event_type: "和约"
    title_zh: "鸿沟中分天下"
    description_zh: "楚汉久相持未决，丁壮苦军旅，老弱罢转漕。项羽谓刘邦愿挑战决雌雄，刘邦笑谢曰'吾宁斗智不能斗力'。伏弩射中汉王。后彭越绝楚粮道，项羽被迫与刘邦约中分天下，鸿沟以西为汉，以东为楚。归太公吕后，军中皆呼万岁。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "中分天下的短暂和平——'楚河汉界'由此而来"
  - date: "-202"
    place_name: "垓下(今安徽灵璧)"
    event_type: "战役"
    title_zh: "四面楚歌霸王别姬"
    description_zh: "韩信三十万大军围项羽于垓下，夜闻四面皆楚歌。项羽大惊曰'汉皆已得楚乎'，起饮帐中，悲歌慷慨：'力拔山兮气盖世，时不利兮骓不逝。骓不逝兮可柰何，虞兮虞兮柰若何！'美人虞姬和之，项王泣数行下，左右皆泣莫能仰视。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "中国文学史上最悲壮的离别场景，千古绝唱"
  - date: "-202"
    place_name: "东城(今安徽定远)"
    event_type: "终局"
    title_zh: "乌江自刎"
    description_zh: "项羽溃围至东城仅余二十八骑，谓其骑曰'吾身七十馀战未尝败北，然今卒困于此，天之亡我也非战之罪'。遂分骑四队，三胜汉军。至乌江，亭长备船待渡，项羽笑曰'天之亡我我何渡为！江东子弟八千人渡江而西今无一人还，纵父兄怜而王我何面目见之'。赐骓马于亭长，独身接战数百人，身被十余创，自刎而死。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "自刎乌江——中国历史上最悲壮的英雄末路"
