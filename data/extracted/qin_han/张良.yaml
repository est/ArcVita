person:
  name_zh: "张良"
  name_en: "Zhang Liang"
  birth_date: "约-250"
  death_date: "-186"
  birth_place: "韩国城父(今河南宝丰)"
  era: "秦末汉初"
  archetype: "以智谋定天下的谋圣"
  dilemmas: ["为韩复仇与天下的格局冲突", "功成身退与济世责任的抉择", "帝王心术下的明哲保身"]
  summary_zh: "韩国贵族后裔，散千金于刺客刺秦始皇未遂，后得黄石公兵书，辅佐刘邦以智谋定天下，运筹帷幄之中、决胜千里之外，封留侯，终以辟谷从赤松子游，功成身退为千古楷模。"
  summary_first_person: "吾本韩相之后，韩亡于秦，吾恨之入骨。博浪沙一击，虽不中秦皇帝，然天下知有张良一人。后于下邳圯上得黄石公兵书，读之十年，胸中自有天下经纬。沛公用吾之策，入咸阳、还定三秦、鸿门宴脱险、下邑之谋定天下大计，垓下一战灭项王。功成之后，吾辞封万户侯而请封留，从赤松子游，辟谷学道。人皆以为奇，吾知帝王之侧非久居之地也。"
  lesson: "大智若愚，功成身退，方为全身之策。"

