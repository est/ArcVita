      - name: "决胜垓下"
        start_date: "-202"
        end_date: "-202"
        place: "垓下(今安徽灵璧)"
        highlight: "十面埋伏灭项王"
    description_zh: "张良少时为韩报仇，遣力士刺秦始皇于博浪沙，误中副车。逃亡下邳，于圯上遇黄石公，三试之而后授以《太公兵法》。后投沛公刘邦，以运筹帷幄之策辅佐之。入咸阳时劝沛公秋毫无犯，鸿门宴上以智脱沛公于死地。楚汉相争，张良献下邑之谋，约韩信、彭越、英布三路并进，垓下之战一举灭项羽。"
    outcome: "刘邦从一介亭长而有天下，张良谋功居首"
    lesson: "善战者无赫赫之功，善谋者运天下于掌上"
  - title_zh: "辟谷从游，功成身退"
    domain: "处世哲学"
    start_date: "-201"
    end_date: "-186"
    places: ["长安(今陕西西安)", "留(今江苏沛县东南)"]
    phases:
      - name: "辞封留地"
        start_date: "-201"
        end_date: "-201"
        place: "长安(今陕西西安)"
        highlight: "封留侯——以地名为号"
      - name: "辟谷从游"
        start_date: "-198"
        end_date: "-186"
        place: "长安(今陕西西安)"
        highlight: "从赤松子游，不问政事"
    description_zh: "天下既定，张良辞曰：'家世相韩，及韩灭，不爱万金之资，为韩报仇强秦，天下震动。今以三寸舌为帝者师，封万户，位列侯，此布衣之极，于良足矣。愿弃人间事，欲从赤松子游耳。'遂辟谷导引，杜门不出。"
    outcome: "张良成为功臣善终的典范，封留侯而终"
    lesson: "知进退、明得失，是比谋略更高的智慧"

events:
  - date: "-218"
    place_name: "博浪沙(今河南原阳)"
    event_type: "刺杀行动"
    title_zh: "博浪沙刺秦——义士一击"
    description_zh: "良年少时，韩破，良家僮三百人，弟死不葬，悉以家财求客刺秦王，为韩报仇。得力士，为铁椎重百二十斤。秦皇帝东游至博浪沙中，良与力士狙击秦皇帝，误中副车。秦皇帝大怒，大索天下。良乃更名姓，亡匿下邳。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "博浪沙刺秦——以一介布衣撼动天下之志，虽败犹荣"
  - date: "-209"
    place_name: "下邳(今江苏邳州)"
    event_type: "人生转折"
    title_zh: "圯上受书——黄石公三试张良"
    description_zh: "良尝从容步游下邳圯上，有一老父衣褐，至良所，直堕其履圯下，顾谓良曰：'孺子，下取履！'良愕然，欲殴之。为其老，强忍，下取履。父曰：'履我！'良业为取履，因长跪履之。父以足受，笑而去。复还曰：'孺子可教矣。后五日平明，与我会此。'如是者三，乃授以《太公兵法》，曰：'读此则为王者师矣。'"
    is_highlight: true
    highlight_type: "成语典故"
    highlight_note: "圯上受书——忍辱负重方得真传，成为张良人生的转折点"
  - date: "-206"
    place_name: "鸿门(今陕西临潼)"
    event_type: "政治博弈"
    title_zh: "鸿门宴——智保沛公"
    description_zh: "沛公入咸阳还军霸上，项羽大怒欲击之。张良夜驰往见项伯，使项伯为沛公说项羽。鸿门宴上，项庄舞剑意在沛公，张良急召樊哙入帐护卫。又令沛公如厕遁走，从小道归灞上。项羽虽怒，终不能害沛公。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "鸿门宴——中国史上最惊心动魄的饭局，张良的智谋在生死一线间展现"
  - date: "-204"
    place_name: "下邑(今安徽砀山)"
    event_type: "战略决策"
    title_zh: "下邑之谋——定天下大计"
    description_zh: "彭城之败后，刘邦问：'吾欲捐关以东等弃之，谁可与共功者？'张良对曰：'九江王布，楚枭将，与项王有隙；彭越与齐王田荣反梁地。此两人可急使。而汉王之将独韩信可属大事，当一面。即欲捐之，捐之此三人，则楚可破也。'此即'下邑之谋'，为灭楚定下了总方略。"
    is_highlight: true
    highlight_type: "战略"
    highlight_note: "下邑之谋——以三路合围破楚的战略蓝图，中国军事史上以少胜多的谋略典范"
  - date: "-203"
    place_name: "荥阳(今河南荥阳)"
    event_type: "政治决策"
    title_zh: "借箸谏阻分封——以箸代筹"
    description_zh: "郦食其劝刘邦分封六国后裔以制楚，刘邦已令刻印将行。张良从外来谒，汉王方食，曰：'客有为我计桡楚权者。'具以郦生言告良，曰：'何如？'良曰：'谁为陛下画此计者？陛下事去矣。'借箸前筹，历数八不可，刘邦辍食吐哺，骂曰：'竖儒，几败而公事！'令趣销印。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "借箸谏阻——以八条理由力挽狂澜，阻止了刘邦最大的战略失误"
  - date: "-202"
    place_name: "垓下(今安徽灵璧)"
    event_type: "战役"
    title_zh: "垓下之围——四面楚歌"
    description_zh: "张良献策，约韩信、彭越如期并进。韩信从齐地南下，彭越从梁地西进，英布从九江北上，三路合围。汉军四面皆楚歌，项羽闻之曰：'汉皆已得楚乎？是何楚人之多也！'遂夜起饮帐中，悲歌慷慨，虞姬和之。项王泣数行下，左右皆泣，莫能仰视。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "四面楚歌——英雄末路的千古悲歌，也是张良战略谋划的最终成果"
  - date: "-201"
    place_name: "长安(今陕西西安)"
    event_type: "政治决策"
    title_zh: "请封留地——功成身退"
    description_zh: "高祖封功臣，张良无战功，高祖曰：'运筹帷帐中，决胜千里外，子房功也。自择齐三万户。'良曰：'始臣起下邳，与上会留，此天以臣授陛下。陛下用臣计，幸而时中，臣愿封留足矣，不敢当三万户。'乃封张良为留侯。"
    is_highlight: true
    highlight_type: "决策智慧"
    highlight_note: "让封三万户——功臣自谦避祸的最高境界"
