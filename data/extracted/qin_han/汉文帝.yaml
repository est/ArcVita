person:
  name_zh: "汉文帝"
  name_en: "Emperor Wen of Han"
  birth_date: "-203"
  death_date: "-157"
  birth_place: "代地中都(今山西平遥)"
  era: "西汉"
  archetype: "以德化民的仁圣之君"
  dilemmas: ["诸侯王尾大不掉与中央集权的矛盾", "匈奴侵边与和亲求安的两难", "个人节俭与国家强盛的平衡"]
  summary_zh: "高祖中子，初封代王。诸吕既诛，大臣迎立。在位二十三年，废肉刑、除诽谤、减田租、轻徭薄赋，以德化民。宫室苑囿无所增益，治霸陵皆用瓦器。海内殷富，兴于礼义，开文景之治之先河。"
  summary_first_person: "朕本代王，居边鄙之地，不意大臣迎立。即位之初，诸吕新灭，人心未安。朕约法省禁，废肉刑，除诽谤，劝农桑，轻徭役。欲作露台，计直百金，中民十家之产也，遂不作。衣绨衣，帏帐不文绣，以示敦朴为天下先。匈奴入寇，朕不欲烦苦百姓深入追击，但令边备守而已。二十三年崩，遗令薄葬，天下闻之皆哀。"
  lesson: "治天下不在于有为，而在于与民休息；仁德胜于武力，节俭胜于奢华。"

endavors:
  - title_zh: "文景之治：以德化民开盛世"
    domain: "治国"
    start_date: "-180"
    end_date: "-157"
    places: ["长安(今陕西西安)", "未央宫"]
    phases:
      - name: "酝酿"
        start_date: "-180"
        end_date: "-179"
        place: "长安(今陕西西安)"
        highlight: "即位后大赦天下，废连坐收帑律"
      - name: "破局"
        start_date: "-179"
        end_date: "-173"
        place: "长安(今陕西西安)"
        highlight: "废除肉刑、除诽谤罪、劝农开籍田"
      - name: "高潮"
        start_date: "-167"
        end_date: "-157"
        place: "长安(今陕西西安)"
        highlight: "除田租税、天下殷富、礼义大兴"
      - name: "收束"
        start_date: "-157"
        end_date: "-157"
        place: "未央宫"
        highlight: "遗诏薄葬，令天下临丧三日即释服"
    description_zh: "文帝即位后，先废秦苛法连坐收帑，再除肉刑。二年令列侯就国减轻长安供给。十三年除田租税，劝农务本。南越王尉佗自立为武帝，上召贵其兄弟以德报之，佗遂去帝称臣。与匈奴和亲，背约入盗亦不深入追击，恶烦苦百姓。二十三年崩，遗令薄葬不起坟，灞陵皆瓦器。"
    outcome: "海内殷富、兴于礼义，奠定文景之治"
    lesson: "无为而治是最高的治术——让百姓休养生息即是最大的仁政"
  - title_zh: "缇萦上书除肉刑"
    domain: "法治"
    start_date: "-167"
    end_date: "-167"
    places: ["长安(今陕西西安)"]
    phases:
      - name: "酝酿"
        start_date: "-167"
        end_date: "-167"
        place: "长安(今陕西西安)"
        highlight: "太仓令淳于公有罪当刑，少女缇萦上书"
      - name: "高潮"
        start_date: "-167"
        end_date: "-167"
        place: "长安(今陕西西安)"
        highlight: "文帝感其意下诏废肉刑"
      - name: "收束"
        start_date: "-167"
        end_date: "-167"
        place: "长安(今陕西西安)"
        highlight: "天下称颂仁德"
    description_zh: "齐太仓令淳于公有罪当刑，无男有五女。少女缇萦随父至长安上书，曰'死者不可复生刑者不可复属，虽欲改过自新无由也，愿没入为官婢赎父刑'。文帝怜之，下诏曰'刑至断支体刻肌肤终身不息，岂为民父母意哉'，遂废肉刑。"
    outcome: "废除肉刑，中国法治史上的里程碑"
    lesson: "仁政不在于严刑峻法，而在于教化感格"
  - title_zh: "缇萦上书废肉刑后 — 除田租税"
    domain: "经济"
    start_date: "-167"
    end_date: "-157"
    places: ["全国"]
    phases:
      - name: "高潮"
        start_date: "-167"
        end_date: "-157"
        place: "全国"
        highlight: "除天下田租税，劝农务本"
    description_zh: "文帝十三年，诏曰'农天下之本，务莫大焉。今勤身从事而有租税之赋，是为本末无以异'。遂除田之租税。又减诸服御狗马，损郎吏员，发仓庾振贫民。天下旱蝗，令诸侯毋入贡，弛山泽。海内殷富。"
    outcome: "轻徭薄赋，百姓富足"
    lesson: "藏富于民是国家长治久安之本"
  - title_zh: "薄葬遗诏"
    domain: "制度"
    start_date: "-157"
    end_date: "-157"
    places: ["未央宫(今陕西西安)", "霸陵(今陕西西安东)"]
    phases:
      - name: "高潮"
        start_date: "-157"
        end_date: "-157"
        place: "未央宫(今陕西西安)"
        highlight: "遗诏薄葬，令天下临丧三日释服"
      - name: "收束"
        start_date: "-157"
        end_date: "-157"
        place: "霸陵(今陕西西安东)"
        highlight: "霸陵皆瓦器，不起坟，因山为陵"
    description_zh: "文帝崩于未央宫，遗诏曰'死者天地之理，奚可甚哀。厚葬以破业重服以伤生，吾甚不取'。令天下吏民出临三日皆释服，绖带无过三寸，毋布车兵器，毋发男女哭临宫殿。灞陵山川因其故毋有所改，皆以瓦器不得金银铜锡为饰。"
    outcome: "薄葬成为后世帝王典范"
    lesson: "生死有常，厚葬不如薄葬——仁君之终亦仁"

events:
  - date: "-180"
    place_name: "代邸(今山西平遥)"
    event_type: "登基"
    title_zh: "大臣迎立代王入长安即位"
    description_zh: "诸吕既诛，大臣谋立新帝。张武等疑大臣有诈，宋昌力排众议力陈三因。代王遣薄昭见绛侯，知其诚意。至渭桥群臣拜谒，太尉跪上天子玺符。代王三让而后受，入未央宫即天子位。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "三让而后受——仁君即位的谦逊与审慎"
  - date: "-178"
    place_name: "长安(今陕西西安)"
    event_type: "政治"
    title_zh: "除诽谤罪纳谏"
    description_zh: "文帝诏曰'古者有进善之旌诽谤之木，所以通治道来谏者。今法有诽谤妖言之罪，使众臣不敢尽情，将何以来远方贤良'。遂除诽谤妖言罪，使臣下得尽情进谏，开言路以通民情。"
    is_highlight: true
    highlight_type: "制度"
    highlight_note: "开言路除诽谤——民主政治的古代萌芽"
  - date: "-167"
    place_name: "长安(今陕西西安)"
    event_type: "司法"
    title_zh: "缇萦上书废肉刑"
    description_zh: "太仓令淳于公有罪当刑。其少女缇萦上书曰'死者不可复生刑者不可复属，虽欲改过自新无由也，愿没入为官婢赎父刑'。文帝怜悲其意，下诏废肉刑，改以笞刑代之。天下称颂。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "缇萦救父——一个少女改变中国刑罚制度"
  - date: "-163"
    place_name: "长安(今陕西西安)"
    event_type: "外交"
    title_zh: "与匈奴和亲"
    description_zh: "匈奴屡侵边境，文帝遣使致书单于，愿'弃细过偕之大道结兄弟之义以全天下元元之民'。和亲之约自此始。匈奴背约入盗，文帝令边备守不发兵深入，恶烦苦百姓。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "以和亲代征伐——百姓免于战争之苦"
  - date: "-158"
    place_name: "细柳(今陕西咸阳西北)"
    event_type: "军事"
    title_zh: "细柳营劳军"
    description_zh: "匈奴入上郡云中，文帝遣三将军分驻细柳霸上棘门。帝亲劳军至细柳营，军士被甲持锐刀彀弓满。先驱至不得入，曰'天子且至'。军门都尉曰'将军令曰军中闻将军令不闻天子诏'。文帝至亦不得入，使使持节诏将军乃入。文帝叹曰'真将军矣'，以周亚夫为太尉。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "细柳营——军纪严明的千古佳话"
  - date: "-157"
    place_name: "未央宫(今陕西西安)"
    event_type: "终局"
    title_zh: "遗诏薄葬"
    description_zh: "文帝崩于未央宫，遗诏令薄葬。曰'死者天地之理，奚可甚哀。厚葬破业重服伤生，吾甚不取'。天下吏民出临三日释服，霸陵皆瓦器不起坟。群臣上尊号曰孝文皇帝，太史公曰'德至盛也'。"
    is_highlight: true
    highlight_type: "结局"
    highlight_note: "一代仁君以薄葬终——千古帝王之典范"
