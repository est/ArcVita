    phases:
      - name: "白登解围后议和"
        start_date: "-198"
        end_date: "-198"
        place: "长安(今陕西西安)"
        highlight: "和亲之约始"
      - name: "屡侵汉边"
        start_date: "-192"
        end_date: "-174"
        place: "汉匈边境"
        highlight: "边患不止"
    description_zh: "白登解围后，刘敬献和亲之策，以宗室女嫁匈奴单于，岁遗缯帛酒食。吾许和亲，然匈奴骑兵仍不时南下寇边。汉惠帝、吕后时期，吾致书吕后，辞甚嫚，欲以吕后和亲。吕后忍怒，复遣宗室女往嫁。吾在位期间，匈奴控弦之士日盛，汉朝以和亲求安，实为以女换时。"
    outcome: "确立和亲制度，匈奴在和亲与寇掠间反复获利"
    lesson: "强者可谈条件，但和约永远只是缓冲而非终局"

events:
  - date: "-209"
    place_name: "头曼城(今蒙古国鄂尔浑河东畔)"
    event_type: "政变"
    title_zh: "鸣镝弑父自立"
    description_zh: "冒顿单于初为太子，其父头曼欲废之而立幼子，乃遣冒顿质于月氏。月氏欲杀之，冒顿盗其善马亡归。头曼以为勇，令将万骑。冒顿乃作鸣镝，令骑射曰：'鸣镝所射而不悉射者，斩之。'猎鸟兽，有不射鸣镝所射者，斩之。已而以鸣镝射其良马，左右或不敢射者，皆斩之。顷之，复以鸣镝射其爱妻，左右或甚恐不敢射，又斩之。居顷之，冒顿出猎，以鸣镝射头曼之良马，左右皆随射之。于是冒顿知其左右皆可用，随其父猎，以鸣镝射头曼，左右亦皆随射之，遂弑头曼。"
    is_highlight: true
    highlight_type: "成语典故"
    highlight_note: "鸣镝射马/鸣镝弑父——'其左右皆随鸣镝而射'，成为铁血纪律的极致象征"
  - date: "-206"
    place_name: "东胡故地"
    event_type: "军事征伐"
    title_zh: "韬光灭东胡"
    description_zh: "冒顿弑父自立后，东胡王遣使索头曼千里马，群臣谏勿予，冒顿曰'奈何与人邻国而爱一宝马乎'，予之。东胡王益骄，复索单于阏氏，群臣皆怒欲战，冒顿曰'奈何与人邻国爱一女子乎'，予之。东胡王以冒顿畏之，遂不设备。冒顿乃引兵东袭，东胡猝不及备，大破之，东胡王虏其民畜而归。"
    is_highlight: true
    highlight_type: "谋略"
    highlight_note: "欲擒故纵——两度忍辱予物以骄敌，一击灭国"
  - date: "-200"
    place_name: "白登山(今山西大同东北马铺山)"
    event_type: "军事对峙"
    title_zh: "白登之围"
    description_zh: "韩王信叛汉降匈奴，引匈奴南下。汉高祖刘邦亲率三十二万大军北征，先头部队被匈奴四十万骑兵围困于白登山七日。城中汉军缺粮，内外不能相救。后陈平以秘计使冒顿阏氏言于冒顿，谓'两主不相困，今得汉地，单于终不能居之'。冒顿与韩王信将王黄、赵利期约不至，疑其与汉有谋，遂解围一角。高祖引兵南还，自此汉朝行和亲之策。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "白登之围——汉匈关系的转折点，开启和亲时代"
  - date: "-192"
    place_name: "匈奴单于庭(今蒙古国鄂尔浑河畔)"
    event_type: "外交"
    title_zh: "嫚书戏吕后"
    description_zh: "冒顿修书吕后，辞曰：'孤偾之君，生于沮泽之中，长于平野牛马之域，数至边境，愿游中国。陛下独立，孤偾独居。两主不乐，无以自虞，愿以所有，易其所无。'吕后览书大怒，欲击匈奴。群臣以高祖白登之围为戒，劝吕后忍辱和亲。吕后乃遣宗室女厚遗冒顿，复约为婚姻。"
    is_highlight: true
    highlight_type: "外交奇观"
    highlight_note: "匈奴冒顿致吕后'求偶'嫚书——中国历史上最奇特的外交文书之一"
  - date: "-174"
    place_name: "匈奴单于庭(今蒙古国鄂尔浑河畔)"
    event_type: "身后"
    title_zh: "一代雄主谢幕"
    description_zh: "冒顿在位约三十余年，使匈奴从草原上一个部落联盟发展为纵横万里的帝国。控弦之士三十余万，东灭东胡、西逐月氏、北服丁零、南与汉朝对峙。其死后，匈奴内部因继承问题陷入动荡，老上单于、军臣单于相继继位，匈奴帝国虽衰而余威犹在。"
    is_highlight: false
    highlight_type: ""
    highlight_note: ""
