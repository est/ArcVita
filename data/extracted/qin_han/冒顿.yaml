        highlight: "白登之围"
    description_zh: "吾先以鸣镝之法训练亲骑，凡鸣镝所向不从者皆斩。弑父即位后，东面之东胡轻吾新立，索地求物，吾皆予之以骄其志。东胡不备，吾乘夜击之，东胡大破。随即西逐月氏、北服丁零、南并楼烦，控弦之士三十余万，草原尽统于匈奴。又南下与汉争锋，高祖亲率三十二万大军北伐，吾以四十万骑围高祖于白登七日，终以陈平秘计解围，由此确立匈奴与汉分庭抗礼之势。"
    outcome: "统一草原，建立匈奴帝国，开创草原民族第一个大一统政权"
    lesson: "韬光养晦，蓄势而后发"
  - title_zh: "和亲之约与对汉博弈"
