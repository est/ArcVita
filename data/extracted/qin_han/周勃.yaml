person:
  name_zh: "周勃"
  name_en: "Zhou Bo"
  birth_date: "约-250"
  death_date: "-169"
  birth_place: "沛(今江苏沛县)"
  era: "秦末汉初"
  archetype: "以忠勇定社稷的绛侯"
  dilemmas: ["武将不善言的庙堂困境", "忠臣与猜忌的生死博弈", "诛吕安刘的功臣宿命"]
  summary_zh: "沛县编织蚕箔的贫寒子弟，随刘邦起兵攻城略地，定天下后封绛侯。吕后时隐忍不发，吕后崩后联合陈平诛灭诸吕、迎立文帝，再造汉室。然功高见疑，几死狱中，晚年以韬晦善终。"
  summary_first_person: "吾本沛县贫民，以织蚕箔为生，又兼为人吹箫给丧事。高祖起沛，吾以中涓从之，每战先登，攻城拔旗，身被七十余创。天下既定封绛侯。吕后时，诸吕擅权，吾握兵权而隐忍不发。吕后崩，吾一呼而北军左袒，诛灭诸吕，安刘氏社稷。然功高见疑，文帝几杀吾于狱中。人谓吾勇，吾知忠比勇更难。"
  lesson: "忠勇定社稷，韬晦保余生，功臣之难在于知进退。"

endeavors:
  - title_zh: "从沛公起兵，攻城略地"
    domain: "军事"
    start_date: "-209"
    end_date: "-202"
    places: ["沛(今江苏沛县)", "咸阳(今陕西咸阳)", "垓下(今安徽灵璧)"]
    phases:
      - name: "从沛公起兵"
        start_date: "-209"
        end_date: "-206"
        place: "沛(今江苏沛县)"
        highlight: "中涓从高祖"
      - name: "攻秦灭楚"
        start_date: "-206"
        end_date: "-202"
        place: "关中、中原"
        highlight: "每战先登，身被七十余创"
    description_zh: "周勃以中涓从沛公攻胡陵、方与，破秦军于丰邑。攻下邑先登。攻蒙、虞皆下之。破李斯子由军于雍丘。每战先登，攻城拔旗，身被七十余创。垓下之战，随韩信大破项羽。天下既定，赐绛侯印，食邑八千一百八十户。"
    outcome: "以战功封绛侯，位列功臣"
    lesson: "出身寒微不碍建功立业"
  - title_zh: "诛诸吕安刘——一呼而天下定"
    domain: "政治军事"
    start_date: "-180"
    end_date: "-180"
    places: ["长安(今陕西西安)", "北军(长安城北)"]
    phases:
      - name: "隐忍待时"
        start_date: "-180"
        end_date: "-180"
        place: "长安(今陕西西安)"
        highlight: "握兵权而不动"
      - name: "北军左袒"
        start_date: "-180"
        end_date: "-180"
        place: "长安(今陕西西安)"
        highlight: "一呼军中皆左袒"
      - name: "诛灭诸吕"
        start_date: "-180"
        end_date: "-180"
        place: "长安(今陕西西安)"
        highlight: "尽诛吕氏宗族"
    description_zh: "吕后时，周勃为太尉，然不得兵权。吕后崩，周勃与陈平合谋。郦寄说吕禄交兵权，周勃驰入北军，令曰：'为刘氏者左袒！'军中皆左袒。遂将北军诛诸吕，男女无少长皆斩之。迎立代王刘恒为文帝。"
    outcome: "诛灭吕氏，迎立文帝，汉室社稷得以延续"
    lesson: "关键时刻一呼百应，在于人心向背"
  - title_zh: "绛侯狱中——功臣的至暗时刻"
    domain: "政治"
    start_date: "-176"
    end_date: "-174"
    places: ["长安(今陕西西安)"]
    phases:
      - name: "见疑入狱"
        start_date: "-176"
        end_date: "-174"
        place: "长安(今陕西西安)"
        highlight: "几死狱中"
      - name: "薄昭救之"
        start_date: "-174"
        end_date: "-174"
        place: "长安(今陕西西安)"
        highlight: "以公主为质获释"
    description_zh: "周勃免相就国，每河东守尉行县至绛，绛侯恐诛，常被甲，令家人持兵以见之。其后人有上书告勃欲反，下廷尉治之。吏稍侵辱之，勃以千金予狱吏，书牍背示之'以公主为证'。公主者，文帝女也，勃子胜之尚之。薄太后亦言无反意。文帝乃赦出之，复爵邑。"
    is_highlight: true
    highlight_type: "人生低谷"
    highlight_note: "绛侯入狱——诛吕安刘的功臣反遭猜忌，千古功臣之悲"

events:
  - date: "-209"
    place_name: "沛(今江苏沛县)"
    event_type: "人生起步"
    title_zh: "沛县贫民——从蚕箔匠到开国功臣"
    description_zh: "周勃为人，木强敦厚。高祖之为沛公初起，勃以中涓从。勃为人织蚕箔，又兼为人吹箫给丧事，常为人吹箫给丧事。材官引强。以材官引强从沛公攻胡陵。"
    is_highlight: false
    highlight_type: "出身"
    highlight_note: ""
  - date: "-209"
    place_name: "沛(今江苏沛县)"
    event_type: "军事行动"
    title_zh: "攻下邑先登——初露锋芒"
    description_zh: "周勃从沛公攻下邑先登。攻蒙、虞皆下之。攻秦军于雍丘，破之。所将卒斩秦守、尉各一人，破秦军于东阿下，追至濮阳，下甄城。"
    is_highlight: false
    highlight_type: "军事"
    highlight_note: ""
  - date: "-204"
    place_name: "荥阳(今河南荥阳)"
    event_type: "军事行动"
    title_zh: "守荥阳——断项羽粮道"
    description_zh: "周勃别击项羽军，攻曲遇，破之。迁为将军。从高祖击项羽，守敖仓，绝项羽粮道。"
    is_highlight: false
    highlight_type: "军事"
    highlight_note: ""
  - date: "-180"
    place_name: "长安(今陕西西安)"
    event_type: "政治军事"
    title_zh: "北军左袒——一呼定社稷"
    description_zh: "吕后崩，太尉周勃入北军门，行令军中曰：'为吕氏右袒，为刘氏左袒！'军中皆左袒。太尉遂将北军。然尚有南军。平乃遣朱虚侯刘章以兵入宫诛诸吕，太尉与丞相遂尽诛吕氏宗族。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "左袒之令——一声号令定天下归属，汉室延续的关键瞬间"
  - date: "-179"
    place_name: "长安(今陕西西安)"
    event_type: "政治"
    title_zh: "归绛就国——功臣退场"
    description_zh: "文帝既立，以周勃为右丞相，赐金五千斤，邑万户。居月余，人或说勃曰：'君既诛诸吕，立代王，威震天下。君处尊位，赏厚，久之即祸及身矣。'勃惧，乃谢病请归相印。上许之。岁余，陈丞相平卒，上复以勃为丞相。十余月，上曰：'前日吾诏列侯就国，或未能行，丞相吾所重，其率先之。'乃免丞相就国。"
    is_highlight: true
    highlight_type: "政治"
    highlight_note: "归绛就国——功臣在和平年代的必然归宿"
  - date: "-176"
    place_name: "长安(今陕西西安)"
    event_type: "人生危机"
    title_zh: "绛侯入狱——功臣之悲"
    description_zh: "周勃既就国，每河东守尉行县至绛，绛侯自畏恐诛，常被甲，令家人持兵以见之。其后人有上书告勃欲反，下廷尉治。廷尉下其事长安，逮捕勃治之。勃恐，不知置辞。吏稍侵辱之。勃以千金予狱吏，狱吏乃书牍背示之曰'以公主为证'。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "狱吏教绛侯——千古名句，满朝功臣不如一狱吏深知法度之险"
  - date: "-169"
    place_name: "绛(今山西侯马)"
    event_type: "人生终章"
    title_zh: "善终于绛——晚年的清醒"
    description_zh: "绛侯复就国。孝文帝十一年薨，谥曰武侯。勃不好文学，每召诸生说士，东乡坐而责之：'趣为我语。'其椎少文如此。然定天下安刘氏，勃之功不在诸人下。"
    is_highlight: false
    highlight_type: "人生终章"
    highlight_note: ""
