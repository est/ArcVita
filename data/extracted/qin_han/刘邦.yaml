person:
  name_zh: "刘邦"
  name_en: "Liu Bang"
  birth_date: "-256"
  death_date: "-195"
  birth_place: "沛丰邑中阳里(今江苏丰县)"
  era: "秦末汉初"
  archetype: "无赖天子，布衣帝王"
  dilemmas: ["出身卑微与帝王尊严的张力", "用人不疑与兔死狗烹的悖论", "天命自许与现实困境的拉锯"]
  summary_zh: "沛县亭长出身，斩蛇起义，先入关中约法三章。楚汉争天下五年，以弱胜强，终灭项羽。即位后剪除异姓王，定都长安，开汉家四百年基业。"
  summary_first_person: "吾本泗水亭长，好酒好色，人皆以为无赖。然观秦皇帝出行，叹曰'大丈夫当如此也'。斩白蛇起事，约法三章入关中，鸿门宴全身而退，五年楚汉终有天下。论运筹帷幄吾不如子房，论治国抚民吾不如萧何，论战必胜攻必取吾不如韩信——然此三者皆人杰，吾能用之，此吾所以取天下也。"
  lesson: "天下非一人之智可定，善用人者得天下。"

endavors:
  - title_zh: "沛县起义，约法三章入关中"
    domain: "政治军事"
    start_date: "-209"
    end_date: "-206"
    places: ["沛县(今江苏丰县)", "咸阳(今陕西咸阳)", "霸上(今陕西西安东)"]
    phases:
      - name: "酝酿"
        start_date: "-209"
        end_date: "-209"
        place: "沛县(今江苏丰县)"
        highlight: "萧何曹参推刘邦为沛公"
      - name: "破局"
        start_date: "-206"
        end_date: "-206"
        place: "武关(今陕西丹凤)"
        highlight: "用张良计破武关，先入关中"
      - name: "高潮"
        start_date: "-206"
        end_date: "-206"
        place: "咸阳(今陕西咸阳)"
        highlight: "秦王子婴降于轵道，约法三章"
      - name: "收束"
        start_date: "-206"
        end_date: "-206"
        place: "霸上(今陕西西安东)"
        highlight: "还军霸上，秦人大喜争持牛酒"
    description_zh: "秦二世元年，沛令欲应陈胜，萧何曹参推刘邦为主。刘邦入沛后被立为沛公，此后转战各地。怀王令其西略地入关，一路用张良计破武关蓝田，先于诸侯至霸上。秦王子婴素车白马降，刘邦不杀，约法三章除秦苛法，秦人大喜唯恐其不为秦王。"
    outcome: "率先入关灭秦，得关中民心"
    lesson: "以德服人者得民心，约法三章是最大的政治智慧"

  - title_zh: "楚汉争霸，以弱胜强灭项羽"
    domain: "军事政治"
    start_date: "-206"
    end_date: "-202"
    places: ["汉中(今陕西汉中)", "荥阳(今河南荥阳)", "垓下(今安徽灵璧)"]
    phases:
      - name: "酝酿"
        start_date: "-206"
        end_date: "-206"
        place: "汉中(今陕西汉中)"
        highlight: "萧何月下追韩信，登坛拜将"
      - name: "破局"
        start_date: "-206"
        end_date: "-205"
        place: "陈仓(今陕西宝鸡)"
        highlight: "明修栈道暗度陈仓，还定三秦"
      - name: "高潮"
        start_date: "-203"
        end_date: "-202"
        place: "垓下(今安徽灵璧)"
        highlight: "韩信三十万围项羽，四面楚歌"
      - name: "收束"
        start_date: "-202"
        end_date: "-202"
        place: "定陶(今山东定陶)"
        highlight: "夺韩信军，即皇帝位于氾水之阳"
    description_zh: "被封巴蜀后，用韩信计暗度陈仓还定三秦。彭城大败后收散卒于荥阳，与楚相持岁余。用陈平计离间项羽范增，用张良计拉拢韩信彭越。最终垓下合围灭楚，诸侯共请即皇帝位，建立大汉王朝。"
    outcome: "灭楚建汉，开创四百年基业"
    lesson: "能忍常人不能忍，能用常人不能用，方为帝王"
  - title_zh: "剪除异姓王，巩固刘氏天下"
    domain: "政治"
    start_date: "-202"
    end_date: "-196"
    places: ["长安(今陕西西安)", "各地封国"]
    phases:
      - name: "高潮"
        start_date: "-196"
        end_date: "-196"
        place: "长安(今陕西西安)"
        highlight: "白马之盟'非刘氏而王天下共击之'"
      - name: "收束"
        start_date: "-196"
        end_date: "-195"
        place: "长安(今陕西西安)"
        highlight: "临终论定'安刘氏者必周勃'"
    description_zh: "天下大定后，刘邦逐一剪除异姓王。韩信以谋反罪夷三族，彭越黥布相继被诛。约非刘氏不王，白马盟誓。临终安排身后，论定曹参王陵陈平周勃各有所长，曰'安刘氏者必勃也'。"
    outcome: "刘氏天下得以稳固，奠定汉初政治格局"
    lesson: "创业难守业更难，帝王之道在于防患未然"

events:
  - date: "-209"
    place_name: "沛县(今江苏丰县)"
    event_type: "起义"
    title_zh: "斩蛇起义"
    description_zh: "刘邦为县送徒郦山，徒多道亡。至丰西泽中，夜解纵所送徒。被酒前行，遇大蛇当径，拔剑斩之。后人至蛇所，有老妪夜哭曰'吾子白帝子也化为蛇当道今为赤帝子斩之'。从者日益畏之。"
    is_highlight: true
    highlight_type: "神话"
    highlight_note: "赤帝子斩白帝子——刘邦神话叙事的起点"
  - date: "-206"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "政治"
    title_zh: "约法三章"
    description_zh: "刘邦先入咸阳后，不居宫室，还军霸上。召诸县父老曰'父老苦秦苛法久矣，吾与诸侯约先入关者王之。与父老约法三章耳：杀人者死，伤人及盗抵罪，余悉除去秦法'。秦人大喜，争持牛羊酒食献飨军士。"
    is_highlight: true
    highlight_type: "制度"
    highlight_note: "约法三章——中国法治史上从苛政到宽政的标志性转折"
  - date: "-206"
    place_name: "鸿门(今陕西临潼)"
    event_type: "政治博弈"
    title_zh: "鸿门宴全身而退"
    description_zh: "项羽四十万军欲击刘邦。项伯夜报张良，刘邦亲赴鸿门谢罪。项王赐酒食，范增举玦示意不杀，项庄舞剑意在沛公。樊哙闯帐怒斥。刘邦借如厕遁走，留张良献璧。项王受璧坐上，亚父拔剑撞破玉斗叹'竖子不足与谋'。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "鸿门宴——绝境求生的政治教科书"
  - date: "-204"
    place_name: "荥阳(今河南荥阳)"
    event_type: "政治博弈"
    title_zh: "离间计除范增"
    description_zh: "项羽围荥阳急，刘邦用陈平计，予四万斤金以间楚君臣。项羽使者来，先以太牢具待之，佯惊曰'以为亚父使者'，更以恶食食之。使者归报项羽，遂疑范增。增大怒辞归，疽发背而死。"
    is_highlight: true
    highlight_type: "谋略"
    highlight_note: "陈平反间计——四万斤金换范增一条命"
  - date: "-202"
    place_name: "垓下(今安徽灵璧)"
    event_type: "战役"
    title_zh: "垓下之战灭楚"
    description_zh: "韩信率三十万自当项羽，孔将军居左费将军居右，刘邦在后。淮阴侯先合不利却，孔费纵之，淮阴侯复乘之，大败垓下。项羽闻四面楚歌，夜溃围南出。灌婴五千骑追至东城，项羽自刎而死。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "垓下之战终结楚汉争霸，奠定大汉天下"
  - date: "-202"
    place_name: "氾水之阳(今山东曹县)"
    event_type: "登基"
    title_zh: "即皇帝位"
    description_zh: "群臣共请刘邦即皇帝位，刘邦三让。群臣曰'大王起微细诛暴逆平定四海，不尊号皆疑不信'。刘邦曰'诸君必以为便，便国家'。甲午即皇帝位，大赦天下。"
    is_highlight: true
    highlight_type: "制度"
    highlight_note: "中国历史上第一个布衣天子的诞生"
  - date: "-195"
    place_name: "沛(今江苏沛县)"
    event_type: "抒怀"
    title_zh: "大风歌"
    description_zh: "刘邦击黥布还，过沛留饮。悉召故人父老子弟纵酒，发沛中儿百二十人教之歌。酒酣击筑自为歌诗：'大风起兮云飞扬，威加海内兮归故乡，安得猛士兮守四方！'令儿和习之，高祖乃起舞，慷慨伤怀泣数行下。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "大风歌——帝王暮年的苍凉与豪迈"
  - date: "-195"
    place_name: "长乐宫(今陕西西安)"
    event_type: "遗命"
    title_zh: "临终论将"
    description_zh: "刘邦病甚，吕后问萧相国死后谁代。上曰曹参可。又问其次，曰王陵可然少戆，陈平智有馀然难独任。周勃重厚少文，'然安刘氏者必勃也，可令为太尉'。此后亦非而所知也。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "临终人事安排精准无比——预言周勃安刘"
