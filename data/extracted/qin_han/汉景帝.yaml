person:
  name_zh: "汉景帝"
  name_en: "Emperor Jing of Han"
  birth_date: "-188"
  death_date: "-141"
  birth_place: "长安(今陕西西安)"
  era: "西汉"
  archetype: "守成之主与削藩推手"
  dilemma: ["削藩过急引发七国之乱", "延续文帝仁政与集权需要的矛盾", "立储之争与母后干政的隐忧"]
  summary_zh: "文帝中子，承文帝之治继续轻徭薄赋、与民休息。以晁错之策削藩，引发吴楚七国之乱。用周亚夫三月平叛，后以细柳军功为名诛周亚夫。在位十六年，天下殷富，与文帝并称文景之治。"
  summary_first_person: "朕承先帝之业，兢兢守成。晁错言诸侯太盛当削，朕从之，然七国俱反，以诛晁错为名。朕不得已诛晁错而兵不罢，乃用周亚夫三月平乱。诸侯自此衰，中央始固。然细柳之事，周亚夫刚直难用，终以冤死。文景之治，非朕之功，先帝遗德也。"
  lesson: "削藩当循序渐进，操之过急反生大乱；守成之主当以仁为本，以稳为先。"

endavors:
  - title_zh: "七国之乱与削藩定策"
    domain: "政治军事"
    start_date: "-154"
    end_date: "-154"
    places: ["长安(今陕西西安)", "吴楚(今江苏一带)", "荥阳(今河南荥阳)"]
    phases:
      - name: "酝酿"
        start_date: "-155"
        end_date: "-154"
        place: "长安(今陕西西安)"
        highlight: "晁错削藩策引发诸侯不满"
      - name: "破局"
        start_date: "-154"
        end_date: "-154"
        place: "吴楚(今江苏一带)"
        highlight: "吴王濞以诛晁错为名联合七国起兵"
      - name: "高潮"
        start_date: "-154"
        end_date: "-154"
        place: "荥阳(今河南荥阳)"
        highlight: "周亚夫三月平七国之乱"
      - name: "收束"
        start_date: "-154"
        end_date: "-154"
        place: "长安(今陕西西安)"
        highlight: "诸侯王势力大减，中央集权确立"
    description_zh: "景帝用晁错策削诸侯地，吴王濞以诛晁错为名联合楚赵胶西等七国反。帝不得已诛晁错于东市而兵不止。乃遣太尉周亚夫率三十六将军东击吴楚，三月大破之。七国之乱遂平。此后诸侯王势力大减，诸侯唯得衣食税租，不与政事。"
    outcome: "平定七国之乱，中央集权得以确立"
    lesson: "削藩需讲策略，晁错之策虽正确但方式过激"

  - title_zh: "延续文景之治"
    domain: "治国"
    start_date: "-157"
    end_date: "-141"
    places: ["长安(今陕西西安)", "全国"]
    phases:
      - name: "高潮"
        start_date: "-157"
        end_date: "-141"
        place: "全国"
        highlight: "除田半租、减轻徭赋、天下大治"
    description_zh: "景帝承文帝之治，继续轻徭薄赋。即位初即除田半租，减轻百姓负担。后虽因七国之乱短暂增赋，乱定后复行宽政。在位十六年，天下殷富，史称文景之治。"
    outcome: "文景之治达于极盛，国库充盈，百姓安乐"
    lesson: "守成之道在于不变祖宗良法"

events:
  - date: "-154"
    place_name: "吴楚(今江苏一带)"
    event_type: "叛乱"
    title_zh: "七国之乱"
    description_zh: "吴王濞联合楚赵胶西等七国以诛晁错清君侧为名起兵反。景帝初从袁盎计诛晁错于东市，然七国不止。乃遣周亚夫为太尉东击，绝吴楚粮道，三月大破之。吴王走越，越杀之。楚王自杀，赵王亦自杀。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "晁错死而七国不止——'清君侧'的政治骗局"
  - date: "-154"
    place_name: "长安(今陕西西安)"
    event_type: "政治"
    title_zh: "诛晁错东市"
    description_zh: "七国以诛晁错为名反，景帝从袁盎计，使晁错穿朝服斩于东市。晁错衣朝衣被斩于长安东市，家族皆诛。然七国仍进兵不止，景帝始悟为贼所卖。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "晁错忠而被诛——'清君侧'的历史悲剧"
  - date: "-154"
    place_name: "荥阳(今河南荥阳)"
    event_type: "战役"
    title_zh: "周亚夫平七国之乱"
    description_zh: "周亚夫为太尉东击吴楚，至荥阳深壁坚守，绝吴楚粮道。吴楚军久攻梁国不下，粮尽兵疲。亚夫出精兵击之，大破吴楚军。吴王走越，越人杀之。楚王自杀。亚夫用兵三月平定七国，天下称快。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "三月平七国——周亚夫的军事天才"
  - date: "-143"
    place_name: "长安(今陕西西安)"
    event_type: "政治"
    title_zh: "周亚夫冤死狱中"
    description_zh: "周亚夫为丞相，景帝欲废太子，亚夫固争不可。又窦太后欲封皇后兄王信为侯，亚夫曰'高帝约非刘氏不得王非有功不得侯'。后因事下狱，不食五日，呕血而死。"
    is_highlight: true
    highlight_type: "悲剧"
    highlight_note: "功高震主——亚夫之死揭示帝王薄恩本性"
  - date: "-141"
    place_name: "未央宫(今陕西西安)"
    event_type: "终局"
    title_zh: "景帝崩，太子彻即位"
    description_zh: "景帝崩于未央宫，皇太子彻即位，是为孝武皇帝。遗诏赐诸侯王以下至民为父后爵一级，天下户百钱，出宫人归其家。景帝在位十六年，天下殷富，文景之治至此达于极盛。"
    is_highlight: true
    highlight_type: "结局"
    highlight_note: "文景之治的收官——为武帝开疆拓土积蓄了雄厚国力"
