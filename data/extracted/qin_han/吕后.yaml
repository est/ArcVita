person:
  name_zh: "吕后"
  name_en: "Empress Lü"
  birth_date: "约-241"
  death_date: "-180"
  birth_place: "单父(今山东单县)"
  era: "汉初"
  archetype: "刚毅决断的铁腕女主"
  dilemmas: ["女性执政与男权体制的冲突", "保全吕氏与刘氏天下的撕裂", "残暴本性与政治理性的角力"]
  summary_zh: "刘邦之妻，佐高祖定天下。惠帝仁弱，吕后临朝称制十五年，杀赵王如意、人彘戚夫人，大封诸吕。然刑罚罕用，天下晏然，民生滋殖。死后诸吕被诛，刘氏复安。"
  summary_first_person: "吾随高祖于微时，备尝艰辛。天下既定，戚夫人日夜啼泣欲夺吾儿太子之位，几废几立。高祖崩后，吾称制天下。人皆谓吾残忍，然吾若不刚毅，刘氏天下何以安？吕氏何以存？吾身后诸吕皆诛，然惠文之世天下太平，岂非吾之功耶？"
  lesson: "权力面前无人性可言，铁腕手段或能守业，终难善终。"

endavors:
  - title_zh: "称制临朝十五年"
    domain: "政治"
    start_date: "-195"
    end_date: "-180"
    places: ["长安(今陕西西安)", "长乐宫"]
    phases:
      - name: "酝酿"
        start_date: "-195"
        end_date: "-188"
        place: "长安(今陕西西安)"
        highlight: "惠帝仁弱，吕后渐揽朝政"
      - name: "破局"
        start_date: "-188"
        end_date: "-188"
        place: "长乐宫"
        highlight: "惠帝崩后临朝称制，号令一出太后"
      - name: "高潮"
        start_date: "-188"
        end_date: "-181"
        place: "长安(今陕西西安)"
        highlight: "大封诸吕为王，吕氏权倾天下"
      - name: "收束"
        start_date: "-180"
        end_date: "-180"
        place: "长乐宫"
        highlight: "病危诫吕禄吕产据兵卫宫，然未能保全"
    description_zh: "高祖崩后，吕后先杀赵王如意、人彘戚夫人以绝后患。惠帝崩，临朝称制。先废王陵相权，以陈平周勃为左右丞相。追尊吕氏父兄为王，大封诸吕。以吕禄女为帝后，诸吕皆居要职掌南北军。然终因诸吕无能，死后即被功臣集团诛灭。"
    outcome: "维持汉室十五年稳定，但吕氏终遭族灭"
    lesson: "女主临朝虽能安定一时，外戚专权终是祸根"
  - title_zh: "保住太子之位"
    domain: "政治"
    start_date: "-205"
    end_date: "-195"
    places: ["长安(今陕西西安)"]
    phases:
      - name: "酝酿"
        start_date: "-205"
        end_date: "-195"
        place: "长安(今陕西西安)"
        highlight: "戚夫人日夜啼泣欲立赵王如意"
      - name: "破局"
        start_date: "-196"
        end_date: "-196"
        place: "长安(今陕西西安)"
        highlight: "请张良出策，商山四皓辅太子"
      - name: "高潮"
        start_date: "-196"
        end_date: "-195"
        place: "长安(今陕西西安)"
        highlight: "高祖见四皓随太子，叹羽翼已成遂不废"
      - name: "收束"
        start_date: "-195"
        end_date: "-195"
        place: "长安(今陕西西安)"
        highlight: "太子之位稳固，吕后地位得保"
    description_zh: "刘邦得戚夫人后常欲废太子刘盈立赵王如意。吕后年长留守，益疏。赖大臣争之及张良策请商山四皓出山辅太子，刘邦见太子羽翼已成，叹曰'彼四人辅之羽翼已成难动矣'，遂不废。"
    outcome: "保住儿子皇位，为日后临朝称制奠定基础"
    lesson: "政治斗争中，隐忍与借力是弱势者的最佳武器"

events:
  - date: "-205"
    place_name: "彭城之战"
    event_type: "战乱"
    title_zh: "彭城之败被俘"
    description_zh: "项羽大破汉军于彭城，刘邦逃遁。吕后与太公走间道，反遇楚军被俘。置于军中为质约两年。其间备尝艰辛，人性尽失，性情大变。"
    is_highlight: true
    highlight_type: "磨难"
    highlight_note: "两年楚营为质的经历塑造了吕后日后的刚毅与残忍"
  - date: "-194"
    place_name: "长乐宫(今陕西西安)"
    event_type: "暴行"
    title_zh: "人彘之祸"
    description_zh: "吕后囚戚夫人于永巷，断其手足、去眼、煇耳、饮瘖药，置厕中号曰'人彘'。又召惠帝观之，帝问知为戚夫人，大哭因病岁余不起，请太后曰'此非人所为，臣为太后子终不能治天下'。自此帝日饮为淫乐不听政。"
    is_highlight: true
    highlight_type: "名场面"
    highlight_note: "人彘——中国历史上最骇人听闻的宫廷惨案"
  - date: "-194"
    place_name: "长安(今陕西西安)"
    event_type: "政治博弈"
    title_zh: "鸩杀赵王如意"
    description_zh: "吕后三召赵王如意，赵相周昌拒曰'高帝属臣赵王，王且病不能奉诏'。吕后怒召赵相，复召赵王。惠帝慈仁，自迎赵王入宫挟与起居饮食。太后欲杀不得间，乘惠帝晨出射，使人持酖饮之。帝还，赵王已死。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "吕后除政敌不择手段，连幼子亦不放过"
  - date: "-188"
    place_name: "长乐宫(今陕西西安)"
    event_type: "权力更迭"
    title_zh: "惠帝崩后临朝称制"
    description_zh: "惠帝崩，太后哭泣不下。张辟彊十五岁侍中，请丞相拜诸吕为将掌南北军，太后心安其哭乃哀。吕氏权由此起。乃废少帝，立常山王弘，号令一出太后，天下事皆决于吕后。"
    is_highlight: true
    highlight_type: "制度"
    highlight_note: "中国历史上第一位临朝称制的太后"
  - date: "-180"
    place_name: "长乐宫(今陕西西安)"
    event_type: "终局"
    title_zh: "病危遗命与身死族灭"
    description_zh: "吕后病甚，诫吕禄吕产必据兵卫宫慎毋送丧毋为人所制。崩后，陈平周勃与朱虚侯刘章谋诛诸吕。周勃入北军，令为刘氏左袒，军中皆左袒。刘章杀吕产，诸吕男女无少长皆斩之。吕氏遂灭。"
    is_highlight: true
    highlight_type: "结局"
    highlight_note: "生前权倾天下，死后族灭——权力无常的最好注脚"
