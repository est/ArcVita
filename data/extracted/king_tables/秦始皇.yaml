person:
  name_zh: "秦始皇"
  name_en: "Qin Shi Huang"
  birth_date: "前259"
  death_date: "前210"
  birth_place: "邯郸(今河北邯郸)"
  era: "战国末期—秦朝"
  archetype: "千古一帝：以法驭天下的制度缔造者"
  dilemmas: ["统一与暴政的边界", "长生求仙与身后虚无", "传位扶苏与赵高矫诏"]
  summary_zh: "嬴政十三岁即位，用商鞅之法统一六国，书同文车同轨，建长城、设郡县，奠定两千年帝制根基。然焚书坑儒、严刑峻法，天下苦秦，身后沙丘之变，秦朝二世而亡。"
  summary_first_person: "吾十三岁即秦王之位，灭韩赵魏楚燕齐，海内为一。书同文、车同轨、统度量，功盖三皇五帝，号曰始皇帝。然吾求长生而不得，死于沙丘，天下遂乱。"
  lesson: "制度的力量超越个人寿命，但暴政终将反噬缔造者自身。"

endeavors:
  - title_zh: "灭六国统一天下"
    domain: "军事/政治"
    start_date: "前230"
    end_date: "前221"
    places: ["咸阳(今陕西咸阳)", "六国故地"]
    phases:
      - name: "远交近攻"
        start_date: "前230"
        end_date: "前225"
        place: "咸阳(今陕西咸阳)"
        highlight: "先后灭韩、赵、魏"
      - name: "席卷南方"
        start_date: "前224"
        end_date: "前222"
        place: "楚国故地"
        highlight: "王翦灭楚六十万大军"
      - name: "一统海内"
        start_date: "前222"
        end_date: "前221"
        place: "齐国临淄(今山东淄博)"
        highlight: "齐王建不战而降，天下一统"
    description_zh: "嬴政用李斯之谋、王翦之兵，十年间依次灭韩赵魏楚燕齐六国。前221年，天下一统，嬴政自号始皇帝，开创中国历史上第一个大一统王朝。"
    outcome: "结束战国五百年纷争，建立中国第一个中央集权帝国"
    lesson: "天下大势分久必合，但统一只是开始而非终点"
  - title_zh: "创建帝国制度"
    domain: "政治制度"
    start_date: "前221"
    end_date: "前210"
    places: ["咸阳(今陕西咸阳)"]
    phases:
      - name: "废封建设郡县"
        start_date: "前221"
        end_date: "前221"
        place: "咸阳(今陕西咸阳)"
        highlight: "废分封行郡县"
      - name: "书同文车同轨"
        start_date: "前221"
        end_date: "前215"
        place: "全帝国"
        highlight: "统一度量衡、文字、货币"
      - name: "筑长城驰道"
        start_date: "前215"
        end_date: "前210"
        place: "北疆/全帝国"
        highlight: "蒙恬北击匈奴筑长城"
    description_zh: "始皇帝废封建、设三十六郡，书同文、车同轨、统一度量衡货币，修驰道、筑长城、建阿房宫，以法家治天下，建立了一套影响两千年的帝国制度。"
    outcome: "中央集权制度延续两千余年，郡县制成为治国根基"
    lesson: "好的制度可以跨越时代，但制度需要人心来维护"

events:
  - date: "前221"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "政治制度"
    title_zh: "始皇帝称帝"
    description_zh: "秦灭六国后，嬴政认为'王'的称号不足以显示功业，取'三皇五帝'之义，号曰始皇帝。废封建、设郡县、统一度量衡文字，建立中国历史上第一个大一统帝国。"
    is_highlight: true
    highlight_type: "制度"
    highlight_note: "中国帝制时代的起点，影响此后两千年"
  - date: "前213"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "文化政策"
    title_zh: "焚书坑儒"
    description_zh: "丞相李斯建议焚毁民间《诗》《书》百家语，唯留医药卜筮种树之书。始皇帝从之，坑杀方士儒生四百六十余人。此举钳制思想，亦种下秦亡之因。"
    is_highlight: true
    highlight_type: "政策"
    highlight_note: "焚书坑儒——文化专制的开端与教训"
  - date: "前210"
    place_name: "沙丘(今河北广宗)"
    event_type: "宫廷政变"
    title_zh: "沙丘之变"
    description_zh: "始皇帝东巡途中病逝于沙丘。赵高与李斯合谋，矫诏赐死太子扶苏，立胡亥为秦二世。始皇帝的身后事，由他最不信任的人决定。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "一代帝王身后即遭政变，秦朝覆灭的起点"
  - date: "前215"
    place_name: "北疆(今内蒙古河套)"
    event_type: "军事行动"
    title_zh: "蒙恬北击匈奴筑长城"
    description_zh: "始皇帝派蒙恬率三十万大军北击匈奴，收复河南地，并连接秦赵燕三国长城，筑成万里长城。匈奴不敢南下而牧马，北疆暂安。"
    is_highlight: true
    highlight_type: "军事"
    highlight_note: "万里长城——帝国防御的极致与民力消耗的代价"
  - date: "前219"
    place_name: "琅琊(今山东青岛)"
    event_type: "巡游求仙"
    title_zh: "始皇东巡封禅"
    description_zh: "始皇帝东巡泰山封禅，刻石颂德。又遣徐福率童男女数千入海求仙药。始皇帝晚年沉迷长生不老，多次东巡求仙，耗费巨大。"
    is_highlight: false
    highlight_type: "文化"
    highlight_note: ""
  - date: "前209"
    place_name: "大泽乡(今安徽宿州)"
    event_type: "农民起义"
    title_zh: "大泽乡起义"
    description_zh: "陈胜吴广因大雨误期，按秦法当斩，遂揭竿而起。'王侯将相宁有种乎'一呼百应，天下响应。始皇帝死后仅一年，秦帝国便岌岌可危。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "暴政之下，民不聊生，帝国根基一夜崩塌"
  - date: "前246"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "宫廷政变"
    title_zh: "嫪毐之乱与逐吕不韦"
    description_zh: "嬴政即位时年仅十三岁，国政由丞相吕不韦与太后宠臣嫪毐把持。前238年嫪毐叛乱被平，嬴政亲政后又免吕不韦相权，逐出咸阳，真正掌权。"
    is_highlight: false
    highlight_type: "转折"
    highlight_note: ""
  - date: "前210"
    place_name: "沙丘(今河北广宗)"
    event_type: "帝王驾崩"
    title_zh: "始皇帝驾崩"
    description_zh: "始皇帝在第五次东巡途中病逝于沙丘平台，享年四十九岁。遗诏本欲传位长子扶苏，却被赵高李斯篡改，秦朝命运由此转折。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "始皇帝之死是秦朝覆灭的直接导火索"
