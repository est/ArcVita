person:
  name_zh: "吴王阖闾"
  birth_date: "约-537"
  death_date: "前496"
  birth_place: "姑苏(今江苏苏州)"
  era: "春秋末期"
  archetype: "用贤图强的崛起之君"
  summary_zh: "吴王阖闾用伍子胥、孙武为将，柏举之战五战入楚郢都，是吴国崛起为霸主的关键人物。"
  summary_first_person: "吾弟僚据王位，吾遣专诸刺之于宴席之上，始得即位。伍子胥自楚来奔，为吾策划霸业。孙武以兵法见用，吾拜为将军。吾用此二人，西破强楚，五战入郢，楚昭王仓皇出奔。然越王允常薨，吾伐越时竟被勾践击败，伤指而亡。一生图强，终为他人作嫁。"
  lesson: "得人才者得天下，但也不能忽视潜在的威胁。"

endeavors:
  - title_zh: "专诸刺僚，夺取王位"
    domain: "政治/军事"
    start_date: "约-515"
    end_date: "约-515"
    places: ["姑苏(今江苏苏州)"]
    phases:
      - name: "密谋夺位"
        start_date: "约-516"
        end_date: "约-515"
        place: "姑苏(今江苏苏州)"
        highlight: "伍子胥荐专诸"
      - name: "专诸刺僚"
        start_date: "约-515"
        end_date: "约-515"
        place: "姑苏(今江苏苏州)"
        highlight: "鱼肠剑刺杀王僚"
    description_zh: "吴王僚据位不正，公子光(阖闾)在伍子胥策划下，以专诸刺杀王僚于宴席之上。专诸以鱼肠剑藏于鱼腹，一举刺杀王僚，自己也被卫士所杀。公子光即位为吴王阖闾。"
    outcome: "阖闾夺取王位，开启吴国崛起之路"
    lesson: "非常之时需非常之策，但代价往往高昂"
  - title_zh: "柏举之战，西破强楚"
    domain: "军事"
    start_date: "约-512"
    end_date: "前506"
    places: ["姑苏(今江苏苏州)", "柏举(今湖北麻城)", "郢(今湖北荆州)"]
    phases:
      - name: "用孙武、伍子胥"
        start_date: "约-512"
        end_date: "约-510"
        place: "姑苏(今江苏苏州)"
        highlight: "用孙武为将、伍子胥为谋"
      - name: "柏举之战"
        start_date: "前506"
        end_date: "前506"
        place: "柏举(今湖北麻城)"
        highlight: "五战五胜，入楚郢都"
      - name: "入郢都"
        start_date: "前506"
        end_date: "前506"
        place: "郢(今湖北荆州)"
        highlight: "楚昭王出奔，吴国霸业鼎盛"
    description_zh: "阖闾用孙武为将军、伍子胥为谋臣，制定伐楚战略。前506年，吴军三万千里奔袭，在柏举大破楚军二十万，五战五胜，一路追击至郢都。楚昭王仓皇出奔，吴军入郢。这是春秋时期规模最大的远征，也是吴国霸业的巅峰。"
    outcome: "西破强楚，五战入郢，吴国成为春秋末期霸主"
    lesson: "以少胜多的关键在于战略与人才"
  - title_zh: "重用人才，吴国崛起"
    domain: "政治/人才"
    start_date: "约-515"
    end_date: "前496"
    places: ["姑苏(今江苏苏州)"]
    phases:
      - name: "任用伍子胥"
        start_date: "约-515"
        end_date: "前496"
        place: "姑苏(今江苏苏州)"
        highlight: "用伍子胥为行人(外交官)"
      - name: "任用孙武"
        start_date: "约-512"
        end_date: "约-504"
        place: "姑苏(今江苏苏州)"
        highlight: "用孙武为将军"
      - name: "国力大增"
        start_date: "约-510"
        end_date: "前496"
        place: "姑苏(今江苏苏州)"
        highlight: "吴国从偏居东南的小国崛起为霸主"
    description_zh: "阖闾即位后，广纳贤才。用伍子胥为行人，谋划霸业；用孙武为将军，训练军队；又用伯嚭为大夫。在这些人才辅佐下，吴国从一个偏居东南的小国迅速崛起为能与楚国抗衡的强国。"
    outcome: "吴国崛起为春秋末期最强大的国家之一"
    lesson: "人才是国家崛起的第一资源"

events:
  - date: "约-515"
    place_name: "姑苏(今江苏苏州)"
    event_type: "政治事件"
    title_zh: "专诸刺王僚"
    description_zh: "公子光(阖闾)设宴请王僚。专诸将鱼肠剑藏于烤鱼腹中，借献鱼之机刺杀王僚。王僚当场毙命，专诸亦被卫士所杀。公子光即位为吴王阖闾。此即中国四大刺客故事之首。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "专诸刺王僚——中国刺客文化的开端"
  - date: "约-512"
    place_name: "姑苏(今江苏苏州)"
    event_type: "军事任用"
    title_zh: "孙武见用为将军"
    description_zh: "孙武以兵法十三篇谒见吴王阖闾，阖闾拜为将军。孙武与伍子胥共谋伐楚，制定了'疲楚误楚'的长期战略，为柏举之战的胜利奠定了基础。"
    is_highlight: true
    highlight_type: "人才"
    highlight_note: "孙武见吴王——兵圣与霸主的相遇"
  - date: "前506"
    place_name: "柏举(今湖北麻城)"
    event_type: "战役"
    title_zh: "柏举之战五战入郢"
    description_zh: "孙武率吴军三万自淮汭千里奔袭楚国，在柏举大破楚军二十万。此后五战五胜，长驱直入楚国郢都。楚昭王仓皇出奔，吴军入郢，吴国霸业达到顶峰。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "春秋时期最大规模的远征战——三万破二十万"
  - date: "前506"
    place_name: "郢(今湖北荆州)"
    event_type: "军事行动"
    title_zh: "入郢鞭尸"
    description_zh: "吴军攻入郢都后，伍子胥掘楚平王之墓鞭尸三百，以报父兄被杀之仇。此举虽解了伍子胥的心头之恨，却也失去了收服楚国民心的机会，为吴国日后在楚地的统治困难埋下了伏笔。"
    is_highlight: false
    highlight_type: "事件"
    highlight_note: ""
  - date: "前496"
    place_name: "槜李(今浙江嘉兴)"
    event_type: "战役"
    title_zh: "槜李之战——阖闾之死"
    description_zh: "越王允常薨，阖闾趁机伐越。越王勾践在槜李迎战，以敢死队冲阵、又派罪人自刎阵前搅乱吴军。阖闾被越军击伤脚趾，伤重不治而死于陉。一代霸主竟死于轻敌冒进。"
    is_highlight: true
    highlight_type: "终局"
    highlight_note: "一世英名终因轻敌——为夫差埋下复仇之种"
