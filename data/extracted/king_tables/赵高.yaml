person:
  name_zh: "赵高"
  name_en: "Zhao Gao"
  birth_date: "约前256"
  death_date: "前207"
  birth_place: "赵国(今河北邯郸)"
  era: "秦朝"
  archetype: "窃国弄臣：以阴谋颠覆帝国的宦官权奸"
  dilemmas: ["出身卑微的权力渴望", "操控帝王与自我暴露的危险平衡", "帝国覆灭与个人毁灭的同步"]
  summary_zh: "赵国宗族疏远，以精通律法入秦宫，深得始皇帝信任。始皇死后矫诏立胡亥、杀扶苏，指鹿为马独揽朝政，逼杀李斯、秦二世，终被子婴诛杀。秦帝国覆灭，赵高居首功。"
  summary_first_person: "吾本赵国疏宗，入秦宫为宦者。始皇帝以为吾通律法，使教公子胡亥。始皇崩后，吾以利害说李斯，矫诏立胡亥。朝堂之上吾指鹿为马，顺吾者昌逆吾者亡。然秦室既灭，吾亦难逃一死。"
  lesson: "权谋可以颠覆一切，但没有根基的权力终将反噬自身。"

endeavors:
  - title_zh: "操控秦朝权力中枢"
    domain: "政治阴谋"
    start_date: "前210"
    end_date: "前207"
    places: ["沙丘(今河北广宗)", "咸阳(今陕西咸阳)"]
    phases:
      - name: "沙丘矫诏"
        start_date: "前210"
        end_date: "前210"
        place: "沙丘(今河北广宗)"
        highlight: "矫诏杀扶苏立胡亥"
      - name: "独揽朝政"
        start_date: "前210"
        end_date: "前207"
        place: "咸阳(今陕西咸阳)"
        highlight: "指鹿为马"
      - name: "逼帝自尽"
        start_date: "前207"
        end_date: "前207"
        place: "咸阳(今陕西咸阳)"
        highlight: "逼秦二世自杀"
    description_zh: "赵高从沙丘矫诏开始，先杀李斯取而代之为丞相，又以'指鹿为马'试探群臣顺逆。最终逼秦二世自杀于望夷宫，欲自立为帝不成，立子婴为秦王。子婴即位后诛杀赵高，夷三族。"
    outcome: "秦帝国在赵高操控下二世而亡，赵高亦身死族灭"
    lesson: "窃国者终被国灭，权谋终有尽时"

events:
  - date: "前210"
    place_name: "沙丘(今河北广宗)"
    event_type: "宫廷政变"
    title_zh: "沙丘矫诏"
    description_zh: "始皇帝驾崩，赵高以'扶苏即位蒙恬用事则李斯失势'说服丞相李斯，合谋篡改遗诏，立胡亥为二世皇帝，赐长子扶苏、大将蒙恬自尽。此举直接颠覆了秦帝国的合法继承秩序。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "一纸矫诏改变帝国命运——秦亡的起点"
  - date: "前208"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "宫廷阴谋"
    title_zh: "指鹿为马"
    description_zh: "赵高为试探群臣，牵鹿入朝对二世曰'此马也'。二世笑曰'丞相误邪，谓鹿为马'。问左右，或言鹿或言马，言鹿者皆被赵高暗中报复。自此朝中再无人敢忤逆赵高。"
    is_highlight: true
    highlight_type: "成语"
    highlight_note: "指鹿为马——权奸颠倒黑白的经典典故"
  - date: "前208"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "政治清洗"
    title_zh: "赵高杀李斯"
    description_zh: "赵高以李斯父子谋反为由，上奏二世。李斯五刑具身，腰斩咸阳市中。李斯一死，赵高独揽朝政，秦帝国最后一根支柱折断。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "帝国制度缔造者死于权奸之手"
  - date: "前207"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "宫廷政变"
    title_zh: "逼秦二世自杀"
    description_zh: "章邯降楚后，赵高恐二世追责，派女婿阎乐逼二世于望夷宫。二世求为黔首不得，遂自杀。赵高欲自立为帝，群臣皆不从，乃立子婴为秦王。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "帝国皇帝被自己的丞相逼死"
  - date: "前207"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "处刑"
    title_zh: "子婴诛赵高"
    description_zh: "子婴即位后，称病不朝。赵高亲往探视，子婴趁机刺杀赵高，夷其三族。赵高死于自己扶植的傀儡之手，咸阳市中百姓争相观看。"
    is_highlight: true
    highlight_type: "结局"
    highlight_note: "窃国者终被诛灭——权奸的最终归宿"
  - date: "前210"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "人物关系"
    title_zh: "教授胡亥律法"
    description_zh: "赵高精通律法，秦始皇令其教授公子胡亥律法与狱讼之事。赵高由此与胡亥建立了深厚的信任关系，为日后矫诏立胡亥奠定了基础。"
    is_highlight: false
    highlight_type: "铺垫"
    highlight_note: ""
  - date: "前209"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "政治清洗"
    title_zh: "诛杀蒙氏兄弟"
    description_zh: "蒙恬蒙毅兄弟为秦朝栋梁，赵高矫诏逼蒙恬自杀后，又借二世之手诛杀蒙毅。蒙氏既灭，秦朝再无良将可用，边疆防御体系崩溃。"
    is_highlight: false
    highlight_type: "政治"
    highlight_note: ""
  - date: "前207"
    place_name: "望夷宫(今陕西咸阳)"
    event_type: "宫廷政变"
    title_zh: "望夷宫之变"
    description_zh: "楚军逼近关中，赵高恐二世问责，先杀二世侄子婴不得，遂派阎乐率千余人入望夷宫逼二世。二世左右皆散，唯一小宦随侍。二世叹曰'吾闻之韩子曰...',遂自杀。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "秦帝国在宫变中走向终结"
