    highlight: 连下齐国七十余城，仅余即墨和莒
  - name: 收束
    start_date: '-279'
    end_date: '-279'
    place: 蓟(今北京)
    highlight: 昭王薨，田单复齐
  description_zh: 前284年，燕昭王以乐毅为上将军，联合秦、韩、赵、魏五国联军大举伐齐。齐国在齐湣王的暴政下已是强弩之末，联军一战大破齐军于济西。乐毅独率燕军长驱直入，连下齐国七十余城，仅剩即墨和莒两城未下。齐湣王逃亡被杀。齐国几乎灭亡，燕国报了当年被破国之仇。
  outcome: 燕国洗雪前耻，成为战国中后期的重要强国
  lesson: 长期隐忍加上精准出击，弱国也能覆灭强国
