  description_zh: 燕昭王即位后，以谦恭的态度和优厚的待遇招揽人才。他先拜郭隗为师，郭隗以'千金买骨'的故事建议昭王先重用自己这样的中等人才，以吸引更优秀的贤者。昭王从之，筑黄金台于蓟城之上，置千金于台上以待贤者。消息传开，天下贤士纷纷入燕。
  outcome: 燕国从人才荒漠变为人才汇聚之地
  lesson: 招揽人才不是等人才上门，而是主动释放诚意
- title_zh: 五国伐齐，乐毅连下七十余城
  domain: 军事外交
