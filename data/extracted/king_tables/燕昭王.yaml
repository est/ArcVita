person:
  name_zh: 燕昭王
  birth_date: '-335'
  death_date: '-279'
  birth_place: 蓟(今北京)
  era: 战国中晚期
  archetype: 卧薪尝胆式的复仇复兴之君
  summary_zh: 姬职，燕国历史上最伟大的君主。即位时燕国刚被齐国趁乱攻破，几乎亡国。他以'千金买骨'的姿态招揽天下贤才——筑黄金台、置千金于其上以待贤者。乐毅、邹衍、剧辛等名士纷至沓来。经过二十八年的卧薪尝胆，联合五国伐齐，乐毅连下齐国七十余城，几乎灭齐。燕国从战国最小最弱的国家一跃成为天下强国。
  summary_first_person: 吾即位时，燕国刚被齐国趁内乱攻破，国破家亡。吾深以为耻，立志复仇。筑黄金台、置千金以招贤士。乐毅自魏来，邹衍自齐来，剧辛自赵来。吾以乐毅为上将军，联合五国伐齐。乐毅连下七十余城，齐国几亡。吾二十八年之卧薪尝胆，燕国终于扬眉吐气。
  lesson: 最弱的国家也能成就最伟大的事业，关键是有耐心和人才。
