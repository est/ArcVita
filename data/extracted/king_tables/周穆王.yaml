person:
  name_zh: "周穆王"
  birth_date: "约-1010"
  death_date: "约-922"
  birth_place: "镐京(今陕西西安)"
  era: "西周中期"
  archetype: "远征四海的浪漫之君"
  summary_zh: "周穆王西征犬戎、东巡徐国、会西王母于瑶池，是西周最富浪漫色彩的君主，其远征虽拓土万里，却也耗尽国力，为西周衰落埋下伏笔。"
  summary_first_person: "吾承成康之治余荫，天下太平，遂欲穷天下之极。吾驾八骏之乘，率六师西征犬戎，获其五王，迁戎于太原。又西行至瑶池，会西王母于弇山之上，觞于瑶池之畔。吾游遍天下，东至东海，西极昆仑，南抵巴楚，北达朔漠。然远征耗国力，晚年王室渐衰，吾之壮游，究竟是开拓还是挥霍，后人自有评说。"
  lesson: "开拓与节制之间的平衡，是每一个强盛时代都要面对的课题。"

endeavors:
  - title_zh: "西征犬戎，远行万里"
    domain: "军事/探索"
    start_date: "约-970"
    end_date: "约-960"
    places: ["镐京(今陕西西安)", "犬戎(今甘肃平凉)", "瑶池(今新疆天山)"]
    phases:
      - name: "西征犬戎"
        start_date: "约-970"
        end_date: "约-965"
        place: "犬戎(今甘肃平凉)"
        highlight: "获犬戎五王，迁戎于太原"
      - name: "瑶池会西王母"
        start_date: "约-965"
        end_date: "约-960"
        place: "瑶池(今新疆天山)"
        highlight: "会西王母于瑶池之畔"
      - name: "东巡徐国"
        start_date: "约-960"
        end_date: "约-955"
        place: "徐(今江苏徐州)"
        highlight: "平定徐国之乱"
    description_zh: "周穆王不满足于成康之治的守成格局，决心开疆拓土。亲率六师西征犬戎，获其五王，迁部分犬戎至太原。又驾八骏西行至瑶池，与西王母相会，留下了千古传奇。东巡时平定徐国僭号称王之乱。穆王远征万里，拓土四方，但也耗尽了成康之治积累的国力。"
    outcome: "拓土万里，威震四方，但国力耗损严重"
    lesson: "远征开拓需以国力为限，过度扩张反致衰落"
  - title_zh: "穆王立法，吕刑传世"
    domain: "法律/文化"
    start_date: "约-960"
    end_date: "约-950"
    places: ["镐京(今陕西西安)"]
    phases:
      - name: "制定吕刑"
        start_date: "约-960"
        end_date: "约-950"
        place: "镐京(今陕西西安)"
        highlight: "制定《吕刑》，确立五刑制度"
    description_zh: "穆王晚年，命吕侯制定《吕刑》，确立墨、劓、剕、宫、大辟五刑制度，共三千条。这是中国最早的成文法典之一，体现了西周从人治向法治的初步转变。"
    outcome: "《吕刑》传世，成为中国法律史的重要里程碑"
    lesson: "以法度规范权力，是治理国家的根本"

events:
  - date: "约-970"
    place_name: "镐京(今陕西西安)"
    event_type: "军事行动"
    title_zh: "西征犬戎"
    description_zh: "周穆王亲率六师西征犬戎。大臣祭公谋父劝谏'先王耀德不观兵'，穆王不听。西征虽获犬戎五王，迁戎于太原，但此后'荒服不至'，边疆诸国不再朝贡周室。"
    is_highlight: true
    highlight_type: "军事"
    highlight_note: "得不偿失的远征——开拓与节制的失衡"
  - date: "约-965"
    place_name: "瑶池(今新疆天山)"
    event_type: "外交/传说"
    title_zh: "瑶池会西王母"
    description_zh: "穆王驾八骏之乘西行至瑶池，与西王母相会。西王母为穆王歌曰'白云在天，山陵自出。道里悠远，山川间之。将子无死，尚能复来'。穆王答以'予归东土，和治诸夏。万民平均，吾顾见汝'。此会成为中国古代最富浪漫色彩的传说之一。"
    is_highlight: true
    highlight_type: "传说"
    highlight_note: "瑶池会西王母——中国最早的'远方'叙事"
  - date: "约-960"
    place_name: "徐(今江苏徐州)"
    event_type: "军事行动"
    title_zh: "东征徐国"
    description_zh: "徐国国君徐偃王行仁义，得江淮民心，僭号称王。穆王率军东征，联合楚国夹击徐国。徐偃王不忍战祸殃及百姓，主动放弃抵抗。穆王封其子于徐，延续徐国祭祀。"
    is_highlight: true
    highlight_type: "军事"
    highlight_note: "仁义之君与霸道之君的碰撞"
  - date: "约-955"
    place_name: "镐京(今陕西西安)"
    event_type: "文化事件"
    title_zh: "天子之驭与八骏传说"
    description_zh: "穆王善驭马，有八骏名曰：赤骥、盗骊、白义、逾轮、山子、渠黄、华骝、绿耳。后世以'穆王八骏'比喻良马，以'穆天子'称呼周穆王，成为中国文化中'远方'与'浪漫'的象征。"
    is_highlight: true
    highlight_type: "文化"
    highlight_note: "八骏——中国马文化的起点"
  - date: "约-950"
    place_name: "镐京(今陕西西安)"
    event_type: "法律制度"
    title_zh: "制定《吕刑》"
    description_zh: "穆王命吕侯制定刑书，确立墨刑(刺面)、劓刑(割鼻)、剕刑(断足)、宫刑(去势)、大辟(死刑)五刑制度，共三千条。这是西周最重要的法律文献，被收录于《尚书》。"
    is_highlight: true
    highlight_type: "制度"
    highlight_note: "中国最早的系统性法典之一"
  - date: "约-940"
    place_name: "镐京(今陕西西安)"
    event_type: "政治衰落"
    title_zh: "王室衰微初现"
    description_zh: "穆王晚年，长期远征耗尽国力。'荒服不至'——边疆诸侯不再朝贡，王室权威开始动摇。穆王之世，成为西周由盛转衰的分水岭。"
    is_highlight: false
    highlight_type: "衰落"
    highlight_note: ""
  - date: "约-922"
    place_name: "镐京(今陕西西安)"
    event_type: "人物终局"
    title_zh: "穆王崩于镐京"
    description_zh: "周穆王在位约五十五年，是西周在位时间最长的君主。他的一生充满浪漫与传奇，但远征耗尽国力，为西周中后期的衰落埋下了伏笔。"
    is_highlight: false
    highlight_type: "终局"
    highlight_note: ""
