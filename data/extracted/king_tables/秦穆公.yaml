person:
  name_zh: "秦穆公"
  birth_date: "约-682"
  death_date: "前621"
  birth_place: "雍(今陕西凤翔)"
  era: "春秋"
  archetype: "称霸西戎的雄略之君"
  summary_zh: "秦穆公用百里奚、蹇叔为相，东出争霸中原受阻于崤之战，转而西征灭十二戎国，称霸西戎，为秦国日后的东出统一天下奠定了根基。"
  summary_first_person: "吾用百里奚为相，蹇叔为谋，欲东出争霸中原。然崤之战大败于晋，三帅被俘，吾之东进之路断矣。吾不馁，转而西征，灭十二戎国，开地千里，遂霸西戎。吾生平最痛者，不听蹇叔之谏而有崤之败；最憾者，与晋文公联盟终反目。然吾知秦之东出，不在吾世，而在后人。"
  lesson: "一次失败不可怕，可怕的是不懂得调整方向。东进受阻则西扩，此为战略弹性。"

endeavors:
  - title_zh: "崤之战与东进受挫"
    domain: "军事/外交"
    start_date: "前659"
    end_date: "前627"
    places: ["雍(今陕西凤翔)", "崤山(今河南洛宁)", "郑(今河南新郑)"]
    phases:
      - name: "秦晋联盟"
        start_date: "前659"
        end_date: "前636"
        place: "雍(今陕西凤翔)"
        highlight: "助晋文公归国，秦晋之好"
      - name: "联盟破裂"
        start_date: "前630"
        end_date: "前628"
        place: "中原"
        highlight: "秦晋围郑后关系恶化"
      - name: "崤之战惨败"
        start_date: "前627"
        end_date: "前627"
        place: "崤山(今河南洛宁)"
        highlight: "三帅被俘，东进之路断绝"
    description_zh: "秦穆公先与晋国结盟，助晋文公归国即位。晋文公称霸后，秦晋联盟渐生嫌隙。文公死后，穆公派兵袭郑，被郑国商人弦高识破。秦军回师途中在崤山被晋军伏击，三帅被俘。此战彻底打破了秦穆公东进争霸的计划。"
    outcome: "崤之战惨败，秦东进受阻，但未放弃争霸之心"
    lesson: "战略受挫时，懂得转向比死磕更明智"
  - title_zh: "西征灭戎，称霸西戎"
    domain: "军事"
    start_date: "前627"
    end_date: "前621"
    places: ["雍(今陕西凤翔)", "西戎(今甘肃天水)"]
    phases:
      - name: "转向西征"
        start_date: "前627"
        end_date: "前625"
        place: "雍(今陕西凤翔)"
        highlight: "崤之战后转向西扩"
      - name: "由余献策"
        start_date: "约-625"
        end_date: "约-623"
        place: "雍(今陕西凤翔)"
        highlight: "用戎人由余为谋，知戎虚实"
      - name: "灭十二戎国"
        start_date: "约-623"
        end_date: "前621"
        place: "西戎(今甘肃天水)"
        highlight: "开地千里，遂霸西戎"
    description_zh: "崤之战后，秦穆公转向西方。用戎人由余为谋，了解戎国虚实。先后灭掉西戎十二国，开地千里，周襄王赐金鼓以贺。秦穆公遂霸西戎，为秦国日后东出统一天下奠定了西部疆域的基础。"
    outcome: "称霸西戎，开地千里，奠定秦国统一的根基"
    lesson: "东方不亮西方亮，战略调整是困境中的生存之道"

events:
  - date: "前659"
    place_name: "雍(今陕西凤翔)"
    event_type: "政治事件"
    title_zh: "五羖大夫百里奚"
    description_zh: "秦穆公用五张黑公羊皮赎回百里奚，拜为相。百里奚又荐蹇叔，二人辅佐穆公。百里奚相秦七年，开地千里，秦穆公的霸业由此起步。"
    is_highlight: true
    highlight_type: "人才"
    highlight_note: "五羖大夫——中国历史上最廉价也最值的人才交易"
  - date: "前636"
    place_name: "雍(今陕西凤翔)"
    event_type: "政治事件"
    title_zh: "纳晋文公归国"
    description_zh: "秦穆公以兵纳重耳归国即位，是为晋文公。秦晋之好由此确立。然穆公的目的并非无私——他希望通过控制晋君来实现秦国东进的战略。"
    is_highlight: true
    highlight_type: "外交"
    highlight_note: "秦晋联盟——各怀心思的合作"
  - date: "前630"
    place_name: "郑(今河南新郑)"
    event_type: "军事行动"
    title_zh: "秦晋围郑"
    description_zh: "秦晋联军围攻郑国。郑国烛之武夜缒而出，说服秦穆公退兵，曰'亡郑以陪邻，邻之厚，君之薄也'。穆公退兵，秦晋联盟出现裂痕。"
    is_highlight: true
    highlight_type: "外交"
    highlight_note: "烛之武退秦师——外交瓦解联盟的经典"
  - date: "前627"
    place_name: "崤山(今河南洛宁)"
    event_type: "战役"
    title_zh: "崤之战——秦军惨败"
    description_zh: "晋文公死后，秦穆公不听蹇叔劝谏，派兵千里袭郑。被郑国商人弦高识破后回师，在崤山遭晋军伏击。秦军全军覆没，三帅孟明视、西乞术、白乙丙被俘。此战是秦穆公东进争霸的最大挫折。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "崤之战——秦东进之路的终结"
  - date: "约-623"
    place_name: "西戎(今甘肃天水)"
    event_type: "军事行动"
    title_zh: "西征灭十二戎国"
    description_zh: "秦穆公用由余之谋，西征犬戎。先后灭掉绵诸、绲戎、翟、豲等十二戎国，开地千里。周襄王赐金鼓以贺，秦穆公遂霸西戎。此功为秦国后来统一六国奠定了西部根基。"
    is_highlight: true
    highlight_type: "军事"
    highlight_note: "开地千里——秦国统一基业的起点"
  - date: "前621"
    place_name: "雍(今陕西凤翔)"
    event_type: "人物终局"
    title_zh: "穆公薨，以三良殉葬"
    description_zh: "秦穆公薨，以三良(子车氏三子：奄息、仲行、鍼虎)殉葬。秦人哀之，为之赋《黄鸟》。穆公一生，东进受阻而西扩称霸，为秦国留下了千里疆域和争霸天下的雄心。"
    is_highlight: true
    highlight_type: "终局"
    highlight_note: "三良殉葬——秦穆公的功过与时代的残忍"
