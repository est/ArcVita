person:
  name_zh: "越王勾践"
  birth_date: "约-520"
  death_date: "前465"
  birth_place: "会稽(今浙江绍兴)"
  era: "春秋末期"
  archetype: "卧薪尝胆的复仇之君"
  summary_zh: "越王勾践败于夫差后卧薪尝胆十年，终灭吴国称霸中原，是'三千越甲可吞吴'的传奇主角，也是'飞鸟尽良弓藏'的冷酷实践者。"
  summary_first_person: "吾败于夫椒，困于会稽山，几欲自杀。文种劝吾忍辱求和，吾乃为夫差驾车三年，尝粪问疾以取其信。归国后卧薪尝胆，十年生聚、十年教训。范蠡、文种辅吾灭吴，吾遂称霸中原。然范蠡知吾'可与共患难，不可与共安乐'，辞去泛舟五湖。文种不听，终被吾赐死。吾之一生，从亡国之君到霸主，从忍辱负重到恩将仇报，功过参半。"
  lesson: "患难见真情，安乐见人心。最可怕的敌人不是对手，而是自己的猜忌。"

endeavors:
  - title_zh: "卧薪尝胆，十年复仇"
    domain: "政治/军事"
    start_date: "前494"
    end_date: "前473"
    places: ["会稽(今浙江绍兴)", "姑苏(今江苏苏州)", "吴(今江苏苏州)"]
    phases:
      - name: "会稽之耻"
        start_date: "前494"
        end_date: "前494"
        place: "会稽(今浙江绍兴)"
        highlight: "夫椒战败，困于会稽山"
      - name: "为奴三年"
        start_date: "前494"
        end_date: "前491"
        place: "姑苏(今江苏苏州)"
        highlight: "为夫差驾车、尝粪取信"
      - name: "十年生聚"
        start_date: "前491"
        end_date: "前482"
        place: "会稽(今浙江绍兴)"
        highlight: "卧薪尝胆，十年生聚十年教训"
      - name: "灭吴称霸"
        start_date: "前482"
        end_date: "前473"
        place: "姑苏(今江苏苏州)"
        highlight: "趁虚偷袭、最终灭吴"
    description_zh: "勾践在会稽山被困时，听从文种建议忍辱求和。为夫差驾车三年，尝粪问疾，极尽卑躬屈膝之能事，终获夫差信任放归。归国后卧薪尝胆，与范蠡、文种共谋十年。十年生聚(发展人口经济)、十年教训(训练军队)。先趁夫差北上偷袭姑苏，后经三年围城终灭吴国。"
    outcome: "灭吴称霸中原，实现从亡国之君到霸主的逆袭"
    lesson: "忍辱负重需要超乎常人的意志力"
  - title_zh: "飞鸟尽良弓藏——诛杀功臣"
    domain: "政治"
    start_date: "前473"
    end_date: "前465"
    places: ["会稽(今浙江绍兴)", "姑苏(今江苏苏州)"]
    phases:
      - name: "范蠡辞去"
        start_date: "前473"
        end_date: "前473"
        place: "姑苏(今江苏苏州)"
        highlight: "范蠡泛舟五湖，辞官而去"
      - name: "文种被杀"
        start_date: "约-472"
        end_date: "约-472"
        place: "会稽(今浙江绍兴)"
        highlight: "勾践赐文种自刎"
    description_zh: "灭吴后，范蠡深知勾践'可与共患难，不可与共安乐'，辞官泛舟五湖，经商致富号陶朱公。临行遗书文种曰'飞鸟尽，良弓藏；狡兔死，走狗烹'。文种不听，终被勾践赐死。勾践的冷酷无情，暴露了其性格的另一面。"
    outcome: "范蠡功成身退，文种被杀——患难与安乐的试金石"
    lesson: "功成身退是最大的智慧"

events:
  - date: "前494"
    place_name: "会稽(今浙江绍兴)"
    event_type: "战役"
    title_zh: "会稽之耻"
    description_zh: "夫椒之战，勾践大败，仅率五千残兵困于会稽山。越国面临亡国之危。勾践欲自杀，被文种劝止。文种提出以卑辞厚礼求和，勾践乃遣文种赴吴营请降。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "会稽之耻——勾践一生的转折点"
  - date: "约-493"
    place_name: "姑苏(今江苏苏州)"
    event_type: "人物经历"
    title_zh: "为夫差驾车三年"
    description_zh: "勾践入吴为臣，为夫差驾车养马。夫差生病，勾践亲尝其粪以判断病情，曰'大王之疾将愈'。夫差大悦，以为勾践忠心不二。三年后放勾践归国。此事展现了勾践超乎常人的忍耐力。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "卧薪尝胆的前奏——忍辱负重的极致"
  - date: "约-490"
    place_name: "会稽(今浙江绍兴)"
    event_type: "政治改革"
    title_zh: "十年生聚十年教训"
    description_zh: "勾践归国后，卧薪尝胆，与百姓同苦。用范蠡治军、文种治民。鼓励生育(生聚)，训练精兵(教训)。十年间越国从一个战败国恢复为强国。"
    is_highlight: true
    highlight_type: "改革"
    highlight_note: "卧薪尝胆——中国最著名的励志典故"
  - date: "前482"
    place_name: "姑苏(今江苏苏州)"
    event_type: "军事行动"
    title_zh: "趁虚偷袭姑苏"
    description_zh: "夫差北上黄池争霸，勾践趁吴国空虚率军偷袭姑苏，俘获太子友，焚毁姑苏台。吴国精锐尽失，由盛转衰。这是勾践十年卧薪尝胆的第一次回报。"
    is_highlight: true
    highlight_type: "军事"
    highlight_note: "螳螂捕蝉，黄雀在后——十年隐忍的回报"
  - date: "前473"
    place_name: "姑苏(今江苏苏州)"
    event_type: "战役"
    title_zh: "灭吴——三千越甲可吞吴"
    description_zh: "勾践率越军围姑苏三年。城破之日，夫差逃至阳山，遣使求和不成，蒙面自刎。吴国自阖闾创业至此仅传两代而亡。勾践遂称霸中原，成为春秋最后一位霸主。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "三千越甲可吞吴——最经典的复仇故事"
  - date: "约-472"
    place_name: "会稽(今浙江绍兴)"
    event_type: "政治事件"
    title_zh: "范蠡辞去，文种被杀"
    description_zh: "范蠡泛舟五湖辞去，遗书文种曰'飞鸟尽，良弓藏；狡兔死，走狗烹。越王为人长颈鸟喙，可与共患难，不可与共安乐。'文种不听，称病不朝。勾践赐文种属镂之剑，曰'子教寡人伐吴七术，寡人用其三而败吴，其四在子，子为我从先王试之'。文种遂自杀。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "飞鸟尽良弓藏——功臣的宿命"
  - date: "前465"
    place_name: "会稽(今浙江绍兴)"
    event_type: "人物终局"
    title_zh: "勾践薨"
    description_zh: "越王勾践在位约三十年而薨。他的一生从亡国之君到霸主，从卧薪尝胆到恩将仇报，是中国历史上最具戏剧性的人物之一。其忍耐力令人敬佩，其冷酷无情令人齿寒。"
    is_highlight: true
    highlight_type: "终局"
    highlight_note: "功过参半的复仇之君——历史最复杂的面孔之一"
