person:
  name_zh: "晋文公"
  birth_date: "约-697"
  death_date: "前628"
  birth_place: "绛(今山西翼城)"
  era: "春秋"
  archetype: "流亡十九年终成霸业的坚韧之君"
  summary_zh: "晋文公流亡十九年遍历诸侯，终归晋国即位。城濮之战退避三舍大败楚军，践土会盟称霸中原，以'退避三舍'的信义和军事才能成为春秋第二位霸主。"
  summary_first_person: "吾父献公宠骊姬，吾几死于谗。流亡十九年，过卫绝粮、过曹受辱、过郑被慢。齐桓公妻吾以女，楚成王遇吾以礼。吾许楚王'退避三舍'。及归晋即位，勤王平叛得周襄王赐地。城濮之战，吾践前言退三舍，楚军追击，吾以逸待劳大败之。践土会盟，吾为诸侯之长。然吾一生最痛者，子犯(狐偃)劝吾杀怀公以绝后患，吾终未能与秦穆公善始善终。"
  lesson: "苦难是最好的老师，流亡十九年的磨砺铸就了最坚韧的霸主。"

endeavors:
  - title_zh: "流亡十九年，终归晋国"
    domain: "政治"
    start_date: "约-656"
    end_date: "前636"
    places: ["狄(今山西北部)", "卫(今河南滑县)", "齐(今山东淄博)", "楚(今湖北荆州)", "秦(今陕西凤翔)"]
    phases:
      - name: "出奔狄国"
        start_date: "约-656"
        end_date: "约-644"
        place: "狄(今山西北部)"
        highlight: "骊姬之乱，重耳出奔"
      - name: "遍历诸侯"
        start_date: "约-644"
        end_date: "约-637"
        place: "中原各国"
        highlight: "过卫绝粮、过曹受辱、齐国娶妻"
      - name: "秦穆公送归"
        start_date: "约-637"
        end_date: "前636"
        place: "秦(今陕西凤翔)"
        highlight: "秦穆公以兵纳重耳入晋"
    description_zh: "晋文公重耳因骊姬之乱流亡在外十九年。历经狄、卫、齐、曹、郑、楚、秦等国，受尽冷眼与磨难。在齐国娶妻安居，几乎放弃归国之志，被齐姜灌醉强行送走。最终在秦穆公帮助下归国即位，时年已六十二岁。"
    outcome: "六十二岁即位，十九年流亡铸就坚韧品格"
    lesson: "苦难是人生最深刻的教育"
  - title_zh: "城濮之战，践土称霸"
    domain: "军事/外交"
    start_date: "前636"
    end_date: "前628"
    places: ["绛(今山西翼城)", "城濮(今山东鄄城)", "践土(今河南原阳)"]
    phases:
      - name: "勤王平叛"
        start_date: "前636"
        end_date: "前635"
        place: "洛邑(今河南洛阳)"
        highlight: "勤王平王子带之乱，得周襄王赐地"
      - name: "城濮之战"
        start_date: "前632"
        end_date: "前632"
        place: "城濮(今山东鄄城)"
        highlight: "退避三舍，大败楚军"
      - name: "践土会盟"
        start_date: "前632"
        end_date: "前632"
        place: "践土(今河南原阳)"
        highlight: "称霸中原，天子临盟"
    description_zh: "晋文公即位后，先勤王平定王子带之乱，得到周襄王赐予的阳樊、温、原等地。前632年，楚国北伐中原，晋文公率军迎战。践前言退避三舍(九十里)，以逸待劳在城濮大败楚军。随后在践土会盟诸侯，周襄王亲临，晋文公成为继齐桓公之后的第二位霸主。"
    outcome: "城濮之战大败楚军，践土会盟称霸中原"
    lesson: "退让不是软弱，而是以退为进的大智慧"

events:
  - date: "约-656"
    place_name: "绛(今山西翼城)"
    event_type: "政治事件"
    title_zh: "骊姬之乱，重耳出奔"
    description_zh: "晋献公宠骊姬，欲废太子申生、立骊姬之子奚齐。太子申生被逼自杀，公子重耳、夷吾出奔。重耳自此流亡在外十九年，历经八国。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "骊姬之乱——改变春秋格局的历史事件"
  - date: "约-644"
    place_name: "卫国五鹿(今河南滑县)"
    event_type: "人物经历"
    title_zh: "过卫绝粮，乞食于野人"
    description_zh: "重耳过卫国，饥困于五鹿。向野人(农民)乞食，野人予之以土块。重耳怒，子犯曰'土乃国之象征，天赐土地于君，此乃吉兆'。重耳乃拜受之。此事体现了流亡之苦与随臣的智慧。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "乞食得土——流亡中的吉兆"
  - date: "约-643"
    place_name: "齐国临淄(今山东淄博)"
    event_type: "人物经历"
    title_zh: "齐国娶妻，安居忘归"
    description_zh: "重耳至齐国，齐桓公厚待之，妻以齐姜。重耳乐不思蜀，子犯与齐姜合谋，灌醉重耳后载之出行。重耳醒后大怒，执戈追子犯。此举虽粗暴，却救了重耳——若留齐，便无后来的晋文公。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "醉遣重耳——最及时的'背叛'"
  - date: "前636"
    place_name: "绛(今山西翼城)"
    event_type: "政治事件"
    title_zh: "秦穆公纳重耳入晋"
    description_zh: "秦穆公以兵纳重耳归国。重耳在外流亡十九年，归国即位时已六十二岁。他以超乎常人的耐心和智慧，将十九年的苦难转化为治国的智慧。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "六十二岁登基——大器晚成的典范"
  - date: "前632"
    place_name: "城濮(今山东鄄城)"
    event_type: "战役"
    title_zh: "城濮之战退避三舍"
    description_zh: "楚成王率军北伐，晋文公率军迎战。践流亡楚国时'退避三舍'的诺言，先退九十里。楚军追击，晋军以逸待劳，大败楚军于城濮。此战奠定了晋国霸业，也成为中国军事史上'以退为进'的经典战例。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "退避三舍——信义与兵法的完美结合"
  - date: "前632"
    place_name: "践土(今河南原阳)"
    event_type: "会盟"
    title_zh: "践土会盟称霸"
    description_zh: "城濮之战后，晋文公会诸侯于践土。周襄王亲临，赐晋文公'彤弓矢百、玈弓矢千'。晋文公为诸侯之长，号令天下。践土会盟标志着晋国正式取代齐国成为中原霸主。"
    is_highlight: true
    highlight_type: "会盟"
    highlight_note: "践土会盟——晋国霸业的正式确立"
  - date: "前630"
    place_name: "绛(今山西翼城)"
    event_type: "外交事件"
    title_zh: "秦晋围郑，烛之武退秦师"
    description_zh: "晋文公与秦穆公联合围攻郑国。郑国烛之武夜缒而出，说服秦穆公退兵。秦军撤退后，晋文公亦退兵。此事体现了秦晋联盟的裂痕——秦国开始有了自己的战略考量。"
    is_highlight: false
    highlight_type: "外交"
    highlight_note: ""
  - date: "前628"
    place_name: "绛(今山西翼城)"
    event_type: "人物终局"
    title_zh: "晋文公薨"
    description_zh: "晋文公在位仅九年即薨，但其成就足以匹敌在位四十年的齐桓公。城濮之战退避三舍、践土会盟称霸中原，晋文公以坚韧与智慧证明：真正的霸业不在于时间长短，而在于格局大小。"
    is_highlight: true
    highlight_type: "终局"
    highlight_note: "在位九年，霸业永存——最短暂也最辉煌的霸主"
