person:
  name_zh: "齐桓公"
  birth_date: "约-716"
  death_date: "前643"
  birth_place: "临淄(今山东淄博)"
  era: "春秋"
  archetype: "尊王攘夷的霸业开创者"
  summary_zh: "齐桓公用管仲为相，九合诸侯、一匡天下，以'尊王攘夷'号令诸侯，是春秋第一位霸主，开创了以会盟代替征伐的霸业模式。"
  summary_first_person: "吾兄襄公无道，吾出奔莒。管仲曾射吾带钩，吾几死之。然吾即位后，鲍叔牙荐管仲为相，吾不记前嫌，用之不疑。管仲相齐，通货积财、轻重九府，齐国大富。吾率诸侯北伐山戎、南征楚国，九合诸侯，一匡天下，葵丘会盟，天子赐胙，吾之霸业至于极矣。然管仲既薨，吾用竖刁、易牙、开方三佞，身后五子争立，吾尸六十七日不殡，虫出于户。一世英名，毁于身后。"
  lesson: "用人之道：亲贤臣远小人，是一生的功课，没有终点。"

endeavors:
  - title_zh: "九合诸侯，尊王攘夷"
    domain: "军事/外交"
    start_date: "前685"
    end_date: "前651"
    places: ["临淄(今山东淄博)", "北杏(今山东东阿)", "葵丘(今河南民权)", "召陵(今河南郾城)"]
    phases:
      - name: "即位用管仲"
        start_date: "前685"
        end_date: "前685"
        place: "临淄(今山东淄博)"
        highlight: "不记一箭之仇，拜管仲为相"
      - name: "北杏会盟"
        start_date: "前681"
        end_date: "前681"
        place: "北杏(今山东东阿)"
        highlight: "首次会盟，春秋霸业起点"
      - name: "葵丘会盟"
        start_date: "前651"
        end_date: "前651"
        place: "葵丘(今河南民权)"
        highlight: "霸业巅峰，天子赐胙"
    description_zh: "齐桓公用管仲为相，内修国政、外结诸侯。以'尊王攘夷'为旗号，北伐山戎救燕，南征楚国问罪，九次会盟诸侯。葵丘会盟时，周襄王派人赐胙，承认齐桓公的霸主地位。这是春秋时代第一次以会盟而非征伐确立霸权的尝试。"
    outcome: "春秋第一位霸主，九合诸侯、一匡天下"
    lesson: "以德服人胜于以力服人，以制度约束胜于以暴力压制"
  - title_zh: "管仲辅政，齐国大治"
    domain: "政治/经济"
    start_date: "前685"
    end_date: "前643"
    places: ["临淄(今山东淄博)"]
    phases:
      - name: "不记前嫌"
        start_date: "前685"
        end_date: "前685"
        place: "临淄(今山东淄博)"
        highlight: "管仲射带钩之仇，桓公不记"
      - name: "管仲治齐"
        start_date: "前685"
        end_date: "前643"
        place: "临淄(今山东淄博)"
        highlight: "通货积财，轻重九府，齐国大富"
      - name: "管仲辞世"
        start_date: "前643"
        end_date: "前643"
        place: "临淄(今山东淄博)"
        highlight: "管仲薨后，桓公用佞臣，齐国衰落"
    description_zh: "管仲相齐四十年，推行'相地而衰征'的税收改革，发展渔盐之利，设立轻重九府调控经济。齐国因此成为春秋最富庶的国家。管仲临终告诫桓公远离竖刁、易牙、开方三人，桓公不听。管仲死后，三人得宠，齐国陷入内乱。"
    outcome: "齐国成为春秋首霸，管仲被尊为'华夏第一相'"
    lesson: "知人善任是最大的智慧，亲小人是最大的隐患"

events:
  - date: "前685"
    place_name: "临淄(今山东淄博)"
    event_type: "政治事件"
    title_zh: "不记一箭之仇"
    description_zh: "齐桓公即位后，鲍叔牙推荐管仲为相。管仲曾辅佐公子纠与桓公争位，射中桓公带钩。桓公不记前嫌，拜管仲为相，言听计从。此举成就了春秋最著名的君臣佳话。"
    is_highlight: true
    highlight_type: "人才"
    highlight_note: "不记前嫌、用人不疑——霸业的起点"
  - date: "前681"
    place_name: "北杏(今山东东阿)"
    event_type: "会盟"
    title_zh: "北杏会盟"
    description_zh: "齐桓公首次会盟诸侯于北杏，宋、陈、蔡、邾四国与会。此次会盟虽规模不大，但开创了以会盟确立霸权的模式，是春秋霸业的起点。"
    is_highlight: true
    highlight_type: "会盟"
    highlight_note: "春秋霸业的起点"
  - date: "前663"
    place_name: "山戎(今河北北部)"
    event_type: "军事行动"
    title_zh: "北伐山戎救燕"
    description_zh: "山戎侵燕，齐桓公率军北伐山戎，一直追击至孤竹(今河北卢龙)。燕庄公送桓公入齐境，桓公曰'非天子，诸侯相送不出境'，遂割燕君所至之地予燕。此举传为美谈，诸侯皆服。"
    is_highlight: true
    highlight_type: "军事"
    highlight_note: "尊王攘夷的典范——伐戎救燕、割地予燕"
  - date: "前656"
    place_name: "召陵(今河南郾城)"
    event_type: "军事行动"
    title_zh: "召陵之盟伐楚"
    description_zh: "楚国连年北侵中原诸侯，齐桓公率八国联军伐楚。楚使质问'君处北海，寡人处南海，唯是风马牛不相及也'，管仲以'包茅不贡'为由对答。双方在召陵结盟，楚国暂时屈服。"
    is_highlight: true
    highlight_type: "军事"
    highlight_note: "风马牛不相及——齐楚争霸的经典外交辞令"
  - date: "前651"
    place_name: "葵丘(今河南民权)"
    event_type: "会盟"
    title_zh: "葵丘会盟——霸业巅峰"
    description_zh: "齐桓公会诸侯于葵丘，周襄王派宰孔赐胙。管仲建议桓公行跪拜礼，桓公欲不拜，管仲曰'不可'。桓公最终下拜受胙。葵丘会盟标志着齐桓公霸业达到巅峰——九合诸侯，一匡天下。"
    is_highlight: true
    highlight_type: "会盟"
    highlight_note: "春秋霸业的巅峰——九合诸侯"
  - date: "前643"
    place_name: "临淄(今山东淄博)"
    event_type: "人物终局"
    title_zh: "桓公饿死，五子争立"
    description_zh: "管仲死后，桓公不听遗言，重用竖刁、易牙、开方三佞臣。桓公病重时，五子争位，宫中大乱。竖刁、易牙封锁宫门，桓公饿死于宫中。死后六十七日无人收殓，虫出于户。一代霸主，结局凄惨。"
    is_highlight: true
    highlight_type: "终局"
    highlight_note: "一世英名毁于身后——亲小人的代价"
