person:
  name_zh: "李广"
  name_en: "Li Guang"
  birth_date: "约前166"
  death_date: "前119"
  birth_place: "成纪(今甘肃静宁)"
  era: "西汉"
  archetype: "飞将军：一生未封侯的悲剧英雄"
  dilemmas: ["战功赫赫却终生不封的宿命", "个人武勇与统帅才能的错位", "漠北之战迷路自刎的最后尊严"]
  summary_zh: "李广历文帝、景帝、武帝三朝，与匈奴大小七十余战，匈奴闻之色变号'飞将军'。然终生未能封侯，最后一次漠北之战中因迷路失期，不堪受辱自刎而死。'李广难封'成为千古遗憾。"
  summary_first_person: "吾历三朝，与匈奴战七十余阵。文帝时吾射虎没镞，景帝时吾守边郡匈奴不敢犯。然吾数奇不封侯，最后一次出塞，大将军令吾出东道，吾争为前驱不得，遂迷失道。吾不愿面对刀笔吏，遂自刎。"
  lesson: "个人英雄主义不等于统帅之才，命运有时不可抗争。"

endeavors:
  - title_zh: "戍边抗匈三十余年"
    domain: "军事"
    start_date: "前166"
    end_date: "前119"
    places: ["边塞(今甘肃宁夏)", "漠北草原"]
    phases:
      - name: "初战成名"
        start_date: "前166"
        end_date: "前150"
        place: "边塞(今甘肃宁夏)"
        highlight: "文帝时射虎没镞"
      - name: "郡守守边"
        start_date: "前150"
        end_date: "前129"
        place: "上郡/陇西/北地"
        highlight: "匈奴号'飞将军'"
      - name: "漠北之战"
        start_date: "前119"
        end_date: "前119"
        place: "漠北草原"
        highlight: "迷路自刎"
    description_zh: "李广自文帝时从军击匈奴，历经三朝七十余战。匈奴畏之号'飞将军'，闻其名不敢犯边。然数次大战皆因各种原因未能封侯。前119年漠北之战中因迷路失期，不堪受辱自刎。"
    outcome: "飞将军名震天下，但终生未封侯"
    lesson: "英雄的悲剧往往不在于战场，而在于命运"
  - title_zh: "射虎没镞的传奇"
    domain: "军事技艺"
    start_date: "约前160"
    end_date: "约前160"
    places: "边塞(今甘肃静宁)"
    phases:
      - name: "射虎"
        start_date: "约前160"
        end_date: "约前160"
        place: "边塞(今甘肃静宁)"
        highlight: "射石没镞"
    description_zh: "李广出猎见草丛中似虎，引弓射之。次日视之乃石头，箭已没入石中。广再射不入，盖精诚所至金石为开。此事传为千古佳话。"
    outcome: "射石没镞成为中国武将传奇的经典意象"
    lesson: "精诚所至金石为开，但个人勇武不能替代统帅之才"

events:
  - date: "前119"
    place_name: "漠北草原"
    event_type: "战役"
    title_zh: "漠北之战迷路自刎"
    description_zh: "漠北之战中，李广请为前驱，大将军卫青令其出东道迂回。李广争之不得，愤而率军出东道。漠北荒原中无向导，大军迷失道路，未能如期会师。卫青派长史问状，李广曰'诸校尉无罪，乃我自失道'，遂引刀自刭。"
    is_highlight: true
    highlight_type: "悲剧"
    highlight_note: "李广难封——飞将军的最后尊严"
  - date: "约前160"
    place_name: "边塞(今甘肃静宁)"
    event_type: "传奇故事"
    title_zh: "射石没镞"
    description_zh: "李广出猎见草丛中蹲伏似虎，张弓射之。箭没入石棱中。广以为虎再射之，箭不能复入。后人以'精诚所至金石为开'赞之。此事成为李广个人武勇的标志性传说。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "射石没镞——飞将军武勇的极致象征"
  - date: "前154"
    place_name: "昌邑(今山东巨野)"
    event_type: "战役"
    title_zh: "七国之乱中的骑郎将"
    description_zh: "七国之乱时，李广为骑郎将，随太尉周亚夫平叛。李广在昌邑之战中夺取敌军战旗，立下大功。然因私下接受梁王授印，功过相抵不得封侯。"
    is_highlight: false
    highlight_type: "军事"
    highlight_note: ""
  - date: "前129"
    place_name: "上谷(今河北怀来)"
    event_type: "战役"
    title_zh: "龙城之战前的出击"
    description_zh: "汉武帝首次大规模出击匈奴，派四路大军。李广率万骑出上谷，遭遇匈奴主力，全军覆没，李广独自逃回。按律当斩，以庶人身份赎为庶人。"
    is_highlight: false
    highlight_type: "军事"
    highlight_note: ""
  - date: "前121"
    place_name: "河西走廊"
    event_type: "军事行动"
    title_zh: "右北平守边"
    description_zh: "河西之战前后，李广率四千骑出右北平，被匈奴四万骑包围。李广布圆阵拒敌，亲自射杀匈奴裨将数人。激战两日援军至，匈奴解围去。此战虽勇但损失过半。"
    is_highlight: true
    highlight_type: "军事"
    highlight_note: "以四千骑抗四万骑——飞将军的个人武勇"
  - date: "前119"
    place_name: "长安(今陕西西安)"
    event_type: "人物互动"
    title_zh: "争为前驱不得"
    description_zh: "漠北之战前，李广已年过六十，仍请战出征。大将军卫青以李广数奇（命运不好）为由，令其出东道迂回，不令为前驱。李广愤懑不平，但军令难违。"
    is_highlight: true
    highlight_type: "人物互动"
    highlight_note: "将军迟暮——'数奇'二字断送了一生的封侯梦"
  - date: "前119"
    place_name: "漠北草原"
    event_type: "军事行动"
    title_zh: "最后一次出塞"
    description_zh: "漠北之战是李广最后一次出征。他率军出东道，因无向导迷失道路，未能按时到达约定会师地点。战后卫青派长史询问迷路情况，李广不愿面对刀笔吏的审讯。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "迷路失期——命运对飞将军的最后一次捉弄"
  - date: "约前130"
    place_name: "雁门(今山西代县)"
    event_type: "人物互动"
    title_zh: "李广被俘脱逃"
    description_zh: "李广出击匈奴被俘，匈奴以两马夹持而行。李广佯死，趁匈奴不备夺取战马逃回。此事展现了李广超凡的个人武勇和临危不乱的胆识。"
    is_highlight: false
    highlight_type: "人物"
    highlight_note: ""
