person:
  name_zh: "张飞"
  name_en: "Zhang Fei"
  birth_date: "约166"
  death_date: "221"
  birth_place: "涿郡涿县(今河北涿州)"
  era: "东汉末年—三国"
  archetype: "猛张飞：勇冠三军却死于部下之手的悲剧猛将"
  dilemmas: ["粗豪性格与政治智慧的缺失", "勇猛过人但不善驭下", "为兄报仇的冲动与致命后果"]
  summary_zh: "张飞与刘备、关羽桃园结义，勇冠三军。当阳桥一声吼退曹军，入川作战势如破竹。然性格暴躁嗜酒鞭打部下，最终在伐吴前夕被部下范强、张达刺杀。"
  summary_first_person: "吾与大哥二哥桃园结义，誓同生死。当阳桥上吾一声吼退曹操百万兵，长坂坡前无人敢近。然吾性急嗜酒，鞭打士卒。大哥伐吴前令吾率军会合，吾竟被小人所杀。"
  lesson: "勇猛可以赢得战斗，但性格缺陷可以致命。"

endeavors:
  - title_zh: "从涿郡到蜀汉的征战生涯"
    domain: "军事"
    start_date: "184"
    end_date: "221"
    places: ["涿郡(今河北涿州)", "当阳(今湖北当阳)", "成都(今四川成都)"]
    phases:
      - name: "桃园起兵"
        start_date: "184"
        end_date: "184"
        place: "涿郡(今河北涿州)"
        highlight: "与刘备关羽结义起兵"
      - name: "当阳断后"
        start_date: "208"
        end_date: "208"
        place: "当阳(今湖北当阳)"
        highlight: "当阳桥一声吼退曹军"
      - name: "入川建功"
        start_date: "214"
        end_date: "221"
        place: "成都(今四川成都)"
        highlight: "攻取益州"
    description_zh: "张飞一生追随刘备征战四方。当阳桥断后一声吼退曹军，是三国中最经典的个人武勇场面之一。入川作战势如破竹，为蜀汉建立立下大功。然性格暴躁，最终被部下所杀。"
    outcome: "蜀汉猛将，勇冠三军但结局悲惨"
    lesson: "性格决定命运，暴躁是最危险的致命弱点"
  - title_zh: "当阳桥断后"
    domain: "军事"
    start_date: "208"
    end_date: "208"
    places: "当阳(今湖北当阳)"
    phases:
      - name: "长坂断后"
        start_date: "208"
        end_date: "208"
        place: "当阳(今湖北当阳)"
        highlight: "当阳桥一声吼退曹军"
    description_zh: "赤壁之战前曹操追击刘备，刘备败走当阳。张飞率二十余骑断后，立于当阳桥上。曹军追至，张飞一声大喝，曹军将领夏侯杰惊得肝胆俱裂坠马而死。曹操军退。"
    outcome: "当阳桥一声吼退曹军，成为个人武勇的极致象征"
    lesson: "气势有时候比武力更有威力"

events:
  - date: "208"
    place_name: "当阳(今湖北当阳)"
    event_type: "战役"
    title_zh: "当阳桥一声吼退曹军"
    description_zh: "曹操追击刘备至当阳长坂。张飞率二十余骑断后，据水断桥。曹军追至，张飞横矛立马厉声大喝'我乃燕人张翼德也！谁敢与我决一死战！'声如巨雷。夏侯杰惊得肝胆俱裂坠马而死，曹军尽皆退去。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "当阳桥一声吼——三国最经典的个人武勇场面"
  - date: "221"
    place_name: "阆中(今四川阆中)"
    event_type: "人物结局"
    title_zh: "张飞被部下刺杀"
    description_zh: "刘备伐吴前令张飞率军会合。张飞急于出兵，鞭打士卒。部下范强、张达不堪忍受，趁张飞醉酒将其刺杀，持其首级投奔孙权。一代猛将竟死于部下之手。"
    is_highlight: true
    highlight_type: "悲剧"
    highlight_note: "猛将的致命弱点——暴躁驭下"
  - date: "211"
    place_name: "巴郡(今重庆)"
    event_type: "战役"
    title_zh: "义释严颜"
    description_zh: "张飞入川攻打巴郡，守将严颜宁死不降。张飞怒而欲斩，严颜曰'卿等无状，侵夺我州，我州但有断头将军，无有降将军也'。张飞壮其义，释放严颜，严颜遂降。"
    is_highlight: true
    highlight_type: "人物互动"
    highlight_note: "义释严颜——猛张飞也有敬重义士的一面"
  - date: "214"
    place_name: "成都(今四川成都)"
    event_type: "战役"
    title_zh: "入川之战"
    description_zh: "张飞与诸葛亮、赵云分兵入川。张飞一路势如破竹，攻城拔寨。在巴郡义释严颜后，沿途守将闻张飞之名纷纷投降。张飞最先到达成都，与刘备会师。"
    is_highlight: false
    highlight_type: "军事"
    highlight_note: ""
  - date: "219"
    place_name: "汉中(今陕西汉中)"
    event_type: "战役"
    title_zh: "大破张郃"
    description_zh: "汉中之战中，张飞在宕渠大破曹将张郃。张郃弃马攀山而逃，仅余十余人。此战是张飞军事生涯中的重要胜利，展现了他不仅是猛将，也是有谋略的将领。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "猛张飞也有智谋——宕渠之战"
  - date: "184"
    place_name: "涿郡(今河北涿州)"
    event_type: "人物关系"
    title_zh: "桃园结义"
    description_zh: "张飞与刘备、关羽在桃园中结义，誓愿同心协力。张飞散尽家财资助刘备起兵。此后三人一生追随，成为中国忠义精神的象征。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "桃园结义——三兄弟情义的起点"
  - date: "221"
    place_name: "阆中(今四川阆中)"
    event_type: "人物性格"
    title_zh: "鞭打士卒的致命弱点"
    description_zh: "张飞性格暴躁，嗜酒鞭打部下。刘备曾劝诫'卿刑杀过差，又鞭挞健儿，而令在左右，此取祸之道也'。张飞不改，终被部下范强、张达刺杀。"
    is_highlight: true
    highlight_type: "教训"
    highlight_note: "暴躁驭下——张飞性格缺陷的致命后果"
