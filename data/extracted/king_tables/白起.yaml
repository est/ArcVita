        end_date: "-279"
        place: "鄢(今湖北宜城)"
        highlight: "率军深入楚境"
      - name: "破局"
        start_date: "-279"
        end_date: "-279"
        place: "鄢(今湖北宜城)"
        highlight: "水灌鄢城，歼楚军主力"
      - name: "高潮"
        start_date: "-278"
        end_date: "-278"
        place: "郢(今湖北荆州)"
        highlight: "攻破郢都，烧夷陵"
      - name: "收束"
        start_date: "-278"
        end_date: "-278"
        place: "郢(今湖北荆州)"
        highlight: "楚国东迁，一蹶不振"
    description_zh: "白起率军深入楚国腹地，采取长驱直入、速战速决之策。先在鄢城(今湖北宜城)筑堤蓄水、水灌城中，淹死楚军十余万。次年直捣楚国都城郢(今湖北荆州)，烧毁楚先王陵墓夷陵。楚顷襄王仓皇东迁至陈(今河南淮阳)。屈原闻郢都陷落，投汨罗江而死。"
    outcome: "楚国丧失半壁江山，从战国最强之一沦为二流国家"
    lesson: "战争中最致命的打击不是击败军队，而是摧毁国家的意志"

  - title_zh: "长平之战，坑杀赵卒四十万"
