        place: "邯郸(今河北邯郸)"
        highlight: "秦军围攻邯郸失利"
      - name: "高潮"
        start_date: "-257"
        end_date: "-257"
        place: "咸阳(今陕西咸阳)"
        highlight: "秦王赐剑，令白起自裁"
      - name: "收束"
        start_date: "-257"
        end_date: "-257"
        place: "杜邮(今陕西咸阳东)"
        highlight: "白起自刎"
    description_zh: "长平之战后，白起欲乘胜灭赵，但秦昭襄王受范雎谗言和韩赵游说而退兵。次年再攻邯郸时，白起多次称病推辞，认为战机已失。邯郸之战果然失利，秦王迁怒于白起，免其爵位降为士卒。白起出咸阳至杜邮，秦王使使者赐剑令其自裁。白起叹曰'我固当死，长平之战赵卒降者数十万人，我诈而尽坑之，是足以死'，遂自刎。"
    outcome: "秦国失去最优秀的军事统帅"
    lesson: "功高震主是千古不变的危机"
