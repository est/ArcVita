person:
  name_zh: "白起"
  birth_date: "约-320"
  death_date: "-257"
  birth_place: "郿(今陕西眉县)"
  era: "战国中晚期"
  archetype: "战无不胜的杀神名将"
  summary_zh: "战国四大名将之首，一生七十余战无一败绩。伊阙之战斩韩魏联军二十四万，鄢郢之战破楚国都城，长平之战坑杀赵卒四十余万——战国时代死于白起之手的将士超过百万。他是纯粹的军事天才，战略眼光和战术执行力均为战国第一。然因功高震主、性格刚直，拒绝参加邯郸之战，被秦昭襄王赐死于杜邮。临终叹'我固当死'，一代杀神终归尘土。"
  summary_first_person: "吾自郿地布衣从军，以首级计功，积功至大良造。伊阙一战斩韩魏二十四万，鄢郢之战水灌楚都，长平之战坑赵卒四十万。吾一生七十余战，未尝一败。然邯郸之役吾力谏不可，秦王不听而败。秦王怒，赐吾死。吾叹曰'长平之战赵卒降者数十万，吾诈而尽坑之，是足以死'。"
  lesson: "战场上的绝对胜利无法保护你在政治上的生存。"

