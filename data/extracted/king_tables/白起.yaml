      - name: "收束"
        start_date: "-293"
        end_date: "-293"
        place: "伊阙(今河南洛阳龙门)"
        highlight: "韩魏东出之路被封死"
    description_zh: "前293年，韩魏联军二十四万据守伊阙(今河南洛阳龙门)阻秦东进。白起采用避实击虚之策，先以少量兵力牵制韩国军队，集中主力猛攻实力较弱的魏军。魏军溃败后韩国军队失去依托，全线崩溃。此战斩首二十四万，是战国时期规模最大的歼灭战之一。"
    outcome: "韩魏联军精锐尽丧，秦国东出大门洞开"
    lesson: "集中优势兵力各个击破是永远的制胜法则"

  - title_zh: "鄢郢之战，破楚国都"
    domain: "军事"
    start_date: "-279"
    end_date: "-278"
