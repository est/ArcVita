        place: "长平(今山西高平)"
        highlight: "包围赵军四十六日，坑杀四十万"
      - name: "收束"
        start_date: "-260"
        end_date: "-260"
        place: "长平(今山西高平)"
        highlight: "赵国精锐尽丧"
    description_zh: "秦国秘密换白起为主将。白起佯败诱赵括出击，然后以两支奇兵迂回包围——一支断赵军粮道，一支阻断赵军与邯郸的联系。赵军被围四十六日，粮尽援绝，赵括突围被射杀，四十万赵军投降。白起恐降卒叛乱，将其全部坑杀，仅放归二百四十名年幼者回赵国散布恐惧。"
    outcome: "赵国四十万精锐尽丧，再无力单独抗秦"
    lesson: "战争的残酷在于，有时胜利者的负担比失败者更重"

