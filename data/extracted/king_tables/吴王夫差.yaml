person:
  name_zh: "吴王夫差"
  birth_date: "约-510"
  death_date: "前473"
  birth_place: "姑苏(今江苏苏州)"
  era: "春秋末期"
  archetype: "胜而骄、骄而亡的悲剧之君"
  summary_zh: "吴王夫差败越后不灭越国，北上争霸黄池，却被越王勾践趁虚偷袭，最终亡国自刎，是中国历史上'胜而骄、骄而亡'的典型。"
  summary_first_person: "吾父阖闾死于越人之手，吾日夜不忘复仇。三年教训，终败越于夫椒。勾践请为臣，吾许之。伍子胥谏曰'越王勾践为人能辛苦，今不灭，后必悔之'。吾不听。又北上与晋争霸于黄池，后方空虚。勾践趁虚入吴，焚吾姑苏台。吾归国求和不得，又三年，越围姑苏。吾走阳山，无面目见子胥，蒙面而死。吾之败，非败于勾践，乃败于自己的骄傲。"
  lesson: "骄傲是胜利的副产品，也是失败的催化剂。"

endeavors:
  - title_zh: "夫椒败越，放虎归山"
    domain: "军事/政治"
    start_date: "前494"
    end_date: "前494"
    places: ["夫椒(今江苏太湖)", "姑苏(今江苏苏州)"]
    phases:
      - name: "复仇练兵"
        start_date: "前496"
        end_date: "前494"
        place: "姑苏(今江苏苏州)"
        highlight: "为父报仇，三年教训"
      - name: "夫椒之战"
        start_date: "前494"
        end_date: "前494"
        place: "夫椒(今江苏太湖)"
        highlight: "大败越军，勾践请降"
      - name: "放勾践归越"
        start_date: "前494"
        end_date: "前494"
        place: "姑苏(今江苏苏州)"
        highlight: "不听伍子胥谏，放勾践归国"
    description_zh: "夫差为报父仇，三年教训士卒。前494年，在夫椒大败越军，越王勾践率五千残兵困于会稽山。勾践遣文种请降，愿为吴臣。伍子胥谏曰'勾践为人能辛苦，今不灭，后必悔之'。夫差不听，许越请降，放勾践归国。此为吴国灭亡的起点。"
    outcome: "夫椒大败越国，却放虎归山，埋下亡国之祸"
    lesson: "对敌人的仁慈就是对自己的残忍"
  - title_zh: "北上争霸，黄池会盟"
    domain: "军事/外交"
    start_date: "前489"
    end_date: "前482"
    places: ["姑苏(今江苏苏州)", "黄池(今河南封丘)"]
    phases:
      - name: "北上伐齐"
        start_date: "前489"
        end_date: "前484"
        place: "齐(今山东淄博)"
        highlight: "艾陵之战大败齐国"
      - name: "黄池会盟"
        start_date: "前482"
        end_date: "前482"
        place: "黄池(今河南封丘)"
        highlight: "与晋争霸，夺得霸主之位"
      - name: "后方空虚"
        start_date: "前482"
        end_date: "前482"
        place: "姑苏(今江苏苏州)"
        highlight: "勾践趁虚偷袭吴国"
    description_zh: "夫差北上争霸，伐齐获胜后又率精锐北上至黄池与晋国会盟。正当夫差在黄池与晋争做霸主时，勾践趁吴国空虚偷袭姑苏，俘获太子友。夫差在黄池闻讯，为防消息泄露，帐中杀七人灭口。虽勉强夺得霸主之位，但吴国已是强弩之末。"
    outcome: "黄池夺霸，但后方被越偷袭，吴国由盛转衰"
    lesson: "贪图虚名而忽视根本，是最大的战略失误"

events:
  - date: "前496"
    place_name: "槜李(今浙江嘉兴)"
    event_type: "战役"
    title_zh: "槜李之战，父仇之始"
    description_zh: "越王允常薨，阖闾伐越。越王勾践以敢死队冲阵、罪人自刎搅乱吴军。阖闾被伤脚趾，死于归途。夫差即位，誓报父仇。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "父仇之始——夫差一生执念的起点"
  - date: "前494"
    place_name: "夫椒(今江苏太湖)"
    event_type: "战役"
    title_zh: "夫椒之战大败越国"
    description_zh: "夫差率军在夫椒大败越军。勾践仅率五千残兵退守会稽山，遣文种以美女宝器贿吴太宰伯嚭求和。夫差不听伍子胥'越王勾践为人能辛苦'的谏言，许越为臣，放勾践归国。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "夫椒之战——放虎归山的致命错误"
  - date: "约-489"
    place_name: "齐(今山东淄博)"
    event_type: "战役"
    title_zh: "艾陵之战败齐"
    description_zh: "夫差率军北伐齐国，在艾陵大败齐军。此战展示了吴国强大的军事实力，也为夫差北上争霸奠定了基础。"
    is_highlight: false
    highlight_type: "军事"
    highlight_note: ""
  - date: "前482"
    place_name: "黄池(今河南封丘)"
    event_type: "会盟"
    title_zh: "黄池会盟——霸主之位"
    description_zh: "夫差率精锐北上至黄池，与晋定公会盟。夫差与晋争做霸主，以兵力威慑。晋人恐惧，让夫差先歃血。夫差夺得霸主之位。但此时勾践已趁虚偷袭姑苏，俘获太子友。"
    is_highlight: true
    highlight_type: "会盟"
    highlight_note: "黄池会盟——虚名与实祸的交换"
  - date: "前482"
    place_name: "姑苏(今江苏苏州)"
    event_type: "军事事件"
    title_zh: "勾践偷袭姑苏"
    description_zh: "夫差北上争霸时，勾践趁吴国空虚率军偷袭姑苏，俘获太子友，焚毁姑苏台。夫差闻讯后帐中杀七人灭口，虽勉强保住霸主之位，但吴国精锐尽失，元气大伤。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "螳螂捕蝉，黄雀在后——勾践十年卧薪尝胆的回报"
  - date: "前473"
    place_name: "姑苏(今江苏苏州)"
    event_type: "战役"
    title_zh: "越围姑苏，吴国灭亡"
    description_zh: "勾践卧薪尝胆十年，率军伐吴。吴军连战连败，姑苏被围三年。夫差困守城中，粮尽援绝。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "三年围城——从霸主到亡国"
  - date: "前473"
    place_name: "阳山(今江苏苏州)"
    event_type: "人物终局"
    title_zh: "夫差自刎——无面目见子胥"
    description_zh: "姑苏城破，夫差逃至阳山。遣使求和不成，曰'吾无面目见子胥也'，蒙面而死。死前以三幅布蒙面，曰'吾悔不用子胥之言，自令陷此'。吴国自阖闾创业至此，仅传两代即亡。"
    is_highlight: true
    highlight_type: "终局"
    highlight_note: "无面目见子胥——骄傲者的最终代价"
