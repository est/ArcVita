person:
  name_zh: "彭越"
  name_en: "Peng Yue"
  birth_date: "约前200(约前240)"
  death_date: "前196"
  birth_place: "昌邑(今山东巨野)"
  era: "秦末楚汉"
  archetype: "游击鼻祖：以游击战搅动楚汉棋局的枭雄"
  dilemmas: ["盗匪出身的身份困境", "在楚汉之间的投机与站队", "功臣被诛的命运宿命"]
  summary_zh: "彭越以巨野泽中渔盗起兵，首创游击战术，长期在楚军后方袭扰粮道。楚汉争霸中多次断项羽粮道，垓下之围有大功。汉初封梁王，因被告谋反遭刘邦夷灭三族。"
  summary_first_person: "吾本巨野泽中渔盗，聚众千余人于泽中。楚汉相争时吾以游击袭扰楚军后方，断其粮道，使项王首尾不能相顾。垓下之围吾亦有功，封梁王。然功高震主，终被夷灭三族。"
  lesson: "游击战可以改变战争格局，但功高震主者终难善终。"

endeavors:
  - title_zh: "以游击战搅动楚汉格局"
    domain: "军事"
    start_date: "前207"
    end_date: "前202"
    places: ["巨野泽(今山东巨野)", "梁地(今河南商丘)"]
    phases:
      - name: "泽中聚众"
        start_date: "前207"
        end_date: "前206"
        place: "巨野泽(今山东巨野)"
        highlight: "渔盗聚众千余人"
      - name: "游击楚军"
        start_date: "前205"
        end_date: "前204"
        place: "梁地(今河南商丘)"
        highlight: "断项羽粮道"
      - name: "垓下会战"
        start_date: "前202"
        end_date: "前202"
        place: "垓下(今安徽灵璧)"
        highlight: "围杀项羽有功"
    description_zh: "彭越在巨野泽聚众起兵，楚汉争霸中以游击战术长期袭扰楚军后方粮道。项羽多次东征西讨，彭越在其后方反复出现，使楚军疲于奔命。垓下之围中率军参战，因功封梁王。"
    outcome: "游击战改变了楚汉战争的走向，但功臣终被诛灭"
    lesson: "非对称作战可以以弱胜强，但战后的政治博弈更为残酷"
  - title_zh: "梁王之祸"
    domain: "政治"
    start_date: "前196"
    end_date: "前196"
    places: "梁(今河南商丘)"
    phases:
      - name: "功高震主"
        start_date: "前196"
        end_date: "前196"
        place: "梁(今河南商丘)"
        highlight: "被刘邦猜忌"
      - name: "夷灭三族"
        start_date: "前196"
        end_date: "前196"
        place: "洛阳(今河南洛阳)"
        highlight: "被醢刑处死"
    description_zh: "刘邦征英布时召彭越，彭越称病不从。刘邦怒，捕彭越囚于洛阳。有人为彭越求情，刘邦赦之流放蜀地。途中遇吕后，吕后劝刘邦斩草除根，遂杀彭越夷三族。"
    outcome: "梁王彭越被醢刑处死，肉分赐诸侯"
    lesson: "功臣的命运不取决于功绩，而取决于帝王的信任"

events:
  - date: "前207"
    place_name: "巨野泽(今山东巨野)"
    event_type: "起义"
    title_zh: "泽中聚众起兵"
    description_zh: "彭越在巨野泽中以渔猎为生，聚众百余人。陈胜起义后，泽中少年欲推彭越为首领。彭越曰'臣愿为长'，约日后期，迟到者斩。次日十余人迟到，彭越斩最后一人以立军威。"
    is_highlight: true
    highlight_type: "人物"
    highlight_note: "以严明军纪从盗匪中崛起"
  - date: "前205"
    place_name: "梁地(今河南商丘)"
    event_type: "军事行动"
    title_zh: "游击断楚粮道"
    description_zh: "楚汉相持荥阳时，彭越在楚军后方梁地反复袭扰，断绝楚军粮道。项羽被迫回师东征彭越，前线压力骤减。彭越的游击战成为楚汉争霸中的关键变量。"
    is_highlight: true
    highlight_type: "军事"
    highlight_note: "游击战鼻祖——以非对称作战改变战争走向"
  - date: "前202"
    place_name: "垓下(今安徽灵璧)"
    event_type: "战役"
    title_zh: "垓下会战"
    description_zh: "韩信、彭越、英布等诸侯联军围项羽于垓下。韩信十面埋伏，四面楚歌，项羽突围至乌江自刎。彭越因功封梁王，都定陶。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "楚汉争霸的终极决战"
  - date: "前196"
    place_name: "洛阳(今河南洛阳)"
    event_type: "政治清洗"
    title_zh: "彭越被醢刑"
    description_zh: "刘邦征英布时召彭越，彭越称病不往。刘邦怒而捕之，废为庶人徙蜀。吕后劝曰'此壮士也，不如诛之'。遂杀彭越夷三族，将其肉剁为醢酱分赐诸侯。"
    is_highlight: true
    highlight_type: "悲剧"
    highlight_note: "功臣被醢——兔死狗烹的极致"
  - date: "前205"
    place_name: "彭城(今江苏徐州)"
    event_type: "军事行动"
    title_zh: "趁虚入彭城"
    description_zh: "项羽攻齐时，彭越趁虚攻占梁地十余城。项羽回师击之，彭越退走。此为彭越游击战的典型战术——敌进我退，敌疲我打，后世游击战的雏形。"
    is_highlight: false
    highlight_type: "军事"
    highlight_note: ""
  - date: "前204"
    place_name: "梁地(今河南商丘)"
    event_type: "军事行动"
    title_zh: "与刘邦荥阳会师"
    description_zh: "彭越率军三万人北上，与刘邦在荥阳会师。刘邦由此兵力大增，楚汉攻守之势逆转。彭越的游击战为刘邦赢得了战略主动权。"
    is_highlight: false
    highlight_type: "军事"
    highlight_note: ""
  - date: "前196"
    place_name: "洛阳(今河南洛阳)"
    event_type: "政治清洗"
    title_zh: "吕后劝诛彭越"
    description_zh: "刘邦赦彭越流放蜀地后，吕后在途中遇见彭越。彭越哭诉求归故乡昌邑，吕后许诺。至洛阳后吕后劝刘邦曰'彭越壮士也，今释之必为后患'。刘邦遂杀彭越。"
    is_highlight: true
    highlight_type: "人物互动"
    highlight_note: "吕后的冷酷与刘邦的猜忌——功臣命运的决定性时刻"
