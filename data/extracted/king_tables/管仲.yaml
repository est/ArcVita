person:
  name_zh: "管仲"
  birth_date: "约-723"
  death_date: "前645"
  birth_place: "颍上(今安徽颍上)"
  era: "春秋"
  archetype: "华夏第一相的治国宗师"
  summary_zh: "管仲辅佐齐桓公四十年，推行'相地而衰征'改革，通货积财使齐国成为春秋首富，以'尊王攘夷'辅桓公称霸，被后世尊为'华夏第一相'。"
  summary_first_person: "吾少时贫困，鲍叔牙知吾才。公子纠争位败死，吾为阶下囚。鲍叔牙力荐吾为齐相，桓公不记一箭之仇用吾。吾相齐四十年，通货积财、轻重九府、相地而衰征，齐国大富。九合诸侯，一匡天下，非吾之力，乃用众人之力也。吾临终告桓公远竖刁、易牙、开方，桓公不听，果乱。吾生平最知者，知己如鲍叔牙也。"
  lesson: "治国先富民，富民先通商；知人善任，是治国的最高智慧。"

endeavors:
  - title_zh: "相地而衰征——齐国经济改革"
    domain: "经济/政治"
    start_date: "前685"
    end_date: "前645"
    places: ["临淄(今山东淄博)"]
    phases:
      - name: "通货积财"
        start_date: "前685"
        end_date: "前680"
        place: "临淄(今山东淄博)"
        highlight: "发展渔盐之利，设轻重九府"
      - name: "相地而衰征"
        start_date: "前680"
        end_date: "前670"
        place: "临淄(今山东淄博)"
        highlight: "按土地肥瘠征税，公平赋役"
      - name: "士农工商四民分业"
        start_date: "前670"
        end_date: "前645"
        place: "临淄(今山东淄博)"
        highlight: "职业世袭，专业化分工"
    description_zh: "管仲推行经济改革，利用齐国靠海优势发展渔盐贸易，设立轻重九府调控物价。又推行'相地而衰征'，按土地肥瘠分等征税。还将士、农、工、商四民分业定居，实行专业化分工。这些改革使齐国成为春秋最富庶的国家，为桓公称霸奠定了经济基础。"
    outcome: "齐国成为春秋首富，经济实力远超列国"
    lesson: "经济基础决定上层建筑，富民是强国的前提"
  - title_zh: "辅桓公称霸——尊王攘夷"
    domain: "外交/军事"
    start_date: "前685"
    end_date: "前645"
    places: ["临淄(今山东淄博)", "北杏(今山东东阿)", "葵丘(今河南民权)", "召陵(今河南郾城)"]
    phases:
      - name: "制定霸业方略"
        start_date: "前685"
        end_date: "前681"
        place: "临淄(今山东淄博)"
        highlight: "提出'尊王攘夷'战略"
      - name: "九合诸侯"
        start_date: "前681"
        end_date: "前651"
        place: "中原各地"
        highlight: "辅佐桓公九次会盟诸侯"
      - name: "临终遗言"
        start_date: "前645"
        end_date: "前645"
        place: "临淄(今山东淄博)"
        highlight: "告诫桓公远离三佞臣"
    description_zh: "管仲为齐桓公制定了'尊王攘夷'的战略方针，以维护周天子权威为旗号，北伐山戎、南征楚国，九次会盟诸侯。管仲在外交上善于以小博大，以义服人。临终时告诫桓公远离竖刁、易牙、开方，桓公不听，后果如管仲所料。"
    outcome: "辅佐桓公成就春秋首霸，管仲被尊为'华夏第一相'"
    lesson: "最高的智慧是预知未来，最大的遗憾是忠言不被采纳"

events:
  - date: "约-723"
    place_name: "颍上(今安徽颍上)"
    event_type: "人物经历"
    title_zh: "管鲍之交"
    description_zh: "管仲少时贫困，与鲍叔牙合伙经商，分利时常多取。鲍叔牙知其贫且有老母，不以为贪。管仲三次为官三次被逐，鲍叔牙知其时运未至。管仲叹曰'生我者父母，知我者鲍子也'。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "管鲍之交——千古友谊的典范"
  - date: "前686"
    place_name: "临淄(今山东淄博)"
    event_type: "政治事件"
    title_zh: "管仲射带钩"
    description_zh: "公子纠与公子小白(齐桓公)争位，管仲辅佐公子纠。管仲一箭射中小白带钩，小白佯死。后小白先入临淄即位为齐桓公，公子纠被杀。管仲沦为阶下囚。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "一箭之仇——从死敌到最亲密的君臣"
  - date: "前685"
    place_name: "临淄(今山东淄博)"
    event_type: "政治任用"
    title_zh: "鲍叔牙力荐管仲"
    description_zh: "鲍叔牙力荐管仲为相，曰'君将治齐，高傒与叔牙足也。君且欲霸王，非管夷吾不可'。桓公从之，不记一箭之仇，拜管仲为相。此举成就了春秋最伟大的君臣组合。"
    is_highlight: true
    highlight_type: "人才"
    highlight_note: "用人不疑——齐国霸业的起点"
  - date: "约-680"
    place_name: "临淄(今山东淄博)"
    event_type: "经济改革"
    title_zh: "相地而衰征"
    description_zh: "管仲推行'相地而衰征'，按土地肥瘠、产量高低分等征税。好田少征，坏田多征，使农民负担公平。同时发展渔盐贸易，设轻重九府调控经济。齐国由此大富。"
    is_highlight: true
    highlight_type: "改革"
    highlight_note: "中国最早的税制改革之一"
  - date: "前656"
    place_name: "召陵(今河南郾城)"
    event_type: "外交事件"
    title_zh: "管仲对楚使"
    description_zh: "齐桓公率八国联军伐楚，楚使质问'君处北海，寡人处南海，唯是风马牛不相及也。何故涉吾地？'管仲从容对答'尔贡包茅不入，王祭不共，无以缩酒，寡人是征'。以小罪名行大征伐之实，外交辞令堪称经典。"
    is_highlight: true
    highlight_type: "外交"
    highlight_note: "风马牛不相及——中国外交辞令的经典"
  - date: "前645"
    place_name: "临淄(今山东淄博)"
    event_type: "人物终局"
    title_zh: "管仲辞世，遗言成谶"
    description_zh: "管仲临终，桓公问谁可继相位。管仲荐隰朋，又告诫桓公远离竖刁、易牙、开方三人。桓公不听。管仲死后，三人果然祸乱齐国，桓公饿死宫中。管仲之先见之明，令人叹服。"
    is_highlight: true
    highlight_type: "终局"
    highlight_note: "生前辅霸四十年，身后遗言成谶——华夏第一相的谢幕"
