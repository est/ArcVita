        end_date: "-341"
        place: "临淄(今山东淄博)"
        highlight: "齐国成为东方最强国"
    description_zh: "前342年，魏国伐韩，韩国求救于齐。齐威王以田忌为将、孙膑为军师。孙膑用减灶之计诱庞涓轻骑追击，于马陵道万弩齐发。庞涓自刎，魏太子申被俘。此战彻底打垮了魏国的军事力量，齐国一跃成为东方最强国家。"
    outcome: "魏国霸业终结，齐国成为东方霸主"
    lesson: "选择正确的时机和对手，一战定乾坤"

