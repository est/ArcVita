person:
  name_zh: "齐威王"
  birth_date: "约-378"
  death_date: "-320"
  birth_place: "临淄(今山东淄博)"
  era: "战国中期"
  archetype: "纳谏如流的中兴明主"
  summary_zh: "田因齐，齐国历史上最有作为的君主之一。即位初期沉迷酒色，邹忌以'讽谏'说之——以自身比美之事喻治国之理。齐威王幡然醒悟，下令'群臣吏民能面刺寡人之过者受上赏'。此后重用田忌、孙膑在马陵之战大破魏国，使齐国一跃成为与秦国并立的东方大国。'邹忌讽齐王纳谏'的故事传诵千古，成为纳谏如流的典范。"
  summary_first_person: "吾初即位，好为长夜之饮，委政卿大夫。邹忌以鼓琴说治国之道，又以比美之事讽谏。吾闻之，下令群臣面刺吾过者受上赏。自此朝堂清明，人才济济。吾用田忌、孙膑大败魏国于马陵，齐国强盛，与秦并立于天下。"
  lesson: "敢于面对批评的君主才能成就真正的霸业。"

