    description_zh: "齐威王对地方官员进行严格考核。即墨大夫辖区百姓富足，虽无人为其说好话反而得到封赏。阿大夫辖区百姓穷困，花钱行贿朝中为其美言，结果被烹杀。此举震动朝野，齐国吏治为之一新。"
    outcome: "齐国吏治清明，国力持续增长"
    lesson: "考核官员看实绩而非口碑，是最有效的吏治手段"
