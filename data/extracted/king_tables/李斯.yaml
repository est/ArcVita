person:
  name_zh: "李斯"
  name_en: "Li Si"
  birth_date: "约前284"
  death_date: "前208"
  birth_place: "楚国上蔡(今河南上蔡)"
  era: "战国末期—秦朝"
  archetype: "法家信徒：制度缔造者与权力殉葬者"
  dilemmas: ["寒门士子的出人头地之志", "法家理想与政治现实的冲突", "与赵高合作的致命抉择"]
  summary_zh: "楚国小吏入秦师从荀子，以法家之术佐秦始皇统一天下。书同文、废封建、行郡县，帝国制度的设计者。然始皇死后屈从赵高矫诏，终被腰斩灭族，以'仓鼠论'始，以'厕鼠论'终。"
  summary_first_person: "吾本上蔡布衣，见仓鼠与厕鼠之别，遂辞楚入秦。始皇帝用吾之策，废封建行郡县，书同文车同轨。然始皇崩后，赵高以利害相胁，吾从之，遂身死族灭。吾之一生，始于仓鼠之志，终于厕鼠之祸。"
  lesson: "才能可以建功立业，但品格才能决定最终结局。"

endeavors:
  - title_zh: "辅佐秦始皇统一天下"
    domain: "政治"
    start_date: "前247"
    end_date: "前221"
    places: ["咸阳(今陕西咸阳)"]
    phases:
      - name: "入秦从学"
        start_date: "前247"
        end_date: "前237"
        place: "咸阳(今陕西咸阳)"
        highlight: "师从荀子学帝王之术"
      - name: "谏逐客书"
        start_date: "前237"
        end_date: "前237"
        place: "咸阳(今陕西咸阳)"
        highlight: "上《谏逐客书》留秦"
      - name: "佐帝成业"
        start_date: "前237"
        end_date: "前221"
        place: "咸阳(今陕西咸阳)"
        highlight: "献灭六国之策"
    description_zh: "李斯入秦后为吕不韦舍人，渐得秦王嬴政信任。前237年秦下逐客令，李斯上《谏逐客书》力陈不可，秦王遂废逐客令。此后辅佐嬴政灭六国，功居首列。"
    outcome: "秦统一天下，李斯成为帝国首席文官"
    lesson: "抓住时代机遇，以才华换取舞台"
  - title_zh: "设计帝国制度"
    domain: "政治制度"
    start_date: "前221"
    end_date: "前208"
    places: ["咸阳(今陕西咸阳)"]
    phases:
      - name: "废封建行郡县"
        start_date: "前221"
        end_date: "前221"
        place: "咸阳(今陕西咸阳)"
        highlight: "力主废分封设郡县"
      - name: "书同文"
        start_date: "前221"
        end_date: "前215"
        place: "咸阳(今陕西咸阳)"
        highlight: "统一文字为小篆"
      - name: "焚书"
        start_date: "前213"
        end_date: "前213"
        place: "咸阳(今陕西咸阳)"
        highlight: "建议焚书钳制思想"
    description_zh: "统一后李斯力主废分封行郡县，统一文字为小篆，统一度量衡。然亦建议焚书，钳制思想。始皇崩后，李斯在赵高威逼下参与矫诏，最终身陷囹圄。"
    outcome: "帝国制度延续两千年，但个人身死族灭"
    lesson: "制度设计者未必能善终，权力场中品格最为重要"

events:
  - date: "前237"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "政治奏议"
    title_zh: "谏逐客书"
    description_zh: "韩国派水工郑国入秦修渠以疲秦，事泄后秦国宗室建议逐走所有客卿。李斯上《谏逐客书》，历数客卿功绩，论证逐客之害。秦王嬴政采纳，废逐客令，李斯由此受到重用。"
    is_highlight: true
    highlight_type: "名篇"
    highlight_note: "千古名篇《谏逐客书》——一篇奏议改变帝国人才格局"
  - date: "前221"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "政治决策"
    title_zh: "力主废封建行郡县"
    description_zh: "天下一统后，丞相王绾建议在燕齐楚等远方设王子为诸侯。李斯力排众议，认为分封必致割据混战，主张全面推行郡县制。始皇帝从之，确立了此后两千年中国的基本行政制度。"
    is_highlight: true
    highlight_type: "制度"
    highlight_note: "郡县制vs分封制的历史性抉择"
  - date: "前213"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "文化政策"
    title_zh: "建议焚书"
    description_zh: "淳于越谏言复分封，李斯借机上奏焚书，建议焚毁民间《诗》《书》百家语，以古非今者族。始皇帝从之，此为中国历史上首次大规模文化钳制事件。"
    is_highlight: true
    highlight_type: "政策"
    highlight_note: "焚书之议——文化专制的起点"
  - date: "前208"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "宫廷政变"
    title_zh: "赵高矫诏李斯附从"
    description_zh: "始皇帝驾崩沙丘后，赵高以'立胡亥则李斯长保富贵，立扶苏则李斯失势'相胁。李斯惧祸从之，与赵高合谋矫诏赐死扶苏、蒙恬，立胡亥为二世。此举成为李斯一生最大的污点。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "帝国首席文官参与政变——才华让位于恐惧"
  - date: "前208"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "刑罚"
    title_zh: "李斯腰斩咸阳"
    description_zh: "赵高借二世之手除李斯，以谋反罪名收捕。李斯五刑具身，腰斩咸阳市。临刑谓其子曰：'吾欲与若复牵黄犬俱出上蔡东门逐狡兔，岂可得乎！'遂父子相泣。"
    is_highlight: true
    highlight_type: "悲剧"
    highlight_note: "仓鼠之志始，黄犬之叹终——一代名相的悲惨结局"
  - date: "前247"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "人物转折"
    title_zh: "入秦师荀子"
    description_zh: "李斯为楚国上蔡小吏，见仓中硕鼠与厕中瘦鼠之别，感悟'人之贤不肖譬如鼠矣，在所自处耳'。遂辞官入齐师从荀子学帝王之术，学成后入秦求功名。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "仓鼠论——李斯人生哲学的起点"
  - date: "前233"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "政治斗争"
    title_zh: "韩非之死"
    description_zh: "韩非入秦，秦王嬴政赏识其才。李斯恐韩非取代自己地位，进谗言毒杀韩非。韩非虽著《说难》《孤愤》，终未能自保，死于同门之手。"
    is_highlight: false
    highlight_type: "人性"
    highlight_note: ""
  - date: "前210"
    place_name: "沙丘(今河北广宗)"
    event_type: "宫廷政变"
    title_zh: "沙丘矫诏"
    description_zh: "始皇帝遗诏传位扶苏，李斯在赵高威逼利诱下同意矫诏。赵高曰'君侯自料能孰与蒙恬？功孰与蒙恬？远孰与蒙恬？'李斯自知不如，遂从。天下由此大乱。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "一念之差改变天下命运"
