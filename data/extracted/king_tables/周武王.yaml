person:
  name_zh: "周武王"
  birth_date: "约-1080"
  death_date: "约-1043"
  birth_place: "岐(今陕西岐山)"
  era: "西周初"
  archetype: "吊民伐罪的革命之君"
  summary_zh: "周武王承父祖之志，用姜子牙为帅，牧野之战以少胜多灭商建周，分封天下奠定封建制度，开创西周三百年基业。"
  summary_first_person: "吾父文王囚于羑里，吾知殷商气数已尽。文王既崩，吾继其遗志，东观兵于盟津，八百诸侯不期而会。后二年，纣杀比干、囚箕子，吾以为时不可失，遂率戎车三百乘、虎贲三千、甲士四万五千东征。牧野之战，殷师倒戈，纣自焚于鹿台。吾即天子位，封功臣于天下，建周家八百年基业。"
  lesson: "时机未到则蓄势待发，时机一到则雷霆万钧——等待与决断同样重要。"

endeavors:
  - title_zh: "灭商建周"
    domain: "军事/政治"
    start_date: "约-1050"
    end_date: "约-1046"
    places: ["镐京(今陕西西安)", "盟津(今河南孟津)", "牧野(今河南新乡)"]
    phases:
      - name: "蓄势待发"
        start_date: "约-1050"
        end_date: "约-1046"
        place: "镐京(今陕西西安)"
        highlight: "文王奠基，武王继志"
      - name: "盟津观兵"
        start_date: "约-1048"
        end_date: "约-1048"
        place: "盟津(今河南孟津)"
        highlight: "八百诸侯不期而会"
      - name: "牧野决战"
        start_date: "约-1046"
        end_date: "约-1046"
        place: "牧野(今河南新乡)"
        highlight: "一战灭商，纣王自焚"
    description_zh: "周武王承文王遗志，用姜子牙为军师，于盟津观兵试探诸侯之心。两年后，纣王暴虐日甚，武王率联军东征。牧野之战，殷师前徒倒戈，纣王自焚于鹿台，商朝六百年基业一朝倾覆。武王建立周朝，定都镐京，分封功臣宗室于天下。"
    outcome: "灭商建周，分封天下，开创西周封建制度"
    lesson: "蓄势以待天时，一击而定乾坤"
  - title_zh: "封建天下，制礼作乐"
    domain: "政治制度"
    start_date: "约-1046"
    end_date: "约-1043"
    places: ["镐京(今陕西西安)", "洛邑(今河南洛阳)"]
    phases:
      - name: "分封诸侯"
        start_date: "约-1046"
        end_date: "约-1046"
        place: "镐京(今陕西西安)"
        highlight: "封齐、鲁、燕、卫、宋等七十一国"
      - name: "营建洛邑"
        start_date: "约-1046"
        end_date: "约-1043"
        place: "洛邑(今河南洛阳)"
        highlight: "建东都洛邑，控制东方"
    description_zh: "武王灭商后，大封功臣宗室于天下，封姜子牙于齐、周公于鲁、召公于燕，以藩屏周。又营建洛邑为东都，以控制东方广大领土。虽武王在位仅三年即崩，但其分封制度奠定了西周三百年的政治格局。"
    outcome: "封建制度确立，周朝统治网络覆盖天下"
    lesson: "制度设计比个人英明更持久"

events:
  - date: "约-1050"
    place_name: "羑里(今河南汤阴)"
    event_type: "政治事件"
    title_zh: "文王被囚，武王承志"
    description_zh: "周文王被纣王囚于羑里，长子伯邑考被杀。文王归周后，韬光养晦，暗中积蓄力量。文王崩后，武王姬发继位，承父祖三代之志，誓灭殷商。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "三代人的复仇与建国之志"
  - date: "约-1048"
    place_name: "盟津(今河南孟津)"
    event_type: "军事行动"
    title_zh: "盟津观兵"
    description_zh: "武王率师东出，至于盟津。诸侯不期而会者八百。武王曰'汝未知天命，未可也'，遂还师。此为灭商前的军事演习，试探了天命与人心。"
    is_highlight: true
    highlight_type: "军事"
    highlight_note: "八百诸侯不期而会——天命所归的征兆"
  - date: "约-1046"
    place_name: "牧野(今河南新乡)"
    event_type: "战役"
    title_zh: "牧野之战灭商"
    description_zh: "武王率戎车三百乘、虎贲三千、甲士四万五千与纣王七十万大军战于牧野。殷师前徒倒戈，纣王见大势已去，登鹿台自焚而死。牧野之战仅一日而定天下，是中国历史上最著名的以少胜多的战役之一。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "牧野之战——一日灭商，封建制取代奴隶制的历史转折"
  - date: "约-1046"
    place_name: "朝歌(今河南淇县)"
    event_type: "政治事件"
    title_zh: "入朝歌，散鹿台之财"
    description_zh: "武王入朝歌，至纣自焚之处。散鹿台之财发桥之粟，以赈济贫民。释箕子之囚，封比干之墓，表商容之间。以示伐罪吊民之意，非为贪天下之利。"
    is_highlight: true
    highlight_type: "政治"
    highlight_note: "吊民伐罪——革命的正当性叙事"
  - date: "约-1046"
    place_name: "镐京(今陕西西安)"
    event_type: "政治制度"
    title_zh: "分封天下"
    description_zh: "武王大封功臣宗室，封姜子牙于齐、周公于鲁、召公于燕、康叔于卫、微子于宋等七十一国。以宗法制和分封制构建天下秩序，建立周朝封建体制。"
    is_highlight: true
    highlight_type: "制度"
    highlight_note: "中国封建制度的正式确立"
  - date: "约-1045"
    place_name: "洛邑(今河南洛阳)"
    event_type: "政治工程"
    title_zh: "营建洛邑"
    description_zh: "武王深感镐京偏西，难以控制东方广土，遂命周公营建洛邑(今河南洛阳)为东都。洛邑建成后成为周朝控制东方的政治军事中心。"
    is_highlight: false
    highlight_type: "工程"
    highlight_note: ""
  - date: "约-1043"
    place_name: "镐京(今陕西西安)"
    event_type: "人物终局"
    title_zh: "武王驾崩，周公摄政"
    description_zh: "武王灭商后仅三年即崩，天下初定，百废待举。成王年幼，周公旦摄政。武王虽在位短暂，但其灭商建周之功，奠定了中国此后三千年的政治文明基础。"
    is_highlight: true
    highlight_type: "终局"
    highlight_note: "英年早逝，遗命周公辅政——历史的接力"
