person:
  name_zh: "英布"
  name_en: "Ying Bu"
  birth_date: "约前201(约前240)"
  death_date: "前196"
  birth_place: "六县(今安徽六安)"
  era: "秦末楚汉"
  archetype: "骁勇悍将：从囚徒到诸侯王的传奇"
  dilemmas: ["刑徒出身的自卑与渴望", "在项羽与刘邦之间的反复抉择", "功臣与猜忌的生死博弈"]
  summary_zh: "英布因秦法黥面，又称黥布。从骊山刑徒起兵，归项羽为九江王，后叛楚归汉，垓下之围有大功。汉初封淮南王，因韩信彭越被杀而恐惧，终于起兵反叛，兵败被杀。"
  summary_first_person: "吾本骊山刑徒，黥面之后人称黥布。陈胜举义后吾聚众数千，归项王为九江王。鸿门宴后见项王杀义帝，知其不能成大事，遂归汉王。垓下围杀项王，吾有大功。然汉高祖猜忌功臣，韩信彭越先后被诛，吾惧而反，终败死。"
  lesson: "从底层崛起者最懂权力的诱惑，也最怕权力的反噬。"

endeavors:
  - title_zh: "从刑徒到九江王"
    domain: "军事"
    start_date: "前209"
    end_date: "前206"
    places: ["六县(今安徽六安)", "彭城(今江苏徐州)"]
    phases:
      - name: "骊山起兵"
        start_date: "前209"
        end_date: "前209"
        place: "骊山(今陕西临潼)"
        highlight: "刑徒起兵数千人"
      - name: "归附项羽"
        start_date: "前208"
        end_date: "前206"
        place: "彭城(今江苏徐州)"
        highlight: "巨鹿之战为前锋"
      - name: "封九江王"
        start_date: "前206"
        end_date: "前206"
        place: "六县(今安徽六安)"
        highlight: "项羽分封为九江王"
    description_zh: "英布因犯秦法受黥刑，发配骊山修皇陵。陈胜起义后英布率骊山刑徒数千人起兵，后归项羽。巨鹿之战中英布为前锋，以少胜多破秦军。项羽灭秦后封英布为九江王。"
    outcome: "从刑徒到诸侯王，完成社会底层的逆袭"
    lesson: "时势造英雄，乱世中底层亦可崛起"
  - title_zh: "楚汉争霸中的摇摆与归汉"
    domain: "政治军事"
    start_date: "前206"
    end_date: "前202"
    places: ["六县(今安徽六安)", "荥阳(今河南荥阳)"]
    phases:
      - name: "暗通刘邦"
        start_date: "前205"
        end_date: "前205"
        place: "六县(今安徽六安)"
        highlight: "项羽征兵不应"
      - name: "叛楚归汉"
        start_date: "前204"
        end_date: "前204"
        place: "荥阳(今河南荥阳)"
        highlight: "随何策反"
      - name: "垓下围杀"
        start_date: "前202"
        end_date: "前202"
        place: "垓下(今安徽灵璧)"
        highlight: "垓下之围有大功"
    description_zh: "项羽征兵英布不应，刘邦遣随何策反英布。英布杀楚使叛楚归汉，但因败于楚军，几乎全军覆没。后收集散兵归汉，在垓下之围中率军侧击，为歼灭项羽做出重要贡献。"
    outcome: "楚汉争霸中的关键摇摆人物，最终站在了胜利者一边"
    lesson: "乱世中的抉择往往决定生死存亡"
  - title_zh: "淮南王之乱"
    domain: "政治军事"
    start_date: "前196"
    end_date: "前196"
    places: ["六县(今安徽六安)", "蕲西(今安徽宿州)"]
    phases:
      - name: "恐惧观望"
        start_date: "前196"
        end_date: "前196"
        place: "六县(今安徽六安)"
        highlight: "韩信彭越被杀"
      - name: "起兵反叛"
        start_date: "前196"
        end_date: "前196"
        place: "六县(今安徽六安)"
        highlight: "淮南王之乱"
      - name: "兵败身死"
        start_date: "前196"
        end_date: "前196"
        place: "蕲西(今安徽宿州)"
        highlight: "被长沙王吴臣诱杀"
    description_zh: "韩信、彭越先后被吕后设计诛杀，英布恐惧不安。部下贲赫告发英布谋反，英布遂起兵。刘邦亲征，英布军败，逃至番阳被长沙王吴臣诱杀。"
    outcome: "淮南王之乱被平定，英布身死族灭"
    lesson: "功臣与帝王之间的信任一旦瓦解，结局早已注定"

events:
  - date: "前207"
    place_name: "巨鹿(今河北平乡)"
    event_type: "战役"
    title_zh: "巨鹿之战先锋"
    description_zh: "巨鹿之战中，英布率数千骊山旧部为项羽前锋，先渡河击秦军，以少胜多。项羽大军随后渡河，大破秦军主力。英布之战功为巨鹿大捷奠定了基础。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "刑徒出身的悍将在历史转折点上的表现"
  - date: "前206"
    place_name: "彭城(今江苏徐州)"
    event_type: "分封"
    title_zh: "封九江王"
    description_zh: "项羽灭秦后分封十八路诸侯，英布因巨鹿之战功居诸将之首，被封为九江王，都六县。从刑徒到诸侯王，英布完成了不可思议的逆袭。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "黥面刑徒封王——乱世中身份的重塑"
  - date: "前204"
    place_name: "六县(今安徽六安)"
    event_type: "政治策反"
    title_zh: "随何策反英布"
    description_zh: "刘邦遣辩士随何出使九江，以'项王杀义帝为不义'说英布。英布暗中归汉，但犹豫未决。随何当着楚使面宣布英布已叛楚，迫使英布公开归汉。"
    is_highlight: true
    highlight_type: "人物互动"
    highlight_note: "楚汉争霸中的关键人物摇摆"
  - date: "前202"
    place_name: "垓下(今安徽灵璧)"
    event_type: "战役"
    title_zh: "垓下之围"
    description_zh: "韩信设十面埋伏围项羽于垓下，英布率军从侧翼攻击。四面楚歌响起后，项羽突围至乌江自刎。英布因垓下之功被封为淮南王。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "楚汉争霸的终极决战"
  - date: "前196"
    place_name: "六县(今安徽六安)"
    event_type: "军事叛乱"
    title_zh: "淮南王之乱"
    description_zh: "韩信、彭越先后被诛，英布恐惧。部下贲赫告发谋反，英布被迫起兵。刘邦亲征，英布军败于蕲西，逃至长沙国境内被吴臣诱杀。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "功臣命运的缩影——兔死狗烹"
  - date: "前206"
    place_name: "彭城(今江苏徐州)"
    event_type: "政治决策"
    title_zh: "不从项羽征兵"
    description_zh: "齐地叛乱时，项羽征调九江兵，英布托病不从，仅派数千人应付。项羽由此对英布不满，两人关系渐生嫌隙，为英布后来叛楚埋下伏笔。"
    is_highlight: false
    highlight_type: "决策"
    highlight_note: ""
  - date: "前196"
    place_name: "蕲西(今安徽宿州)"
    event_type: "军事失败"
    title_zh: "英布兵败被杀"
    description_zh: "刘邦亲征英布，两军战于蕲西。英布军虽勇但寡不敌众，败走江南。长沙王吴臣（英布岳父）假意收留，实则诱至番阳，在农民家中将其杀死。"
    is_highlight: true
    highlight_type: "结局"
    highlight_note: "一代骁将终死于猜忌与背叛"
