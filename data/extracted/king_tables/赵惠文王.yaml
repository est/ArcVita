        highlight: "蔺相如完璧归赵"
      - name: "破局"
        start_date: "-279"
        end_date: "-279"
        place: "渑池(今河南渑池)"
        highlight: "渑池之会，相如维护赵王尊严"
      - name: "高潮"
        start_date: "-279"
        end_date: "-279"
        place: "邯郸(今河北邯郸)"
        highlight: "廉颇负荆请罪，将相和"
      - name: "收束"
        start_date: "-279"
        end_date: "-270"
        place: "邯郸(今河北邯郸)"
        highlight: "赵国将相和睦，国力维持"
    description_zh: "前283年，蔺相如持和氏璧出使秦国，以'璧有瑕请指示王'之计完璧归赵。前279年渑池之会，秦王令赵王鼓瑟，蔺相如以死相逼请秦王击缶，维护了赵国尊严。廉颇不服蔺相如位居其上，相如以'先国家之急而后私仇'回避。廉颇深感惭愧，负荆请罪，二人结为生死之交。"
    outcome: "赵国将相和睦，外交上不输秦国，维持了大国地位"
    lesson: "国家利益高于个人恩怨，将相和睦是国家安定的基石"

  - title_zh: "长平之战换将之失"
    domain: "军事决策"
    start_date: "-260"
    end_date: "-260"
    places: ["长平(今山西高平)", "邯郸(今河北邯郸)"]
    phases:
      - name: "酝酿"
        start_date: "-262"
        end_date: "-260"
        place: "长平(今山西高平)"
        highlight: "廉颇坚守不出，与秦军对峙三年"
      - name: "破局"
        start_date: "-260"
        end_date: "-260"
        place: "邯郸(今河北邯郸)"
        highlight: "秦国间谍散布谣言，赵王中计"
      - name: "高潮"
        start_date: "-260"
        end_date: "-260"
        place: "长平(今山西高平)"
        highlight: "赵括替廉颇，中白起之计"
      - name: "收束"
        start_date: "-260"
        end_date: "-260"
        place: "长平(今山西高平)"
        highlight: "四十万赵军被坑杀"
    description_zh: "长平之战初期，老将廉颇采取坚壁清野策略，与秦军对峙三年不败。秦国见正面无法取胜，遂施反间计，散布'秦之所畏，独赵奢之子赵括耳'的谣言。赵惠文王中计，不顾蔺相如病重劝阻，以赵括替换廉颇。赵括出击中白起之计，四十万赵军被围断粮四十六日后投降，全部被坑杀。"
    outcome: "赵国四十万精锐尽丧，从此再无力与秦国争锋"
    lesson: "临阵换将，自古为兵家大忌"

  - title_zh: "邯郸之战，艰难守国"
    domain: "军事"
    start_date: "-259"
    end_date: "-257"
    places: ["邯郸(今河北邯郸)"]
    phases:
      - name: "酝酿"
        start_date: "-259"
        end_date: "-259"
        place: "邯郸(今河北邯郸)"
        highlight: "秦国乘胜围攻邯郸"
      - name: "破局"
        start_date: "-258"
        end_date: "-258"
        place: "邯郸(今河北邯郸)"
        highlight: "平原君求救于楚魏"
      - name: "高潮"
        start_date: "-257"
        end_date: "-257"
        place: "邯郸(今河北邯郸)"
        highlight: "信陵君窃符救赵，楚国春申君援军至"
      - name: "收束"
        start_date: "-257"
        end_date: "-257"
        place: "邯郸(今河北邯郸)"
        highlight: "秦军撤围，赵国幸免于亡"
    description_zh: "长平之战后，秦国趁势围攻赵国都城邯郸。赵国命悬一线，平原君赵胜赴楚求救，毛遂自荐说服楚王出兵。同时魏国信陵君魏无忌窃取兵符，率军救赵。在赵、楚、魏三国联军夹击下，秦国大将王陵战败，被迫撤围。赵国虽保住邯郸，但国力已大不如前。"
    outcome: "赵国暂时保住国都，但已无力恢复长平之前的实力"
    lesson: "危难时刻需要冒险的勇气和广泛的外交支持"
