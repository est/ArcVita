person:
  name_zh: "赵惠文王"
  birth_date: "-308"
  death_date: "-266"
  birth_place: "邯郸(今河北邯郸)"
  era: "战国中晚期"
  archetype: "守成有余的中庸之君"
  summary_zh: "赵何，赵武灵王之子。在其父推行胡服骑射的遗产基础上，维持了赵国作为战国第二强国的地位。在位期间最辉煌的篇章是廉颇、蔺相如'将相和'——蔺相如完璧归赵、渑池之会维护了赵国尊严，廉颇负荆请罪传为千古佳话。但长平之战前临阵换将、以赵括替廉颇，直接导致四十万赵军被坑杀，成为赵国由盛转衰的转折点。"
  summary_first_person: "吾即位时，赵国尚承父王胡服骑射之盛。蔺相如完璧归赵，渑池之会不辱使命，廉颇负荆请罪，吾之朝廷将相和睦。然长平之役，吾惑于秦人间谍之言，以赵括替廉颇，四十万将士尽丧。此吾一生之大过也。"
  lesson: "用人不疑是治国根本，临阵换将是最大的失策。"

endeavors:
  - title_zh: "将相和——廉颇蔺相如共保赵国"
    domain: "政治外交"
    start_date: "-283"
