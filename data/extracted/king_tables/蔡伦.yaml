person:
  name_zh: "蔡伦"
  name_en: "Cai Lun"
  birth_date: "约50"
  death_date: "121"
  birth_place: "桂阳郡(今湖南郴州)"
  era: "东汉"
  archetype: "造纸改良者：推动人类文明进程的技术革命家"
  dilemmas: ["宦官身份的政治困境", "技术革新与宫廷权力斗争", "造纸术改良者的历史地位"]
  summary_zh: "蔡伦入宫为宦官，任尚方令期间改良造纸术，以树皮、麻头、破布、旧渔网为原料造纸，人称'蔡侯纸'。造纸术的推广极大促进了知识传播与文化发展。后因卷入宫廷政变，饮鸩而死。"
  summary_first_person: "吾入宫为宦官，后任尚方令，主宫廷制造。吾总结前人经验，以树皮麻头破布旧渔网造纸，天下称之蔡侯纸。造纸之术流传四海，然吾晚年卷入宫廷之争，饮鸩而死。"
  lesson: "技术的力量可以超越权力更替而永存。"

endeavors:
  - title_zh: "改良造纸术"
    domain: "科技发明"
    start_date: "约89"
    end_date: "105"
    places: "洛阳(今河南洛阳)"
    phases:
