      - name: "原料改良"
        start_date: "约100"
        end_date: "105"
        place: "洛阳(今河南洛阳)"
        highlight: "以树皮麻头破布造纸"
      - name: "推广天下"
        start_date: "105"
    end_date: "121"
    place: "全帝国"
    highlight: "蔡侯纸天下通行"
    description_zh: "蔡伦任尚方令后，总结前人造纸经验，用树皮、麻头、破布、旧渔网为原料造纸。此纸质地轻薄、造价低廉、便于书写。105年蔡伦将此纸献于汉和帝，帝大悦，诏令天下通行。人称'蔡侯纸'。"
    outcome: "造纸术改良极大促进了人类文明的发展与知识传播"
    lesson: "技术创新的价值在于普及与应用"
  - title_zh: "主持宫廷制造"
    domain: "科技管理"
    start_date: "约75"
    end_date: "121"
    places: "洛阳(今河南洛阳)"
    phases:
      - name: "任尚方令"
        start_date: "约75"
        end_date: "105"
        place: "洛阳(今河南洛阳)"
        highlight: "主管宫廷御用器物制造"
      - name: "技术革新"
        start_date: "约75"
        end_date: "105"
        place: "洛阳(今河南洛阳)"
        highlight: "改良多种工艺"
    description_zh: "蔡伦主管宫廷尚方制造，主持改进刀剑、器械等工艺。在其任内，宫廷制造技术达到新高度。造纸术的改良正是在这种技术氛围中诞生的。"
    outcome: "宫廷制造技术提升，造纸术由此改良"
    lesson: "技术积累与创新环境的重要性"

events:
  - date: "105"
    place_name: "洛阳(今河南洛阳)"
    event_type: "科技发明"
    title_zh: "蔡侯纸献世"
    description_zh: "蔡伦将改良后的纸献于汉和帝。此纸以树皮、麻头、破布、旧渔网为原料，经挫、捣、抄、烘干等工艺制成。质地轻薄、造价低廉、便于书写，迅速取代竹简帛书。"
    is_highlight: true
    highlight_type: "发明"
    highlight_note: "造纸术——中国四大发明之一，推动人类文明进程"
  - date: "121"
    place_name: "洛阳(今河南洛阳)"
    event_type: "宫廷政变"
    title_zh: "蔡伦饮鸩而死"
    description_zh: "蔡伦早年参与窦太后迫害宋贵人之事。汉安帝亲政后追查此事，蔡伦自知难逃一死，沐浴整衣后饮鸩而死。一代发明家就这样在宫廷斗争中落幕。"
    is_highlight: true
    highlight_type: "悲剧"
    highlight_note: "造纸术改良者终被宫廷政治吞噬"
  - date: "89"
    place_name: "洛阳(今河南洛阳)"
    event_type: "人物转折"
    title_zh: "蔡伦入宫为宦官"
    description_zh: "蔡伦因家贫入宫为宦官，后因办事得力升为小黄门。窦太后临朝时蔡伦受重用，任中常侍、尚方令。蔡伦由此接触到宫廷制造工艺，为后来改良造纸术奠定了基础。"
    is_highlight: false
    highlight_type: "人物"
    highlight_note: ""
  - date: "105"
    place_name: "洛阳(今河南洛阳)"
    event_type: "文化推广"
    title_zh: "诏令天下用纸"
    description_zh: "汉和帝见蔡伦所造纸大为赞赏，下令全国推广使用。蔡侯纸迅速取代竹简帛书，成为主要书写材料。知识的记录与传播成本大幅降低，文化教育得以普及。"
    is_highlight: true
    highlight_type: "影响"
    highlight_note: "知识传播的革命——纸张普及改变了文明进程"
  - date: "约100"
    place_name: "洛阳(今河南洛阳)"
    event_type: "科技实验"
    title_zh: "蔡伦的造纸实验"
    description_zh: "蔡伦在尚方工坊中反复试验，以各种廉价原料造纸。从树皮到麻头，从破布到渔网，经过挫、捣、抄、烘等数十道工序，终于造出质地优良的纸张。"
    is_highlight: true
    highlight_type: "发明"
    highlight_note: "技术创新需要无数次试验与坚持"
  - date: "121"
    place_name: "洛阳(今河南洛阳)"
    event_type: "历史评价"
    title_zh: "造纸术的世界影响"
    description_zh: "造纸术经丝绸之路传至阿拉伯，再传至欧洲。欧洲人用纸取代羊皮纸后，知识记录成本大幅降低，为文艺复兴和宗教改革奠定了物质基础。蔡伦的发明改变了整个人类文明的进程。"
    is_highlight: true
    highlight_type: "影响"
    highlight_note: "中国四大发明之一——造纸术的世界性影响"
