person:
  name_zh: "秦孝公"
  birth_date: "约-381"
  death_date: "-338"
  birth_place: "雍城(今陕西凤翔)"
  era: "战国中期"
  archetype: "矢志图强的中兴之主"
  summary_zh: "即位时秦处西陲、六国卑之。颁布求贤令招天下英才，力排众议任用卫鞅变法，废井田、奖耕战、行县制，二十年间秦国由弱变强，收复河西失地，为日后统一六国奠基。临终虽车裂商鞅以平旧族之怨，却始终未废其法，堪称战国最清醒的君主之一。"
  summary_first_person: "吾即位时，秦国地僻西陲，六国不与会盟，诸侯卑秦。吾深以为耻，下求贤令曰'宾客群臣有能出奇计强秦者，吾且尊官与之分土'。卫鞅至，以霸道说吾，吾知此人可托国。变法二十年，秦人富强，河西复归。吾虽不得已而杀鞅，然其法吾一字不废。"
  lesson: "知耻近乎勇，用人须放手，变法贵在持久。"

endeavors:
  - title_zh: "颁布求贤令，招揽天下英才"
