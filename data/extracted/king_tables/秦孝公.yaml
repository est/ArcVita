      - name: "高潮"
        start_date: "-361"
        end_date: "-356"
        place: "栎阳(今陕西富平)"
        highlight: "卫鞅入秦，以霸道说君"
      - name: "收束"
        start_date: "-356"
        end_date: "-356"
        place: "栎阳(今陕西富平)"
        highlight: "拜卫鞅为左庶长，主持变法"
    description_zh: "秦孝公即位之初，秦处关中西陲，河山以东强国六，微力不得与中原会盟。孝公愤然下求贤令，开厚禄高爵之门招揽天下士人。卫鞅携李悝《法经》入秦，以帝道、王道、霸道三说试探孝公，孝公唯取霸道——富国强兵之术。"
    outcome: "招揽到商鞅等大批人才，为秦国变法图强奠定人才基础"
    lesson: "求贤若渴不是姿态，而是真正的战略投资"

  - title_zh: "支持商鞅变法，秦国由弱变强"
    domain: "政治军事"
    start_date: "-356"
    end_date: "-338"
    places: ["栎阳(今陕西富平)", "咸阳(今陕西咸阳)"]
    phases:
      - name: "酝酿"
        start_date: "-356"
        end_date: "-356"
        place: "栎阳(今陕西富平)"
        highlight: "第一次变法：废井田、奖耕战"
      - name: "破局"
        start_date: "-350"
        end_date: "-350"
        place: "咸阳(今陕西咸阳)"
        highlight: "迁都咸阳，推行县制"
      - name: "高潮"
        start_date: "-350"
        end_date: "-340"
        place: "咸阳(今陕西咸阳)"
        highlight: "秦国大治，道不拾遗"
      - name: "收束"
        start_date: "-340"
        end_date: "-338"
        place: "咸阳(今陕西咸阳)"
        highlight: "河西之战收复失地"
    description_zh: "孝公全力支持商鞅推行两次变法。第一次变法于栎阳颁行，废井田开阡陌、奖励耕织军功、编户连坐。秦国旧贵族群起反对，太子驷犯法，商鞅刑其师傅公子虔、公孙贾。孝公力排众议，始终站在变法一方。"
    outcome: "秦国社会焕然一新，国力大增，从弱国一跃为战国强国"
    lesson: "变法者需要君主绝对的信任，而信任的前提是君主自身的远见"

  - title_zh: "收复河西失地"
    domain: "军事"
    start_date: "-341"
    end_date: "-338"
    places: ["河西(今陕西韩城一带)", "安邑(今山西夏县)"]
    phases:
      - name: "酝酿"
        start_date: "-341"
        end_date: "-340"
        place: "河西(今陕西韩城一带)"
        highlight: "魏国马陵之战大败，国力衰减"
      - name: "破局"
        start_date: "-340"
        end_date: "-340"
        place: "河西(今陕西韩城一带)"
        highlight: "商鞅率军大破魏军"
      - name: "高潮"
        start_date: "-340"
        end_date: "-338"
        place: "安邑(今山西夏县)"
        highlight: "收复河西之地"
      - name: "收束"
        start_date: "-338"
        end_date: "-338"
        place: "咸阳(今陕西咸阳)"
        highlight: "秦国东出大门洞开"
    description_zh: "魏国马陵之战惨败后，国力骤衰。秦孝公趁势派商鞅率军伐魏，大败魏军，俘虏魏公子卬。魏惠王被迫将河西之地归还秦国。至此秦国收复了被魏国占领八十年的河西失地，东出通道彻底打通。"
    outcome: "收复河西失地，秦国获得关中至黄河的完整战略纵深"
    lesson: "国运的逆转往往只需要一个正确的战略窗口期"

events:
  - date: "-361"
    place_name: "栎阳(今陕西富平)"
    event_type: "政治决策"
    title_zh: "颁布求贤令"
    description_zh: "秦孝公即位后深感秦国被六国鄙视之耻，颁布求贤令曰：'宾客群臣有能出奇计强秦者，吾且尊官与之分土。'此令传遍天下，卫鞅(商鞅)携李悝《法经》从魏国入秦，开启了秦国变法图强之路。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "求贤令是秦国崛起的起点"
  - date: "-359"
    place_name: "栎阳(今陕西富平)"
    event_type: "政治改革"
    title_zh: "任用商鞅主持变法"
    description_zh: "秦孝公力排众议，拜卫鞅为左庶长，主持第一次变法。废井田开阡陌、奖励耕织和军功、编户连坐。太子驷犯法，商鞅刑其师傅公子虔、公孙贾以立威。旧贵族群起反对，但孝公始终站在变法一方。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "孝公对商鞅的信任是变法成功的关键"
  - date: "-350"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "政治改革"
    title_zh: "迁都咸阳，推行第二次变法"
    description_zh: "在商鞅主持下，秦国迁都至咸阳(今陕西咸阳)，推行郡县制、统一度量衡。咸阳的地理位置更有利于秦国向东扩张，也远离了旧贵族势力盘踞的旧都。"
    is_highlight: false
    highlight_type: "决策"
    highlight_note: ""
  - date: "-341"
    place_name: "河西(今陕西韩城一带)"
    event_type: "战役"
    title_zh: "河西之战，收复失地"
    description_zh: "魏国马陵之战惨败后国力骤衰，秦孝公趁势派商鞅率军伐魏。商鞅设计俘虏魏公子卬，大破魏军。魏惠王被迫将河西之地归还秦国，秦国收复了被魏国占领八十年的河西失地。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "秦国收复河西，东出大门洞开"
  - date: "-338"
    place_name: "咸阳(今陕西咸阳)"
    event_type: "政治事件"
    title_zh: "孝公薨，商鞅被车裂"
    description_zh: "秦孝公薨，秦惠文王即位。旧贵族群起攻讦商鞅，诬其谋反。商鞅逃亡至关下欲宿旅店，旅店主人曰'商君之法，舍人无验者坐之'——商鞅自己制定的法律反困住了自己。最终商鞅被车裂灭族。然秦惠文王虽杀商鞅，却终未废其法。"
    is_highlight: true
    highlight_type: "事件"
    highlight_note: "法死而法存——商鞅变法最深刻的遗产"
