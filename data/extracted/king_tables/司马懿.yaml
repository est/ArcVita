person:
  name_zh: "司马懿"
  name_en: "Sima Yi"
  birth_date: "179"
  death_date: "251"
  birth_place: "河内温县(今河南温县)"
  era: "东汉末年—三国"
  archetype: "隐忍枭雄：以耐心与谋略窃取天下的终极赢家"
  dilemmas: ["曹魏权臣的忠诚与野心", "与诸葛亮的智谋对决", "高平陵政变的生死抉择"]
  summary_zh: "司马懿为河内名门，被曹操强征入仕。辅佐曹丕、曹叡两代帝王，抵御诸葛亮北伐。曹叡死后托孤辅政，发动高平陵政变诛杀曹爽，独揽朝政。其孙司马炎代魏建晋，司马懿家族最终统一天下。"
  summary_first_person: "吾本河内名门，被曹操强征。吾装病七年避其锋芒，后辅佐文帝、明帝。诸葛亮六出祁山，吾以守为攻耗其锐气。明帝临终托孤，吾忍辱负重十年，终在高平陵一举夺权。天下最终归于司马氏。"
  lesson: "最深的忍耐换最大的收获，但窃取来的权力终有代价。"

endeavors:
  - title_zh: "抵御诸葛亮北伐"
    domain: "军事"
    start_date: "231"
    end_date: "234"
    places: ["长安(今陕西西安)", "五丈原(今陕西岐山)"]
    phases:
      - name: "对峙消耗"
        start_date: "231"
        end_date: "234"
        place: "关中(今陕西)"
        highlight: "以守为攻消耗蜀军"
      - name: "五丈原对峙"
        start_date: "234"
        end_date: "234"
        place: "五丈原(今陕西岐山)"
        highlight: "诸葛亮病逝五丈原"
    description_zh: "司马懿以持久战抵御诸葛亮北伐。诸葛亮多次挑战，司马懿坚守不出。诸葛亮送女装羞辱之，司马懿不为所动。五丈原对峙百余日后，诸葛亮病逝，蜀军退去。"
    outcome: "成功抵御诸葛亮六次北伐"
    lesson: "有时候最聪明的策略就是等待"
  - title_zh: "高平陵政变夺权"
    domain: "政治"
    start_date: "249"
    end_date: "249"
    places: "洛阳(今河南洛阳)"
    phases:
      - name: "装病十年"
        start_date: "239"
        end_date: "249"
        place: "洛阳(今河南洛阳)"
        highlight: "麻痹曹爽"
      - name: "高平陵政变"
        start_date: "249"
        end_date: "249"
        place: "洛阳(今河南洛阳)"
        highlight: "诛杀曹爽夺权"
      - name: "独揽朝政"
        start_date: "249"
        end_date: "251"
        place: "洛阳(今河南洛阳)"
        highlight: "司马氏掌控曹魏"
    description_zh: "曹叡死后托孤司马懿与曹爽。曹爽独揽朝政排挤司马懿。司马懿装病示弱，麻痹曹爽。249年曹爽陪皇帝祭高平陵，司马懿趁机发动政变控制洛阳，诛杀曹爽三族。从此司马氏掌控曹魏朝政。"
    outcome: "高平陵政变使司马氏掌控曹魏，为代魏建晋奠定基础"
    lesson: "最深的忍耐换最大的收获"
  - title_zh: "隐忍侍曹"
    domain: "政治"
    start_date: "208"
    end_date: "239"
    places: "洛阳(今河南洛阳)"
    phases:
      - name: "强征入仕"
        start_date: "208"
        end_date: "208"
        place: "洛阳(今河南洛阳)"
        highlight: "被曹操强征"
      - name: "装病避祸"
        start_date: "208"
        end_date: "208"
        place: "河内温县(今河南温县)"
        highlight: "装病七年至曹操以刀相胁"
      - name: "辅佐文帝"
        start_date: "220"
        end_date: "226"
        place: "洛阳(今河南洛阳)"
        highlight: "为曹丕心腹"
      - name: "受托辅政"
        start_date: "239"
        end_date: "239"
        place: "洛阳(今河南洛阳)"
        highlight: "曹叡托孤"
    description_zh: "司马懿被曹操强征入仕，初装病避祸。后为曹丕心腹，为其出谋划策。曹叡时抵御诸葛亮，功勋卓著。曹叡临终托孤，与曹爽共辅幼帝。司马懿隐忍十年，终发动高平陵政变。"
    outcome: "从隐忍到夺权，完成家族崛起"
    lesson: "忍耐是最大的智慧，也是最深的算计"

events:
  - date: "249"
    place_name: "洛阳(今河南洛阳)"
    event_type: "宫廷政变"
    title_zh: "高平陵政变"
    description_zh: "曹爽陪皇帝祭高平陵，司马懿趁机发动政变。以太后令关闭城门，占据武库，派人控制洛水浮桥。又派人劝说曹爽投降，许以'只免官不杀'。曹爽犹豫后投降，司马懿随即诛杀曹爽三族。"
    is_highlight: true
    highlight_type: "政变"
    highlight_note: "高平陵政变——司马氏篡魏的关键一步"
  - date: "234"
    place_name: "五丈原(今陕西岐山)"
    event_type: "战役"
    title_zh: "五丈原对峙诸葛亮病逝"
    description_zh: "诸葛亮六出祁山与司马懿对峙于五丈原。司马懿坚守不战，诸葛亮送女装羞辱之。司马懿曰'亮食少事烦，其能久乎？'百余日后诸葛亮病逝于五丈原，蜀军退去。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "两个绝世智者的终极对决"
  - date: "208"
    place_name: "河内温县(今河南温县)"
    event_type: "人物转折"
    title_zh: "装病避曹操征召"
    description_zh: "曹操闻司马懿之名欲征召。司马懿以风痹之疾推辞。曹操派刺客试探，司马懿在床不动。后曹操以刀相胁曰'再不应征，便杀汝'。司马懿惧而从之，由此入仕。"
    is_highlight: true
    highlight_type: "人物"
    highlight_note: "装病七年——司马懿隐忍性格的起点"
  - date: "231"
    place_name: "祁山(今甘肃礼县)"
    event_type: "战役"
    title_zh: "第四次北伐退诸葛亮"
    description_zh: "诸葛亮第四次北伐，司马懿追击至祁山。诸葛亮以'死诸葛走生仲达'之计吓退魏军。司马懿叹曰'吾能料生，不便料死也'。此役展现了两位军事天才的智谋较量。"
    is_highlight: true
    highlight_type: "人物互动"
    highlight_note: "死诸葛走生仲达——智者对决的千古佳话"
  - date: "249"
    place_name: "洛阳(今河南洛阳)"
    event_type: "政治斗争"
    title_zh: "诛杀曹爽三族"
    description_zh: "曹爽投降后，司马懿以谋反罪名诛杀曹爽及其党羽三族。何晏、邓飏等人皆被处死。朝中曹魏势力一扫而空，司马氏完全掌控朝政。"
    is_highlight: true
    highlight_type: "政变"
    highlight_note: "一次政变改变了一个朝代的命运"
  - date: "239"
    place_name: "洛阳(今河南洛阳)"
    event_type: "政治传承"
    title_zh: "曹叡托孤"
    description_zh: "魏明帝曹叡病重，召司马懿入朝托孤。司马懿与曹爽共同辅佐幼帝曹芳。曹叡曰'吾忍死待君，君其与爽辅少子'。然曹爽独揽朝政，司马懿被架空。"
    is_highlight: false
    highlight_type: "铺垫"
    highlight_note: ""
  - date: "251"
    place_name: "洛阳(今河南洛阳)"
    event_type: "帝王驾崩"
    title_zh: "司马懿病逝"
    description_zh: "司马懿在洛阳病逝，享年七十三岁。其子司马师、司马昭继续掌控朝政。其孙司马炎代魏建晋，最终统一天下。司马懿家族从隐忍侍曹到窃取天下，完成了中国历史上最漫长的'潜伏'。"
    is_highlight: true
    highlight_type: "结局"
    highlight_note: "三代人的'潜伏'——从隐忍到窃国"
  - date: "234"
    place_name: "五丈原(今陕西岐山)"
    event_type: "人物互动"
    title_zh: "送女装之辱"
    description_zh: "诸葛亮多次挑战司马懿不应，遂送女装羞辱之。司马懿部将愤怒请战，司马懿曰'朝廷深以重任相托，岂可轻动'。又上表请战，明帝不许。司马懿以忍耐耗死了诸葛亮。"
    is_highlight: true
    highlight_type: "人物互动"
    highlight_note: "忍辱负重——司马懿最深的智慧"
