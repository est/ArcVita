    highlight: 田单施反间计，燕惠王中计
  - name: 高潮
    start_date: '-279'
    end_date: '-279'
    place: 即墨(今山东平度)
    highlight: 燕惠王以骑劫代乐毅
  - name: 收束
    start_date: '-279'
    end_date: '-279'
    place: 赵国邯郸(今河北邯郸)
    highlight: 乐毅奔赵，田单火牛阵复齐
  description_zh: 燕昭王薨后，继位的燕惠王为太子时就与乐毅有嫌隙。齐国即墨守将田单趁机施反间计，散布'乐毅欲自立为齐王'的谣言。燕惠王中计，派骑劫替代乐毅。乐毅知归燕必死，遂出奔赵国。赵惠文王以客卿之礼待之。此后田单以火牛阵大破燕军，齐国复国七十余城。
  outcome: 乐毅全身而退，但燕国二十八年伐齐之功尽丧
  lesson: 功高不赏则危，知进退者方能全身
