  description_zh: 前284年，乐毅受燕昭王重拜为上将军，统率燕、秦、韩、赵、魏五国联军伐齐。在济西(今山东聊城一带)大破齐军后，乐毅遣返其他四国军队，独率燕军长驱直入。七十余城望风而降，齐国仅余即墨和莒两城。乐毅在已克之地施仁政、废苛令、礼待齐国旧臣，试图从根本上征服齐国人心。
  outcome: 创造了战国时代最辉煌的军事胜利，燕国从小国跃为大国
  lesson: 最伟大的军事胜利不是杀戮，而是征服人心
- title_zh: 出奔赵国
  domain: 政治
  start_date: '-279'
  end_date: '-279'
  places:
