person:
  name_zh: 乐毅
  birth_date: 约-310
  death_date: 约-250
  birth_place: 中山国(今河北平山)
  era: 战国中晚期
  archetype: 以弱破强的传奇统帅
  summary_zh: 战国名将，中山国后裔，先仕赵、后仕魏、终至燕。受燕昭王知遇之恩，拜为上将军，率五国联军伐齐，连下七十余城，创造了战国时代最辉煌的军事胜利。其军事才能和政治智慧并重——围攻即墨五年而不强攻，以仁义感化齐人。然燕昭王薨后，新王中反间计换将，乐毅被迫出奔赵国。诸葛亮常自比乐毅，可见其在后世心目中的地位。
  summary_first_person: 吾中山之后，先仕赵魏，终至燕。燕昭王筑黄金台待吾，吾感其知遇，率五国之兵伐齐。济西一战大破齐军，吾独将燕师长驱七十余城，齐国几亡。围即墨五年，吾欲以仁义化齐人。然昭王薨，惠王中反间，吾遂去燕适赵。诸葛亮每自比管乐，吾之平生亦足慰矣。
  lesson: 被信任时倾力以报，被猜疑时全身而退——是名将的最高智慧。
