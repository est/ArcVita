    highlight: 攻破邯郸，赵王迁被俘
  - name: 收束
    start_date: '-228'
    end_date: '-228'
    place: 邯郸(今河北邯郸)
    highlight: 赵国灭亡
  description_zh: 王翦率军攻赵，面对赵国名将李牧的顽强抵抗，采取稳扎稳打之策。先以反间计除掉李牧(赵王中秦国间谍谗言杀李牧)，再大举进攻。前228年攻破赵国都城邯郸，俘虏赵王迁。赵国公子嘉逃往代地自立为代王，但赵国主体已亡。
  outcome: 赵国灭亡，秦国在北方再无强敌
  lesson: 战争中最大的变数不是军事，而是对方的内部决策
- title_zh: 灭楚之战
  domain: 军事
  start_date: '-224'
  end_date: '-223'
  places:
  - 寿春(今安徽寿县)
  - 郢(今湖北荆州)
  phases:
  - name: 酝酿
    start_date: '-224'
    end_date: '-224'
    place: 咸阳(今陕西咸阳)
    highlight: 秦王问灭楚需多少兵力
  - name: 破局
    start_date: '-224'
    end_date: '-224'
    place: 寿春(今安徽寿县)
    highlight: 六十万大军陈兵楚境
  - name: 高潮
    start_date: '-224'
    end_date: '-223'
    place: 寿春(今安徽寿县)
    highlight: 大破楚军，俘虏楚王负刍
  - name: 收束
    start_date: '-223'
    end_date: '-223'
    place: 郢(今湖北荆州)
    highlight: 楚国灭亡
  description_zh: 秦始皇问灭楚需要多少兵力，青年将领李信说二十万足矣，王翦则答'非六十万不可'。始皇笑王翦怯，用李信率二十万伐楚，结果大败而归。始皇只得亲赴频阳请王翦出山。王翦率六十万大军，不急于决战，而是步步为营。楚军求战不得、粮草耗尽，最终大败。王翦灭楚国，俘楚王负刍。
  outcome: 楚国灭亡，南方最大诸侯国被纳入秦国版图
  lesson: 审时度势、实事求是比盲目自信更重要
- title_zh: 以自污保身
  domain: 政治智慧
  start_date: '-224'
  end_date: '-221'
  places:
  - 咸阳(今陕西咸阳)
  phases:
  - name: 酝酿
    start_date: '-224'
    end_date: '-224'
    place: 咸阳(今陕西咸阳)
    highlight: 率六十万大军出征
  - name: 破局
    start_date: '-224'
    end_date: '-224'
    place: 咸阳(今陕西咸阳)
    highlight: 行前多次请求赏赐田宅
  - name: 高潮
    start_date: '-224'
    end_date: '-223'
    place: 寿春(今安徽寿县)
    highlight: 灭楚过程中不断派使者回咸阳求田问舍
  - name: 收束
    start_date: '-223'
    end_date: '-221'
    place: 咸阳(今陕西咸阳)
    highlight: 全身而退，善终于家
  description_zh: 王翦深知秦始皇多疑的性格。率六十万大军出征前，他多次向始皇请求赏赐咸阳附近的美田宅园池。出征途中又连续五次派使者回咸阳请求田宅。部下不解，王翦解释说'秦王多疑，如今倾国之兵在我手中，我不多请田宅以自污，秦王怎能放心？'此举动果然让秦始皇大笑，消除了疑心。
  outcome: 王翦善终于家，其子王贲也封列侯，家族平安
  lesson: 在权力的棋局中，自污是最聪明的自保术
