person:
  name_zh: 王翦
  birth_date: 约-269
  death_date: 约-209
  birth_place: 频阳(今陕西富平)
  era: 战国末期
  archetype: 知进退、善自保的不世名将
  summary_zh: 战国四大名将之一，与白起、廉颇、李牧并称。与白起的杀伐果断不同，王翦以稳重著称——他灭楚时要求六十万大军，几乎倾秦国全国之兵，秦始皇一度犹豫。但他深知功高震主之危，每次出征前都向秦王请求田宅园池以自污，让秦王放心。终其一生灭五国中的赵、燕、楚三国，为秦统一天下立下最大军功，且全身而退，善终于家——这在功臣难得善终的秦朝是极其罕见的。
  summary_first_person: 吾与子王贲事秦王，灭赵、破燕、平楚，天下十之七八定于吾手。然吾深知功高震主之理，每出征必请田宅园池于咸阳，使秦王知吾无大志。灭楚时秦王欲用二十万，吾曰'非六十万不可'。秦王笑吾怯。吾不辩，唯请美田宅以自污。终灭楚国，全身而退，善终于家。
  lesson: 最高明的自保不是功成身退，而是让君主永远对你放心。
