person:
  name_zh: "周亚夫"
  name_en: "Zhou Yafu"
  birth_date: "约前199"
  death_date: "前143"
  birth_place: "沛县(今江苏沛县)"
  era: "西汉"
  archetype: "刚直名将：治军严明却饿死狱中的悲剧将军"
  dilemmas: ["名将之子的压力与自我证明", "刚直不阿与朝廷政治的冲突", "功高不赏的悲剧宿命"]
  summary_zh: "周勃之子，驻军细柳治军严明。汉景帝时平七国之乱，三个月荡平叛军，功居首位。后为丞相因谏废栗太子触怒景帝，又因儿子买御器被告谋反，绝食五日呕血而死。"
  summary_first_person: "吾父周勃佐高祖定天下，诛诸吕安刘氏。吾守细柳营，文帝劳军不得入。七国之乱时吾以三个月平定天下，功居首位。然刚直不阿，谏废太子触怒景帝，终被诬陷绝食而死。"
  lesson: "刚直可以建功，但在宫廷政治中，刚直往往是致命的弱点。"

endeavors:
  - title_zh: "平定七国之乱"
    domain: "军事"
    start_date: "前154"
    end_date: "前154"
    places: ["长安(今陕西西安)", "荥阳(今河南荥阳)"]
    phases:
      - name: "受命出征"
        start_date: "前154"
        end_date: "前154"
        place: "长安(今陕西西安)"
        highlight: "汉景帝拜为太尉"
      - name: "坚守荥阳"
        start_date: "前154"
        end_date: "前154"
        place: "荥阳(今河南荥阳)"
        highlight: "断吴楚粮道"
      - name: "三个月平叛"
        start_date: "前154"
        end_date: "前154"
        place: "梁国→吴国"
        highlight: "荡平七国叛军"
    description_zh: "七国之乱时，周亚夫被拜为太尉。他坚守荥阳不救梁国，断吴楚联军粮道。三个月内吴楚军粮尽自溃，七国之乱平定。周亚夫功居首位，被拜为丞相。"
    outcome: "三个月平定七国之乱，巩固了中央集权"
    lesson: "军事上的最优解未必是政治上的最优解"
  - title_zh: "细柳营治军"
    domain: "军事"
    start_date: "前158"
    end_date: "前158"
    places: "细柳(今陕西咸阳)"
    phases:
      - name: "文帝劳军"
        start_date: "前158"
        end_date: "前158"
        place: "细柳(今陕西咸阳)"
        highlight: "军门都尉不纳天子"
    description_zh: "匈奴入侵时，周亚夫驻军细柳。汉文帝劳军至细柳营，军门都尉曰'军中闻将军令，不闻天子之诏'。文帝感叹'此真将军矣'，后周亚夫升为中尉。"
    outcome: "细柳营成为治军严明的千古典范"
    lesson: "军纪严明是战胜的基础"
  - title_zh: "绝食而死"
    domain: "政治"
    start_date: "前147"
    end_date: "前143"
    places: "长安(今陕西西安)"
    phases:
      - name: "谏废太子"
        start_date: "前147"
        end_date: "前147"
        place: "长安(今陕西西安)"
        highlight: "反对废栗太子"
      - name: "被诬入狱"
        start_date: "前143"
        end_date: "前143"
        place: "长安(今陕西西安)"
        highlight: "儿子被告买御器"
      - name: "绝食而死"
        start_date: "前143"
        end_date: "前143"
        place: "长安(今陕西西安)"
        highlight: "呕血而死"
    description_zh: "周亚夫为丞相时谏废栗太子，触怒景帝。后其子买御器被告谋反，周亚夫被下狱。廷尉责问'君欲反乎？'周亚夫曰'吾买葬器，何谓反邪？'遂绝食五日，呕血而死。"
    outcome: "一代名将绝食而死，令天下冤之"
    lesson: "刚直不阿者在权力场中往往结局悲惨"

events:
  - date: "前158"
    place_name: "细柳(今陕西咸阳)"
    event_type: "军事驻防"
    title_zh: "细柳营劳军"
    description_zh: "匈奴侵边时，周亚夫驻军细柳。汉文帝亲自劳军，至细柳营前，军门都尉持戟曰'军中闻将军令，不闻天子之诏'。文帝使节持节方得入。周亚夫以军礼见，文帝感叹'此真将军矣'。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "细柳营——中国治军严明的经典象征"
  - date: "前154"
    place_name: "荥阳(今河南荥阳)"
    event_type: "战役"
    title_zh: "平定七国之乱"
    description_zh: "七国之乱爆发，吴楚联军攻梁。汉景帝拜周亚夫为太尉，周亚夫坚守荥阳不救梁国，断吴楚粮道。三个月内叛军粮尽自溃，吴王刘濞逃至东越被杀，七国之乱平定。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "三个月平定七国之乱——以逸待劳的经典战例"
  - date: "前143"
    place_name: "长安(今陕西西安)"
    event_type: "政治冤案"
    title_zh: "周亚夫绝食而死"
    description_zh: "周亚夫之子为父买甲盾五百具以作葬器，被人告发谋反。廷尉审讯时问'君侯欲反乎？'周亚夫答'吾买葬器，何谓反邪？'廷尉曰'纵不反地上，即欲反地下耳'。周亚夫绝食五日，呕血而死。"
    is_highlight: true
    highlight_type: "悲剧"
    highlight_note: "千古奇冤——欲加之罪何患无辞"
  - date: "前154"
    place_name: "长安(今陕西西安)"
    event_type: "政治决策"
    title_zh: "谏废栗太子"
    description_zh: "汉景帝欲废栗太子刘荣，周亚夫以'废嫡立庶不祥'力谏。景帝不悦，从此疏远周亚夫。此事成为周亚夫后来悲剧命运的伏笔。"
    is_highlight: true
    highlight_type: "人物互动"
    highlight_note: "将军谏君——刚直者的政治悲剧"
  - date: "前158"
    place_name: "长安(今陕西西安)"
    event_type: "军事行动"
    title_zh: "驻军细柳"
    description_zh: "匈奴三万骑入侵上郡，三万骑入侵云中。汉文帝发车千乘、骑十万驻长安旁以备胡。周亚夫驻细柳，刘礼驻霸上，徐厉驻棘门。唯细柳军纪最为严明。"
    is_highlight: false
    highlight_type: "军事"
    highlight_note: ""
  - date: "前154"
    place_name: "梁国(今河南商丘)"
    event_type: "军事决策"
    title_zh: "不救梁国"
    description_zh: "七国之乱时，吴楚联军猛攻梁国。梁孝王求救于周亚夫，周亚夫坚守荥阳不救。梁王每日遣使求救，景帝亦下诏令救，周亚夫不从。梁王坚守独力抗击，吴楚军终因粮尽而溃。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "军事最优解vs政治代价——不救梁国的艰难抉择"
  - date: "前157"
    place_name: "长安(今陕西西安)"
    event_type: "人物关系"
    title_zh: "细柳营后的升迁"
    description_zh: "文帝劳军细柳后，感叹周亚夫治军有方。临终前嘱太子刘启（景帝）'即有缓急，周亚夫真可任将'。景帝即位后拜周亚夫为车骑将军，为后来平定七国之乱埋下伏笔。"
    is_highlight: false
    highlight_type: "人物关系"
    highlight_note: ""
