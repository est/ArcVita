        highlight: "孙膑装疯逃往齐国"
    description_zh: "庞涓与孙膑同师鬼谷子，知孙膑才高于己。庞涓先入魏为将后，假意邀孙膑至魏。到魏后诬其私通齐国，魏惠王下令施以膑刑(挖去膝盖骨)和黥刑(脸上刺字)。孙膑忍辱装疯，后被齐国使者暗中救出，逃至齐国。"
    outcome: "庞涓除去了一个竞争对手，却也为自己埋下了灭顶之灾"
    lesson: "以不义手段排挤他人，终会招来更强的对手"
