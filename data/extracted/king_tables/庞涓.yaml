    description_zh: "庞涓率魏武卒围攻赵国邯郸，赵国危在旦夕。然齐国孙膑以'围魏救赵'之策直取大梁，庞涓被迫回师，在桂陵遭伏击大败。这是庞涓军事生涯中的第一次重大挫折，也让他首次直面昔日同窗的智谋。"
    outcome: "桂陵之战失利，但魏国尚存实力"
    lesson: "战场上最可怕的对手是了解你的人"

