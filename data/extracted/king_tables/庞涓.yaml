person:
  name_zh: "庞涓"
  birth_date: "约-370"
  death_date: "-341"
  birth_place: "魏国(今河南开封一带)"
  era: "战国中期"
  archetype: "才华横溢却因妒丧身的悲剧名将"
  summary_zh: "战国初期魏国名将，与孙膑同师鬼谷子。庞涓先下山入魏，受魏惠王重用为将军。他深知孙膑之才远胜于己，遂设计将其骗至魏国施以膑刑。然天道好还——桂陵之战'围魏救赵'令庞涓首尝败绩，马陵之战孙膑以减灶之计诱其入伏，庞涓在万弩齐发中自刎而死。一代名将，因嫉才而亡于己手。"
  summary_first_person: "吾与孙膑同窗学兵法于鬼谷子，自知才不及之。吾先入魏，拜将军，伐卫破赵，魏王甚重吾。然吾恐膑至魏后魏王弃吾用之，遂设计膑之。孙膑废而为齐所用，吾于桂陵败之。马陵之役，吾追齐军至谷中，万弩俱发，吾知败矣，叹曰'遂成竖子之名'，自刎而死。"
  lesson: "嫉妒是一把双刃剑，害人者终将被自己的恶果反噬。"

