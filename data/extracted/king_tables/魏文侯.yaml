        place: "安邑(今山西夏县)"
        highlight: "西门豹治邺，各尽其才"
      - name: "高潮"
        start_date: "-400"
        end_date: "-396"
        place: "安邑(今山西夏县)"
        highlight: "朝堂人才济济，天下归心"
      - name: "收束"
        start_date: "-396"
        end_date: "-396"
        place: "安邑(今山西夏县)"
        highlight: "开创战国养士之风"
    description_zh: "魏文侯礼贤下士，对贤者以师礼相待。他过段干木之闾必下车凭轼致敬，田子方与之对坐论道，子夏在魏传授儒学。西门豹治邺破除'河伯娶妇'的迷信，发展农业水利。魏国一时人才济济，成为天下士人向往之地，开创了战国养士之风。"
    outcome: "魏国成为战国初期的文化和人才中心"
    lesson: "一个国家最宝贵的资源不是土地和军队，而是人才"
