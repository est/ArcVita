        start_date: "-409"
        end_date: "-400"
        place: "河西(今陕西韩城一带)"
        highlight: "吴起在魏训练魏武卒"
      - name: "破局"
        start_date: "-400"
        end_date: "-395"
        place: "河西(今陕西韩城一带)"
        highlight: "连年进攻秦国"
      - name: "高潮"
        start_date: "-389"
        end_date: "-389"
        place: "阴晋(今陕西华阴)"
        highlight: "阴晋之战，五万魏武卒大破五十万秦军"
      - name: "收束"
        start_date: "-389"
        end_date: "-387"
        place: "河西(今陕西韩城一带)"
        highlight: "秦国被逼退至洛水以西"
    description_zh: "魏文侯任用吴起为将，训练出闻名天下的精锐部队'魏武卒'——士兵需全副甲胄操十二石之弩、负矢五十，日行百里方可入选。吴起率魏武卒连年进攻秦国，最终在阴晋之战中以五万人大破五十万秦军。秦国被迫退守洛水以西，失去了经营数百年的河西之地。"
    outcome: "魏国夺取河西之地，秦国被封锁在关中，魏国成为战国初期最强国"
    lesson: "精锐的军事制度比兵员数量更能决定战争胜负"

  - title_zh: "礼贤下士，开养士之风"
    domain: "政治文化"
