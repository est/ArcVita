        highlight: "魏国霸业确立"
    description_zh: "魏文侯任用李悝为相，推行战国时代第一次系统性变法。李悝提出'尽地力之教'，鼓励农民精耕细作以提高粮食产量；推行'平籴法'稳定粮价；制定《法经》六篇，以法治国。这些改革比商鞅变法早了近百年，为魏国在战国初期的霸业奠定了制度基础。"
    outcome: "魏国成为战国初期第一个通过变法富强的国家"
    lesson: "制度创新是国家竞争力的根本来源"

  - title_zh: "吴起为将，西取河西"
    domain: "军事"
    start_date: "-409"
    end_date: "-389"
    places: ["河西(今陕西韩城一带)", "阴晋(今陕西华阴)"]
