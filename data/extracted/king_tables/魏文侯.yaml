person:
  name_zh: "魏文侯"
  birth_date: "约-472"
  death_date: "-396"
  birth_place: "安邑(今山西夏县)"
  era: "战国初期"
  archetype: "开时代先河的霸主之君"
  summary_zh: "魏国开国之君魏斯，是战国时代第一位真正的霸主。他以李悝变法开战国变法之先河，以吴起为将西取秦国河西之地，以乐羊伐灭中山国。礼贤下士，与段干木、田子方等贤者交游。在位期间魏国率先从三晋中脱颖而出，成为战国初期最强盛的国家，开创了战国时代的新格局。"
  summary_first_person: "吾即位之初，晋室已衰，三家分晋已成定局。吾知欲霸天下，须先变法图强。用李悝尽地力之教，国以富强。拜吴起为将，西取河西。吾亦知用人之道——吾过段干木之闾而式之，非敬其人，敬其德也。吾朝多贤臣，田子方、西门豹各司其职，此魏所以为战国首霸。"
  lesson: "率先变法者率先强盛，但先发优势需要用制度和人才持续维护。"

