      - name: "收束"
        start_date: "-338"
        end_date: "-338"
        place: "咸阳(今陕西咸阳)"
        highlight: "车裂灭族，法存身灭"
    description_zh: "孝公薨，秦惠文王即位。旧贵族群起攻讦，公子虔诬商鞅谋反。商鞅欲逃，至关下欲宿旅店，旅店主人曰'商君之法，舍人无验者坐之'——商鞅自己制定的法律反困住了自己。最终商鞅被擒，车裂而死，灭其族。然秦惠文王虽杀商鞅，却终未废其法。"
    outcome: "商鞅身死，但其法被秦国完整沿用，影响中国两千年"
    lesson: "法不阿贵，绳不挠曲——但制定法律的人也终将被法律所约束"
