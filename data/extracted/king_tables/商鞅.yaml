        highlight: "封商地十五邑"
    description_zh: "魏国马陵之战惨败后，商鞅建议趁势伐魏。他利用与魏公子卬的旧交，以宴请为名诱其至军中，趁机俘虏。魏军群龙无首，大败而归。魏惠王被迫割让河西之地。商鞅因功封于商地，号商君。"
    outcome: "秦国收复河西，商鞅获封商地"
    lesson: "军事胜利有时需要超越常规的手段，但代价是信誉的透支"

  - title_zh: "车裂殉法"
