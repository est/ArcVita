      - name: "收束"
        start_date: "-350"
        end_date: "-350"
        place: "栎阳(今陕西富平)"
        highlight: "升为大良造，主持第二次变法"
    description_zh: "商鞅入秦后，先以徙木立信——在都城南门立三丈之木，悬赏五十金迁木至北门，百姓观望后终有勇者尝试，商鞅如约赏金。此举令百姓知法令必行。随后颁布废井田、开阡陌、奖励耕织和军功、编户连坐等法令。旧贵族群起反对，商鞅刑太子师傅公子虔、公孙贾以儆效尤。"
    outcome: "秦国农业产量和军事战力大幅提升，初步建立法治秩序"
    lesson: "法律的权威在于必行，取信于民是变法的第一步"

