        highlight: "迁都咸阳"
      - name: "破局"
        start_date: "-350"
        end_date: "-345"
        place: "咸阳(今陕西咸阳)"
        highlight: "推行县制，编户齐民"
      - name: "高潮"
        start_date: "-345"
        end_date: "-340"
        place: "咸阳(今陕西咸阳)"
        highlight: "统一度量衡，秦制大成"
      - name: "收束"
        start_date: "-340"
        end_date: "-338"
        place: "咸阳(今陕西咸阳)"
        highlight: "秦法完备，影响深远"
    description_zh: "第二次变法更为深刻：迁都咸阳以远离旧贵族势力中心，推行郡县制取代分封，编户齐民使国家直接控制每一个百姓。统一度量衡为经济一体化奠基。商鞅被封于商地十五邑，号商君，权势煊赫一时。"
    outcome: "建立了一整套中央集权的制度框架，奠定了秦朝统一后的政治体制"
    lesson: "制度变革比政策变更更深远，真正的改革家改变的是规则本身"

