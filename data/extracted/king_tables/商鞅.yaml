person:
  name_zh: "商鞅"
  birth_date: "约-390"
  death_date: "-338"
  birth_place: "卫国(今河南淇县)"
  era: "战国中期"
  archetype: "以身殉法的变法先驱"
  summary_zh: "卫国公族后裔，初仕魏国不得志，携李悝《法经》入秦。以'霸道'说秦孝公，受命主持两次变法：废井田、开阡陌、奖耕战、行县制、统一度量衡。二十年间使秦国脱胎换骨。然变法触动旧贵族利益，孝公死后被车裂灭族。其法终被历代秦君沿用，堪称'法死而法存'的千古悲剧英雄。"
  summary_first_person: "吾本卫国公孙，游历诸侯而无所遇。入秦以霸道说孝公，一语中的。变法十年，秦道不拾遗、山无盗贼。然吾深知法之所在即怨之所聚。太子犯法，刑其师傅以立威，吾与公子虔结仇已深。孝公薨，吾走不能，终被车裂。然吾法不废，秦终一天下，吾虽死犹生。"
  lesson: "变法者终成变法的祭品，但法的精神可以超越个人存亡。"

