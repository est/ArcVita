person:
  name_zh: "曹操"
  name_en: "Cao Cao"
  birth_date: "155"
  death_date: "220"
  birth_place: "沛国谯县(今安徽亳州)"
  era: "东汉末年—三国"
  archetype: "乱世枭雄：以权谋与才华终结乱世的霸主"
  dilemmas: ["宦官之后的出身困境", "挟天子以令诸侯的道德代价", "统一北方后未能统一天下的遗憾"]
  summary_zh: "曹操出身宦官之家，起兵讨董卓，官渡之战以少胜多破袁绍，统一北方。'挟天子以令诸侯'建魏国基业，赤壁之战败于孙刘联军未能统一天下。既是杰出的政治家军事家，也是建安文学的代表人物。"
  summary_first_person: "吾本宦官之后，世人轻之。然吾在乱世中起兵，官渡破袁绍百万之众，统一北方。'挟天子以令诸侯'，天下三分吾有其二。赤壁一败，天命未在吾。吾生为天下计，死亦为天下计。"
  lesson: "才华与权谋可以成就霸业，但天命与人心同样不可忽视。"

endeavors:
  - title_zh: "官渡之战统一北方"
    domain: "军事政治"
    start_date: "196"
    end_date: "207"
    places: ["许昌(今河南许昌)", "官渡(今河南中牟)", "邺(今河北临漳)"]
    phases:
      - name: "挟天子以令诸侯"
        start_date: "196"
        end_date: "196"
        place: "许昌(今河南许昌)"
        highlight: "迎汉献帝都许"
      - name: "官渡决战"
        start_date: "200"
        end_date: "200"
        place: "官渡(今河南中牟)"
        highlight: "以少胜多破袁绍"
      - name: "统一北方"
        start_date: "200"
        end_date: "207"
        place: "邺(今河北临漳)"
        highlight: "北征乌桓平定北方"
    description_zh: "曹操196年迎汉献帝都许，挟天子以令诸侯。200年官渡之战以少胜多大破袁绍，此后陆续消灭袁氏势力，北征乌桓，统一了中国北方。赤壁之战败后转向经营北方，奠定魏国基业。"
    outcome: "统一中国北方，奠定魏国根基"
    lesson: "以弱胜强需要非凡的勇气与谋略"
  - title_zh: "建安文学"
    domain: "文学"
    start_date: "189"
    end_date: "220"
    places: "许昌(今河南许昌)"
    phases:
      - name: "征战诗篇"
        start_date: "189"
        end_date: "207"
        place: "军旅途中"
        highlight: "《蒿里行》《短歌行》"
      - name: "晚年著述"
        start_date: "207"
        end_date: "220"
        place: "许昌(今河南许昌)"
        highlight: "《龟虽寿》《观沧海》"
    description_zh: "曹操不仅是杰出的政治家军事家，也是建安文学的代表人物。其诗作慷慨悲凉，气韵沉雄。'对酒当歌，人生几何'道尽英雄暮年的感慨，被后世尊为建安风骨的开创者。"
    outcome: "开创建安文学，影响中国文学数百年"
    lesson: "英雄与诗人可以是同一个人"

events:
  - date: "200"
    place_name: "官渡(今河南中牟)"
    event_type: "战役"
    title_zh: "官渡之战"
    description_zh: "袁绍以十万大军南下，曹操以不足两万兵力在官渡相持。曹操采纳许攸之谋，夜袭袁绍乌巢粮仓，火烧其粮草辎重。袁军大溃，袁绍仅以八百骑逃回河北。此战奠定了曹操统一北方的基础。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "官渡之战——以少胜多改变天下格局"
  - date: "208"
    place_name: "赤壁(今湖北赤壁)"
    event_type: "战役"
    title_zh: "赤壁之战"
    description_zh: "曹操率八十万大军(号称)南下，孙刘联军五万在赤壁以火攻大破曹军。曹操败走华容道，天下三分格局由此形成。赤壁之战是曹操一生最大的转折点——从统一天下的希望到三分天下的现实。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "赤壁之战——曹操统一梦碎，三国鼎立格局形成"
  - date: "196"
    place_name: "许昌(今河南许昌)"
    event_type: "政治决策"
    title_zh: "迎汉献帝都许"
    description_zh: "汉献帝东归洛阳后，曹操迎帝都许。自此'挟天子以令诸侯'，掌握了政治正统。袁绍曾欲迎献帝至邺，犹豫不决，终被曹操抢先一步。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "挟天子以令诸侯——曹操一生最重要的政治决策"
  - date: "207"
    place_name: "碣石(今河北昌黎)"
    event_type: "文学创作"
    title_zh: "观沧海"
    description_zh: "曹操北征乌桓途中登碣石山，写下千古名篇《观沧海》：'东临碣石，以观沧海。水何澹澹，山岛竦峙。'此诗气势磅礴，展现了曹操博大的胸襟与英雄气概。"
    is_highlight: true
    highlight_type: "文学"
    highlight_note: "建安文学的巅峰之作"
  - date: "189"
    place_name: "洛阳(今河南洛阳)"
    event_type: "军事行动"
    title_zh: "矫诏讨董卓"
    description_zh: "董卓入京废立皇帝，曹操逃离洛阳至陈留起兵。矫诏号召天下诸侯讨伐董卓，关东诸侯推袁绍为盟主。虽讨董失败，但曹操由此崛起为一方诸侯。"
    is_highlight: false
    highlight_type: "转折"
    highlight_note: ""
  - date: "208"
    place_name: "江陵(今湖北荆州)"
    event_type: "军事决策"
    title_zh: "华容道败走"
    description_zh: "赤壁之战后，曹操率残军经华容道北撤。道路泥泞，人马难行。曹操大笑曰'刘备，吾俦也，但得计少晚'。关羽率军伏于道侧，因旧恩释放曹操。"
    is_highlight: true
    highlight_type: "人物互动"
    highlight_note: "关羽义释曹操——忠义与人情的千古佳话"
  - date: "220"
    place_name: "洛阳(今河南洛阳)"
    event_type: "帝王驾崩"
    title_zh: "曹操病逝洛阳"
    description_zh: "曹操在洛阳病逝，享年六十六岁。遗令'分香卖履'，嘱咐薄葬。其子曹丕代汉建魏，追尊曹操为魏武帝。曹操一生征战南北，统一北方，虽未统一天下，但奠定了三国鼎立的基础。"
    is_highlight: true
    highlight_type: "结局"
    highlight_note: "分香卖履——一代枭雄最后的温情"
  - date: "200"
    place_name: "官渡(今河南中牟)"
    event_type: "人物互动"
    title_zh: "许攸来投"
    description_zh: "官渡之战相持阶段，袁绍谋士许攸投奔曹操。曹操跣足出迎，许攸献计夜袭乌巢。曹操从之，亲率五千精骑奇袭乌巢，火烧袁绍粮草，扭转了战局。"
    is_highlight: true
    highlight_type: "人物互动"
    highlight_note: "跣足迎许攸——曹操的求才若渴"
