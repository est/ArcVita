person:
  name_zh: "苏武"
  name_en: "Su Wu"
  birth_date: "约前140"
  death_date: "约前60"
  birth_place: "杜陵(今陕西西安)"
  era: "西汉"
  archetype: "持节不屈：十九年牧羊北海的忠义化身"
  dilemmas: ["使节被扣的生死抉择", "李陵劝降的兄弟情义", "持节牧羊十九年的孤独坚守"]
  summary_zh: "苏武以中郎将出使匈奴，因副使张胜卷入匈奴内乱被扣。匈奴以酷刑利诱逼降，苏武宁死不屈。被流放北海(今贝加尔湖)牧羊十九年，持汉节不失。始元六年归汉，须发尽白，天下敬之。"
  summary_first_person: "吾以汉使至匈奴，副使张胜卷入缑王谋反。匈奴以刀剑加颈逼吾降，吾引刀自刺。又以幽禁断食逼之，吾啮雪吞旃。十九年牧羊北海，持节不失。归汉之日须发尽白，节旄尽落。"
  lesson: "忠诚不是一时的热血，而是一生的坚守。"

