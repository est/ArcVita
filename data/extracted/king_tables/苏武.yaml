      - name: "宁死不降"
        start_date: "前100"
        end_date: "前100"
        place: "匈奴(今蒙古国)"
        highlight: "引刀自刺宁死不屈"
      - name: "北海牧羊"
        start_date: "前100"
        end_date: "前81"
        place: "北海(今贝加尔湖)"
        highlight: "十九年持节牧羊"
      - name: "持节归汉"
        start_date: "前81"
        end_date: "前81"
        place: "长安(今陕西西安)"
        highlight: "须发尽白归汉"
    description_zh: "苏武以汉使出使匈奴，副使张胜参与匈奴缑王谋反事败。匈奴单于欲杀苏武，苏武引刀自刺。又被幽禁大窖中断食，苏武啮雪吞旃不死。遂被流放北海牧羊，曰'羝乳乃得归'。十九年后汉匈和亲，苏武始归。"
    outcome: "苏武持节十九年不屈，成为中国忠义精神的永恒象征"
    lesson: "真正的忠诚经得起时间与苦难的考验"
  - title_zh: "李陵劝降"
    domain: "气节"
    start_date: "约前99"
    end_date: "约前99"
    places: "北海(今贝加尔湖)"
    phases:
      - name: "李陵来劝"
        start_date: "约前99"
        end_date: "约99"
        place: "北海(今贝加尔湖)"
        highlight: "李陵以亲情劝降"
      - name: "苏武拒降"
        start_date: "约前99"
        end_date: "约前99"
        place: "北海(今贝加尔湖)"
        highlight: "答曰'臣事君犹子事父'"
    description_zh: "李陵兵败投降匈奴后，奉单于之命至北海劝降苏武。李陵以苏武兄弟被诛、老母亡故等事相劝，苏武终不为动。李陵叹曰'陵与卫律之罪上通于天'，泣下沾襟而去。"
    outcome: "苏武拒降李陵，两人不同的选择形成鲜明对比"
    lesson: "同一困境中的不同选择，定义了不同的人生"

events:
  - date: "前100"
    place_name: "匈奴王庭(今蒙古国)"
    event_type: "外交事件"
    title_zh: "苏武出使被扣"
    description_zh: "苏武以中郎将持节出使匈奴，副使张胜暗中参与匈奴缑王谋反。事败后匈奴单于欲杀汉使，苏武曰'屈节辱命，虽生何面目以归汉！'引刀自刺。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "一次外交使命变成十九年的囚徒生涯"
  - date: "约前100"
    place_name: "北海(今贝加尔湖)"
    event_type: "囚禁"
    title_zh: "北海牧羊"
    description_zh: "苏武被流放至北海(今贝加尔湖)牧羊，匈奴曰'羝乳乃得归'（公羊生子才能回去）。苏武在荒凉的北海之滨，手持汉节牧羊十九年，节旄尽落而节不离手。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "牧羊十九年——忠诚与坚守的极致象征"
  - date: "前81"
    place_name: "长安(今陕西西安)"
    event_type: "外交事件"
    title_zh: "苏武归汉"
    description_zh: "汉昭帝时汉匈和亲，汉使要求放还苏武。匈奴谎称苏武已死。后汉使得知苏武在北海实情，以'天子射上林得雁足系帛书'为由向匈奴索回苏武。始元六年苏武归汉，须发尽白，手持光秃的汉节。"
    is_highlight: true
    highlight_type: "结局"
    highlight_note: "雁足传书——苏武归汉的传奇"
  - date: "约前99"
    place_name: "北海(今贝加尔湖)"
    event_type: "人物互动"
    title_zh: "李陵劝降"
    description_zh: "李陵投降匈奴后至北海劝降苏武，告知苏武兄弟被诛、老母已故、妻子改嫁。苏武曰'臣事君犹子事父也，子为父死无所恨'。李陵泣下沾襟，叹'陵与卫律之罪上通于天'。"
    is_highlight: true
    highlight_type: "人物互动"
    highlight_note: "两个降臣与一个不降者的命运对照"
  - date: "前100"
    place_name: "匈奴(今蒙古国)"
    event_type: "刑罚"
    title_zh: "幽禁断食啮雪吞旃"
    description_zh: "苏武引刀自刺未死，匈奴单于壮其节。将苏武幽禁于大窖中断绝饮食，欲以饥寒逼降。苏武啮雪与旃毛并吞之，数日不死。匈奴以为神，遂流放北海。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "啮雪吞旃——生死关头的不屈意志"
  - date: "前81"
    place_name: "长安(今陕西西安)"
    event_type: "封赏"
    title_zh: "苏武拜为典属国"
    description_zh: "苏武归汉后被拜为典属国，秩中二千石。汉宣帝赐爵关内侯。苏武在匈奴十九年不屈的事迹传遍天下，成为忠义精神的象征。"
    is_highlight: true
    highlight_type: "结局"
    highlight_note: "十九年坚守终获回报——忠诚不被辜负"
  - date: "约前99"
    place_name: "边境"
    event_type: "军事失败"
    title_zh: "李陵投降匈奴"
    description_zh: "李陵率五千步卒深入匈奴腹地，遭遇匈奴八万骑兵围攻。血战八日，矢尽粮绝，援兵不至，李陵投降。此事成为苏武被扣的间接原因，也成为汉武帝晚年的一大痛事。"
    is_highlight: false
    highlight_type: "铺垫"
    highlight_note: ""
