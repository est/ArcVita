        highlight: "与刘备张飞结义"
      - name: "千里走单骑"
        start_date: "200"
        end_date: "200"
        place: "从许昌到荆州"
        highlight: "过五关斩六将寻兄"
      - name: "镇守荆州"
        start_date: "214"
        end_date: "220"
        place: "荆州(今湖北荆州)"
        highlight: "独当一面镇守荆州"
    description_zh: "关羽与刘备、张飞桃园结义，誓同生死。一生追随刘备颠沛流离。曹操俘获关羽后厚待之，关羽仍不忘刘备，千里走单骑寻兄。后镇守荆州，独当一面。"
    outcome: "忠义成为关羽的永恒标签"
    lesson: "忠诚是最强大的精神力量"
  - title_zh: "水淹七军威震华夏"
    domain: "军事"
    start_date: "219"
    end_date: "219"
    places: ["樊城(今湖北襄阳)", "荆州(今湖北荆州)"]
    phases:
      - name: "北伐襄樊"
        start_date: "219"
        end_date: "219"
        place: "樊城(今湖北襄阳)"
        highlight: "水淹七军擒于禁"
      - name: "威震华夏"
        start_date: "219"
        end_date: "219"
        place: "中原各地"
        highlight: "曹操欲迁都"
    description_zh: "关羽北伐襄樊，利用汉水暴涨水淹于禁七军，擒于禁斩庞德。一时间威震华夏，曹操甚至考虑迁都以避其锋芒。然关羽骄傲轻敌，后方荆州被吕蒙白衣渡江偷袭。"
    outcome: "水淹七军成为关羽军事生涯的巅峰"
    lesson: "功高震主往往是最危险的时刻"
  - title_zh: "败走麦城"
    domain: "军事"
    start_date: "219"
    end_date: "220"
    places: ["麦城(今湖北当阳)", "临沮(今湖北远安)"]
    phases:
      - name: "荆州失守"
        start_date: "219"
        end_date: "219"
        place: "荆州(今湖北荆州)"
        highlight: "吕蒙白衣渡江"
      - name: "败走麦城"
        start_date: "219"
        end_date: "219"
        place: "麦城(今湖北当阳)"
        highlight: "孤城困守"
      - name: "被擒遇害"
        start_date: "220"
        end_date: "220"
        place: "临沮(今湖北远安)"
        highlight: "被孙权所杀"
    description_zh: "吕蒙白衣渡江袭取荆州，关羽腹背受敌。败走麦城，仅余数百骑。突围至临沮被伏兵所擒。孙权劝降不从，遂杀之。关羽首级被送至曹操，操以侯礼葬之。"
    outcome: "一代名将殒命麦城"
    lesson: "骄傲轻敌是英雄最大的敌人"

events:
  - date: "200"
    place_name: "从许昌到荆州"
    event_type: "军事行动"
    title_zh: "千里走单骑"
    description_zh: "关羽被曹操俘获后厚待之，封汉寿亭侯。关羽仍不忘刘备，挂印封金千里寻兄。过五关斩六将，终与刘备在古城相会。此事成为关羽忠义精神的标志性传说。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "千里走单骑——忠义精神的极致体现"
  - date: "219"
    place_name: "樊城(今湖北襄阳)"
    event_type: "战役"
    title_zh: "水淹七军"
    description_zh: "关羽北伐襄樊，秋雨暴涨汉水。关羽趁机决堤水淹于禁七军，于禁投降，庞德被斩。此战关羽威名大震，一时间'威震华夏'，曹操甚至考虑迁都。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "水淹七军——关羽军事生涯的巅峰"
  - date: "220"
    place_name: "临沮(今湖北远安)"
    event_type: "人物结局"
    title_zh: "败走麦城被杀"
    description_zh: "荆州被吕蒙袭取后，关羽败走麦城。突围至临沮被伏兵擒获。孙权劝降，关羽骂曰'碧眼小儿，紫髯鼠辈！吾与刘皇叔桃园结义，誓共死生。岂肯降汝！'遂被杀。"
    is_highlight: true
    highlight_type: "悲剧"
    highlight_note: "一代武圣的最后尊严"
  - date: "200"
    place_name: "白马(今河南滑县)"
    event_type: "战役"
    title_zh: "温酒斩华雄"
    description_zh: "十八路诸侯讨董卓，华雄连斩数将。关羽请战，曹操斟热酒一杯。关羽曰'酒且斟下，某去便来'。出帐提华雄之头掷于地上，其酒尚温。此事展现了关羽的超凡武勇。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "温酒斩华雄——关羽武勇的标志性传说"
  - date: "219"
    place_name: "荆州(今湖北荆州)"
    event_type: "军事失败"
    title_zh: "吕蒙白衣渡江"
    description_zh: "关羽北伐时，孙权遣吕蒙白衣渡江偷袭荆州。吕蒙令军士扮作商人白衣摇橹，沿江烽火台无人报警。荆州一夜易主，关羽腹背受敌。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "白衣渡江——关羽败亡的直接原因"
  - date: "219"
    place_name: "樊城(今湖北襄阳)"
    event_type: "人物互动"
    title_zh: "刮骨疗毒"
    description_zh: "关羽作战时右臂被毒箭所伤。华佗为其刮骨疗毒，关羽饮酒食肉与诸将对弈，谈笑自若。此事展现了关羽超凡的意志力与英雄气概。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "刮骨疗毒——英雄气概的极致体现"
  - date: "184"
    place_name: "涿郡(今河北涿州)"
    event_type: "人物关系"
    title_zh: "桃园结义"
    description_zh: "刘备、关羽、张飞三人在桃园中结义，誓愿'同心协力，救困扶危'。以刘备为长兄，关羽次之，张飞最小。此后三人一生追随，成为中国忠义精神的象征。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "桃园结义——忠义精神的起点"
