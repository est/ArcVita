person:
  name_zh: "关羽"
  name_en: "Guan Yu"
  birth_date: "约162"
  death_date: "220"
  birth_place: "河东解良(今山西运城)"
  era: "东汉末年—三国"
  archetype: "武圣：忠义千秋的千古名将"
  dilemates: ["忠义与骄傲的矛盾", "北伐襄樊的功高震主", "败走麦城的最后尊严"]
  summary_zh: "关羽与刘备桃园结义，一生追随。温酒斩华雄、千里走单骑、过五关斩六将、刮骨疗毒、水淹七军。后因骄傲轻敌败走麦城被杀。后世尊为武圣，忠义的化身。"
  summary_first_person: "吾与大哥桃园结义，誓同生死。千里走单骑寻兄，过五关斩六将。刮骨疗毒吾不惧，水淹七军威震华夏。然吾刚而自矜，败走麦城。身后千年，世人以'关帝'称之，吾心甚慰。"
  lesson: "忠义可以超越生死成为永恒，但骄傲往往是英雄的致命弱点。"

endeavors:
  - title_zh: "桃园结义与追随刘备"
    domain: "人物关系"
