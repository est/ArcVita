        start_date: "-260"
        end_date: "-259"
        place: "咸阳(今陕西咸阳)"
        highlight: "白起反对邯郸之战"
      - name: "破局"
        start_date: "-259"
        end_date: "-258"
        place: "邯郸(今河北邯郸)"
        highlight: "邯郸之战失利"
      - name: "高潮"
        start_date: "-257"
        end_date: "-257"
        place: "咸阳(今陕西咸阳)"
        highlight: "赐死白起"
      - name: "收束"
        start_date: "-257"
        end_date: "-257"
        place: "杜邮(今陕西咸阳东)"
        highlight: "白起自刎，秦失一帅"
    description_zh: "长平之战后，白起主张乘胜灭赵，昭襄王初许后又听范雎之言受韩赵游说而退兵。次年再攻赵国邯郸时，白起多次称病推辞。邯郸之战失利后，昭襄王迁怒于白起，先是免其爵位，后赐剑令其自裁。白起叹曰'我固当死，长平之战赵卒降者数十万人，我诈而尽坑之，是足以死'，遂自刎。"
    outcome: "秦国失去最优秀的军事统帅"
    lesson: "功高震主是千古不变的危机，但杀将自毁更是帝王的大忌"
