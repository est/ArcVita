person:
  name_zh: "班超"
  name_en: "Ban Chao"
  birth_date: "32"
  death_date: "102"
  birth_place: "扶风平陵(今陕西咸阳)"
  era: "东汉"
  archetype: "投笔从戎：以三十六人定五十国的西域传奇"
  dilemmas: ["文吏生涯的不甘与从军壮志", "孤军深入异域的生死抉择", "经营西域三十年的归乡之念"]
  summary_zh: "班超为班固之弟，初为抄书吏，投笔从戎出使西域。以三十六人纵横西域三十年，运用外交与军事手段，使五十余国归附汉朝。年老思乡上书乞归，'臣不敢望到酒泉郡，但愿生入玉门关'，终老洛阳。"
  summary_first_person: "吾本为人抄书以养母，一日投笔叹曰'大丈夫无它志略，犹当效傅介子、张骞立功异域'。遂从军出使西域。三十六人定五十国，纵横三十年。年老上书乞归，愿生入玉门关。"
  lesson: "人生的关键转折往往在于一个决断——投笔从戎改变命运。"

endeavors:
  - title_zh: "投笔从戎经营西域"
    domain: "外交军事"
    start_date: "73"
    end_date: "102"
    places: ["洛阳(今河南洛阳)", "西域(今新疆及中亚)"]
    phases:
      - name: "投笔从戎"
        start_date: "73"
        end_date: "73"
        place: "洛阳(今河南洛阳)"
        highlight: "弃笔从军出使西域"
      - name: "三十六人定西域"
        start_date: "73"
        end_date: "87"
        place: "西域(今新疆及中亚)"
        highlight: "攻降鄯善、于阗、疏勒"
      - name: "经营三十年"
        start_date: "87"
        end_date: "102"
        place: "西域都护府(今新疆库车)"
        highlight: "五十余国归附"
      - name: "生入玉门关"
        start_date: "102"
        end_date: "102"
        place: "洛阳(今河南洛阳)"
        highlight: "年老归乡"
    description_zh: "班超以三十六人出使西域，运用外交手腕与军事奇袭，先后降服鄯善、于阗、疏勒等国。后任西域都护，经营西域三十余年，使五十余国归附汉朝。年老上书'臣不敢望到酒泉郡，但愿生入玉门关'，终得以归国。"
    outcome: "西域五十余国归附汉朝，丝绸之路畅通无阻"
    lesson: "个人的决断可以改变历史的走向"

events:
  - date: "73"
    place_name: "鄯善(今新疆若羌)"
    event_type: "外交军事"
    title_zh: "夜袭匈奴使团"
    description_zh: "班超出使鄯善，匈奴亦遣使到鄯善。鄯善王犹豫不决。班超率三十六人夜袭匈奴使营，纵火烧之，斩杀匈奴使团百余人。鄯善王遂决意归汉。"
    is_highlight: true
    highlight_type: "军事"
    highlight_note: "三十六人夜袭——以少胜多的经典外交军事行动"
  - date: "94"
    place_name: "西域(今新疆及中亚)"
    event_type: "外交军事"
    title_zh: "降服焉耆等国"
    description_zh: "班超调发西域诸国兵七万人攻焉耆、危须、尉犁三国。先以外交手段诱其国王出迎，伏兵尽杀之。西域其余诸国震恐，纷纷投降。至此西域五十余国全部归附。"
    is_highlight: true
    highlight_type: "军事"
    highlight_note: "西域一统——三十年经营的巅峰"
  - date: "102"
    place_name: "洛阳(今河南洛阳)"
    event_type: "人物情感"
    title_zh: "上书乞归"
    description_zh: "班超年老多病，上书汉和帝曰'臣不敢望到酒泉郡，但愿生入玉门关。谨遣子勇随安息献物入塞，及臣生在，令勇目见中土。'言辞恳切，和帝感其言，准其归国。"
    is_highlight: true
    highlight_type: "名言"
    highlight_note: "'但愿生入玉门关'——英雄迟暮的深切乡愁"
  - date: "73"
    place_name: "于阗(今新疆和田)"
    event_type: "外交军事"
    title_zh: "降服于阗"
    description_zh: "班超至于阗，于阗王信巫信匈奴使者之言，欲杀汉使。班超先下手斩杀巫师，以利害说于阗王。于阗王遂杀匈奴使者归汉。"
    is_highlight: true
    highlight_type: "外交"
    highlight_note: "以智谋降服一国——外交家的胆略"
  - date: "74"
    place_name: "疏勒(今新疆喀什)"
    event_type: "外交军事"
    title_zh: "智取疏勒"
    description_zh: "班超得知疏勒王为匈奴所立，不得人心。遂率少数随从直入疏勒王宫，废黜傀儡王，另立疏勒王室后裔。疏勒人大悦，归附汉朝。"
    is_highlight: false
    highlight_type: "外交"
    highlight_note: ""
  - date: "75"
    place_name: "西域(今新疆库车)"
    event_type: "军事行动"
    title_zh: "疏勒城保卫战"
    description_zh: "匈奴攻西域都护府，耿恭守疏勒城。班超闻讯率军援救。匈奴围城数月，城中煮铠弩食筋革。耿恭坚守不降，援军至时仅余二十六人。班超与耿恭内外配合击退匈奴。"
    is_highlight: true
    highlight_type: "军事"
    highlight_note: "孤军守城的悲壮——东汉西域经营的血泪"
  - date: "97"
    place_name: "大秦(今罗马帝国)"
    event_type: "外交探险"
    title_zh: "甘英出使大秦"
    description_zh: "班超派遣副使甘英出使大秦（罗马帝国）。甘英西行至条支(今伊拉克)，临海欲渡，安息人以'海水广大'相阻。甘英遂还，虽未到达大秦，但拓展了中国对西方的认知。"
    is_highlight: false
    highlight_type: "外交"
    highlight_note: ""
  - date: "73"
    place_name: "洛阳(今河南洛阳)"
    event_type: "人物转折"
    title_zh: "投笔从戎"
    description_zh: "班超为佣书吏，以抄写文书为生。一日掷笔叹曰'大丈夫无它志略，犹当效傅介子、张骞立功异域，以取封侯，安能久事笔研间乎？'遂从军出使西域。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "投笔从戎——改变人生的关键决断"
