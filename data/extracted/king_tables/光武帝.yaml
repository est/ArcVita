person:
  name_zh: "光武帝"
  name_en: "Emperor Guangwu of Han"
  birth_date: "前5"
  death_date: "57"
  birth_place: "南阳蔡阳(今湖北枣阳)"
  era: "东汉"
  archetype: "柔道中兴：以温和手段重建汉室的千古明君"
  dilemmas: ["宗室旁支如何争天下", "功臣与皇权的平衡", "柔道治天下与边疆压力"]
  summary_zh: "刘秀为汉景帝后裔，昆阳之战以两万破王莽四十二万大军。统一天下后以柔道治天下，退功臣进文吏，减轻赋税刑罚，开创光武中兴。史称'最完美的皇帝'。"
  summary_first_person: "吾本南阳一布衣，昆阳之战以两万破新莽四十二万。诸将拥吾为帝，吾三让而后受。统一天下后吾以柔道治之，不任功臣以吏事，退功臣进文吏，使天下休息。"
  lesson: "真正的帝王之术不在于征伐，而在于让天下休养生息。"

endeavors:
  - title_zh: "昆阳之战推翻新莽"
    domain: "军事"
    start_date: "23"
    end_date: "23"
    places: ["昆阳(今河南叶县)", "长安(今陕西西安)"]
    phases:
      - name: "昆阳突围"
        start_date: "23"
        end_date: "23"
        place: "昆阳(今河南叶县)"
        highlight: "以两万破四十二万"
      - name: "推翻新莽"
        start_date: "23"
        end_date: "23"
        place: "长安(今陕西西安)"
        highlight: "王莽被杀新莽灭亡"
    description_zh: "昆阳之战中，王莽四十二万大军围困昆阳。刘秀率十三骑突围求援，引万余援军回击。以精锐三千冲击敌阵，城内守军夹击，大破新莽军。此战为历史上以少胜多的经典战例。"
    outcome: "昆阳之战直接导致新莽政权崩溃"
    lesson: "以少胜多需要勇气与智慧的完美结合"
  - title_zh: "光武中兴"
    domain: "政治"
    start_date: "25"
    end_date: "57"
    places: ["洛阳(今河南洛阳)"]
    phases:
      - name: "称帝建制"
        start_date: "25"
        end_date: "25"
        place: "鄗(今河北柏乡)"
        highlight: "鄗城称帝建东汉"
      - name: "统一天下"
        start_date: "25"
        end_date: "36"
        place: "全国"
        highlight: "十二年削平群雄"
      - name: "柔道治国"
        start_date: "36"
        end_date: "57"
        place: "洛阳(今河南洛阳)"
        highlight: "退功臣进文吏"
    description_zh: "刘秀称帝后用十二年统一天下。此后以柔道治天下，退功臣不任以吏事，减轻赋税刑罚，释放奴婢，裁并郡县。东汉初年社会经济恢复，史称光武中兴。"
    outcome: "重建汉室，开创光武中兴的太平盛世"
    lesson: "打天下靠武力，治天下靠仁政"

events:
  - date: "23"
    place_name: "昆阳(今河南叶县)"
    event_type: "战役"
    title_zh: "昆阳之战"
    description_zh: "王莽遣大司空王邑率四十二万大军围昆阳。刘秀时年二十八，率十三骑突围至郾城、定陵调集援军数千人回击。以精锐三千冲击敌中坚，城内守军鼓噪而出，内外夹攻，大破新莽军。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "昆阳之战——中国历史上最经典的以少胜多战例之一"
  - date: "25"
    place_name: "鄗(今河北柏乡)"
    event_type: "称帝"
    title_zh: "鄗城称帝"
    description_zh: "刘秀在诸将拥戴下，于鄗城千秋亭即皇帝位，国号汉，建元建武。后定都洛阳，史称东汉。刘秀三让而后受，体现了谦逊谨慎的帝王风格。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "汉室复兴的起点"
  - date: "36"
    place_name: "洛阳(今河南洛阳)"
    event_type: "政治制度"
    title_zh: "退功臣进文吏"
    description_zh: "天下一统后，刘秀不令功臣掌实权，而是给予优厚待遇退隐。同时重用文吏治理国家。邓禹、吴汉等功臣皆得善终，这在中国历史上极为罕见。"
    is_highlight: true
    highlight_type: "制度"
    highlight_note: "最完美的功臣处理方式——退功臣进文吏"
  - date: "35"
    place_name: "洛阳(今河南洛阳)"
    event_type: "社会政策"
    title_zh: "释放奴婢"
    description_zh: "刘秀多次下诏释放奴婢，严禁买卖人口。又减轻赋税刑罚，裁并郡县，减轻百姓负担。东汉初年社会经济迅速恢复，人口增长。"
    is_highlight: true
    highlight_type: "政策"
    highlight_note: "仁政惠民——光武中兴的根基"
  - date: "25"
    place_name: "长安(今陕西西安)"
    event_type: "政治转折"
    title_zh: "更始帝之死"
    description_zh: "更始帝刘玄先于刘秀入长安称帝，但无治国之才。赤眉军攻入长安，更始帝投降后被杀。刘秀以'复兴汉室'为号召，在鄗城称帝，承接正统。"
    is_highlight: false
    highlight_type: "铺垫"
    highlight_note: ""
  - date: "36"
    place_name: "成都(今四川成都)"
    event_type: "军事行动"
    title_zh: "灭公孙述"
    description_zh: "公孙述据蜀称帝，刘秀遣吴汉率军攻蜀。公孙述战死成都，蜀地平定。至此天下一统，刘秀完成了从昆阳之战到统一天下的全部军事目标。"
    is_highlight: false
    highlight_type: "军事"
    highlight_note: ""
  - date: "57"
    place_name: "洛阳(今河南洛阳)"
    event_type: "帝王驾崩"
    title_zh: "光武帝驾崩"
    description_zh: "刘秀在洛阳南宫前殿驾崩，享年六十二岁。遗诏'无益于百姓之事，皆不得请'。群臣上谥号光武皇帝。光武帝以柔道治天下，开创了东汉近两百年的基业。"
    is_highlight: true
    highlight_type: "结局"
    highlight_note: "最完美的皇帝之死——无益于百姓之事皆不得请"
  - date: "23"
    place_name: "昆阳(今河南叶县)"
    event_type: "人物互动"
    title_zh: "十三骑突围求援"
    description_zh: "昆阳被围时，城中守军不足万人。刘秀率十三骑趁夜突围至郾城调集援军。沿途召集数千人回击昆阳，以三千精锐冲击敌阵。此事展现了刘秀超凡的胆识与魅力。"
    is_highlight: true
    highlight_type: "人物"
    highlight_note: "十三骑突围——以勇气改变历史走向"
