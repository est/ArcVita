        start_date: "-299"
        end_date: "-299"
        place: "邯郸(今河北邯郸)"
        highlight: "传位于幼子赵何"
      - name: "破局"
        start_date: "-298"
        end_date: "-296"
        place: "邯郸(今河北邯郸)"
        highlight: "长子赵章不服，暗中积蓄势力"
      - name: "高潮"
        start_date: "-295"
        end_date: "-295"
        place: "沙丘(今河北广宗)"
        highlight: "赵章发动政变，被公子成平定"
      - name: "收束"
        start_date: "-295"
        end_date: "-295"
        place: "沙丘(今河北广宗)"
        highlight: "赵武灵王被围困饿死"
    description_zh: "赵武灵王壮年时主动退位传位于幼子赵何(赵惠文王)，自号'主父'。然长子赵章不服，在权臣支持下趁赵王与主父在沙丘宫时发动政变。公子成、李兑率军平叛，赵章被杀。但为防主父报复，他们围困沙丘宫不放食物。赵武灵王在宫中困守三月，最终掏雀巢充饥仍不得活，被活活饿死。"
    outcome: "一代英主死于非命，赵国政治元气大伤"
    lesson: "再英明的改革者也无法弥补继承人选择的重大失误"
