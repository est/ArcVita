person:
  name_zh: "赵武灵王"
  birth_date: "-340"
  death_date: "-295"
  birth_place: "邯郸(今河北邯郸)"
  era: "战国中晚期"
  archetype: "以胡服骑射重塑军制的改革之君"
  summary_zh: "赵雍，战国最具改革魄力的君主之一。面对北方胡族的军事威胁和中原大国的围困，他力排众议推行'胡服骑射'——脱宽袍大袖、穿短衣窄袖、改车战为骑兵，使赵国军事力量急剧增强。灭中山、收楼烦、辟千里之地。然壮年传位于幼子，引发沙丘之变，被围困宫中活活饿死。一代英主，最终困死沙丘，令人唏嘘。"
  summary_first_person: "吾初即位，赵国四面受敌，常为中山所苦。吾观胡人骑射之利，决意胡服骑射。群臣反对，公子成称病不朝，吾亲往其家说服之。变服骑射三年，赵国骑兵大盛，灭中山、收楼烦，辟地千里。然吾晚年传位于幼子，废长立幼，终困于沙丘，饿死沙丘宫中。"
  lesson: "改革需要勇气，但权力交接的失败可以毁掉一切。"

