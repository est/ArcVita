        start_date: "-300"
        end_date: "-299"
        place: "邯郸(今河北邯郸)"
        highlight: "赵国成为北方强国"
    description_zh: "赵武灵王深感中原式车战在山地和草原上的局限，决心效法北方胡人推行军事改革。他要求赵国贵族脱去宽袍大袖、穿上短衣窄袖的胡服，将传统车战改为骑兵作战。反对声浪巨大，叔父公子成称病不朝。赵武灵王亲自登门说服，公子成终于接受。改革后赵国骑兵大盛，北灭中山、收楼烦、林胡，辟地千里。"
    outcome: "赵国建立了战国时代最强大的骑兵力量，成为唯一能与秦国正面抗衡的国家"
    lesson: "打破常规需要非凡的勇气，但最关键的不是提出改革，而是说服既得利益者"

  - title_zh: "灭中山国"
    domain: "军事"
    start_date: "-306"
    end_date: "-296"
    places: ["中山国都灵寿(今河北平山)", "邯郸(今河北邯郸)"]
    phases:
      - name: "酝酿"
        start_date: "-307"
        end_date: "-306"
        place: "邯郸(今河北邯郸)"
        highlight: "胡服骑射后赵军战斗力大增"
      - name: "破局"
        start_date: "-306"
        end_date: "-300"
        place: "中山国(今河北平山一带)"
        highlight: "连年进攻中山"
      - name: "高潮"
        start_date: "-296"
        end_date: "-296"
        place: "中山国都灵寿(今河北平山)"
        highlight: "灭亡中山国"
      - name: "收束"
        start_date: "-296"
        end_date: "-296"
        place: "邯郸(今河北邯郸)"
        highlight: "赵国统一河北"
    description_zh: "中山国地处赵国腹地，是赵国的心腹大患。赵武灵王利用胡服骑射后的骑兵优势，从多个方向持续进攻中山。经过十年蚕食，终于在前296年灭亡中山国，迁其君主于肤施(今陕西榆林)。赵国至此统一了河北地区，国力大增。"
    outcome: "赵国腹地贯通，不再有后顾之忧，国力跃升为战国第二"
    lesson: "消除后顾之忧是争霸天下的前提"

  - title_zh: "沙丘之变，困死沙丘宫"
    domain: "政治"
    start_date: "-299"
    end_date: "-295"
    places: ["沙丘(今河北广宗)", "邯郸(今河北邯郸)"]
