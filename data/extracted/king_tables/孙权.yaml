person:
  name_zh: "孙权"
  name_en: "Sun Quan"
  birth_date: "182"
  death_date: "252"
  birth_place: "吴郡富春(今浙江富阳)"
  era: "三国"
  archetype: "守成之主：以制衡之术稳固江东的开国皇帝"
  dilemmas: ["继承兄业的压力与自我证明", "联刘抗曹vs降曹求安的战略抉择", "晚年继承人之争的宫廷乱政"]
  summary_zh: "孙策之弟，十八岁继承江东基业。赤壁之战联刘抗曹大获全胜，建立吴国。在位五十二年，善于用人制衡，使东吴在三国中存续最久。晚年昏聩，因继承人问题引发宫廷乱政。"
  summary_first_person: "吾兄伯符临终以江东托付，吾年十八受之。赤壁之战联刘抗曹，天下三分吾有其一。吾善用人而不善用人之始，善守业而不善传业之终。东吴基业传至于此，后人当自勉。"
  lesson: "守成者的价值在于稳固根基，但继承人问题往往是最难的考验。"

endeavors:
  - title_zh: "赤壁之战联刘抗曹"
    domain: "军事外交"
    start_date: "208"
    end_date: "208"
    places: ["建业(今江苏南京)", "赤壁(今湖北赤壁)"]
    phases:
      - name: "战和之争"
        start_date: "208"
        end_date: "208"
        place: "建业(今江苏南京)"
        highlight: "主战派鲁肃周瑜力排众议"
      - name: "联刘抗曹"
        start_date: "208"
        end_date: "208"
        place: "赤壁(今湖北赤壁)"
        highlight: "孙刘联军火烧赤壁"
      - name: "奠定三分"
        start_date: "208"
    end_date: "229"
    place: "建业(今江苏南京)"
    highlight: "称帝建吴"
    description_zh: "曹操率大军南下，东吴群臣多主降。鲁肃引诸葛亮见孙权，周瑜力主抗曹。孙权决意联刘抗曹，以周瑜为大都督，火烧赤壁大破曹军。此后孙权稳固江东，229年称帝建吴。"
    outcome: "赤壁之战大胜，奠定三国鼎立格局"
    lesson: "关键时刻的决断可以改变历史走向"
  - title_zh: "经营东吴五十二年"
    domain: "政治"
    start_date: "200"
    end_date: "252"
    places: ["建业(今江苏南京)"]
    phases:
      - name: "继承基业"
        start_date: "200"
        end_date: "208"
        place: "建业(今江苏南京)"
        highlight: "十八岁承兄业"
      - name: "称帝建吴"
        start_date: "229"
        end_date: "229"
        place: "建业(今江苏南京)"
        highlight: "建立吴国"
      - name: "晚年守成"
        start_date: "229"
    end_date: "252"
    place: "建业(今江苏南京)"
    highlight: "继承人之争"
    description_zh: "孙权在位五十二年，是三国时期在位最久的君主。他善于用人制衡，使东吴在三国中存续最久。但晚年因继承人问题引发宫廷乱政，二宫之争使东吴元气大伤。"
    outcome: "东吴存续最久，但晚年乱政埋下灭亡隐患"
    lesson: "守成之功不可没，但继承人问题是帝王最大的考验"

events:
  - date: "208"
    place_name: "赤壁(今湖北赤壁)"
    event_type: "战役"
    title_zh: "赤壁之战"
    description_zh: "曹操率八十万大军(号称)南下，孙权以周瑜为大都督，联刘备以三万兵力在赤壁以火攻大破曹军。曹操败走华容道，退回北方。赤壁之战是中国历史上最著名的以少胜多战役之一，奠定了三国鼎立格局。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "赤壁之战——三国鼎立的起点"
  - date: "208"
    place_name: "建业(今江苏南京)"
    event_type: "人物互动"
    title_zh: "孙刘联盟"
    description_zh: "鲁肃引诸葛亮至江东见孙权。诸葛亮以'操军不习水战'说孙权，周瑜以'操军不过二十万'力主抗曹。孙权拔剑砍案角曰'再言降操者如此案'，决意联刘抗曹。"
    is_highlight: true
    highlight_type: "人物互动"
    highlight_note: "孙刘联盟——改变天下格局的外交决策"
  - date: "229"
    place_name: "建业(今江苏南京)"
    event_type: "称帝"
    title_zh: "孙权称帝建吴"
    description_zh: "229年孙权在建业称帝，国号吴，改元黄龙。此前孙权已实际统治江东三十年，至此正式建国。东吴成为三国中存续最久的政权。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "吴国建立——三国鼎立正式形成"
  - date: "219"
    place_name: "荆州(今湖北荆州)"
    event_type: "军事行动"
    title_zh: "袭取荆州"
    description_zh: "关羽北伐襄樊水淹七军威震华夏，孙权趁荆州空虚派吕蒙白衣渡江袭取荆州。关羽败走麦城被杀。此举虽得荆州，但破坏了孙刘联盟，为夷陵之战埋下伏笔。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "袭取荆州——孙刘联盟破裂的关键"
  - date: "222"
    place_name: "夷陵(今湖北宜昌)"
    event_type: "战役"
    title_zh: "夷陵之战"
    description_zh: "刘备为关羽报仇伐吴，陆逊在夷陵以火攻大破蜀军。刘备退至白帝城，次年病逝。夷陵之战巩固了东吴对荆州的控制，也使三国格局最终稳定。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "夷陵之战——三国格局的最终确立"
  - date: "245"
    place_name: "建业(今江苏南京)"
    event_type: "宫廷政变"
    title_zh: "二宫之争"
    description_zh: "孙权晚年因继承人问题引发太子孙和与鲁王孙霸的党争。朝臣分裂为两派互相攻讦，陆逊等重臣被逼死。孙霸被赐死，孙和被废。东吴元气大伤，为日后灭亡埋下隐患。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "二宫之争——东吴由盛转衰的转折"
  - date: "222"
    place_name: "夷陵(今湖北宜昌)"
    event_type: "人物互动"
    title_zh: "陆逊火烧连营"
    description_zh: "刘备伐吴连营七百里，陆逊以火攻大破之。此战是三国时期三大战役之一，孙权用人得当（陆逊为年轻将领），展现了其善于用人的特点。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "火烧连营——以少胜多的又一经典"
