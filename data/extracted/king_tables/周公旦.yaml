person:
  name_zh: "周公旦"
  birth_date: "约-1060"
  death_date: "约-1036"
  birth_place: "岐(今陕西岐山)"
  era: "西周初"
  archetype: "制礼作乐的圣人之师"
  summary_zh: "周公旦辅佐武王灭商、摄政七年安定天下、制礼作乐奠定华夏文明基石，被孔子尊为千古圣人，是中国政治与文化传统的真正奠基者。"
  summary_first_person: "吾兄武王克殷而崩，成王年幼，天下未定。吾恐失天下之望，乃摄行政当国。管叔、蔡叔疑吾篡位，挟武庚叛。吾东征三年，诛管叔、杀武庚、降蔡叔，始定东方。又营洛邑为东都，制礼作乐，定宗法封建之制。七年而还政成王，吾未尝有不臣之心。后世或疑吾，然天知吾心。"
  lesson: "忠诚与能力并重，才能担起托孤之重；制度比权力更持久。"

endeavors:
  - title_zh: "东征平叛，安定天下"
    domain: "军事/政治"
    start_date: "约-1043"
    end_date: "约-1040"
    places: ["镐京(今陕西西安)", "洛邑(今河南洛阳)", "商奄(今山东曲阜)"]
    phases:
      - name: "管蔡之乱"
        start_date: "约-1043"
        end_date: "约-1043"
        place: "镐京(今陕西西安)"
        highlight: "管叔、蔡叔联合武庚叛周"
      - name: "三年东征"
        start_date: "约-1043"
        end_date: "约-1040"
        place: "东方诸国"
        highlight: "诛管叔、杀武庚、降蔡叔、灭商奄"
      - name: "安定东方"
        start_date: "约-1040"
        end_date: "约-1040"
        place: "洛邑(今河南洛阳)"
        highlight: "营建洛邑，封建诸侯镇东方"
    description_zh: "武王崩后，周公摄政。管叔、蔡叔散布流言，联合纣王之子武庚及东方诸国叛周。周公奉成王之命东征，历时三年，先后诛管叔、杀武庚、降蔡叔，并灭商奄等国，彻底平定东方叛乱，巩固了新生的周朝政权。"
    outcome: "平定三监之乱，巩固周朝统治，东方纳入周之版图"
    lesson: "内部叛乱比外部敌人更危险，果断平叛才能安定大局"
  - title_zh: "制礼作乐，奠定华夏文明"
    domain: "文化/制度"
    start_date: "约-1040"
    end_date: "约-1036"
    places: ["洛邑(今河南洛阳)", "镐京(今陕西西安)"]
    phases:
      - name: "制礼"
        start_date: "约-1040"
        end_date: "约-1038"
        place: "洛邑(今河南洛阳)"
        highlight: "制定冠婚丧祭朝聘之礼"
      - name: "作乐"
        start_date: "约-1038"
        end_date: "约-1036"
        place: "洛邑(今河南洛阳)"
        highlight: "创作《大武》等雅乐"
      - name: "还政成王"
        start_date: "约-1036"
        end_date: "约-1036"
        place: "镐京(今陕西西安)"
        highlight: "摄政七年后主动还政"
    description_zh: "周公在平定叛乱后，深感武力只能定一时，制度方能安万世。遂制定礼乐制度，确立宗法制、嫡长子继承制、封建制等根本制度。又作《周礼》六典，分天、地、春、夏、秋、冬六官，奠定了中国三千年官制与文化传统的基石。摄政七年后，成王成人，周公主动还政，不恋权位，被后世誉为圣人。"
    outcome: "制礼作乐奠定华夏文明基石，还政成王树立忠臣典范"
    lesson: "权力的最高境界是懂得放手"

events:
  - date: "约-1043"
    place_name: "镐京(今陕西西安)"
    event_type: "政治危机"
    title_zh: "管蔡之乱"
    description_zh: "武王崩后，成王年幼。管叔、蔡叔散布流言'周公将不利于成王'，联合纣王之子武庚及东方诸国叛周。周朝面临建国以来最严重的政治危机。"
    is_highlight: true
    highlight_type: "危机"
    highlight_note: "周朝建立不到三年即遭遇分裂危机"
  - date: "约-1042"
    place_name: "商奄(今山东曲阜)"
    event_type: "战役"
    title_zh: "东征灭商奄"
    description_zh: "周公率军东征，先后平定管叔、蔡叔之叛，杀武庚。又继续东进，灭商奄等东方大国。历时三年，东方诸国尽服于周，周朝版图扩大至东海之滨。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "周初最大的军事行动，奠定了周朝对东方的控制"
  - date: "约-1040"
    place_name: "洛邑(今河南洛阳)"
    event_type: "政治工程"
    title_zh: "营建洛邑"
    description_zh: "周公亲自选址，营建洛邑为东都。洛邑位于天下之中，便于控制东方诸侯。周公将殷商遗民迁至洛邑周围，便于监管。洛邑成为周朝东进的战略支点。"
    is_highlight: true
    highlight_type: "工程"
    highlight_note: "天下之中——洛邑选址的战略智慧"
  - date: "约-1038"
    place_name: "洛邑(今河南洛阳)"
    event_type: "文化制度"
    title_zh: "制礼作乐"
    description_zh: "周公制定冠、婚、丧、祭、朝、聘等礼仪制度，创作《大武》等雅乐，确立宗法制和嫡长子继承制。这套礼乐制度成为华夏文明的根基，被后世尊为'周公之礼'。"
    is_highlight: true
    highlight_type: "文化"
    highlight_note: "华夏文明的制度基石——孔子一生推崇的对象"
  - date: "约-1036"
    place_name: "镐京(今陕西西安)"
    event_type: "政治事件"
    title_zh: "还政成王"
    description_zh: "周公摄政七年，成王已成人。周公主动还政于成王，不恋权位。有人疑周公将不利于成王，周公遂东居洛邑，以示无篡位之心。此举被后世誉为忠臣的最高典范。"
    is_highlight: true
    highlight_type: "政治"
    highlight_note: "摄政而不篡位——千古忠臣的标杆"
  - date: "约-1036"
    place_name: "镐京(今陕西西安)"
    event_type: "人物终局"
    title_zh: "周公辞世"
    description_zh: "周公旦辞世，遗言'必葬我于成周，以明吾不敢离成王'。孔子一生以'吾不复梦见周公'感叹礼崩乐坏。周公旦被后世尊为'元圣'，是中国政治与文化传统最深的奠基者。"
    is_highlight: true
    highlight_type: "终局"
    highlight_note: "千古圣人——孔子终身追慕的偶像"
