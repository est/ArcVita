person:
  name_zh: "蔺相如"
  birth_date: "约-330"
  death_date: "约-270"
  birth_place: "赵国(今河北邯郸)"
  era: "战国中晚期"
  archetype: "以智勇双全维护国家尊严的外交家"
  summary_zh: "出身卑微的赵国门客，因'完璧归赵'一举成名，又在渑池之会上以死相逼维护赵王尊严。位居上卿后遭廉颇妒忌，以'先国家之急而后私仇'的胸襟化解矛盾，促成'将相和'的千古佳话。他是战国时代最出色的外交家之一，以三寸之舌和过人胆识在强秦面前维护了赵国的尊严。"
  summary_first_person: "吾本赵国宦者令缪贤之门人，因完璧归赵事见知于赵王。渑池之会吾以颈血溅秦王，赵王得以不辱。廉颇恶吾位居其上，吾避之再三。人问吾何以怯，吾曰'以先国家之急而后私仇也'。廉颇闻之，肉袒负荆请罪。吾与廉颇遂为刎颈之交。"
  lesson: "在强权面前不卑不亢，在恩怨面前以大局为重，是真正的勇气。"

