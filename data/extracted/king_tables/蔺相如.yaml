        highlight: "蔺相如持璧入秦"
      - name: "高潮"
        start_date: "-283"
        end_date: "-283"
        place: "咸阳(今陕西咸阳)"
        highlight: "怒发冲冠，持璧倚柱，以碎璧相胁"
      - name: "收束"
        start_date: "-283"
        end_date: "-283"
        place: "邯郸(今河北邯郸)"
        highlight: "完璧归赵，名震天下"
    description_zh: "秦王欲以十五城换赵国和氏璧。蔺相如奉命携璧入秦，见秦王无意割城，遂以'璧有瑕请指示王'取回和氏璧，怒发冲冠倚柱而立曰'大王欲得璧，臣头今与璧俱碎于柱矣'。秦王恐璧碎，蔺相如趁机令从者怀璧归赵。秦王虽怒，但以礼相待，放其归国。"
    outcome: "赵国既保全了和氏璧，又没有给秦国开战的借口"
    lesson: "在不对等的博弈中，胆识和智谋是最好的武器"

  - title_zh: "渑池之会"
    domain: "外交"
    start_date: "-279"
    end_date: "-279"
    places: ["渑池(今河南渑池)"]
    phases:
      - name: "酝酿"
        start_date: "-279"
        end_date: "-279"
        place: "渑池(今河南渑池)"
        highlight: "秦王邀赵王渑池相会"
      - name: "破局"
        start_date: "-279"
        end_date: "-279"
        place: "渑池(今河南渑池)"
        highlight: "秦王令赵王鼓瑟"
      - name: "高潮"
        start_date: "-279"
        end_date: "-279"
        place: "渑池(今河南渑池)"
        highlight: "蔺相如以死相逼请秦王击缶"
      - name: "收束"
        start_date: "-279"
        end_date: "-279"
        place: "渑池(今河南渑池)"
        highlight: "赵王全身而退"
    description_zh: "秦赵渑池之会，秦王酒酣令赵王鼓瑟以示臣服之意。蔺相如上前请秦王击缶，秦王不肯。相如曰'五步之内，臣请以颈血溅大王矣'，以死相逼。秦王左右欲杀相如，相如怒目叱之。秦王无奈击缶。相如召赵国御史记下'秦王为赵王击缶'。秦终不能加害于赵。"
    outcome: "赵国在外交上不落下风，维护了国家尊严"
    lesson: "外交上的对等是国家主权的底线，需要以命相守"
