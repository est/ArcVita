        highlight: "孙刘联盟"
      - name: "赤壁之战"
        start_date: "208"
        end_date: "208"
        place: "赤壁(今湖北赤壁)"
        highlight: "火烧赤壁大破曹军"
    description_zh: "曹操南下，刘备与孙权联盟抗曹。赤壁之战以火攻大破曹军，刘备趁势取荆州四郡，终于有了自己的根据地。"
    outcome: "赤壁之战使刘备从寄人篱下变为一方诸侯"
    lesson: "联盟是弱者生存的智慧"

events:
  - date: "207"
    place_name: "隆中(今湖北襄阳)"
    event_type: "人物关系"
    title_zh: "三顾茅庐"
    description_zh: "刘备三次亲至隆中拜访诸葛亮。第三次终于见到，诸葛亮为其分析天下大势，提出'隆中对'：联合孙权，占据荆益，待天下有变则两路北伐。刘备得诸葛亮如鱼得水。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "三顾茅庐——中国礼贤下士的千古典范"
  - date: "223"
    place_name: "白帝城(今重庆奉节)"
    event_type: "政治传承"
    title_zh: "白帝城托孤"
    description_zh: "刘备病重将诸葛亮叫到床前，托付后事。曰'君才十倍曹丕，必能安国。若嗣子可辅，辅之；如其不才，君可自取'。诸葛亮泣曰'臣敢竭股肱之力，效忠贞之节，继之以死'。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "白帝城托孤——君臣信任的最高境界"
  - date: "208"
    place_name: "赤壁(今湖北赤壁)"
    event_type: "战役"
    title_zh: "赤壁之战"
    description_zh: "孙刘联军以火攻大破曹操于赤壁。刘备趁势取荆州四郡，终于有了自己的根据地。赤壁之战是刘备一生的转折点——从寄人篱下到一方诸侯。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "赤壁之战——刘备命运的转折点"
  - date: "219"
    place_name: "成都(今四川成都)"
    event_type: "政治事件"
    title_zh: "取益州建蜀汉"
    description_zh: "刘备应刘璋之邀入蜀，后反攻刘璋。214年攻占成都，自领益州牧。221年称帝建蜀汉，以诸葛亮为丞相。从织席贩履到一方帝王，刘备完成了人生的逆袭。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "从织席贩履到蜀汉之主"
  - date: "222"
    place_name: "夷陵(今湖北宜昌)"
    event_type: "战役"
    title_zh: "夷陵兵败"
    description_zh: "关羽被杀后，刘备不顾诸葛亮劝阻伐吴。陆逊在夷陵以火攻大破蜀军，刘备退至白帝城。次年病逝于白帝城，临终托孤诸葛亮。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "夷陵兵败——刘备最后的悲壮"
  - date: "207"
    place_name: "隆中(今湖北襄阳)"
    event_type: "人物互动"
    title_zh: "隆中对"
    description_zh: "诸葛亮为刘备分析天下大势：曹操不可与争锋，孙权可以为援。应取荆州、益州为根据地，待天下有变则两路北伐。刘备大悟，此后二十余年基本按此战略行事。"
    is_highlight: true
    highlight_type: "决策"
    highlight_note: "隆中对——三国战略的总纲领"
  - date: "220"
    place_name: "成都(今四川成都)"
    event_type: "人物情感"
    title_zh: "闻关羽之死"
    description_zh: "关羽败走麦城被孙权所杀。刘备闻讯悲痛欲绝，不顾群臣劝阻决意伐吴。诸葛亮、赵云等人力谏不从。刘备曰'朕与云长誓同生死'，遂举倾国之兵伐吴。"
    is_highlight: true
    highlight_type: "人物情感"
    highlight_note: "兄弟之义——刘备伐吴的真正原因"
