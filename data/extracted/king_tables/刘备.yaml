        start_date: "223"
        end_date: "223"
        place: "白帝城(今重庆奉节)"
        highlight: "托孤诸葛亮"
    description_zh: "夷陵兵败后刘备退至白帝城，病重不起。将诸葛亮叫到床前托孤曰'君才十倍曹丕，必能安国，终定大事。若嗣子可辅，辅之；如其不才，君可自取'。诸葛亮泣泪受命。"
    outcome: "白帝城托孤成为中国历史上最感人的托孤故事"
    lesson: "信任与托付是帝王最难的抉择"
