    description_zh: "刘备以汉室宗亲身份号召天下，但半生漂泊寄人篱下。207年三顾茅庐得诸葛亮，如鱼得水。赤壁之战后取荆州、占益州，221年称帝建蜀汉。关羽被杀后伐吴兵败，白帝城托孤而死。"
    outcome: "从织席贩履到一方之主，建立蜀汉政权"
    lesson: "坚持与仁义最终会赢得回报"
