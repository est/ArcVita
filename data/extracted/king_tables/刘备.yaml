        start_date: "207"
        end_date: "207"
        place: "隆中(今湖北襄阳)"
        highlight: "隆中对三分天下"
    description_zh: "刘备三次亲至隆中拜访诸葛亮。前两次均未见到，第三次终于见到。诸葛亮为其分析天下大势，提出'隆中对'三分天下的战略。刘备得诸葛亮如鱼得水，此为中国历史上礼贤下士的经典。"
    outcome: "三顾茅庐成为中国礼贤下士的千古典范"
    lesson: "真诚的求才之心终会打动贤才"
