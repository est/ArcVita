person:
  name_zh: "刘备"
  name_en: "Liu Bei"
  birth_date: "161"
  death_date: "223"
  birth_place: "涿郡涿县(今河北涿州)"
  era: "东汉末年—三国"
  archetype: "仁德之主：以仁义号召天下的汉室宗亲"
  dilemmas: ["织席贩履的卑微出身与汉室宗亲的身份", "半生漂泊与最终建立蜀汉", "关羽之死与夷陵之败的悲愤"]
  summary_zh: "刘备自称中山靖王之后，织席贩履起家。以仁义号召天下，三顾茅庐得诸葛亮。联孙抗曹赤壁大胜，取益州建蜀汉。关羽被杀后伐吴兵败，白帝城托孤而死。一生颠沛流离终成一方之主。"
  summary_first_person: "吾虽汉室宗亲，然少孤贫，织席贩履为业。半生漂泊无立锥之地，三顾茅庐得孔明，如鱼得水。赤壁之后始有荆州，取益州建蜀汉。然关羽被杀，吾愤而伐吴，夷陵兵败。白帝城中托孤孔明，吾心始安。"
  lesson: "仁义是最强大的号召力，但仅有仁义不足以成就霸业。"

