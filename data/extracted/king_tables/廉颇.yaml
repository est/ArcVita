    highlight: 廉颇负荆请罪
  - name: 收束
    start_date: '-279'
    end_date: '-270'
    place: 邯郸(今河北邯郸)
    highlight: 将相和，赵国大治
  description_zh: 蔺相如因完璧归赵和渑池之会之功，位居廉颇之上。廉颇不服，公然宣言'我见相如必辱之'。蔺相如为避免将相内斗影响国事，主动称病不上朝、出门引车避让。门客以为怯，相如曰'吾所以先国家之急而后私仇也'。廉颇闻之深感惭愧，袒露上身背负荆条登门请罪，二人结为刎颈之交。
  outcome: 将相和睦，赵国朝堂团结一致对外
  lesson: 知错能改是真勇，先国家后私仇是大义
