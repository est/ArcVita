person:
  name_zh: 廉颇
  birth_date: 约-320
  death_date: 约-245
  birth_place: 赵国(今河北邯郸一带)
  era: 战国中晚期
  archetype: 忠勇无双却晚景凄凉的悲剧名将
  summary_zh: 战国四大名将之一，以勇猛善战著称于世。负荆请罪的故事让他与蔺相如并列为'将相和'的千古佳话。长平之战坚守三年不败，却因赵王临阵换将而功亏一篑。晚年遭谗言被逐，辗转于魏、楚之间，最终在楚国郁郁而终。临终叹曰'我思用赵人'，一代名将客死异乡。
  summary_first_person: 吾为赵将数十年，破齐取阳晋，大败燕军于鄗。长平之役吾坚壁不战三年，秦人不能克。然赵王听信谗言，以赵括替吾。吾欲谏而不能，四十万将士尽丧。后赵王复用吾围燕，然终不复信任。吾老矣，被逐至魏，楚王迎吾，然吾终思赵人而不能用也。
  lesson: 将军最大的悲剧不是战死沙场，而是不被信任、老死异乡。
