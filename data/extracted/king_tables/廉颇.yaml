  description_zh: 廉颇是战国四大名将之一，以勇猛善战闻名。前283年大破齐军，取阳晋，拜为上卿。后又大败燕军于鄗，围困燕都迫使燕国割地求和。长平之战中坚守不出三年，秦国无法正面取胜。然赵王中反间计以赵括替之，四十万赵军尽丧。此后廉颇虽再被起用，终因郭开谗言被逐。
  outcome: 赵国名将，但晚景凄凉
  lesson: 名将需要名主，否则再强的将军也无法施展
