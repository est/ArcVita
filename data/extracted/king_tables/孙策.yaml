person:
  name_zh: "孙策"
  name_en: "Sun Ce"
  birth_date: "175"
  death_date: "200"
  birth_place: "吴郡富春(今浙江富阳)"
  era: "东汉末年"
  archetype: "小霸王：以锐气开辟东吴基业的少年英雄"
  dilemmas: ["继承父亲遗志的压力", "开拓与守成的平衡", "英年早逝的未竟壮志"]
  summary_zh: "孙坚之子，年仅十七岁继承父亲旧部，以锐不可当之势横扫江东。六年时间平定江东六郡，人称'小霸王'。正当北上争霸之际，遇刺身亡，年仅二十六岁。其弟孙权继承基业，建立吴国。"
  summary_first_person: "吾父孙坚战死，吾年十七承其旧部。六年间横扫江东，人称小霸王。正欲北上与曹操争中原，不幸遇刺。吾将基业托付弟弟孙权，未能亲自争天下，此吾一生之憾。"
  lesson: "开拓者的锐气最可贵，但生命的长度决定了事业的高度。"

endeavors:
  - title_zh: "平定江东"
    domain: "军事"
    start_date: "194"
    end_date: "200"
    places: ["江东(今江苏浙江)", "建业(今江苏南京)"]
    phases:
      - name: "承父旧部"
        start_date: "194"
        end_date: "195"
        place: "江东(今江苏浙江)"
        highlight: "十七岁继承孙坚旧部"
      - name: "横扫六郡"
        start_date: "195"
        end_date: "200"
        place: "江东(今江苏浙江)"
        highlight: "六年平定江东"
      - name: "北上图霸"
        start_date: "200"
        end_date: "200"
        place: "建业(今江苏南京)"
        highlight: "遇刺身亡"
    description_zh: "孙坚死后，孙策以十七岁之龄继承父亲旧部。以周瑜为辅，六年时间平定吴郡、会稽、丹阳、豫章、庐陵、庐江六郡。人称'小霸王'。正当北上争霸之际，被刺客所伤，不久身亡，年仅二十六岁。"
    outcome: "奠定东吴基业，为三国鼎立奠基"
    lesson: "少年英雄的锐气可以改变天下格局"
  - title_zh: "孙策周瑜共创业"
    domain: "人物关系"
    start_date: "195"
    end_date: "200"
    places: "江东(今江苏浙江)"
    phases:
      - name: "少年知己"
        start_date: "195"
        end_date: "195"
        place: "舒(今安徽庐江)"
        highlight: "与周瑜一见如故"
      - name: "共定江东"
        start_date: "195"
        end_date: "200"
        place: "江东(今江苏浙江)"
        highlight: "周瑜辅佐孙策平定六郡"
    description_zh: "孙策与周瑜少年相识，一见如故。周瑜倾家资助孙策，率军随其平定江东。两人配合默契，堪称乱世中最佳拍档。孙策临终将弟弟孙权托付给周瑜。"
    outcome: "孙策周瑜的友谊成为中国历史上的佳话"
    lesson: "少年知己是最珍贵的创业伙伴"

events:
  - date: "200"
    place_name: "建业(今江苏南京)"
    event_type: "遇刺"
    title_zh: "孙策遇刺身亡"
    description_zh: "孙策独骑出行时被许贡门客刺伤。伤口未愈，又因照镜激动导致伤口裂开。孙策将弟弟孙权叫到床前，以印绶相付曰'举江东之众，决机于两阵之间，与天下争衡，卿不如我'。遂亡，年二十六。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "少年英雄英年早逝——东吴命运的转折点"
  - date: "195"
    place_name: "舒(今安徽庐江)"
    event_type: "人物关系"
    title_zh: "孙策周瑜少年结义"
    description_zh: "孙策至舒投奔周瑜。周瑜出迎孙策，两人一见如故。周瑜将自己府邸的一半让给孙策居住，又倾囊资助。两人结为挚友，共同谋划平定江东大业。"
    is_highlight: true
    highlight_type: "人物互动"
    highlight_note: "少年知己——孙策周瑜的传奇友谊"
  - date: "196"
    place_name: "会稽(今浙江绍兴)"
    event_type: "战役"
    title_zh: "攻破会稽"
    description_zh: "孙策率军攻会稽郡，会稽太守王朗据守固陵。孙策渡水奇袭，大破王朗。王朗投降，会稽平定。孙策由此拥有江东两郡，势力大增。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "以锐气破坚城——小霸王的军事才能"
  - date: "200"
    place_name: "吴郡(今江苏苏州)"
    event_type: "人物关系"
    title_zh: "托孤孙权"
    description_zh: "孙策临终前将孙权叫到床前，以印绶相付曰'举江东之众，决机于两阵之间，与天下争衡，卿不如我。举贤任能，各尽其心，以保江东，我不如卿'。孙权泣而受之。"
    is_highlight: true
    highlight_type: "人物互动"
    highlight_note: "托孤——孙策对孙权的评价与期望"
  - date: "197"
    place_name: "宛(今河南南阳)"
    event_type: "军事行动"
    title_zh: "击败黄祖"
    description_zh: "孙策西征黄祖，大破黄祖军。黄祖败走，孙策缴获船只六千余艘。此战报了父亲孙坚被黄祖部下射杀之仇，也拓展了东吴的势力范围。"
    is_highlight: false
    highlight_type: "军事"
    highlight_note: ""
  - date: "198"
    place_name: "江东(今江苏浙江)"
    event_type: "政治决策"
    title_zh: "招揽人才"
    description_zh: "孙策平定江东后，广招贤才。张昭、张纮、周瑜、鲁肃等人纷纷归附。孙策以诚待人，用人不疑，短短数年便将江东治理得井井有条。"
    is_highlight: false
    highlight_type: "政治"
    highlight_note: ""
  - date: "200"
    place_name: "建业(今江苏南京)"
    event_type: "历史评价"
    title_zh: "小霸王之名"
    description_zh: "孙策作战勇猛，每战身先士卒，人称'小霸王'。他以十七岁之龄六年平定江东，展现了非凡的军事才能和领袖魅力。若非英年早逝，天下格局或将不同。"
    is_highlight: true
    highlight_type: "人物"
    highlight_note: "小霸王——以锐气开创基业的少年英雄"
