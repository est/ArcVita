person:
  name_zh: "魏惠王"
  birth_date: "-400"
  death_date: "-319"
  birth_place: "安邑(今山西夏县)"
  era: "战国中期"
  archetype: "由盛转衰的骄矜之君"
  summary_zh: "魏罃，在位五十年，是魏国从巅峰滑落的关键人物。即位之初魏国仍是天下最强，但他不能识人用人——放走商鞅、不听孙膑、宠信庞涓。桂陵之战和马陵之战两次大败于齐国，魏武卒精锐尽丧。又迁都大梁、四面树敌，最终使魏国从战国首霸沦为各国争相蚕食的对象。孟子见他时，他开口便问'何以利吾国'，孟子对曰'王何必曰利'——这段对话精准地概括了他的格局。"
  summary_first_person: "吾承祖父文侯之业，魏国正值鼎盛。然吾用人不察，放卫鞅入秦而为秦患，用庞涓而失孙膑。桂陵、马陵两败，魏武卒精锐尽失。吾迁都大梁，四面受敌，悔之晚矣。孟子见吾，吾问何以利国，孟子曰'何必曰利'，吾不能用其言。"
  lesson: "守业比创业更难，不能识人用人是最大的败笔。"

