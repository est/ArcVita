        start_date: "-334"
        end_date: "-319"
        place: "大梁(今河南开封)"
        highlight: "魏国盛极而衰"
    description_zh: "魏惠王即位时魏国国力强盛，他迁都大梁(今河南开封)以图进取中原，开凿鸿沟水利。前334年与齐威王在徐州相王，互尊为王。但相王之后，魏国的外交优势逐渐丧失——与齐国表面友好实则暗争，与秦国的河西之争日趋激烈。"
    outcome: "魏国在名义上达到巅峰，但实际上已开始走下坡路"
    lesson: "外强中干的盛世最危险，因为危机往往在繁华中滋生"

  - title_zh: "桂陵之战大败"
    domain: "军事"
    start_date: "-354"
    end_date: "-353"
    places: ["桂陵(今河南长垣)", "大梁(今河南开封)"]
    phases:
      - name: "酝酿"
        start_date: "-354"
        end_date: "-354"
        place: "大梁(今河南开封)"
        highlight: "庞涓率魏军围攻赵国邯郸"
      - name: "破局"
        start_date: "-354"
        end_date: "-354"
        place: "大梁(今河南开封)"
        highlight: "齐国孙膑'围魏救赵'"
      - name: "高潮"
        start_date: "-354"
        end_date: "-353"
        place: "桂陵(今河南长垣)"
        highlight: "魏军中伏大败"
      - name: "收束"
        start_date: "-353"
        end_date: "-353"
        place: "邯郸(今河北邯郸)"
        highlight: "赵国邯郸之围解除"
    description_zh: "前354年，庞涓率魏军八万围攻赵国邯郸。赵国向齐国求救，齐威王派田忌为将、孙膑为军师。孙膑不直接救赵，而是趁魏国空虚直攻大梁。庞涓被迫回师，在桂陵(今河南长垣)遭齐军伏击，大败而归。此即'围魏救赵'的经典战例。"
    outcome: "魏国首次在大战中失利，齐国的军事声望大增"
    lesson: "战争中直击要害比正面对抗更有效"

  - title_zh: "马陵之战，魏国由盛转衰"
