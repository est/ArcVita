      - name: "高潮"
        start_date: "-341"
        end_date: "-341"
        place: "马陵(今河南范县)"
        highlight: "万弩齐发，庞涓自刎"
      - name: "收束"
        start_date: "-341"
        end_date: "-340"
        place: "大梁(今河南开封)"
        highlight: "魏国精锐尽丧，太子申被俘"
    description_zh: "前341年，魏国伐韩，韩国向齐求救。齐国再以田忌、孙膑为主将。孙膑用'减灶之计'——撤退时逐日减少军中灶数，制造齐军士兵大量逃亡的假象。庞涓中计轻骑追击，马陵道两旁万弩齐发，魏军大败。庞涓自刎，太子申被俘。魏武卒精锐尽失，魏国从此一蹶不振。"
    outcome: "魏国军事力量从此一蹶不振，失去战国霸主地位"
    lesson: "骄傲使人盲目，庞涓的嫉妒和轻敌断送了魏国的命运"
