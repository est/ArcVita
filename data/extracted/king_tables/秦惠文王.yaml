      - name: "破局"
        start_date: "-316"
        end_date: "-316"
        place: "巴蜀(今四川盆地)"
        highlight: "司马错率军入蜀"
      - name: "高潮"
        start_date: "-316"
        end_date: "-314"
        place: "巴蜀(今四川盆地)"
        highlight: "灭蜀灭巴，设郡管辖"
      - name: "收束"
        start_date: "-314"
        end_date: "-314"
        place: "巴蜀(今四川盆地)"
        highlight: "成都平原成为秦国战略后方"
    description_zh: "巴蜀内乱，苴侯求援于秦。朝堂上有两派意见：张仪主张先伐韩取周以震慑天下，司马错则主张先取巴蜀以广地富民。惠文王采纳司马错之策，一举灭蜀、继而灭巴。巴蜀归秦后，成都平原成为秦国最重要的粮食基地和战略后方，为日后统一六国提供了坚实的物质保障。"
    outcome: "秦国获得巴蜀千里沃野，粮食产量倍增，战略纵深大为扩展"
    lesson: "有时候迂回的棋比正面的棋更有价值——取巴蜀比争中原更明智"

  - title_zh: "称王，与齐并立"
