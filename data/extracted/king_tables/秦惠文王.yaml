person:
  name_zh: "秦惠文王"
  birth_date: "-356"
  death_date: "-311"
  birth_place: "咸阳(今陕西咸阳)"
  era: "战国中期"
  archetype: "承前启后的扩张之君"
  summary_zh: "秦孝公之子嬴驷，少年时因犯法被商鞅刑其师傅，即位后车裂商鞅却尽用其法——这种'人死法存'的务实态度贯穿一生。任用张仪推行连横策略，破解六国合纵；南取巴蜀获得天府之国；东出函谷与六国争霸。在位期间秦国完成了从区域强国到天下霸主的关键跨越，首次称王，标志着秦国不再满足于诸侯之列。"
  summary_first_person: "吾少时犯法，太傅被刑，此吾一生之耻。然吾深知商鞅之法利于秦国，故即位虽诛鞅而不废其法。张仪以连横说吾，吾用之，使六国各自为谋而不能合。又南取巴蜀，得天府之国。吾称惠文王，自此秦不复为诸侯之秦。"
  lesson: "真正的政治家能超越个人恩怨，为国家利益做出最务实的选择。"

