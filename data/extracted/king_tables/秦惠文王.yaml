        end_date: "-337"
        place: "咸阳(今陕西咸阳)"
        highlight: "旧贵族失望——法并未废除"
    description_zh: "惠文王即位后，公子虔等人诬告商鞅谋反，请求诛杀。惠文王顺势车裂商鞅、灭其族，既满足了旧贵族的怨恨，又稳固了自身王位。但高明之处在于，他从未打算废除商鞅之法——因为正是这套制度让秦国强大起来。这种'杀其人而用其法'的做法，展现了超越个人恩怨的政治智慧。"
    outcome: "平息旧贵族怨恨的同时，完整保留了变法成果"
    lesson: "政治的最高境界是让所有人都觉得赢了，但规则不变"

  - title_zh: "张仪连横，破六国合纵"
    domain: "外交"
    start_date: "-328"
    end_date: "-311"
    places: ["咸阳(今陕西咸阳)", "大梁(今河南开封)", "新郑(今河南新郑)"]
    phases:
      - name: "酝酿"
        start_date: "-328"
        end_date: "-318"
        place: "咸阳(今陕西咸阳)"
        highlight: "苏秦合纵，六国联军伐秦"
      - name: "破局"
        start_date: "-318"
        end_date: "-315"
        place: "各国都城"
        highlight: "张仪以连横逐一瓦解"
      - name: "高潮"
        start_date: "-313"
        end_date: "-311"
        place: "各国都城"
        highlight: "欺楚绝齐，六国再无合力"
      - name: "收束"
        start_date: "-311"
        end_date: "-311"
        place: "咸阳(今陕西咸阳)"
        highlight: "秦国成为天下最强"
    description_zh: "面对苏秦组织的六国合纵伐秦，惠文王起用张仪推行连横策略。张仪凭三寸不烂之舌游说各国，以利诱、恐吓、欺诈等手段逐一瓦解合纵联盟。最精彩的是欺楚绝齐——张仪以商於六百里地诱楚怀王与齐绝交，待楚齐绝交后又称只许六里，楚怀王大怒伐秦，反被大败于丹阳、蓝田。"
    outcome: "六国合纵瓦解，秦国各个击破的外交优势确立"
    lesson: "在大国博弈中，外交策略的价值不亚于军事力量"

