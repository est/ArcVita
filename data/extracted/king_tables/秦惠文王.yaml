      - name: "破局"
        start_date: "-325"
        end_date: "-325"
        place: "咸阳(今陕西咸阳)"
        highlight: "自立为王"
      - name: "高潮"
        start_date: "-323"
        end_date: "-323"
        place: "徐州(今山东枣庄)"
        highlight: "徐州相王，天下格局重塑"
      - name: "收束"
        start_date: "-323"
        end_date: "-311"
        place: "咸阳(今陕西咸阳)"
        highlight: "秦称王成定制"
    description_zh: "前325年，秦惠文王正式称王，这是秦国历史上第一个称王的君主。此后韩、赵、魏、燕相继称王，到前323年徐州相王，战国七雄正式确立'王'的称号体系。惠文王称王标志着秦国不再以周室诸侯自居，而是以平等甚至更强势的姿态与天下争霸。"
    outcome: "秦国正式跻身王者之列，为后续统一天下的政治叙事奠基"
    lesson: "名分的改变往往是实力改变的信号"
