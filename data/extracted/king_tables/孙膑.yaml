        place: "大梁(今河南开封)"
        highlight: "直攻大梁，逼庞涓回师"
      - name: "高潮"
        start_date: "-354"
        end_date: "-353"
        place: "桂陵(今河南长垣)"
        highlight: "设伏大败魏军"
      - name: "收束"
        start_date: "-353"
        end_date: "-353"
        place: "邯郸(今河北邯郸)"
        highlight: "赵国邯郸之围解除"
    description_zh: "魏将庞涓率八万大军围攻赵国邯郸，赵国向齐求救。齐威王以田忌为将、孙膑为军师。孙膑献策'批亢捣虚'——不直接去邯郸与魏军硬拼，而是趁魏国国内空虚直攻大梁。庞涓被迫回师，在桂陵遭齐军伏击，大败而归。此即'围魏救赵'的千古经典。"
    outcome: "齐国以较小代价解赵之围，确立了'以智取胜'的军事思想"
    lesson: "解决问题的最好方法往往不是正面硬刚，而是直击要害"

