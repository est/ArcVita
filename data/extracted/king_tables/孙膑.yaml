        place: "马陵(今河南范县)"
        highlight: "万弩齐发，庞涓自刎"
      - name: "收束"
        start_date: "-341"
        end_date: "-340"
        place: "临淄(今山东淄博)"
        highlight: "魏国霸业终结"
    description_zh: "前341年，魏伐韩，韩求救于齐。孙膑再任军师，用减灶之计：齐军撤退时第一天挖十万个灶，第二天五万，第三天三万——制造齐军士兵大量逃亡的假象。庞涓中计，以为齐军胆怯，率轻骑日夜追击。孙膑在马陵道狭窄处设伏，万弩齐发。庞涓在乱军中自刎，魏太子申被俘。"
    outcome: "魏国精锐尽失，齐国成为东方最强国"
    lesson: "最致命的武器不是刀剑，而是对手的骄傲和轻敌"

