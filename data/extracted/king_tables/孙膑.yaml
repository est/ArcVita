        end_date: "-316"
        place: "临淄(今山东淄博)"
        highlight: "兵法传世"
    description_zh: "马陵之战后，孙膑总结自己一生的军事实践和理论思考，著成兵法八十九篇。1972年在山东临沂银雀山汉墓中出土了《孙膑兵法》残简，证实了这部兵书的真实存在。其内容继承和发展了孙子的军事思想，强调'战胜而强立'——通过战争胜利来确立国家地位。"
    outcome: "《孙膑兵法》传世，丰富了中国古代兵学思想体系"
    lesson: "实践出真知，最好的理论来自最深刻的实战"
