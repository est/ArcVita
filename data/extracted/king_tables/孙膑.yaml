person:
  name_zh: "孙膑"
  birth_date: "约-380"
  death_date: "约-316"
  birth_place: "齐国阿城(今山东阳谷)"
  era: "战国中期"
  archetype: "以智驭勇的兵家传人"
  summary_zh: "孙武后裔，与庞涓同师鬼谷子。被庞涓骗至魏国施以膑刑(挖去膝盖骨)，后装疯逃至齐国。以'围魏救赵'之桂陵之战和'减灶诱敌'之马陵之战两破魏军，终结了魏国的霸业。著有《孙膑兵法》八十九篇，是继《孙子兵法》之后最重要的兵学著作。其人生经历——从被害致残到复仇雪恨——堪称战国最戏剧性的传奇。"
  summary_first_person: "吾与庞涓同窗鬼谷子，涓先去仕魏。吾至魏，涓恐吾见用，遂诬吾通齐，施以膑刑。吾忍辱装疯，齐使者窃载以归。田忌荐吾于齐王，桂陵一战围魏救赵，马陵一战减灶灭涓。此仇此恨，吾以天下之智报之。后著兵法八十九篇，传之后世。"
  lesson: "最深的仇恨可以用最冷静的智慧来偿还，身体的残缺不能限制精神的高度。"

