person:
  name_zh: "周幽王"
  birth_date: "约-800"
  death_date: "前771"
  birth_place: "镐京(今陕西西安)"
  era: "西周末"
  archetype: "亡国之君的典型"
  summary_zh: "周幽王宠褒姒、废申后、烽火戏诸侯，导致犬戎入侵、西周灭亡，是中国历史上最著名的亡国之君之一。"
  summary_first_person: "吾得褒姒而大悦，废申后及太子宜臼，立褒姒为后、其子伯服为太子。褒姒不笑，吾燃烽火以逗之，诸侯至而无寇，褒姒乃大笑。申侯怒，引犬戎攻镐京。吾再燃烽火，诸侯不至。犬戎杀吾于骊山之下，掳褒姒而去。西周三百基业，毁于吾手。吾之罪，在于以私情废公义，以儿戏废信义。"
  lesson: "权力不可私用，信义不可轻废——一次失信，足以亡国。"

