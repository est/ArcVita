  - title_zh: "宠信褒姒，废嫡立庶"
    domain: "政治"
    start_date: "约-780"
    end_date: "前771"
    places: ["镐京(今陕西西安)", "骊山(今陕西临潼)"]
    phases:
      - name: "宠褒姒废申后"
        start_date: "约-780"
        end_date: "约-775"
        place: "镐京(今陕西西安)"
        highlight: "废申后及太子宜臼"
      - name: "烽火戏诸侯"
        start_date: "约-775"
        end_date: "前771"
        place: "骊山(今陕西临潼)"
        highlight: "为逗褒姒一笑而失信于诸侯"
      - name: "犬戎破镐京"
        start_date: "前771"
        end_date: "前771"
        place: "镐京(今陕西西安)"
        highlight: "申侯引犬戎攻周，幽王被杀"
    description_zh: "周幽王宠信褒姒，废申后及太子宜臼，立褒姒为后、伯服为太子。此举引发申侯不满。幽王为逗褒姒一笑，多次燃烽火戏弄诸侯，导致诸侯失信。前771年，申侯联合犬戎攻破镐京，幽王被杀于骊山之下，西周灭亡。"
    outcome: "西周灭亡，周平王东迁洛邑，开启东周时代"
    lesson: "失信于天下，天下必弃之"
  - title_zh: "西周灭亡"
    domain: "政治/军事"
    start_date: "前771"
    end_date: "前771"
    places: ["镐京(今陕西西安)", "骊山(今陕西临潼)", "洛邑(今河南洛阳)"]
    phases:
      - name: "犬戎入侵"
        start_date: "前771"
        end_date: "前771"
        place: "镐京(今陕西西安)"
        highlight: "申侯引犬戎攻破镐京"
      - name: "幽王被杀"
        start_date: "前771"
        end_date: "前771"
        place: "骊山(今陕西临潼)"
        highlight: "幽王死于骊山之下"
      - name: "平王东迁"
        start_date: "前770"
        end_date: "前770"
        place: "洛邑(今河南洛阳)"
        highlight: "周平王东迁洛邑"
    description_zh: "前771年，申侯因女儿被废，联合犬戎攻周。幽王燃烽火求援，诸侯不至。犬戎破镐京，杀幽王于骊山之下，掳褒姒而去。西周灭亡。次年，太子宜臼即位为周平王，东迁洛邑，开启东周时代。"
    outcome: "西周灭亡，周朝东迁，王室权威彻底衰落"
    lesson: "内乱招外祸，因果循环，报应不爽"

events:
  - date: "约-780"
    place_name: "镐京(今陕西西安)"
    event_type: "政治事件"
    title_zh: "宠信褒姒"
    description_zh: "幽王得褒姒，大悦，宠之。褒姒不笑，幽王千方百计逗之不得。此为西周灭亡的起点——一个女人的笑容，竟成了一个王朝的催命符。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "烽火戏诸侯的前因"
  - date: "约-775"
    place_name: "镐京(今陕西西安)"
    event_type: "政治事件"
    title_zh: "废申后及太子宜臼"
    description_zh: "幽王废申后及太子宜臼，立褒姒为后、其子伯服为太子。申后之父申侯大怒，为日后的犬戎攻周埋下祸根。废嫡立庶，历来是王朝动乱的根源。"
    is_highlight: true
    highlight_type: "政治"
    highlight_note: "废嫡立庶——西周灭亡的直接导火索"
  - date: "约-774"
    place_name: "骊山(今陕西临潼)"
    event_type: "政治事件"
    title_zh: "烽火戏诸侯"
    description_zh: "幽王为逗褒姒一笑，命人燃骊山烽火。诸侯见烽火以为犬戎入侵，率兵勤王。至而无寇，褒姒见诸侯仓皇之状大笑。幽王大悦，屡燃烽火。后犬戎真正入侵时，诸侯见烽火不复至。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "烽火戏诸侯——以国家信用为代价博美人一笑"
  - date: "前771"
    place_name: "镐京(今陕西西安)"
    event_type: "战役"
    title_zh: "犬戎破镐京"
    description_zh: "申侯因女儿被废，联合缯国、犬戎攻周。犬戎攻破镐京，幽王燃烽火求援，诸侯不至。犬戎杀幽王、虏褒姒，大掠镐京而去。西周三百年的都城毁于一旦。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "西周灭亡——中国历史上第一次都城被蛮族攻破"
  - date: "前771"
    place_name: "骊山(今陕西临潼)"
    event_type: "人物终局"
    title_zh: "幽王死于骊山"
    description_zh: "幽王出逃至骊山之下，被犬戎追及杀害。死后葬于骊山。太子宜臼在外祖申侯支持下即位为周平王，次年东迁洛邑。周幽王以亡国之君的形象永载史册。"
    is_highlight: true
    highlight_type: "终局"
    highlight_note: "亡国之君——权力私用的代价"
  - date: "前771"
    place_name: "镐京(今陕西西安)"
    event_type: "政治事件"
    title_zh: "镐京陷落，西周终结"
    description_zh: "镐京被犬戎攻破后，宗庙宫室尽毁，积聚百年的珍宝财富被掠一空。西周的礼乐制度、宗法秩序随之崩塌，中国历史从此进入诸侯争霸的东周时代。"
    is_highlight: true
    highlight_type: "终局"
    highlight_note: "一个时代的终结——从封建到争霸的历史转折"
