person:
  name_zh: "楚庄王"
  birth_date: "约-613"
  death_date: "前591"
  birth_place: "郢(今湖北荆州)"
  era: "春秋"
  archetype: "一鸣惊人的霸业之君"
  summary_zh: "楚庄王即位三年不鸣，一鸣惊人；问鼎中原，邲之战大败晋国，使楚国从南方蛮夷跻身中原霸主之列。"
  summary_first_person: "吾即位三年，不发号施令，日夜为乐。有谏者杀之。伍举进隐语曰'有鸟止南方之阜，三年不翅不鸣，是何鸟也？'吾曰'此鸟不飞则已，一飞冲天；不鸣则已，一鸣惊人'。遂亲政，诛奸佞，用孙叔敖为相，国大治。问鼎中原，观兵洛郊，晋人畏之。邲之战，大败晋军。吾之霸业，在于忍耐与果决。"
  lesson: "蛰伏不是沉沦，而是在等待最佳的出手时机。"

