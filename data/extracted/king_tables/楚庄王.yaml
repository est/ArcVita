      - name: "国大治"
        start_date: "前611"
        end_date: "前610"
        place: "郢(今湖北荆州)"
        highlight: "楚国大治，准备北进"
    description_zh: "楚庄王即位后三年不理朝政，日夜为乐。有谏者杀之。伍举以隐语进谏，庄王答以'一飞冲天、一鸣惊人'。随后亲政，诛杀奸佞，任用孙叔敖为令尹(相)，楚国大治。"
    outcome: "三年蛰伏后一朝亲政，楚国由乱而治"
    lesson: "韬光养晦与雷霆出击，需要同样的勇气"
  - title_zh: "问鼎中原，邲之战称霸"
    domain: "军事/外交"
    start_date: "前610"
    end_date: "前591"
    places: ["郢(今湖北荆州)", "洛邑(今河南洛阳)", "邲(今河南郑州)"]
    phases:
      - name: "问鼎中原"
        start_date: "前607"
        end_date: "前607"
        place: "洛邑(今河南洛阳)"
        highlight: "楚王问鼎之轻重"
      - name: "邲之战"
        start_date: "前597"
        end_date: "前597"
        place: "邲(今河南郑州)"
        highlight: "大败晋军，称霸中原"
      - name: "霸业鼎盛"
        start_date: "前597"
        end_date: "前591"
        place: "中原各地"
        highlight: "楚国成为中原霸主"
    description_zh: "楚庄王率军北上，在洛郊观兵，问周天子九鼎之轻重。周使王孙满对曰'在德不在鼎'，庄王乃退。前597年，晋楚战于邲，楚军大胜，晋军溃逃。楚庄王由此称霸中原，成为春秋五霸之一。"
    outcome: "邲之战大败晋国，楚国从南方蛮夷跻身中原霸主"
    lesson: "问鼎中原——实力是说话的底气"

events:
  - date: "前613"
    place_name: "郢(今湖北荆州)"
    event_type: "政治事件"
    title_zh: "即位三年不鸣"
    description_zh: "楚庄王即位后三年不理朝政，日夜为乐。令尹(相)专权，国内矛盾重重。庄王以不鸣不飞的姿态观察朝局，等待时机。"
    is_highlight: true
    highlight_type: "蛰伏"
    highlight_note: "一鸣惊人的前奏——最深的蛰伏"
  - date: "前611"
    place_name: "郢(今湖北荆州)"
    event_type: "政治事件"
    title_zh: "一鸣惊人，亲政诛奸"
    description_zh: "伍举以隐语进谏：'有鸟止南方之阜，三年不翅不鸣，是何鸟也？'庄王曰：'此鸟不飞则已，一飞冲天；不鸣则已，一鸣惊人。'遂亲政，诛杀奸佞，任用孙叔敖为令尹。楚国面貌焕然一新。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "一鸣惊人——中国最著名的励志典故之一"
  - date: "前607"
    place_name: "洛邑(今河南洛阳)"
    event_type: "外交事件"
    title_zh: "问鼎中原"
    description_zh: "楚庄王率军北上至洛郊，向周天子使者王孙满询问九鼎之大小轻重。九鼎乃天子权力的象征，楚王此举意在挑战周天子权威。王孙满对曰'在德不在鼎'，庄王乃退。然'问鼎中原'一词自此成为争夺天下权力的代称。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "问鼎中原——从楚王的野心到千古成语"
  - date: "前597"
    place_name: "邲(今河南郑州)"
    event_type: "战役"
    title_zh: "邲之战大败晋国"
    description_zh: "晋楚两军战于邲。晋军内部指挥混乱，将帅不和。楚军在庄王指挥下大败晋军，晋军渡黄河逃命，死伤无数。此战是春秋时期规模最大的战役之一，标志着楚国正式成为中原霸主。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "邲之战——楚国霸业的巅峰"
  - date: "前597"
    place_name: "邲(今河南郑州)"
    event_type: "政治决策"
    title_zh: "止戈为武"
    description_zh: "邲之战后，臣下建议收集晋军尸骨筑京观(炫耀战功)。庄王不可，曰'夫文，止戈为武'，又引《周颂》'载戢干戈，载橐弓矢。我求懿德，肆于时夏'。展现了楚庄王的仁德与文化修养。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "止戈为武——中国武德思想的源头"
  - date: "前596"
    place_name: "中原各地"
    event_type: "会盟"
    title_zh: "楚庄王称霸诸侯"
    description_zh: "邲之战后，中原诸侯纷纷归附楚国。楚庄王号令诸侯，楚国霸业达到顶峰。这是楚国历史上最辉煌的时刻——一个曾被视为南方蛮夷的国家，终于登上了中原霸主的宝座。"
    is_highlight: false
    highlight_type: "霸业"
    highlight_note: ""
  - date: "前591"
    place_name: "郢(今湖北荆州)"
    event_type: "人物终局"
    title_zh: "楚庄王薨"
    description_zh: "楚庄王在位二十三年，从三年蛰伏到一鸣惊人，从问鼎中原到邲之战称霸，完成了从南方蛮夷到中原霸主的蜕变。其'一鸣惊人'、'问鼎中原'、'止戈为武'三典，千古流传。"
    is_highlight: true
    highlight_type: "终局"
    highlight_note: "一鸣惊人的霸主——三个成语的创造者"
