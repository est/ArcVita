person:
  name_zh: "范增"
  name_en: "Fan Zeng"
  birth_date: "前277"
  death_date: "前204"
  birth_place: "居巢(今安徽巢湖)"
  era: "秦末楚汉"
  archetype: "悲剧谋士：忠而见疑的楚国亚父"
  dilemmas: ["年迈出山的最后壮志", "忠言不被采纳的无奈", "被离间后的愤然出走"]
  summary_zh: "年七十出山佐项羽，号为亚父。鸿门宴力劝杀刘邦未果，屡献良策不被采纳。陈平反间计成功，项羽疑范增，范增愤然归乡，途中疽发而死。楚失范增，遂失天下。"
  summary_first_person: "吾年七十犹在山中，闻陈胜举义遂出。项王用吾为亚父，吾劝其在鸿门杀刘邦，王不听。后陈平施反间，王疑吾。吾愤而归乡，行至彭城，疽发于背而死。楚失吾，犹人失左右手也。"
  lesson: "谋士的价值在于被采纳，忠言不听则谋士亦无用武之地。"

endeavors:
  - title_zh: "辅佐项羽争天下"
    domain: "军事谋略"
    start_date: "前209"
    end_date: "前204"
    places: ["彭城(今江苏徐州)", "咸阳(今陕西西安)"]
    phases:
      - name: "初出茅庐"
        start_date: "前209"
        end_date: "前208"
        place: "居巢(今安徽巢湖)"
        highlight: "七十岁出山投奔项梁"
      - name: "鸿门献策"
        start_date: "前206"
        end_date: "前206"
        place: "鸿门(今陕西临潼)"
        highlight: "鸿门宴力劝杀刘邦"
      - name: "反间出走"
        start_date: "前204"
        end_date: "前204"
        place: "彭城(今江苏徐州)"
        highlight: "被陈平反间出走病死"
    description_zh: "范增七十岁出山，为项梁、项羽出谋划策。鸿门宴上力劝项羽杀刘邦，项伯护之不果。后陈平施反间计离间项羽范增，项羽渐疑范增，范增愤然请归，途中疽发而死。"
    outcome: "楚国失去首席谋士，加速了项羽的败亡"
    lesson: "君臣互信是成就事业的基础，一旦瓦解则大势已去"

events:
  - date: "前206"
    place_name: "鸿门(今陕西临潼)"
    event_type: "宴会"
    title_zh: "鸿门宴"
    description_zh: "刘邦先入关中，项羽大怒欲攻之。范增力劝项羽在鸿门宴上击杀刘邦，项庄舞剑意在沛公。然项伯以身护之，张良刘邦逃脱。范增怒曰'竖子不足与谋'，拔剑撞碎玉斗。"
    is_highlight: true
    highlight_type: "成语"
    highlight_note: "鸿门宴——楚汉争霸的关键转折点"
  - date: "前204"
    place_name: "彭城(今江苏徐州)"
    event_type: "政治阴谋"
    title_zh: "陈平反间计离间范增"
    description_zh: "刘邦谋士陈平施反间计，以金四万斤离间楚国君臣。项羽果然中计，对范增渐生猜忌。范增觉察后愤然请归，叹曰'天下事大定矣，君王自为之'，行至彭城疽发于背而死。"
    is_highlight: true
    highlight_type: "转折"
    highlight_note: "楚失范增，如人失左右手——项羽败亡的加速器"
  - date: "前208"
    place_name: "彭城(今江苏徐州)"
    event_type: "军事决策"
    title_zh: "劝项羽立楚怀王后裔"
    description_zh: "范增劝项梁立楚怀王后裔为义帝，以号召楚地反秦力量。项梁从之，立熊心为楚怀王。此举为楚军争取了正统名分，但也为日后义帝与项羽的矛盾埋下伏笔。"
    is_highlight: false
    highlight_type: "决策"
    highlight_note: ""
  - date: "前207"
    place_name: "巨鹿(今河北平乡)"
    event_type: "军事行动"
    title_zh: "巨鹿之战献策"
    description_zh: "范增随项羽参加巨鹿之战，献破釜沉舟之策。项羽率楚军渡河后砸碎锅灶、凿沉船只，以必死之心大败秦军主力。此战确立了项羽的军事声望。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "破釜沉舟——以少胜多的经典战例"
  - date: "前206"
    place_name: "咸阳(今陕西西安)"
    event_type: "政治决策"
    title_zh: "劝项羽勿居关中"
    description_zh: "有人劝项羽'关中阻山河四塞，地肥饶，可都以霸'。项羽见秦宫室已毁，又思东归，曰'富贵不归故乡，如衣锦夜行'。范增虽谋略过人，但在此事上未能有效劝阻项羽。"
    is_highlight: false
    highlight_type: "决策"
    highlight_note: ""
  - date: "前206"
    place_name: "鸿门(今陕西临潼)"
    event_type: "宴会"
    title_zh: "鸿门宴后的叹息"
    description_zh: "刘邦逃脱后，范增拔剑撞碎玉斗，怒曰'唉！竖子不足与谋！夺项王天下者，必沛公也！吾属今为之虏矣！'此后事态发展果如范增所言。"
    is_highlight: true
    highlight_type: "名言"
    highlight_note: "竖子不足与谋——谋士无力回天的悲叹"
  - date: "前209"
    place_name: "居巢(今安徽巢湖)"
    event_type: "人物转折"
    title_zh: "七十出山"
    description_zh: "范增年七十，素居家好奇计。陈胜吴广起义后，范增出山投奔项梁，建议立楚怀王后裔以号召天下。项梁从之，尊范增为亚父。"
    is_highlight: true
    highlight_type: "人物"
    highlight_note: "七十老翁出山，只为人生最后的壮志"
