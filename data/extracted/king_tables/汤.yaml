person:
  name_zh: "汤"
  birth_date: "约-1650"
  death_date: "约-1588"
  birth_place: "亳(今河南商丘)"
  era: "商初"
  archetype: "顺天应人的开国明君"
  summary_zh: "汤起于亳，用伊尹为相，以仁德感召诸侯，鸣条一战灭夏建商，开创商朝六百年基业，是三代圣王中以德取天下的典范。"
  summary_first_person: "吾起于西伯，知夏桀无道久矣。伊尹耕于有莘之野，吾三聘而得之。伊尹入夏观政，知桀必亡，乃归报吾。吾率诸侯自亳起兵，鸣条之战，夏师大败，桀走南巢。吾不欲杀桀，放之而已。天下诸侯推吾为天子，吾知此非力取，乃仁德所感也。"
  lesson: "得人心者得天下，用人不疑、疑人不用，是开国之君的第一课。"

endeavors:
  - title_zh: "灭夏建商"
    domain: "军事/政治"
    start_date: "约-1610"
    end_date: "约-1600"
    places: ["亳(今河南商丘)", "鸣条(今山西运城)", "南巢(今安徽巢湖)"]
    phases:
      - name: "积蓄力量"
        start_date: "约-1610"
        end_date: "约-1605"
        place: "亳(今河南商丘)"
        highlight: "用伊尹为相，网开一面感召诸侯"
      - name: "鸣条决战"
        start_date: "约-1600"
        end_date: "约-1600"
        place: "鸣条(今山西运城)"
        highlight: "一战灭夏，桀走南巢"
      - name: "建商定都"
        start_date: "约-1600"
        end_date: "约-1588"
        place: "亳(今河南商丘)"
        highlight: "建立商朝，定都于亳"
    description_zh: "汤用伊尹为相，修德行义，诸侯归心。汤先灭葛、韦、顾、昆吾等夏之与国，剪除夏朝羽翼。最后于鸣条与夏桀决战，夏师倒戈，桀奔南巢而死。汤建立商朝，都于亳，开创了六百年商祚。"
    outcome: "灭夏建商，开创六百年商朝基业"
    lesson: "先剪羽翼后取核心，是战略的经典路径"
  - title_zh: "伊尹辅政，制度初创"
    domain: "政治"
    start_date: "约-1600"
    end_date: "约-1588"
    places: ["亳(今河南商丘)"]
    phases:
      - name: "三聘伊尹"
        start_date: "约-1610"
        end_date: "约-1610"
        place: "亳(今河南商丘)"
        highlight: "三顾有莘得伊尹"
      - name: "伊尹摄政"
        start_date: "约-1600"
        end_date: "约-1588"
        place: "亳(今河南商丘)"
        highlight: "伊尹辅佐五代商王"
    description_zh: "汤三次遣使往有莘之野聘请伊尹，终得这位旷世名相。伊尹以烹饪喻治国，提出'调和五味'的治国理念。汤用伊尹辅政，建立商朝官制与礼法，奠定了早期国家的治理框架。伊尹辅佐商朝五代君主，被后世尊为'元圣'。"
    outcome: "伊尹辅政五代，商朝制度初创，国家治理走上正轨"
    lesson: "治大国如烹小鲜，用人是最高的治国艺术"

events:
  - date: "约-1610"
    place_name: "亳(今河南商丘)"
    event_type: "政治任用"
    title_zh: "三聘伊尹"
    description_zh: "汤闻伊尹有贤德，三遣使往聘。伊尹终为汤之诚意所动，出山辅佐。伊尹以'治大国如烹小鲜'喻治国之道，汤深以为然，拜为右相。"
    is_highlight: true
    highlight_type: "人才"
    highlight_note: "三顾茅庐的原型，开创了求贤若渴的传统"
  - date: "约-1605"
    place_name: "亳(今河南商丘)"
    event_type: "政治事件"
    title_zh: "网开一面"
    description_zh: "汤出猎，见猎人四面张网祝曰'天下之鸟皆入吾网'。汤命去其三面，曰'欲左者左，欲右者右，欲高者高，欲下者下，吾取其犯命者'。诸侯闻之，曰'汤德至矣，及禽兽'，皆归心于汤。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "网开一面——以仁德感召天下"
  - date: "约-1600"
    place_name: "夏都斟鄩(今河南偃师)"
    event_type: "军事行动"
    title_zh: "伐夏前奏：灭夏与国"
    description_zh: "汤在伊尹辅佐下，先灭葛、韦、顾、昆吾等亲夏诸侯国，逐步剪除夏桀的羽翼。历时数年，夏朝孤立无援，为最终决战铺平了道路。"
    is_highlight: false
    highlight_type: "战略"
    highlight_note: ""
  - date: "约-1600"
    place_name: "鸣条(今山西运城)"
    event_type: "战役"
    title_zh: "鸣条之战灭夏"
    description_zh: "汤率商军与夏桀战于鸣条。夏师虽众但人心涣散，阵前倒戈。夏桀大败，仓皇出逃至南巢(今安徽巢湖)。汤追至南巢，桀困死于此。商汤灭夏，改朝换代。"
    is_highlight: true
    highlight_type: "战役"
    highlight_note: "中国历史上第一次成功的改朝换代"
  - date: "约-1600"
    place_name: "亳(今河南商丘)"
    event_type: "政治制度"
    title_zh: "建商定都"
    description_zh: "灭夏后，汤回师亳都，即天子位，建立商朝。汤发布《汤诰》，告诫诸侯要勤政爱民，不可效仿夏桀之暴虐。商朝自此建立，延续约六百年。"
    is_highlight: true
    highlight_type: "制度"
    highlight_note: "商朝建立，开启六百年基业"
  - date: "约-1595"
    place_name: "亳(今河南商丘)"
    event_type: "政治事件"
    title_zh: "大旱七年，自焚祈雨"
    description_zh: "商初大旱七年，河竭井枯。汤剪发断爪，身婴白茅，自为牺牲祷于桑林之社。天乃大雨，岁则大熟。此即'汤祷桑林'之典，后世以之为圣王为民牺牲的典范。"
    is_highlight: true
    highlight_type: "典故"
    highlight_note: "汤祷桑林——以身祈雨，圣王仁德的极致体现"
  - date: "约-1588"
    place_name: "亳(今河南商丘)"
    event_type: "人物终局"
    title_zh: "汤崩于亳"
    description_zh: "汤在位约十三年而崩，葬于亳。伊尹辅立汤子外丙，继续执掌朝政。汤的一生，以仁德取天下，以贤相治天下，为后世开国之君树立了标杆。"
    is_highlight: false
    highlight_type: "终局"
    highlight_note: ""
