  description_zh: 曹沫为鲁将，三战三败，失地于齐。鲁庄公与齐桓公会盟于柯邑，曹沫趁执匕首上前劫持桓公，逼其归还所侵鲁地。桓公被迫应允。盟毕，桓公欲反悔，管仲劝曰'弃信于小国不如守信以彰大国之德'，桓公遂归还汶阳之田。
