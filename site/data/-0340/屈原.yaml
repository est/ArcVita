  title_zh: 渔父问答——举世皆浊我独清
  description_zh: 屈原流放江南，形容枯槁。渔父见而问之，屈原曰：'举世皆浊我独清，众人皆醉我独醒。'渔父劝其随波逐流，屈原曰：'宁赴湘流，葬于江鱼之腹中，安能以皓皓之白而蒙世俗之温蠖乎？'
