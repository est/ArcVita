  description_zh: 冒顿单于初为太子，其父头曼欲废之而立幼子，乃遣冒顿质于月氏。月氏欲杀之，冒顿盗其善马亡归。头曼以为勇，令将万骑。冒顿乃作鸣镝，令骑射曰：'鸣镝所射而不悉射者，斩之。'猎鸟兽，有不射鸣镝所射者，斩之。已而以鸣镝射其良马，左右或不敢射者，皆斩之。顷之，复以鸣镝射其爱妻，左右或甚恐不敢射，又斩之。居顷之，冒顿出猎，以鸣镝射头曼之良马，左右皆随射之。于是冒顿知其左右皆可用，随其父猎，以鸣镝射头曼，左右亦皆随射之，遂弑头曼。
