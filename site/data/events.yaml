  description_zh: 韩信数与萧何语，何奇之。至南郑，诸将亡者数十人。信度何等已数言上，上不我用，即亡去。何闻信亡，不及以闻，自追之。有人言之于上曰：'丞相何亡。'上大怒。一二日何来谒上，上骂曰：'若亡，何也？'何曰：'臣不敢亡也，臣追亡者耳。'上复骂曰：'诸将亡者以十数，公无所追，追信，诈也。'何曰：'至如信者，国士无双。王必欲长王汉中，无所事信；必欲争天下，非信无所与计事者。'于是王许之，斋戒设坛场，拜信为大将军，一军皆惊。
