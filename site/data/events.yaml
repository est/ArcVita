  title_zh: 背水一战——置之死地而后生
  description_zh: 韩信与张耳以兵数万，欲东下井陉击赵。信使万人先行，出，背水陈。赵军望见而大笑。平旦，信建大将之旗鼓，鼓行出井陉口。赵开壁击之，大战良久。于是信、耳详弃鼓旗，走水上军。水上军开入之，复疾战。赵果空壁争汉鼓旗，逐韩信、张耳。韩信、张耳已入水上军，军皆殊死战，不可败。信所出奇兵二千骑驰入赵壁，皆拔赵旗，立汉赤帜二千。赵军已不胜，欲还归壁，壁皆汉赤帜，大惊，以为汉皆已得赵王将矣，遂乱，赵将虽斩之不能禁也。于是汉兵夹击，大破虏赵军。
