  description_zh: 吴王阖闾出宫中美女百八十人交孙武操练。孙武三令五申后，妇人仍笑不止。孙武曰'约束不明，申令不熟，将之罪也；既已约束而不用命，吏士之罪也'，遂斩队长二人。自此军令如山，无人敢犯。
