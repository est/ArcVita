  description_zh: 孙武与伍子胥率吴军三万，自淮汭千里奔袭楚国。在柏举大破楚军二十万，五战五胜，一路追击至郢都。楚昭王仓皇出奔，吴军入郢，这是春秋时期以少胜多的经典战例。
