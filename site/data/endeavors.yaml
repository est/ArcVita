  description_zh: 秦将王翦破赵，兵临燕境。太子丹恐惧，欲遣荆轲入秦刺秦王。荆轲携樊於期之首级与督亢地图，以献地为名入秦。秦王召见，荆轲展地图，图穷而匕首现。荆轲左手持秦王袖，右手持匕首刺之。秦王惊起，衣袖挣断。秦王绕柱而走，群臣惊愕。荆轲追秦王，秦王拔剑击断荆轲左腿。荆轲以匕首掷之，不中。荆轲倚柱而笑，箕踞以骂。左右上前杀之。
  outcome: 刺秦失败，荆轲身死
  lesson: 虽千万人吾往矣——明知必败仍义无反顾
