  description_zh: 齐威王即位之初好酒色，荒废朝政。邹忌以鼓琴求见，借琴理喻治国之道。又以自己比美之事讽谏——妻、妾、客都说他比徐公美，实际上他不如徐公。由此推及国政：'宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王，由此观之，王之蔽甚矣。'齐威王大悟，下令重赏进谏者。
  outcome: 齐国政治清明，人才涌入，国力大增
  lesson: 能听逆耳忠言的领导，才是真正的强者
