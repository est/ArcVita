  description_zh: 智伯被赵襄子联合韩魏三家所灭，赵襄子漆智伯之头为饮器。豫让欲为智伯报仇，先漆身为厉（使皮肤溃烂如癞），吞炭为哑（使声音嘶哑），改变容貌声音以行刺。第一次伏于赵襄子宫中厕所，被赵襄子识破释之。第二次伏于襄子过桥之下马惊处，豫让击襄子之衣，襄子叹曰'义士也'，令其击衣如击人，豫让三跃击衣而后伏剑自尽。
