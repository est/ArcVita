<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArcVita · 成事儿时间轴</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header>
  <h1>ArcVita</h1>
  <span class="sub">成事儿时间轴 · 名场面×人物×公元</span>
  <div class="search-box">
    <input id="q" type="search" placeholder="搜索 人物 / 原型 / 境遇…  按 / 聚焦" autocomplete="off">
    <button id="clearSearch" title="清除">×</button>
  </div>
  <div class="hdr-zoom">
    <button id="zoomOut" aria-label="缩小">−</button>
    <span id="zoomLevel">自适应</span>
    <button id="zoomIn" aria-label="放大">+</button>
    <button id="zoomReset">重置</button>
  </div>
  <span class="stats" id="stats"></span>
</header>
<div id="filters" class="filters"></div>
<div class="subbar">
  <div id="centuryChips" class="chips"></div>
  <canvas id="minimap" class="minimap" width="900" height="48" title="点击或拖拽跳转"></canvas>
</div>
<div class="timeline-wrap" id="wrap" tabindex="0">
  <div class="tl-inner" id="inner"></div>
</div>
<div class="tip" id="tip"></div>
<div class="detail" id="detail"><span class="close" onclick="closeDetail()">×</span><div id="dc"></div></div>
<script src="static/app.js"></script>
</body>
</html>
