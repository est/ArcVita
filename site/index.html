<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcVita · 成事儿时间轴</title>
  <meta name="description" content="把历史上值得记住的人按「做事」记录完整周期。水平拖拽漫游四千年，悬停事件看同期年龄，点击人物聚焦做事流。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='12' fill='%23E8502F'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='40' font-family='serif' font-weight='700' fill='%23EFE3CC'%3E%E4%BA%8B%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 顶栏 -->
  <header class="topbar">
    <a class="brand" href="./">
      <svg class="brand-seal" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="2" y="2" width="60" height="60" rx="12" fill="#E8502F"/>
        <rect x="8" y="8" width="48" height="48" rx="8" fill="none" stroke="rgba(22,16,10,.30)" stroke-width="2"/>
        <text x="32" y="45" text-anchor="middle" font-size="36" font-family="Kaiti SC, KaiTi, STKaiti, serif" font-weight="700" fill="#EFE3CC">事</text>
      </svg>
      <span class="brand-name">ArcVita<em>成事儿时间轴</em></span>
    </a>
    <p class="tl-counts" id="tl-counts" aria-label="数据规模"></p>
  </header>

  <main class="app" id="top">

    <!-- 签名元素：可玩时间轴（全屏） -->
    <div class="tl-frame" id="tl-frame" aria-label="可交互时间轴">
      <canvas id="tl-canvas" tabindex="0"
        aria-label="历史人物时间轴。左右拖拽漫游四千年，滚轮缩放，悬停查看同期年龄，点击人物行聚焦其做事流，按 ESC 返回。"></canvas>

      <div class="tl-hints" aria-hidden="true">
        <span class="hint"><b>拖拽</b> 漫游四千年</span>
        <span class="hint"><b>滚轮</b> 缩放年代</span>
        <span class="hint"><b>悬停</b> 看同期年龄</span>
        <span class="hint"><b>点击人物</b> 聚焦做事流</span>
      </div>

      <div class="tl-search">
        <input id="tl-search" type="text" placeholder="搜人物…" autocomplete="off" aria-label="按人名搜索">
        <div class="tl-suggest" id="tl-suggest" hidden></div>
      </div>

      <div class="tl-zoom" role="group" aria-label="缩放控制">
        <button data-z="in" aria-label="放大">＋</button>
        <button data-z="out" aria-label="缩小">－</button>
        <button data-z="fit" aria-label="全览四千年" title="全览四千年">全</button>
      </div>

      <div class="tl-legend" id="tl-legend" aria-hidden="true"></div>

      <div class="tl-pop" id="tl-pop" hidden role="dialog" aria-label="事件详情"></div>
      <aside class="tl-panel" id="tl-panel" hidden aria-label="人物详情"></aside>

      <div class="tl-status" id="tl-status" hidden>
        <div class="ring" aria-hidden="true"></div>
        <p class="msg">正在展开四千年……</p>
      </div>

      <noscript>
        <div class="tl-status" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#16100A;">
          <p class="msg">时间轴需要启用 JavaScript。</p>
        </div>
      </noscript>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
